<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>היכל החכמה</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  background: url('./IMG_5068.PNG') no-repeat center center;
  background-size: cover;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 40vh;
}

.login-box {
  background: rgba(20, 12, 4, 0.82);
  border: 1.5px solid rgba(224,201,127,.45);
  border-radius: 18px;
  padding: 22px 20px;
  width: 240px;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 40px rgba(0,0,0,.6);
  text-align: center;
}

.login-label {
  display: block;
  color: #a08c60;
  font-size: .75rem;
  font-weight: 700;
  margin: 8px 0 3px;
}

.login-input {
  width: 100%;
  padding: 9px 10px;
  background: rgba(255,255,255,.07);
  border: 1.5px solid rgba(224,201,127,.3);
  border-radius: 9px;
  color: #f0e8d0;
  font-size: .9rem;
  font-family: inherit;
  outline: none;
  text-align: center;
  transition: border-color .2s;
  maxlength: 10;
}
.login-input:focus { border-color: #e0c97f; }
.login-input::placeholder { color: #6a5c40; }

.login-btn {
  width: 100%;
  margin-top: 14px;
  padding: 11px;
  background: linear-gradient(135deg, #e0c97f, #c8a84b);
  color: #1a0e00;
  border: none;
  border-radius: 10px;
  font-size: .95rem;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 4px 20px rgba(200,168,75,.35);
  transition: transform .15s;
}
.login-btn:active { transform: scale(.97); }

.error-msg {
  color: #ff8080;
  text-align: center;
  font-size: .78rem;
  margin-top: 8px;
  display: none;
}
</style>
</head>
<body>
<div class="login-box">
  <label class="login-label">אימייל</label>
  <input class="login-input" type="email" id="username" placeholder="your@email.com" autocomplete="email">

  <label class="login-label">סיסמא</label>
  <input class="login-input" type="password" id="password" placeholder="סיסמא" autocomplete="current-password">

  <button class="login-btn" id="loginBtn" onclick="doLogin()">כניסה להיכל ←</button>
  <div class="error-msg" id="errMsg">אימייל או סיסמא שגויים</div>
</div>

<script type="module">
import { supabase } from './supabase-client.js';

// אם כבר מחובר — כניסה ישירה
const { data: { session } } = await supabase.auth.getSession();
if (session) {
  sessionStorage.setItem('userId', session.user.id);
  sessionStorage.setItem('userEmail', session.user.email);
  window.location.replace('calculator.html');
}

window.doLogin = async function() {
  const email    = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn      = document.getElementById('loginBtn');
  const err      = document.getElementById('errMsg');
  if (!email || !password) return;

  btn.disabled    = true;
  btn.textContent = 'מתחבר...';

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    err.textContent    = 'אימייל או סיסמא שגויים';
    err.style.display  = 'block';
    setTimeout(() => err.style.display = 'none', 3000);
    btn.disabled    = false;
    btn.textContent = 'כניסה להיכל ←';
    return;
  }

  sessionStorage.setItem('userId', data.user.id);
  sessionStorage.setItem('userEmail', data.user.email);
  window.location.replace('calculator.html');
};

document.addEventListener('keydown', e => { if (e.key === 'Enter') window.doLogin?.(); });
</script>
</body>
</html>
