<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>היכל החכמה</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  background: url('./IMG_5068.PNG') no-repeat center center;
  background-size: cover;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8vh;
}

/* gradient overlay — transparent at top (shows library + title), dark at bottom (form area) */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(6,3,1,0.10) 0%,
    rgba(6,3,1,0.35) 45%,
    rgba(6,3,1,0.80) 70%,
    rgba(6,3,1,0.90) 100%
  );
  pointer-events: none;
}

.login-wrap {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

/* ─── BOX ─── */
.login-box {
  background: rgba(12, 7, 2, 0.88);
  border: 1px solid rgba(224,201,127,.35);
  border-radius: 20px;
  padding: 28px 26px 24px;
  width: 300px;
  backdrop-filter: blur(12px);
  box-shadow: 0 12px 50px rgba(0,0,0,.7), inset 0 1px 0 rgba(224,201,127,.12);
  text-align: center;
}

.field-group {
  margin-bottom: 14px;
  text-align: right;
}

.login-label {
  display: block;
  color: #8a7850;
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .08em;
  margin-bottom: 5px;
}

.login-input {
  width: 100%;
  padding: 10px 12px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(224,201,127,.25);
  border-radius: 10px;
  color: #f0e8d0;
  font-size: .9rem;
  font-family: inherit;
  outline: none;
  text-align: right;
  transition: border-color .2s, background .2s;
}
.login-input:focus {
  border-color: rgba(224,201,127,.7);
  background: rgba(255,255,255,.08);
}
.login-input::placeholder { color: #4a3e2a; }

.login-btn {
  width: 100%;
  margin-top: 6px;
  padding: 12px;
  background: linear-gradient(135deg, #d4b96a, #b8913a);
  color: #110900;
  border: none;
  border-radius: 11px;
  font-size: .95rem;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: .04em;
  box-shadow: 0 4px 22px rgba(180,145,58,.4);
  transition: opacity .15s, transform .15s, box-shadow .15s;
}
.login-btn:hover  { opacity: .92; box-shadow: 0 6px 28px rgba(180,145,58,.55); }
.login-btn:active { transform: scale(.97); }
.login-btn:disabled { opacity: .5; cursor: default; }

.error-msg {
  color: #e87070;
  text-align: center;
  font-size: .78rem;
  margin-top: 10px;
  display: none;
  padding: 7px 10px;
  background: rgba(200,50,50,.12);
  border-radius: 8px;
  border: 1px solid rgba(200,50,50,.25);
}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="field-group">
      <label class="login-label">אימייל</label>
      <input class="login-input" type="email" id="username" placeholder="your@email.com" autocomplete="email">
    </div>

    <div class="field-group">
      <label class="login-label">סיסמא</label>
      <input class="login-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">כניסה להיכל</button>
    <div class="error-msg" id="errMsg">אימייל או סיסמא שגויים</div>
  </div>

</div>

<script type="module">
import { supabase } from './supabase-client.js';

// אם כבר מחובר — כניסה ישירה
const { data: { session } } = await supabase.auth.getSession();
if (session) {
  sessionStorage.setItem('userId', session.user.id);
  sessionStorage.setItem('userEmail', session.user.email);
  window.location.replace('calculator.html');
}

window.doLogin = async function() {
  const email    = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn      = document.getElementById('loginBtn');
  const err      = document.getElementById('errMsg');
  if (!email || !password) return;

  btn.disabled    = true;
  btn.textContent = 'מתחבר...';

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    err.textContent    = 'אימייל או סיסמא שגויים';
    err.style.display  = 'block';
    setTimeout(() => err.style.display = 'none', 3000);
    btn.disabled    = false;
    btn.textContent = 'כניסה להיכל ←';
    return;
  }

  sessionStorage.setItem('userId', data.user.id);
  sessionStorage.setItem('userEmail', data.user.email);
  window.location.replace('calculator.html');
};

document.addEventListener('keydown', e => { if (e.key === 'Enter') window.doLogin?.(); });
</script>
</body>
</html>
