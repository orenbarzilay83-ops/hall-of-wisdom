<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>היכל החכמה</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  background: url('./IMG_5068.PNG') no-repeat center center;
  background-size: cover;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 8%;
}

.login-box {
  background: rgba(20, 12, 4, 0.82);
  border: 1.5px solid rgba(224,201,127,.45);
  border-radius: 20px;
  padding: 28px 24px;
  width: 88%; max-width: 380px;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 40px rgba(0,0,0,.6);
}

.login-title {
  text-align: center;
  color: #e0c97f;
  font-size: 1.1rem;
  font-weight: 900;
  letter-spacing: .06em;
  margin-bottom: 20px;
}

.login-label {
  display: block;
  color: #a08c60;
  font-size: .8rem;
  font-weight: 700;
  margin: 12px 0 5px;
  letter-spacing: .04em;
}

.login-input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255,255,255,.07);
  border: 1.5px solid rgba(224,201,127,.3);
  border-radius: 11px;
  color: #f0e8d0;
  font-size: 1rem;
  font-family: inherit;
  outline: none;
  text-align: right;
  transition: border-color .2s;
}
.login-input:focus { border-color: #e0c97f; }
.login-input::placeholder { color: #6a5c40; }

.login-btn {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background: linear-gradient(135deg, #e0c97f, #c8a84b);
  color: #1a0e00;
  border: none;
  border-radius: 12px;
  font-size: 1.05rem;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: .04em;
  box-shadow: 0 4px 20px rgba(200,168,75,.35);
  transition: transform .15s, opacity .15s;
}
.login-btn:active { transform: scale(.97); opacity: .9; }

.error-msg {
  color: #ff8080;
  text-align: center;
  font-size: .85rem;
  margin-top: 12px;
  display: none;
}

.change-link {
  text-align: center;
  margin-top: 14px;
  color: #6a5c40;
  font-size: .78rem;
  cursor: pointer;
  text-decoration: underline;
}

/* מסך שינוי סיסמא */
.change-box {
  display: none;
  margin-top: 16px;
  border-top: 1px solid rgba(224,201,127,.2);
  padding-top: 16px;
}
.change-btn {
  width: 100%;
  margin-top: 10px;
  padding: 11px;
  background: transparent;
  border: 1.5px solid rgba(224,201,127,.4);
  border-radius: 11px;
  color: #e0c97f;
  font-size: .9rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.success-msg {
  color: #80ffb0;
  text-align: center;
  font-size: .83rem;
  margin-top: 10px;
  display: none;
}
</style>
</head>
<body>

<div class="login-box">
  <div class="login-title">✦ כניסה להיכל החכמה ✦</div>

  <label class="login-label">שם משתמש</label>
  <input class="login-input" type="text" id="username" placeholder="הזן שם משתמש...">

  <label class="login-label">סיסמא</label>
  <input class="login-input" type="password" id="password" placeholder="הזן סיסמא...">

  <button class="login-btn" onclick="doLogin()">כניסה להיכל ←</button>

  <div class="error-msg" id="errMsg">שם משתמש או סיסמא שגויים</div>

  <div class="change-link" onclick="toggleChange()">שנה פרטי כניסה</div>

  <div class="change-box" id="changeBox">
    <label class="login-label">שם משתמש חדש</label>
    <input class="login-input" type="text" id="newUser" placeholder="שם משתמש חדש...">
    <label class="login-label">סיסמא נוכחית</label>
    <input class="login-input" type="password" id="currPass" placeholder="סיסמא נוכחית...">
    <label class="login-label">סיסמא חדשה</label>
    <input class="login-input" type="password" id="newPass" placeholder="סיסמא חדשה...">
    <label class="login-label">אימות סיסמא חדשה</label>
    <input class="login-input" type="password" id="confPass" placeholder="אמת סיסמא...">
    <button class="change-btn" onclick="doChange()">שמור שינויים</button>
    <div class="success-msg" id="successMsg">✓ הפרטים עודכנו בהצלחה</div>
    <div class="error-msg" id="changeErr" style="display:none"></div>
  </div>
</div>

<script>
const DEFAULT_USER = 'oren moshe';
const DEFAULT_PASS = '1983';

function getUser() { return localStorage.getItem('hUser') || DEFAULT_USER; }
function getPass() { return localStorage.getItem('hPass') || DEFAULT_PASS; }

function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const err = document.getElementById('errMsg');
  if (u === getUser() && p === getPass()) {
    sessionStorage.setItem('loggedIn', '1');
    window.location.href = 'calculator.html';
  } else {
    err.style.display = 'block';
    setTimeout(() => err.style.display = 'none', 3000);
  }
}

function toggleChange() {
  const b = document.getElementById('changeBox');
  b.style.display = b.style.display === 'block' ? 'none' : 'block';
}

function doChange() {
  const newUser = document.getElementById('newUser').value.trim();
  const currPass = document.getElementById('currPass').value.trim();
  const newPass = document.getElementById('newPass').value.trim();
  const confPass = document.getElementById('confPass').value.trim();
  const err = document.getElementById('changeErr');
  const ok = document.getElementById('successMsg');

  err.style.display = 'none';
  ok.style.display = 'none';

  if (currPass !== getPass()) {
    err.textContent = 'הסיסמא הנוכחית שגויה';
    err.style.display = 'block'; return;
  }
  if (newPass && newPass !== confPass) {
    err.textContent = 'הסיסמאות החדשות אינן תואמות';
    err.style.display = 'block'; return;
  }
  if (newUser) localStorage.setItem('hUser', newUser);
  if (newPass) localStorage.setItem('hPass', newPass);

  ok.style.display = 'block';
  setTimeout(() => {
    document.getElementById('changeBox').style.display = 'none';
    ok.style.display = 'none';
  }, 2000);
}

// Enter להתחברות
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
