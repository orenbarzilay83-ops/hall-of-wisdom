<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>היכל החכמה</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  background: url('./IMG_5068.PNG') no-repeat center center;
  background-size: cover;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-box {
  background: rgba(20, 12, 4, 0.82);
  border: 1.5px solid rgba(224,201,127,.45);
  border-radius: 20px;
  padding: 28px 24px;
  width: 320px;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 40px rgba(0,0,0,.6);
  text-align: center;
}

.login-title {
  color: #e0c97f;
  font-size: 1rem;
  font-weight: 900;
  letter-spacing: .06em;
  margin-bottom: 20px;
}

.login-label {
  display: block;
  color: #a08c60;
  font-size: .78rem;
  font-weight: 700;
  margin: 10px 0 4px;
  text-align: center;
}

.login-input {
  width: 100%;
  padding: 11px 14px;
  background: rgba(255,255,255,.07);
  border: 1.5px solid rgba(224,201,127,.3);
  border-radius: 11px;
  color: #f0e8d0;
  font-size: .95rem;
  font-family: inherit;
  outline: none;
  text-align: center;
  transition: border-color .2s;
}
.login-input:focus { border-color: #e0c97f; }
.login-input::placeholder { color: #6a5c40; }

.login-btn {
  width: 100%;
  margin-top: 18px;
  padding: 13px;
  background: linear-gradient(135deg, #e0c97f, #c8a84b);
  color: #1a0e00;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: .04em;
  box-shadow: 0 4px 20px rgba(200,168,75,.35);
  transition: transform .15s;
}
.login-btn:active { transform: scale(.97); }

.error-msg {
  color: #ff8080;
  text-align: center;
  font-size: .82rem;
  margin-top: 10px;
  display: none;
}
</style>
</head>
<body>

<div class="login-box">
  <div class="login-title">✦ היכל החכמה ✦</div>

  <label class="login-label">שם משתמש</label>
  <input class="login-input" type="text" id="username" placeholder="הזן שם משתמש...">

  <label class="login-label">סיסמא</label>
  <input class="login-input" type="password" id="password" placeholder="הזן סיסמא...">

  <button class="login-btn" onclick="doLogin()">כניסה להיכל ←</button>

  <div class="error-msg" id="errMsg">שם משתמש או סיסמא שגויים</div>
</div>

<script>
const DEFAULT_USER = 'oren moshe';
const DEFAULT_PASS = '1983';
function getUser() { return localStorage.getItem('hUser') || DEFAULT_USER; }
function getPass() { return localStorage.getItem('hPass') || DEFAULT_PASS; }

function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const err = document.getElementById('errMsg');
  if (u === getUser() && p === getPass()) {
    sessionStorage.setItem('loggedIn', '1');
    window.location.href = 'calculator.html';
  } else {
    err.style.display = 'block';
    setTimeout(() => err.style.display = 'none', 3000);
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
