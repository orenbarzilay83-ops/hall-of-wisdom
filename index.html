<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>היכל החכמה - נומרולוגיה יהודית</title>
</head>
<body>
    <div class="overlay">
        <div class="dashboard" style="display: block; background: none;">
            <h1 class="gold-title" style="margin-top: 50px;">היכל החכמה</h1>
            
            <div class="card" style="max-width: 400px; margin: 0 auto; background: var(--glass);">
                <input type="text" id="userName" placeholder="הזן שם מלא..." style="width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--gold); background: #000; color: white; text-align: center;">
                <input type="date" id="birthDate" style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid var(--gold); background: #000; color: white; text-align: center;">
                
                <button class="real-gold-btn" style="position: static; transform: none; width: 100%;" onclick="runAnalysis()">נתח נתונים</button>
            </div>

            <div id="output" style="margin-top: 20px;"></div>

            <button class="real-gold-btn" style="position: static; transform: none; width: 250px; margin-top: 30px; font-size: 1rem;" onclick="location.href='myseal.html'">מעבר לחותמות ותהילים</button>
        </div>
    </div>

    <script src="library.js"></script>
    <script src="logic.js"></script>
</body>
</html>
