<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>היכל החכמה</title>
<style>
@font-face {
  font-family: 'STAM';
  src: url('./fonts/STAM.TTF') format('truetype');
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'STAM', 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  background: #0a0602;
  position: relative;
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: url('./login-bg-iphone.webp') no-repeat center center;
  background-size: cover;
  z-index: 0;
}

.login-wrap {
  position: absolute;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 40vw;
  left: 50%;
  top: 40%;
  transform: translateX(-50%);
  padding: 10px 0 20px;
}

/* iPad portrait */
@media (min-width: 768px) and (orientation: portrait) {
  body::before {
    background-image: url('./login-bg-ipad-portrait.webp');
  }
  .login-wrap {
    width: 30vw;
    top: 32%;
  }
}

/* iPad landscape */
@media (min-width: 768px) and (orientation: landscape) {
  body::before {
    background-image: url('./login-bg-ipad-landscape.webp');
  }
  .login-wrap {
    width: 26vw;
    top: 22%;
  }
}

/* ─── TITLE ─── */
.login-title {
  text-align: center;
  margin-bottom: 12px;
}

.login-title h1 {
  font-size: 1.4rem;
  font-weight: 900;
  color: #1e0f03;
  letter-spacing: .03em;
  line-height: 1.2;
}

.login-title p {
  font-size: .7rem;
  color: #4a2e0a;
  letter-spacing: .05em;
  margin-top: 4px;
}

@media (min-width: 768px) {
  .login-title h1 { font-size: 1.7rem; }
  .login-title p  { font-size: .78rem; }
}

/* ─── FIELDS ─── */
.field-group {
  width: 100%;
  margin-bottom: 10px;
}

.login-label {
  display: block;
  color: #2e1a06;
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .08em;
  margin-bottom: 5px;
  text-align: right;
}

.input-wrap {
  position: relative;
}

.input-icon {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: #5a3510;
  pointer-events: none;
  display: flex;
  align-items: center;
}

.input-icon svg {
  width: 15px;
  height: 15px;
  fill: #5a3510;
}

.login-input {
  width: 100%;
  padding: 12px 14px 12px 36px;
  background: rgba(160, 110, 30, 0.28);
  border: 1.5px solid rgba(60, 30, 5, 0.75);
  border-radius: 8px;
  color: #150900;
  font-size: 1rem;
  font-family: inherit;
  outline: none;
  text-align: right;
  transition: border-color .2s, background .2s;
}
.login-input:focus {
  border-color: rgba(60, 30, 5, 1);
  background: rgba(160, 110, 30, 0.42);
}
.login-input::placeholder { color: #7a5525; }

/* ─── BUTTON ─── */
.login-btn {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  background: rgba(80, 48, 12, 0.75);
  color: #f0dea0;
  border: 1.5px solid rgba(80, 48, 12, 0.6);
  border-radius: 9px;
  font-size: 1rem;
  font-weight: 900;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: .08em;
  transition: opacity .15s, transform .15s;
}
.login-btn:hover   { opacity: .82; }
.login-btn:active  { transform: scale(.97); }
.login-btn:disabled { opacity: .45; cursor: default; }

/* ─── ERROR ─── */
.error-msg {
  color: #7a1010;
  text-align: center;
  font-size: .76rem;
  margin-top: 10px;
  display: none;
  padding: 6px 10px;
  background: rgba(160, 30, 30, 0.1);
  border-radius: 7px;
  border: 1px solid rgba(160, 30, 30, 0.3);
}
</style>
</head>
<body>

<div class="login-wrap">

  <div class="login-title">
    <h1>היכל החכמה</h1>
    <p>מערכת יעוץ ונומרולוגיה יהודית</p>
  </div>

  <div class="field-group">
    <label class="login-label">אימייל</label>
    <div class="input-wrap">
      <span class="input-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </span>
      <input class="login-input" type="email" id="username" placeholder="your@email.com" autocomplete="email">
    </div>
  </div>

  <div class="field-group">
    <label class="login-label">סיסמה</label>
    <div class="input-wrap">
      <span class="input-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 8h-1V6c0-2.8-2.2-5-5-5S7 3.2 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.7 1.4-3.1 3.1-3.1 1.7 0 3.1 1.4 3.1 3.1v2z"/>
        </svg>
      </span>
      <input class="login-input" type="password" id="password" placeholder="" autocomplete="current-password">
    </div>
  </div>

  <button class="login-btn" id="loginBtn" onclick="doLogin()">כניסה</button>
  <div class="error-msg" id="errMsg">אימייל או סיסמא שגויים</div>

</div>

<script type="module">
import { supabase } from './supabase-client.js';

const { data: { session } } = await supabase.auth.getSession();
if (session) {
  sessionStorage.setItem('userId', session.user.id);
  sessionStorage.setItem('userEmail', session.user.email);
  window.location.replace('calculator.html');
}

window.doLogin = async function() {
  const email    = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn      = document.getElementById('loginBtn');
  const err      = document.getElementById('errMsg');
  if (!email || !password) return;

  btn.disabled    = true;
  btn.textContent = 'מתחבר...';

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    err.textContent   = 'אימייל או סיסמא שגויים';
    err.style.display = 'block';
    setTimeout(() => err.style.display = 'none', 3000);
    btn.disabled    = false;
    btn.textContent = 'כניסה';
    return;
  }

  sessionStorage.setItem('userId', data.user.id);
  sessionStorage.setItem('userEmail', data.user.email);
  window.location.replace('calculator.html');
};

document.addEventListener('keydown', e => { if (e.key === 'Enter') window.doLogin?.(); });
</script>
</body>
</html>
