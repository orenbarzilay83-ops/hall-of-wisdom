<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>כיוון גרירה</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; height: 100dvh; touch-action: none; }

    #preview {
      position: fixed; inset: 0;
      background: no-repeat center center / cover;
      transition: transform 0.18s;
    }

    .tune-el {
      position: absolute;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.18);
      cursor: grab;
      display: flex; align-items: center; justify-content: center;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
      overflow: hidden;
    }
    .tune-el.selected {
      border-width: 3px; background: rgba(0,0,0,0.35); z-index: 5;
    }
    .tune-el.dragging { cursor: grabbing; z-index: 10; }
    .el-label {
      font-size: 10px; color: #fff;
      font-family: Arial, sans-serif;
      text-shadow: 0 1px 3px #000, 0 1px 3px #000;
      pointer-events: none; text-align: center; padding: 1px;
    }

    /* ── panel ── */
    #panel {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.93); color: #fff; z-index: 999;
    }
    #top-bar {
      display: flex; gap: 5px; padding: 6px 8px;
      border-bottom: 1px solid #333;
    }
    #top-bar button {
      flex: 1; padding: 7px 3px;
      border: none; border-radius: 6px;
      font-size: 11px; font-family: Arial, sans-serif; cursor: pointer;
    }
    #btn-p   { background: #336; color: #fff; }
    #btn-l   { background: #444; color: #fff; }
    #btn-up, #btn-dn { background: #533; color: #fcc; flex: 0 0 36px; font-size: 15px; }
    #btn-out { background: #252; color: #9f9; }

    #status-bar {
      padding: 3px 10px; font-size: 11px; font-family: monospace;
      color: #ff9; min-height: 20px; border-bottom: 1px solid #222;
    }

    #fine-ctrl {
      display: flex; gap: 5px; align-items: center; padding: 5px 8px;
    }
    .fc-group { display: flex; align-items: center; gap: 3px; flex: 1; }
    .fc-lbl { font-size: 9px; color: #888; font-family: monospace; width: 12px; text-align: center; }
    .fc-val { font-size: 10px; font-family: monospace; color: #ff9; width: 34px; text-align: center; }
    .fc-group.w .fc-val, .fc-group.l .fc-val { color: #9cf; }
    .fc-group button {
      background: #333; color: #fff; border: none;
      width: 32px; height: 32px; font-size: 14px;
      border-radius: 5px; cursor: pointer;
      -webkit-tap-highlight-color: transparent; flex-shrink: 0;
    }
    .fc-group button:active { background: #666; }

    #output-box {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.93); color: #0f0;
      font-size: 11px; font-family: monospace;
      padding: 14px; z-index: 1000;
      white-space: pre; line-height: 1.8; overflow-y: auto;
    }
    #output-box button {
      display: block; margin-top: 12px;
      background: #333; color: #fff; border: none;
      padding: 10px 20px; border-radius: 6px; font-size: 15px;
    }
  </style>
</head>
<body>
<div id="preview"></div>
<div id="output-box"></div>

<div id="panel">
  <div id="top-bar">
    <button id="btn-p"  onclick="setMode('portrait')">Portrait</button>
    <button id="btn-l"  onclick="setMode('landscape')">Landscape</button>
    <button id="btn-up" onclick="shiftView(-12)">↑</button>
    <button id="btn-dn" onclick="shiftView(12)">↓</button>
    <button id="btn-out" onclick="showOutput()">📋</button>
  </div>
  <div id="status-bar">גרור קוביה למקום הנכון</div>
  <div id="fine-ctrl">
    <div class="fc-group l">
      <span class="fc-lbl">L</span>
      <button ontouchstart="sfc(1,-0.5)" ontouchend="efc()" onmousedown="sfc(1,-0.5)" onmouseup="efc()">◄</button>
      <span class="fc-val" id="fc-l">--</span>
      <button ontouchstart="sfc(1,0.5)" ontouchend="efc()" onmousedown="sfc(1,0.5)" onmouseup="efc()">►</button>
    </div>
    <div class="fc-group">
      <span class="fc-lbl">T</span>
      <button ontouchstart="sfc(0,-0.5)" ontouchend="efc()" onmousedown="sfc(0,-0.5)" onmouseup="efc()">▲</button>
      <span class="fc-val" id="fc-t">--</span>
      <button ontouchstart="sfc(0,0.5)" ontouchend="efc()" onmousedown="sfc(0,0.5)" onmouseup="efc()">▼</button>
    </div>
    <div class="fc-group w">
      <span class="fc-lbl">W</span>
      <button ontouchstart="sfc(2,-0.5)" ontouchend="efc()" onmousedown="sfc(2,-0.5)" onmouseup="efc()">−</button>
      <span class="fc-val" id="fc-w">--</span>
      <button ontouchstart="sfc(2,0.5)" ontouchend="efc()" onmousedown="sfc(2,0.5)" onmouseup="efc()">+</button>
    </div>
  </div>
</div>

<script>
// Each element: [top%, left%, width%]
// Height is approximate visual indicator only
const ELEMENTS = [
  // key                label             h    portrait[t,l,w]    landscape[t,l,w]
  { key:'alert',        label:'⬛ כותרת', h:4.5, p:[22.0,21.0,27.0], ls:[20.0,21.0,27.0] },

  // Row 1 — שם הלקוח / שם האב
  { key:'name',         label:'שם הלקוח', h:4.5, p:[31.5,21.0,19.5], ls:[31.0,24.5,19.0] },
  { key:'parent',       label:'שם האב',   h:4.5, p:[31.5,41.5,19.5], ls:[31.0,44.5,19.0] },

  // Row 2 — טלפון / דוא"ל
  { key:'phone',        label:'טלפון',    h:4.5, p:[39.5,21.0,19.5], ls:[38.0,24.5,19.0] },
  { key:'email',        label:'דוא"ל',   h:4.5, p:[39.5,41.5,19.5], ls:[38.0,44.5,19.0] },

  // Row 3 — מין
  { key:'male',         label:'זכר',      h:4.5, p:[48.0,21.0,20.0], ls:[46.0,24.5,19.5] },
  { key:'female',       label:'נקבה',     h:4.5, p:[48.0,42.5,20.0], ls:[46.0,45.0,19.5] },

  // Row 4 — מצב משפחתי
  { key:'married',      label:'נשוי/אה',  h:4.5, p:[56.5,21.0,11.5], ls:[55.0,24.5,11.0] },
  { key:'single',       label:'רווק/ה',   h:4.5, p:[56.5,33.5,11.5], ls:[55.0,36.5,11.0] },
  { key:'divorced',     label:'גרוש/ה',   h:4.5, p:[56.5,46.0,11.5], ls:[55.0,48.5,11.0] },
  { key:'widowed',      label:'אלמן/ה',   h:4.5, p:[56.5,58.5,11.5], ls:[55.0,60.5,11.0] },

  // Row 5 — ילדים
  { key:'ch-yes',       label:'יש ילדים', h:4.5, p:[64.5,21.0,20.0], ls:[63.0,24.5,19.5] },
  { key:'ch-no',        label:'אין ילדים',h:4.5, p:[64.5,42.5,20.0], ls:[63.0,45.0,19.5] },

  // Row 6 — תעסוקה
  { key:'employed',     label:'שכיר',          h:4.5, p:[73.5,21.0,11.0], ls:[70.0,24.5,10.5] },
  { key:'unemployed',   label:'מחפש עבודה',    h:4.5, p:[73.5,33.0,11.5], ls:[70.0,36.0,11.5] },
  { key:'self',         label:'עצמאי',         h:4.5, p:[73.5,45.5,11.0], ls:[70.0,48.5,10.5] },
  { key:'retired',      label:'בפנסיה',        h:4.5, p:[73.5,57.5,11.0], ls:[70.0,60.0,10.5] },

  // Row 7 — תאריך / שעה
  { key:'date',         label:'תאריך',    h:4.5, p:[81.0,21.0,19.5], ls:[76.0,24.5,19.0] },
  { key:'time',         label:'שעה',      h:4.5, p:[81.0,41.5,19.5], ls:[76.0,44.5,19.0] },

  // Row 8 — שאלה
  { key:'question',     label:'שאלה',     h:7.0, p:[88.5,21.0,50.5], ls:[82.0,24.5,50.0] },

  // Row 9 — כפתורי פעולה
  { key:'btn-manual',   label:'ידנית',    h:5.0, p:[95.0,21.0,14.0], ls:[88.0,24.5,13.5] },
  { key:'btn-auto',     label:'אוטומטי',  h:5.0, p:[95.0,36.0,15.0], ls:[88.0,39.0,14.5] },
  { key:'btn-clear',    label:'נקה',      h:5.0, p:[95.0,52.0,10.0], ls:[88.0,54.5, 9.5] },
];

const COLORS = [
  '#ff4444','#ff8800','#ffcc00','#aaff00','#00ffaa','#00aaff',
  '#aa00ff','#ff00aa','#ff6666','#ffaa66','#ffee66','#aaff66',
  '#66ffee','#66aaff','#aa66ff','#ff66aa',
  '#ff9999','#ffbb99','#99ff99','#9999ff',
  '#ffaacc','#aaffcc','#ccaaff',
];

let mode = 'portrait';
let vals  = {};   // key → [top, left, width]
let selectedKey  = null;
let _shift       = 0;
let _fcTimer     = null;
let _dragKey     = null;
let _dsx, _dsy, _dsv;

function r1(v){ return Math.round(v*10)/10; }

/* ── mode ── */
function setMode(m) {
  mode = m;
  vals = {};
  ELEMENTS.forEach(el => {
    vals[el.key] = [...(m==='portrait' ? el.p : el.ls)];
  });
  document.getElementById('btn-p').style.background = m==='portrait'  ? '#336' : '#444';
  document.getElementById('btn-l').style.background = m==='landscape' ? '#336' : '#444';
  document.getElementById('preview').style.backgroundImage = `url('./client-bg-ipad-${m}.png')`;
  rebuild();
}

/* ── view shift ── */
function shiftView(d){
  _shift = Math.max(-40, Math.min(40, _shift+d));
  document.getElementById('preview').style.transform = _shift ? `translateY(${_shift}%)` : '';
}

/* ── build elements ── */
function rebuild(){
  const pv = document.getElementById('preview');
  pv.querySelectorAll('.tune-el').forEach(e=>e.remove());
  ELEMENTS.forEach((row,i)=>{
    const el = document.createElement('div');
    el.className = 'tune-el';
    el.id = 'el-'+row.key;
    el.dataset.key = row.key;
    const c = COLORS[i % COLORS.length];
    el.style.borderColor = c+'cc';
    el.style.background  = c+'28';
    el.innerHTML = `<span class="el-label">${row.label}</span>`;
    applyStyle(el, row.key, row.h);
    el.addEventListener('touchstart', elTouchStart, {passive:false});
    el.addEventListener('mousedown',  elMouseDown);
    pv.appendChild(el);
  });
}

function applyStyle(el, key, h){
  const [t,l,w] = vals[key];
  el.style.top    = t+'%';
  el.style.left   = l+'%';
  el.style.width  = w+'%';
  el.style.height = (h||4.5)+'%';
}

function refreshEl(key){
  const row = ELEMENTS.find(r=>r.key===key);
  const el  = document.getElementById('el-'+key);
  if(el && row) applyStyle(el, key, row.h);
}

/* ── selection ── */
function selectEl(key){
  selectedKey = key;
  document.querySelectorAll('.tune-el').forEach(e=>
    e.classList.toggle('selected', e.dataset.key===key));
  updateStatus(); updateFine();
}

function updateStatus(){
  if(!selectedKey) return;
  const [t,l,w] = vals[selectedKey];
  const row = ELEMENTS.find(x=>x.key===selectedKey);
  document.getElementById('status-bar').textContent =
    `${row.label}  T:${t.toFixed(1)}%  L:${l.toFixed(1)}%  W:${w.toFixed(1)}%`;
}
function updateFine(){
  if(!selectedKey) return;
  const [t,l,w] = vals[selectedKey];
  document.getElementById('fc-t').textContent = t.toFixed(1)+'%';
  document.getElementById('fc-l').textContent = l.toFixed(1)+'%';
  document.getElementById('fc-w').textContent = w.toFixed(1)+'%';
}

/* ── drag ── */
function elTouchStart(e){
  e.preventDefault();
  const key = this.dataset.key;
  _dragKey=key; _dsx=e.touches[0].clientX; _dsy=e.touches[0].clientY;
  _dsv=[...vals[key]];
  this.classList.add('dragging'); selectEl(key);
}
function elMouseDown(e){
  e.preventDefault();
  const key = this.dataset.key;
  _dragKey=key; _dsx=e.clientX; _dsy=e.clientY;
  _dsv=[...vals[key]];
  this.classList.add('dragging'); selectEl(key);
}

window.addEventListener('touchmove', e=>{
  if(!_dragKey) return;
  e.preventDefault();
  doDrag(e.touches[0].clientX, e.touches[0].clientY);
},{passive:false});

window.addEventListener('touchend', ()=>{
  if(_dragKey){ document.getElementById('el-'+_dragKey)?.classList.remove('dragging'); _dragKey=null; }
});
window.addEventListener('mousemove', e=>{ if(_dragKey) doDrag(e.clientX,e.clientY); });
window.addEventListener('mouseup',   ()=>{
  if(_dragKey){ document.getElementById('el-'+_dragKey)?.classList.remove('dragging'); _dragKey=null; }
});

function doDrag(cx,cy){
  const rect = document.getElementById('preview').getBoundingClientRect();
  const dx = (cx-_dsx)/rect.width *100;
  const dy = (cy-_dsy)/rect.height*100;
  vals[_dragKey][0] = r1(_dsv[0]+dy);  // top
  vals[_dragKey][1] = r1(_dsv[1]+dx);  // left
  // width stays the same
  refreshEl(_dragKey); updateStatus(); updateFine();
}

/* ── fine controls ── */
function sfc(idx,delta){
  if(!selectedKey) return;
  doFc(idx,delta);
  _fcTimer = setInterval(()=>doFc(idx,delta), 110);
}
function efc(){ clearInterval(_fcTimer); _fcTimer=null; }
function doFc(idx,delta){
  if(!selectedKey) return;
  vals[selectedKey][idx] = r1(vals[selectedKey][idx]+delta);
  refreshEl(selectedKey); updateStatus(); updateFine();
}

/* ── output ── */
function showOutput(){
  const box = document.getElementById('output-box');
  const lines = [`/* iPad ${mode} — individual element positions */`, ''];
  ELEMENTS.forEach(row=>{
    const [t,l,w] = vals[row.key];
    lines.push(`${row.key}: top:${t.toFixed(1)}%  left:${l.toFixed(1)}%  width:${w.toFixed(1)}%`);
  });
  box.innerHTML = lines.join('\n') +
    '\n\n<button onclick="document.getElementById(\'output-box\').style.display=\'none\'">סגור</button>';
  box.style.display='block';
}

setMode('portrait');
</script>
</body>
</html>
