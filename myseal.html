הם לשדים וישפכו דם נקי דםבניהם ובנותיהם אשר זבחו לעצבי כנען ותחנף הארץ בדמים ויטמאו במעשיהם ויזנו במעלליהם ויחראף יהוה בעמו ויתעב אתנחלתו ויתנם בידגוים וימשלו בהם שנאיהם וילחצום אויביהם ויכנעו תחת ידם פעמים רבות יצילם והמה ימרו בעצתם וימכו בעונם וירא בצר להם בשמעו אתרנתם ויזכר להם בריתו וינחם כרב חסדו ויתן אותם לרחמים לפני כלשוביהם הושיענו יהוה אלהינו וקבצנו מןהגוים להדות לשם קדשך להשתבח בתהלתך ברוך יהוה אלהי ישראל מןהעולם ועד העולם ואמר כלהעם אמן הללויה", "107": "הדו ליהוה כיטוב כי לעולם חסדו יאמרו גאולי יהוה אשר גאלם מידצר ומארצות קבצם ממזרח וממערב מצפון ומים תעו במדבר בישימון דרך עיר מושב לא מצאו רעבים גםצמאים נפשם בהם תתעטף ויצעקו אליהוה בצר להם ממצוקותיהם יצילם וידריכם בדרך ישרה ללכת אלעיר מושב יודו ליהוה חסדו ונפלאותיו לבני אדם כיהשביע נפש שקקה ונפש רעבה מלאטוב ישבי חשך וצלמות אסירי עני וברזל כיהמרו אמריאל ועצת עליון נאצו ויכנע בעמל לבם כשלו ואין עזר ויזעקו אליהוה בצר להם ממצקותיהם יושיעם יוציאם מחשך וצלמות ומוסרותיהם ינתק יודו ליהוה חסדו ונפלאותיו לבני אדם כישבר דלתות נחשת ובריחי ברזל גדע אולים מדרך פשעם ומעונתיהם יתענו כלאכל תתעב נפשם ויגיעו עדשערי מות ויזעקו אליהוה בצר להם ממצקותיהם יושיעם ישלח דברו וירפאם וימלט משחיתותם יודו ליהוה חסדו ונפלאותיו לבני אדם ויזבחו זבחי תודה ויספרו מעשיו ברנה יורדי הים באניות עשי מלאכה במים רבים המה ראו מעשי יהוה ונפלאותיו במצולה ויאמר ויעמד רוח סערה ותרומם גליו יעלו שמים ירדו תהומות נפשם ברעה תתמוגג יחוגו וינועו כשכור וכלחכמתם תתבלע ויצעקו אליהוה בצר להם וממצוקתיהם יוציאם יקם סערה לדממה ויחשו גליהם וישמחו כיישתקו וינחם אלמחוז חפצם יודו ליהוה חסדו ונפלאותיו לבני אדם וירוממוהו בקהלעם ובמושב זקנים יהללוהו ישם נהרות למדבר ומצאי מים לצמאון ארץ פרי למלחה מרעת יושבי בה ישם מדבר לאגםמים וארץ ציה למצאי מים ויושב שם רעבים ויכוננו עיר מושב ויזרעו שדות ויטעו כרמים ויעשו פרי תבואה ויברכם וירבו מאד ובהמתם לא ימעיט וימעטו וישחו מעצר רעה ויגון שפך בוז עלנדיבים ויתעם בתהו לאדרך וישגב אביון מעוני וישם כצאן משפחות יראו ישרים וישמחו וכלעולה קפצה פיה מיחכם וישמראלה ויתבוננו חסדי יהוה פ", "108": "שיר מזמור לדוד נכון לבי אלהים אשירה ואזמרה אףכבודי עורה הנבל וכנור אעירה שחר אודך בעמים יהוה ואזמרך בלאמים כיגדול מעלשמים חסדך ועדשחקים אמתך רומה עלשמים אלהים ועל כלהארץ כבודך למען יחלצון ידידיך הושיעה ימינך וענני אלהים דבר בקדשו אעלזה אחלקה שכם ועמק סכות אמדד לי גלעד לי מנשה ואפרים מעוז ראשי יהודה מחקקי מואב סיר רחצי עלאדום אשליך נעלי עליפלשת אתרועע מי יבלני עיר מבצר מי נחני עדאדום הלאאלהים זנחתנו ולאתצא אלהים בצבאתינו הבהלנו עזרת מצר ושוא תשועת אדם באלהים נעשהחיל והוא יבוס צרינו פ", "109": "למנצח לדוד מזמור אלהי תהלתי אלתחרש כי פי רשע ופימרמה עלי פתחו דברו אתי לשון שקר ודברי שנאה סבבוני וילחמוני חנם תחתאהבתי ישטנוני ואני תפלה וישימו עלי רעה תחת טובה ושנאה תחת אהבתי הפקד עליו רשע ושטן יעמד עלימינו בהשפטו יצא רשע ותפלתו תהיה לחטאה יהיוימיו מעטים פקדתו יקח אחר יהיובניו יתומים ואשתו אלמנה ונוע ינועו בניו ושאלו ודרשו מחרבותיהם ינקש נושה לכלאשרלו ויבזו זרים יגיעו אליהילו משך חסד ואליהי חונן ליתומיו יהיאחריתו להכרית בדור אחר ימח שמם יזכר עון אבתיו אליהוה וחטאת אמו אלתמח יהיו נגדיהוה תמיד ויכרת מארץ זכרם יען אשר לא זכר עשות חסד וירדף אישעני ואביון ונכאה לבב למותת ויאהב קללה ותבואהו ולאחפץ בברכה ותרחק ממנו וילבש קללה כמדו ותבא כמים בקרבו וכשמן בעצמותיו תהילו כבגד יעטה ולמזח תמיד יחגרה זאת פעלת שטני מאת יהוה והדברים רע עלנפשי ואתה יהוה אדני עשהאתי למען שמך כיטוב חסדך הצילני כיעני ואביון אנכי ולבי חלל בקרבי כצלכנטותו נהלכתי ננערתי כארבה ברכי כשלו מצום ובשרי כחש משמן ואני הייתי חרפה להם יראוני יניעון ראשם עזרני יהוה אלהי הושיעני כחסדך וידעו כיידך זאת אתה יהוה עשיתה יקללוהמה ואתה תברך קמו ויבשו ועבדך ישמח ילבשו שוטני כלמה ויעטו כמעיל בשתם אודה יהוה מאד בפי ובתוך רבים אהללנו כייעמד לימין אביון להושיע משפטי נפשו פ", "110": "לדוד מזמור נאם יהוה לאדני שב לימיני עדאשית איביך הדם לרגליך מטהעזך ישלח יהוה מציון רדה בקרב איביך עמך נדבת ביום חילך בהדריקדש מרחם משחר לך טל ילדתיך נשבע יהוה ולא ינחם אתהכהן לעולם עלדברתי מלכיצדק אדני עלימינך מחץ ביוםאפו מלכים ידין בגוים מלא גויות מחץ ראש עלארץ רבה מנחל בדרך ישתה עלכן ירים ראש פ", "111": "הללו יה אודה יהוה בכללבב בסוד ישרים ועדה גדלים מעשי יהוה דרושים לכלחפציהם הודוהדר פעלו וצדקתו עמדת לעד זכר עשה לנפלאותיו חנון ורחום יהוה טרף נתן ליראיו יזכר לעולם בריתו כח מעשיו הגיד לעמו לתת להם נחלת גוים מעשי ידיו אמת ומשפט נאמנים כלפקודיו סמוכים לעד לעולם עשוים באמת וישר פדות שלח לעמו צוהלעולם בריתו קדוש ונורא שמו ראשית חכמה יראת יהוה שכל טוב לכלעשיהם תהלתו עמדת לעד פ", "112": "הללו יה אשריאיש ירא אתיהוה במצותיו חפץ מאד גבור בארץ יהיה זרעו דור ישרים יברך הוןועשר בביתו וצדקתו עמדת לעד זרח בחשך אור לישרים חנון ורחום וצדיק טובאיש חונן ומלוה יכלכל דבריו במשפט כילעולם לאימוט לזכר עולם יהיה צדיק משמועה רעה לא יירא נכון לבו בטח ביהוה סמוך לבו לא יירא עד אשריראה בצריו פזר נתן לאביונים צדקתו עמדת לעד קרנו תרום בכבוד רשע יראה וכעס שניו יחרק ונמס תאות רשעים תאבד פ", "113": "הללו יה הללו עבדי יהוה הללו אתשם יהוה יהי שם יהוה מברך מעתה ועדעולם ממזרחשמש עדמבואו מהלל שם יהוה רם עלכלגוים יהוה על השמים כבודו מי כיהוה אלהינו המגביהי לשבת המשפילי לראות בשמים ובארץ מקימי מעפר דל מאשפת ירים אביון להושיבי עםנדיבים עם נדיבי עמו מושיבי עקרת הבית אםהבנים שמחה הללויה פ", "114": "בצאת ישראל ממצרים בית יעקב מעם לעז היתה יהודה לקדשו ישראל ממשלותיו הים ראה וינס הירדן יסב לאחור ההרים רקדו כאילים גבעות כבניצאן מהלך הים כי תנוס הירדן תסב לאחור ההרים תרקדו כאילים גבעות כבניצאן מלפני אדון חולי ארץ מלפני אלוה יעקב ההפכי הצור אגםמים חלמיש למעינומים", "115": "לא לנו יהוה לאלנו כילשמך תן כבוד עלחסדך עלאמתך למה יאמרו הגוים איהנא אלהיהם ואלהינו בשמים כל אשרחפץ עשה עצביהם כסף וזהב מעשה ידי אדם פהלהם ולא ידברו עינים להם ולא יראו אזנים להם ולא ישמעו אף להם ולא יריחון ידיהם ולא ימישון רגליהם ולא יהלכו לאיהגו בגרונם כמוהם יהיו עשיהם כל אשרבטח בהם ישראל בטח ביהוה עזרם ומגנם הוא בית אהרן בטחו ביהוה עזרם ומגנם הוא יראי יהוה בטחו ביהוה עזרם ומגנם הוא יהוה זכרנו יברך יברך אתבית ישראל יברך אתבית אהרן יברך יראי יהוה הקטנים עםהגדלים יסף יהוה עליכם עליכם ועלבניכם ברוכים אתם ליהוה עשה שמים וארץ השמים שמים ליהוה והארץ נתן לבניאדם לא המתים יהללויה ולא כלירדי דומה ואנחנו נברך יה מעתה ועדעולם הללויה פ", "116": "אהבתי כיישמע יהוה אתקולי תחנוני כיהטה אזנו לי ובימי אקרא אפפוני חבלימות ומצרי שאול מצאוני צרה ויגון אמצא ובשםיהוה אקרא אנה יהוה מלטה נפשי חנון יהוה וצדיק ואלהינו מרחם שמר פתאים יהוה דלתי ולי יהושיע שובי נפשי למנוחיכי כייהוה גמל עליכי כי חלצת נפשי ממות אתעיני מןדמעה אתרגלי מדחי אתהלך לפני יהוה בארצות החיים האמנתי כי אדבר אני עניתי מאד אני אמרתי בחפזי כלהאדם כזב מהאשיב ליהוה כלתגמולוהי עלי כוסישועות אשא ובשם יהוה אקרא נדרי ליהוה אשלם נגדהנא לכלעמו יקר בעיני יהוה המותה לחסידיו אנה יהוה כיאני עבדך אניעבדך בןאמתך פתחת למוסרי לךאזבח זבח תודה ובשם יהוה אקרא נדרי ליהוה אשלם נגדהנא לכלעמו בחצרות בית יהוה בתוככי ירושל ם הללויה פ", "117": "הללו אתיהוה כלגוים שבחוהו כלהאמים כי גבר עלינו חסדו ואמתיהוה לעולם הללויה פ", "118": "הודו ליהוה כיטוב כי לעולם חסדו יאמרנא ישראל כי לעולם חסדו יאמרונא ביתאהרן כי לעולם חסדו יאמרונא יראי יהוה כי לעולם חסדו מןהמצר קראתי יה ענני במרחב יה יהוה לי לא אירא מהיעשה לי אדם יהוה לי בעזרי ואני אראה בשנאי טוב לחסות ביהוה מבטח באדם טוב לחסות ביהוה מבטח בנדיבים כלגוים סבבוני בשם יהוה כי אמילם סבוני גםסבבוני בשם יהוה כי אמילם סבוני כדבורים דעכו כאש קוצים בשם יהוה כי אמילם דחה דחיתני לנפל ויהוה עזרני עזי וזמרת יה ויהילי לישועה קול רנה וישועה באהלי צדיקים ימין יהוה עשה חיל ימין יהוה רוממה ימין יהוה עשה חיל לאאמות כיאחיה ואספר מעשי יה יסר יסרני יה ולמות לא נתנני פתחולי שעריצדק אבאבם אודה יה זההשער ליהוה צדיקים יבאו בו אודך כי עניתני ותהילי לישועה אבן מאסו הבונים היתה לראש פנה מאת יהוה היתה זאת היא נפלאת בעינינו זההיום עשה יהוה נגילה ונשמחה בו אנא יהוה הושיעה נא אנא יהוה הצליחה נא ברוך הבא בשם יהוה ברכנוכם מבית יהוה אל יהוה ויאר לנו אסרוחג בעבתים עדקרנות המזבח אלי אתה ואודך אלהי ארוממך הודו ליהוה כיטוב כי לעולם חסדו פ", "119": "אשרי תמימידרך ההלכים בתורת יהוה אשרי נצרי עדתיו בכללב ידרשוהו אף לאפעלו עולה בדרכיו הלכו אתה צויתה פקדיך לשמר מאד אחלי יכנו דרכי לשמר חקיך אז לאאבוש בהביטי אלכלמצותיך אודך בישר לבב בלמדי משפטי צדקך אתחקיך אשמר אלתעזבני עדמאד פ במה יזכהנער אתארחו לשמר כדברך בכללבי דרשתיך אלתשגני ממצותיך בלבי צפנתי אמרתך למען לא אחטאלך ברוך אתה יהוה למדני חקיך בשפתי ספרתי כל משפטיפיך בדרך עדותיך ששתי כעל כלהון בפקודיך אשיחה ואביטה ארחתיך בחקתיך אשתעשע לא אשכח דברך פ גמל עלעבדך אחיה ואשמרה דברך גלעיני ואביטה נפלאות מתורתך גר אנכי בארץ אלתסתר ממני מצותיך גרסה נפשי לתאבה אלמשפטיך בכלעת גערת זדים ארורים השגים ממצותיך גל מעלי חרפה ובוז כי עדתיך נצרתי גם ישבו שרים בי נדברו עבדך ישיח בחקיך גםעדתיך שעשעי אנשי עצתי פ דבקה לעפר נפשי חיני כדברך דרכי ספרתי ותענני למדני חקיך דרךפקודיך הבינני ואשיחה בנפלאותיך דלפה נפשי מתוגה קימני כדברך דרךשקר הסר ממני ותורתך חנני דרךאמונה בחרתי משפטיך שויתי דבקתי בעדותיך יהוה אלתבישני דרךמצותיך ארוץ כי תרחיב לבי פ הורני יהוה דרך חקיך ואצרנה עקב הבינני ואצרה תורתך ואשמרנה בכללב הדריכני בנתיב מצותיך כיבו חפצתי הטלבי אלעדותיך ואל אלבצע העבר עיני מראות שוא בדרכך חיני הקם לעבדך אמרתך אשר ליראתך העבר חרפתי אשר יגרתי כי משפטיך טובים הנה תאבתי לפקדיך בצדקתך חיני פ ויבאני חסדך יהוה תשועתך כאמרתך ואענה חרפי דבר כיבטחתי בדברך ואלתצל מפי דבראמת עדמאד כי למשפטך יחלתי ואשמרה תורתך תמיד לעולם ועד ואתהלכה ברחבה כי פקדיך דרשתי ואדברה בעדתיך נגד מלכים ולא אבוש ואשתעשע במצותיך אשר אהבתי ואשאכפי אלמצותיך אשר אהבתי ואשיחה בחקיך פ זכרדבר לעבדך על אשר יחלתני זאת נחמתי בעניי כי אמרתך חיתני זדים הליצני עדמאד מתורתך לא נטיתי זכרתי משפטיך מעולם יהוה ואתנחם זלעפה אחזתני מרשעים עזבי תורתך זמרות היולי חקיך בבית מגורי זכרתי בלילה שמך יהוה ואשמרה תורתך זאת היתהלי כי פקדיך נצרתי פ חלקי יהוה אמרתי לשמר דבריך חליתי פניך בכללב חנני כאמרתך חשבתי דרכי ואשיבה רגלי אלעדתיך חשתי ולא התמהמהתי לשמר מצותיך חבלי רשעים עודני תורתך לא שכחתי חצותלילה אקום להודות לך על משפטי צדקך חבר אני לכלאשר יראוך ולשמרי פקודיך חסדך יהוה מלאה הארץ חקיך למדני פ טוב עשית עםעבדך יהוה כדברך טוב טעם ודעת למדני כי במצותיך האמנתי טרם אענה אני שגג ועתה אמרתך שמרתי טובאתה ומטיב למדני חקיך טפלו עלי שקר זדים אני בכללב אצר פקודיך טפש כחלב לבם אני תורתך שעשעתי טובלי כיעניתי למען אלמד חקיך טובלי תורתפיך מאלפי זהב וכסף פ ידיך עשוני ויכוננוני הבינני ואלמדה מצותיך יראיך יראוני וישמחו כי לדברך יחלתי ידעתי יהוה כיצדק משפטיך ואמונה עניתני יהינא חסדך לנחמני כאמרתך לעבדך יבאוני רחמיך ואחיה כיתורתך שעשעי יבשו זדים כישקר עותוני אני אשיח בפקודיך ישובו לי יראיך וידעו וידעי עדתיך יהילבי תמים בחקיך למען לא אבוש פ כלתה לתשועתך נפשי לדברך יחלתי כלו עיני לאמרתך לאמר מתי תנחמני כיהייתי כנאד בקיטור חקיך לא שכחתי כמה ימיעבדך מתי תעשה ברדפי משפט כרולי זדים שיחות אשר לא כתורתך כלמצותיך אמונה שקר רדפוני עזרני כמעט כלוני בארץ ואני לאעזבתי פקדיך כחסדך חיני ואשמרה עדות פיך פ לעולם יהוה דברך נצב בשמים לדר ודר אמונתך כוננת ארץ ותעמד למשפטיך עמדו היום כי הכל עבדיך לולי תורתך שעשעי אז אבדתי בעניי לעולם לאאשכח פקודיך כי בם חייתני לךאני הושיעני כי פקודיך דרשתי לי קוו רשעים לאבדני עדתיך אתבונן לכלתכלה ראיתי קץ רחבה מצותך מאד פ מהאהבתי תורתך כלהיום היא שיחתי מאיבי תחכמני מצותך כי לעולם היאלי מכלמלמדי השכלתי כי עדותיך שיחה לי מזקנים אתבונן כי פקודיך נצרתי מכלארח רע כלאתי רגלי למען אשמר דברך ממשפטיך לאסרתי כיאתה הורתני מהנמלצו לחכי אמרתך מדבש לפי מפקודיך אתבונן עלכן שנאתי כלארח שקר פ נרלרגלי דברך ואור לנתיבתי נשבעתי ואקימה לשמר משפטי צדקך נעניתי עדמאד יהוה חיני כדברך נדבות פי רצהנא יהוה ומשפטיך למדני נפשי בכפי תמיד ותורתך לא שכחתי נתנו רשעים פח לי ומפקודיך לא תעיתי נחלתי עדותיך לעולם כיששון לבי המה נטיתי לבי לעשות חקיך לעולם עקב פ סעפים שנאתי ותורתך אהבתי סתרי ומגני אתה לדברך יחלתי סורוממני מרעים ואצרה מצות אלהי סמכני כאמרתך ואחיה ואלתבישני משברי סעדני ואושעה ואשעה בחקיך תמיד סלית כלשוגים מחקיך כישקר תרמיתם סגים השבת כלרשעיארץ לכן אהבתי עדתיך סמר מפחדך בשרי וממשפטיך יראתי פ עשיתי משפט וצדק בלתניחני לעשקי ערב עבדך לטוב אליעשקני זדים עיני כלו לישועתך ולאמרת צדקך עשה עםעבדך כחסדך וחקיך למדני עבדךאני הבינני ואדעה עדתיך עת לעשות ליהוה הפרו תורתך עלכן אהבתי מצותיך מזהב ומפז עלכן כלפקודי כל ישרתי כלארח שקר שנאתי פ פלאות עדותיך עלכן נצרתם נפשי פתח דבריך יאיר מבין פתיים פיפערתי ואשאפה כי למצותיך יאבתי פנהאלי וחנני כמשפט לאהבי שמך פעמי הכן באמרתך ואלתשלטבי כלאון פדני מעשק אדם ואשמרה פקודיך פניך האר בעבדך ולמדני אתחקיך פלגימים ירדו עיני על לאשמרו תורתך פ צדיק אתה יהוה וישר משפטיך צוית צדק עדתיך ואמונה מאד צמתתני קנאתי כישכחו דבריך צרי צרופה אמרתך מאד ועבדך אהבה צעיר אנכי ונבזה פקדיך לא שכחתי צדקתך צדק לעולם ותורתך אמת צרומצוק מצאוני מצותיך שעשעי צדק עדותיך לעולם הבינני ואחיה פ קראתי בכללב ענני יהוה חקיך אצרה קראתיך הושיעני ואשמרה עדתיך קדמתי בנשף ואשועה לדבריך לדברך יחלתי קדמו עיני אשמרות לשיח באמרתך קולי שמעה כחסדך יהוה כמשפטך חיני קרבו רדפי זמה מתורתך רחקו קרוב אתה יהוה וכלמצותיך אמת קדם ידעתי מעדתיך כי לעולם יסדתם פ ראהעניי וחלצני כיתורתך לא שכחתי ריבה ריבי וגאלני לאמרתך חיני רחוק מרשעים ישועה כיחקיך לא דרשו רחמיך רבים יהוה כמשפטיך חיני רבים רדפי וצרי מעדותיך לא נטיתי ראיתי בגדים ואתקוטטה אשר אמרתך לא שמרו ראה כיפקודיך אהבתי יהוה כחסדך חיני ראשדברך אמת ולעולם כלמשפט צדקך פ שרים רדפוני חנם ומדבריך ומדברך פחד לבי שש אנכי עלאמרתך כמוצא שלל רב שקר שנאתי ואתעבה תורתך אהבתי שבע ביום הללתיך על משפטי צדקך שלום רב לאהבי תורתך ואיןלמו מכשול שברתי לישועתך יהוה ומצותיך עשיתי שמרה נפשי עדתיך ואהבם מאד שמרתי פקודיך ועדתיך כי כלדרכי נגדך פ תקרב רנתי לפניך יהוה כדברך הבינני תבוא תחנתי לפניך כאמרתך הצילני תבענה שפתי תהלה כי תלמדני חקיך תען לשוני אמרתך כי כלמצותיך צדק תהיידך לעזרני כי פקודיך בחרתי תאבתי לישועתך יהוה ותורתך שעשעי תחינפשי ותהללך ומשפטך יעזרני תעיתי כשה אבד בקש עבדך כי מצותיך לא שכחתי פ", "120": "שיר המעלות אליהוה בצרתה לי קראתי ויענני יהוה הצילה נפשי משפתשקר מלשון רמיה מהיתן לך ומהיסיף לך לשון רמיה חצי גבור שנונים עם גחלי רתמים אויהלי כיגרתי משך שכנתי עםאהלי קדר רבת שכנהלה נפשי עם שונא שלום אנישלום וכי אדבר המה למלחמה פ", "121": "שיר למעלות אשא עיני אלההרים מאין יבא עזרי עזרי מעם יהוה עשה שמים וארץ אליתן למוט רגלך אלינום שמרך הנה לאינום ולא יישן שומר ישראל יהוה שמרך יהוה צלך עליד ימינך יומם השמש לאיככה וירח בלילה יהוה ישמרך מכלרע ישמר אתנפשך יהוה ישמרצאתך ובואך מעתה ועדעולם פ", "122": "שיר המעלות לדוד שמחתי באמרים לי בית יהוה נלך עמדות היו רגלינו בשעריך ירושל ם ירושל ם הבנויה כעיר שחברהלה יחדו ששם עלו שבטים שבטייה עדות לישראל להדות לשם יהוה כי שמה ישבו כסאות למשפט כסאות לבית דוד שאלו שלום ירושל ם ישליו אהביך יהישלום בחילך שלוה בארמנותיך למען אחי ורעי אדברהנא שלום בך למען ביתיהוה אלהינו אבקשה טוב לך פ", "123": "שיר המעלות אליך נשאתי אתעיני הישבי בשמים הנה כעיני עבדים אליד אדוניהם כעיני שפחה אליד גברתה כן עינינו אליהוה אלהינו עד שיחננו חננו יהוה חננו כירב שבענו בוז רבת שבעהלה נפשנו הלעג השאננים הבוז לגאיונים לגאי יונים פ", "124": "שיר המעלות לדוד לולי יהוה שהיה לנו יאמרנא ישראל לולי יהוה שהיה לנו בקום עלינו אדם אזי חיים בלעונו בחרות אפם בנו אזי המים שטפונו נחלה עבר עלנפשנו אזי עבר עלנפשנו המים הזידונים ברוך יהוה שלא נתננו טרף לשניהם נפשנו כצפור נמלטה מפח יוקשים הפח נשבר ואנחנו נמלטנו עזרנו בשם יהוה עשה שמים וארץ פ", "125": "שיר המעלות הבטחים ביהוה כהרציון לאימוט לעולם ישב ירושל ם הרים סביב לה ויהוה סביב לעמו מעתה ועדעולם כי לא ינוח שבט הרשע על גורל הצדיקים למען לאישלחו הצדיקים בעולתה ידיהם היטיבה יהוה לטובים ולישרים בלבותם והמטים עקלקלותם יוליכם יהוה אתפעלי האון שלום עלישראל פ", "126": "שיר המעלות בשוב יהוה אתשיבת ציון היינו כחלמים אז ימלא שחוק פינו ולשוננו רנה אז יאמרו בגוים הגדיל יהוה לעשות עםאלה הגדיל יהוה לעשות עמנו היינו שמחים שובה יהוה את שביתנו שבותנו כאפיקים בנגב הזרעים בדמעה ברנה יקצרו הלוך ילך ובכה נשא משךהזרע באיבא ברנה נשא אלמתיו פ", "127": "שיר המעלות לשלמה אםיהוה לאיבנה בית שוא עמלו בוניו בו אםיהוה לאישמרעיר שוא שקד שומר שוא לכם משכימי קום מאחרישבת אכלי לחם העצבים כן יתן לידידו שנא הנה נחלת יהוה בנים שכר פרי הבטן כחצים בידגבור כן בני הנעורים אשרי הגבר אשר מלא אתאשפתו מהם לאיבשו כיידברו אתאויבים בשער פ", "128": "שיר המעלות אשרי כלירא יהוה ההלך בדרכיו יגיע כפיך כי תאכל אשריך וטוב לך אשתך כגפן פריה בירכתי ביתך בניך כשתלי זיתים סביב לשלחנך הנה כיכן יברך גבר ירא יהוה יברכך יהוה מציון וראה בטוב ירושל ם כל ימי חייך וראהבנים לבניך שלום עלישראל פ", "129": "שיר המעלות רבת צררוני מנעורי יאמרנא ישראל רבת צררוני מנעורי גם לאיכלו לי עלגבי חרשו חרשים האריכו למענותם למעניתם יהוה צדיק קצץ עבות רשעים יבשו ויסגו אחור כל שנאי ציון יהיו כחציר גגות שקדמת שלף יבש שלא מלא כפו קוצר וחצנו מעמר ולא אמרו העברים ברכתיהוה אליכם ברכנו אתכם בשם יהוה פ", "130": "שיר המעלות ממעמקים קראתיך יהוה אדני שמעה בקולי תהיינה אזניך קשבות לקול תחנוני אםעונות תשמריה אדני מי יעמד כיעמך הסליחה למען תורא קויתי יהוה קותה נפשי ולדברו הוחלתי נפשי לאדני משמרים לבקר שמרים לבקר יחל ישראל אליהוה כיעםיהוה החסד והרבה עמו פדות והוא יפדה אתישראל מכל עונתיו פ", "131": "שיר המעלות לדוד יהוה לאגבה לבי ולארמו עיני ולאהלכתי בגדלות ובנפלאות ממני אםלא שויתי ודוממתי נפשי כגמל עלי אמו כגמל עלי נפשי יחל ישראל אליהוה מעתה ועדעולם פ", "132": "שיר המעלות זכוריהוה לדוד את כלענותו אשר נשבע ליהוה נדר לאביר יעקב אםאבא באהל ביתי אםאעלה עלערש יצועי אםאתן שנת לעיני לעפעפי תנומה עדאמצא מקום ליהוה משכנות לאביר יעקב הנהשמענוה באפרתה מצאנוה בשדייער נבואה למשכנותיו נשתחוה להדם רגליו קומה יהוה למנוחתך אתה וארון עזך כהניך ילבשוצדק וחסידיך ירננו בעבור דוד עבדך אלתשב פני משיחך נשבעיהוה לדוד אמת לאישוב ממנה מפרי בטנך אשית לכסאלך אםישמרו בניך בריתי ועדתי זו אלמדם גםבניהם עדיעד ישבו לכסאלך כיבחר יהוה בציון אוה למושב לו זאתמנוחתי עדיעד פהאשב כי אותיה צידה ברך אברך אביוניה אשביע לחם וכהניה אלביש ישע וחסידיה רנן ירננו שם אצמיח קרן לדוד ערכתי נר למשיחי אויביו אלביש בשת ועליו יציץ נזרו פ", "133": "שיר המעלות לדוד הנה מהטוב ומהנעים שבת אחים גםיחד כשמן הטוב עלהראש ירד עלהזקן זקןאהרן שירד עלפי מדותיו כטלחרמון שירד עלהררי ציון כי שם צוה יהוה אתהברכה חיים עדהעולם פ", "134": "שיר המעלות הנה ברכו אתיהוה כלעבדי יהוה העמדים בביתיהוה בלילות שאוידכם קדש וברכו אתיהוה יברכך יהוה מציון עשה שמים וארץ פ", "135": "הללו יה הללו אתשם יהוה הללו עבדי יהוה שעמדים בבית יהוה בחצרות בית אלהינו הללויה כיטוב יהוה זמרו לשמו כי נעים כייעקב בחר לו יה ישראל לסגלתו כי אני ידעתי כיגדול יהוה ואדנינו מכלאלהים כל אשרחפץ יהוה עשה בשמים ובארץ בימים וכלתהמות מעלה נשאים מקצה הארץ ברקים למטר עשה מוצארוח מאוצרותיו שהכה בכורי מצרים מאדם עדבהמה שלח אותת ומפתים בתוככי מצרים בפרעה ובכלעבדיו שהכה גוים רבים והרג מלכים עצומים לסיחון מלך האמרי ולעוג מלך הבשן ולכל ממלכות כנען ונתן ארצם נחלה נחלה לישראל עמו יהוה שמך לעולם יהוה זכרך לדרודר כיידין יהוה עמו ועלעבדיו יתנחם עצבי הגוים כסף וזהב מעשה ידי אדם פהלהם ולא ידברו עינים להם ולא יראו אזנים להם ולא יאזינו אף איןישרוח בפיהם כמוהם יהיו עשיהם כל אשרבטח בהם בית ישראל ברכו אתיהוה בית אהרן ברכו אתיהוה בית הלוי ברכו אתיהוה יראי יהוה ברכו אתיהוה ברוך יהוה מציון שכן ירושל ם הללויה פ", "136": "הודו ליהוה כיטוב כי לעולם חסדו הודו לאלהי האלהים כי לעולם חסדו הודו לאדני האדנים כי לעולם חסדו לעשה נפלאות גדלות לבדו כי לעולם חסדו לעשה השמים בתבונה כי לעולם חסדו לרקע הארץ עלהמים כי לעולם חסדו לעשה אורים גדלים כי לעולם חסדו אתהשמש לממשלת ביום כי לעולם חסדו אתהירח וכוכבים לממשלות בלילה כי לעולם חסדו למכה מצרים בבכוריהם כי לעולם חסדו ויוצא ישראל מתוכם כי לעולם חסדו ביד חזקה ובזרוע נטויה כי לעולם חסדו לגזר יםסוף לגזרים כי לעולם חסדו והעביר ישראל בתוכו כי לעולם חסדו ונער פרעה וחילו ביםסוף כי לעולם חסדו למוליך עמו במדבר כי לעולם חסדו למכה מלכים גדלים כי לעולם חסדו ויהרג מלכים אדירים כי לעולם חסדו לסיחון מלך האמרי כי לעולם חסדו ולעוג מלך הבשן כי לעולם חסדו ונתן ארצם לנחלה כי לעולם חסדו נחלה לישראל עבדו כי לעולם חסדו שבשפלנו זכר לנו כי לעולם חסדו ויפרקנו מצרינו כי לעולם חסדו נתן לחם לכלבשר כי לעולם חסדו הודו לאל השמים כי לעולם חסדו פ", "137": "על נהרות בבל שם ישבנו גםבכינו בזכרנו אתציון עלערבים בתוכה תלינו כנרותינו כי שם שאלונו שובינו דברישיר ותוללינו שמחה שירו לנו משיר ציון איך נשיר אתשיריהוה על אדמת נכר אםאשכחך ירושל ם תשכח ימיני תדבקלשוני לחכי אםלא אזכרכי אםלא אעלה אתירושל ם על ראש שמחתי זכר יהוה לבני אדום את יום ירושל ם האמרים ערו ערו עד היסוד בה בתבבל השדודה אשרי שישלםלך אתגמולך שגמלת לנו אשרי שיאחז ונפץ אתעלליך אלהסלע פ", "138": "לדוד אודך בכללבי נגד אלהים אזמרך אשתחוה אלהיכל קדשך ואודה אתשמך עלחסדך ועלאמתך כיהגדלת עלכלשמך אמרתך ביום קראתי ותענני תרהבני בנפשי עז יודוך יהוה כלמלכיארץ כי שמעו אמריפיך וישירו בדרכי יהוה כיגדול כבוד יהוה כירם יהוה ושפל יראה וגבה ממרחק יידע אםאלך בקרב צרה תחיני על אף איבי תשלח ידך ותושיעני ימינך יהוה יגמר בעדי יהוה חסדך לעולם מעשי ידיך אלתרף פ", "139": "למנצח לדוד מזמור יהוה חקרתני ותדע אתה ידעת שבתי וקומי בנתה לרעי מרחוק ארחי ורבעי זרית וכלדרכי הסכנתה כי אין מלה בלשוני הן יהוה ידעת כלה אחור וקדם צרתני ותשת עלי כפכה פלאיה פליאה דעת ממני נשגבה לאאוכל לה אנה אלך מרוחך ואנה מפניך אברח אםאסק שמים שם אתה ואציעה שאול הנך אשא כנפישחר אשכנה באחרית ים גםשם ידך תנחני ותאחזני ימינך ואמר אךחשך ישופני ולילה אור בעדני גםחשך לאיחשיך ממך ולילה כיום יאיר כחשיכה כאורה כיאתה קנית כליתי תסכני בבטן אמי אודך על כי נוראות נפליתי נפלאים מעשיך ונפשי ידעת מאד לאנכחד עצמי ממך אשרעשיתי בסתר רקמתי בתחתיות ארץ גלמי ראו עיניך ועלספרך כלם יכתבו ימים יצרו ולא ולו אחד בהם ולי מהיקרו רעיך אל מה עצמו ראשיהם אספרם מחול ירבון הקיצתי ועודי עמך אםתקטל אלוה רשע ואנשי דמים סורו מני אשר ימרוך למזמה נשוא לשוא עריך הלואמשנאיך יהוה אשנא ובתקוממיך אתקוטט תכלית שנאה שנאתים לאויבים היו לי חקרני אל ודע לבבי בחנני ודע שרעפי וראה אםדרךעצב בי ונחני בדרך עולם פ", "140": "למנצח מזמור לדוד חלצני יהוה מאדם רע מאיש חמסים תנצרני אשר חשבו רעות בלב כליום יגורו מלחמות שננו לשונם כמונחש חמת עכשוב תחת שפתימו סלה שמרני יהוה מידי רשע מאיש חמסים תנצרני אשר חשבו לדחות פעמי טמנוגאים פח לי וחבלים פרשו רשת לידמעגל מקשים שתולי סלה אמרתי ליהוה אלי אתה האזינה יהוה קול תחנוני יהוה אדני עז ישועתי סכתה לראשי ביום נשק אלתתן יהוה מאויי רשע זממו אלתפק ירומו סלה ראש מסבי עמל שפתימו יכסומו יכסימו ימיטו ימוטו עליהם גחלים באש יפלם במהמרות בליקומו איש לשון בליכון בארץ אישחמס רע יצודנו למדחפת ידעת ידעתי כייעשה יהוה דין עני משפט אבינים אך צדיקים יודו לשמך ישבו ישרים אתפניך פ", "141": "מזמור לדוד יהוה קראתיך חושה לי האזינה קולי בקראילך תכון תפלתי קטרת לפניך משאת כפי מנחתערב שיתה יהוה שמרה לפי נצרה עלדל שפתי אלתטלבי לדבר רע להתעולל עללות ברשע אתאישים פעליאון ובלאלחם במנעמיהם יהלמני צדיק חסד ויוכיחני שמן ראש אליני ראשי כיעוד ותפלתי ברעותיהם נשמטו בידיסלע שפטיהם ושמעו אמרי כי נעמו כמו פלח ובקע בארץ נפזרו עצמינו לפי שאול כי אליך יהוה אדני עיני בכה חסיתי אלתער נפשי שמרני מידי פח יקשו לי ומקשות פעלי און יפלו במכמריו רשעים יחד אנכי עדאעבור פ", "142": "משכיל לדוד בהיותו במערה תפלה קולי אליהוה אזעק קולי אליהוה אתחנן אשפך לפניו שיחי צרתי לפניו אגיד בהתעטף עלי רוחי ואתה ידעת נתיבתי בארחזו אהלך טמנו פח לי הביט ימין וראה ואיןלי מכיר אבד מנוס ממני אין דורש לנפשי זעקתי אליך יהוה אמרתי אתה מחסי חלקי בארץ החיים הקשיבה אלרנתי כידלותי מאד הצילני מרדפי כי אמצו ממני הוציאה ממסגר נפשי להודות אתשמך בי יכתרו צדיקים כי תגמל עלי פ", "143": "מזמור לדוד יהוה שמע תפלתי האזינה אלתחנוני באמנתך ענני בצדקתך ואלתבוא במשפט אתעבדך כי לאיצדק לפניך כלחי כי רדף אויב נפשי דכא לארץ חיתי הושבני במחשכים כמתי עולם ותתעטף עלי רוחי בתוכי ישתומם לבי זכרתי ימים מקדם הגיתי בכלפעלך במעשה ידיך אשוחח פרשתי ידי אליך נפשי כארץעיפה לך סלה מהר ענני יהוה כלתה רוחי אלתסתר פניך ממני ונמשלתי עםירדי בור השמיעני בבקר חסדך כיבך בטחתי הודיעני דרךזו אלך כיאליך נשאתי נפשי הצילני מאיבי יהוה אליך כסתי למדני לעשות רצונך כיאתה אלוהי רוחך טובה תנחני בארץ מישור למעןשמך יהוה תחיני בצדקתך תוציא מצרה נפשי ובחסדך תצמית איבי והאבדת כלצררי נפשי כי אני עבדך פ", "144": "לדוד ברוך יהוה צורי המלמד ידי לקרב אצבעותי למלחמה חסדי ומצודתי משגבי ומפלטי לי מגני ובו חסיתי הרודד עמי תחתי יהוה מהאדם ותדעהו בןאנוש ותחשבהו אדם להבל דמה ימיו כצל עובר יהוה הטשמיך ותרד גע בהרים ויעשנו ברוק ברק ותפיצם שלח חציך ותהמם שלח ידיך ממרום פצני והצילני ממים רבים מיד בני נכר אשר פיהם דברשוא וימינם ימין שקר אלהים שיר חדש אשירה לך בנבל עשור אזמרהלך הנותן תשועה למלכים הפוצה אתדוד עבדו מחרב רעה פצני והצילני מיד בנינכר אשר פיהם דברשוא וימינם ימין שקר אשר בנינו כנטעים מגדלים בנעוריהם בנותינו כזוית מחטבות תבנית היכל מזוינו מלאים מפיקים מזן אל זן צאוננו מאליפות מרבבות בחוצותינו אלופינו מסבלים איןפרץ ואין יוצאת ואין צוחה ברחבתינו אשרי העם שככה לו אשרי העם שיהוה אלהיו פ", "145": "תהלה לדוד ארוממך אלוהי המלך ואברכה שמך לעולם ועד בכליום אברכך ואהללה שמך לעולם ועד גדול יהוה ומהלל מאד ולגדלתו אין חקר דור לדור ישבח מעשיך וגבורתיך יגידו הדר כבוד הודך ודברי נפלאתיך אשיחה ועזוז נוראתיך יאמרו וגדלותיך וגדלתך אספרנה זכר רבטובך יביעו וצדקתך ירננו חנון ורחום יהוה ארך אפים וגדלחסד טוביהוה לכל ורחמיו עלכלמעשיו יודוך יהוה כלמעשיך וחסידיך יברכוכה כבוד מלכותך יאמרו וגבורתך ידברו להודיע לבני האדם גבורתיו וכבוד הדר מלכותו מלכותך מלכות כלעלמים וממשלתך בכלדור ודר סומך יהוה לכלהנפלים וזוקף לכלהכפופים עיניכל אליך ישברו ואתה נותןלהם אתאכלם בעתו פותח אתידך ומשביע לכלחי רצון צדיק יהוה בכלדרכיו וחסיד בכלמעשיו קרוב יהוה לכלקראיו לכל אשר יקראהו באמת רצוןיראיו יעשה ואתשועתם ישמע ויושיעם שומר יהוה אתכלאהביו ואת כלהרשעים ישמיד תהלת יהוה ידבר פי ויברך כלבשר שם קדשו לעולם ועד פ", "146": "הללויה הללי נפשי אתיהוה אהללה יהוה בחיי אזמרה לאלהי בעודי אלתבטחו בנדיבים בבןאדם שאין לו תשועה תצא רוחו ישב לאדמתו ביום ההוא אבדו עשתנתיו אשרי שאל יעקב בעזרו שברו עליהוה אלהיו עשה שמים וארץ אתהים ואתכלאשרבם השמר אמת לעולם עשה משפט לעשוקים נתן לחם לרעבים יהוה מתיר אסורים יהוה פקח עורים יהוה זקף כפופים יהוה אהב צדיקים יהוה שמר אתגרים יתום ואלמנה יעודד ודרך רשעים יעות ימלך יהוה לעולם אלהיך ציון לדר ודר הללויה פ", "147": "הללו יה כיטוב זמרה אלהינו כינעים נאוה תהלה בונה ירושל ם יהוה נדחי ישראל יכנס הרפא לשבורי לב ומחבש לעצבותם מונה מספר לכוכבים לכלם שמות יקרא גדול אדונינו ורבכח לתבונתו אין מספר מעודד ענוים יהוה משפיל רשעים עדיארץ ענו ליהוה בתודה זמרו לאלהינו בכנור המכסה שמים בעבים המכין לארץ מטר המצמיח הרים חציר נותן לבהמה לחמה לבני ערב אשר יקראו לא בגבורת הסוס יחפץ לאבשוקי האיש ירצה רוצה יהוה אתיראיו אתהמיחלים לחסדו שבחי ירושל ם אתיהוה הללי אלהיך ציון כיחזק בריחי שעריך ברך בניך בקרבך השםגבולך שלום חלב חטים ישביעך השלח אמרתו ארץ עדמהרה ירוץ דברו הנתן שלג כצמר כפור כאפר יפזר משליך קרחו כפתים לפני קרתו מי יעמד ישלח דברו וימסם ישב רוחו יזלומים מגיד דברו ליעקב חקיו ומשפטיו לישראל לא עשה כן לכלגוי ומשפטים בלידעום הללויה פ", "148": "הללו יה הללו אתיהוה מןהשמים הללוהו במרומים הללוהו כלמלאכיו הללוהו כל צבאו הללוהו שמש וירח הללוהו כלכוכבי אור הללוהו שמי השמים והמים אשר מעל השמים יהללו אתשם יהוה כי הוא צוה ונבראו ויעמידם לעד לעולם חקנתן ולא יעבור הללו אתיהוה מןהארץ תנינים וכלתהמות אש וברד שלג וקיטור רוח סערה עשה דברו ההרים וכלגבעות עץ פרי וכלארזים החיה וכלבהמה רמש וצפור כנף מלכיארץ וכללאמים שרים וכלשפטי ארץ בחורים וגםבתולות זקנים עםנערים יהללו אתשם יהוה כינשגב שמו לבדו הודו עלארץ ושמים וירם קרן לעמו תהלה לכלחסידיו לבני ישראל עם קרבו הללויה פ", "149": "הללו יה שירו ליהוה שיר חדש תהלתו בקהל חסידים ישמח ישראל בעשיו בניציון יגילו במלכם יהללו שמו במחול בתף וכנור יזמרולו כירוצה יהוה בעמו יפאר ענוים בישועה יעלזו חסידים בכבוד ירננו עלמשכבותם רוממות אל בגרונם וחרב פיפיות בידם לעשות נקמה בגוים תוכחות בלאמים לאסר מלכיהם בזקים ונכבדיהם בכבלי ברזל לעשות בהם משפט כתוב הדר הוא לכלחסידיו הללויה פ", "150": "הללו יה הללואל בקדשו הללוהו ברקיע עזו הללוהו בגבורתיו הללוהו כרב גדלו הללוהו בתקע שופר הללוהו בנבל וכנור הללוהו בתף ומחול הללוהו במנים ועגב הללוהו בצלצלישמע הללוהו בצלצלי תרועה כל הנשמה תהלל יה הללויה"};

const gMap = {
  'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,
  'כ':20,'ך':20,'ל':30,'מ':40,'ם':40,'נ':50,'ן':50,'ס':60,'ע':70,
  'פ':80,'ף':80,'צ':90,'ץ':90,'ק':100,'ר':200,'ש':300,'ת':400
};

const dayNames = ['שבת','ראשון','שני','שלישי','רביעי','חמישי','שישי'];

// אתחול בורר תאריך
(function(){
  var d=document.getElementById('dobDay');
  var m=document.getElementById('dobMonth');
  var y=document.getElementById('dobYear');
  for(var i=1;i<=31;i++) d.innerHTML+='<option value="'+i+'">'+i+'</option>';
  var months=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  for(var i=0;i<months.length;i++) m.innerHTML+='<option value="'+(i+1)+'">'+months[i]+'</option>';
  var cur=new Date().getFullYear();
  for(var yr=cur;yr>=1920;yr--) y.innerHTML+='<option value="'+yr+'">'+yr+'</option>';
})();

// אתחול בורר מזמור
(function(){
  var sel=document.getElementById('psalmSel');
  for(var i=1;i<=150;i++) sel.innerHTML+='<option value="'+i+'">מזמור '+i+'</option>';
})();

function onSelChange(){
  var n=document.getElementById('psalmSel').value;
  var prev=document.getElementById('psalmPreview');
  prev.textContent=PSALMS[String(n)]||'';
  prev.style.display='block';
  document.getElementById('res2').style.display='none';
}

function chg(d){
  var sel=document.getElementById('psalmSel');
  var n=parseInt(sel.value)+d;
  if(n<1)n=150; if(n>150)n=1;
  sel.value=n; onSelChange();
}

// מחשבון א
function runCalc1(){
  var names=document.getElementById('firstName').value+
            document.getElementById('fatherName').value+
            document.getElementById('motherName').value+
            document.getElementById('cityName').value;
  var day  =parseInt(document.getElementById('dobDay').value)||0;
  var month=parseInt(document.getElementById('dobMonth').value)||0;
  var year =parseInt(document.getElementById('dobYear').value)||0;
  var nG=0;
  for(var i=0;i<names.length;i++) nG+=gMap[names[i]]||0;
  var total=nG+day+month+year;
  var psalm=(total%150)||150;
  document.getElementById('psalmNum').innerText=psalm;
  document.getElementById('totalSum').innerText='סכום כולל: '+total;
  document.getElementById('res1').style.display='block';
}

function clearCalc1(){
  ['firstName','fatherName','motherName','cityName'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('dobDay').selectedIndex=0;
  document.getElementById('dobMonth').selectedIndex=0;
  document.getElementById('dobYear').selectedIndex=0;
  document.getElementById('res1').style.display='none';
}

// מחשבון ב
function cleanPsalm(raw){
  var t=raw;
  t=t.replace(/[\[{(]\s*[\u05D0-\u05EA]\s*[\]})]/g,' ');
  t=t.replace(/[^\u05D0-\u05EA\s]/g,' ');
  var words=t.trim().split(/\s+/);
  var result='';
  for(var i=0;i<words.length;i++) if(words[i].length>=2) result+=words[i];
  return result;
}

function runCalc2(){
  var n=document.getElementById('psalmSel').value;
  var raw=PSALMS[String(n)]||'';
  var cleaned=cleanPsalm(raw);
  var g=0;
  for(var i=0;i<cleaned.length;i++) g+=gMap[cleaned[i]]||0;
  var base=Math.floor(g/65);
  var jebra=g%65;

  document.getElementById('outG').innerText=g;
  document.getElementById('outDay').innerText=dayNames[g%7];
  document.getElementById('outHour').innerText=g%24;
  document.getElementById('outBase').innerText=base;
  document.getElementById('outJebra').innerText=jebra;

  var layout=[
    [15,17,22, 2, 9],
    [ 1, 8,14,21,'S'],
    [20,25, 0, 7,13],
    [ 6,12,19,24, 4],
    [23, 3,10,11,18]
  ];

  function cellVal(n){
    if(n==='S') return (base*21)+jebra;
    if(n===0)   return null;
    if(n<=20)   return base*n;
    return (base*n)+jebra;
  }

  var h='<table>';
  for(var r=0;r<layout.length;r++){
    h+='<tr>';
    for(var c=0;c<layout[r].length;c++){
      var cell=layout[r][c];
      if(cell===0)        h+='<td class="center-x">✕</td>';
      else if(cell==='S') h+='<td class="cell-s">'+cellVal('S')+'</td>';
      else if(cell>=21)   h+='<td class="cell-high">'+cellVal(cell)+'</td>';
      else                h+='<td>'+cellVal(cell)+'</td>';
    }
    h+='</tr>';
  }
  h+='</table>';

  document.getElementById('outTable').innerHTML=h;
  document.getElementById('res2').style.display='block';
}

function clearCalc2(){
  document.getElementById('res2').style.display='none';
  document.getElementById('psalmPreview').style.display='none';
  document.getElementById('outTable').innerHTML='';
}
