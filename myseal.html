<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>חותם המזמור</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#1a1a2e;min-height:100vh;padding:20px 16px 40px;direction:rtl;text-align:right}
h1{text-align:center;color:#e0c97f;font-size:1.4em;letter-spacing:.05em;margin-bottom:24px;padding-top:8px}
.card{background:#16213e;border-radius:18px;padding:22px 18px;margin-bottom:22px;border:1px solid #0f3460;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.card-title{color:#e0c97f;font-size:1.15em;font-weight:bold;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid #0f3460;display:flex;align-items:center;gap:8px}
.badge{background:#e0c97f;color:#1a1a2e;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:.85em;font-weight:900;flex-shrink:0}
label{display:block;color:#a0aec0;font-size:1em;font-weight:bold;margin-bottom:6px;margin-top:14px}
input,select{width:100%;padding:14px;border:1.5px solid #0f3460;border-radius:12px;font-size:20px;font-weight:bold;background:#0f3460;color:#e2e8f0;direction:rtl;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:#e0c97f}
select option{background:#0f3460;color:#e2e8f0}
.date-row{display:flex;gap:8px}
.date-row select{flex:1;text-align:center}
.btn{width:100%;border:none;padding:18px;border-radius:14px;font-size:19px;font-weight:bold;cursor:pointer;margin-top:18px;letter-spacing:.03em;transition:opacity .15s,transform .1s;-webkit-tap-highlight-color:transparent}
.btn:active{opacity:.85;transform:scale(.98)}
.btn-gold{background:linear-gradient(135deg,#e0c97f,#c8a84b);color:#1a1a2e}
.btn-blue{background:linear-gradient(135deg,#4a9eff,#1a73e8);color:white}
.btn-clear{background:transparent;border:1.5px solid #4a5568;color:#718096;margin-top:10px;font-size:15px;padding:12px}
.result-a{display:none;margin-top:16px;background:#0f3460;border-radius:12px;padding:16px;text-align:center}
.psalm-number{font-size:3em;font-weight:900;color:#e0c97f;line-height:1.1}
.psalm-label{color:#a0aec0;font-size:.9em;margin-top:4px}
.total-sum{color:#718096;font-size:.82em;margin-top:8px}
.result-b{display:none;margin-top:16px}
.sel-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.arr-btn{width:48px;height:48px;border-radius:50%;border:2px solid #e0c97f;background:transparent;color:#e0c97f;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:bold}
.arr-btn:active{background:#e0c97f;color:#1a1a2e}
.ps-select{flex:1;text-align:center;font-size:1.5rem;font-weight:900;color:#e0c97f;padding:12px}
.psalm-preview{background:#0f3460;border-radius:10px;padding:12px;margin-top:10px;font-size:.95rem;line-height:1.8;color:#e2e8f0;max-height:160px;overflow-y:auto;display:none}
.g-total{background:#0f3460;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.g-total-lbl{color:#a0aec0;font-size:.88em}
.g-total-val{color:#e0c97f;font-weight:900;font-size:1.2em}
.stats-row{display:flex;gap:10px;margin-bottom:14px}
.stat-box{flex:1;background:#0f3460;border-radius:12px;padding:12px 8px;text-align:center}
.stat-val{font-size:1.6em;font-weight:900;color:#e0c97f}
.stat-lbl{font-size:.75em;color:#718096;margin-top:2px}
.keys-row{display:flex;gap:10px;margin-bottom:12px}
.key-box{flex:1;background:#0f3460;border-radius:10px;padding:10px;text-align:center}
.key-val{font-size:1.3em;font-weight:900;color:#68d391}
.key-lbl{font-size:.75em;color:#718096;margin-top:2px}
.seal-wrap{background:#0f3460;border-radius:14px;padding:14px;overflow-x:auto}
.seal-title{color:#a0aec0;font-size:.82em;margin-bottom:10px;text-align:center}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{border:1.5px solid #1a3a6e;height:52px;text-align:center;font-weight:bold;font-size:15px;color:#e2e8f0;background:#16213e}
td.center-x{background:#1a1a2e;color:#4a5568;font-size:1.2em}
td.cell-s{background:#2d4a22;color:#68d391;border-color:#48bb78}
td.cell-high{background:#2a2000;color:#e0c97f}
</style>
</head>
<body>
<h1>✦ מחשבון גימטריה ✦</h1>

<!-- מחשבון א -->
<div class="card">
  <div class="card-title"><span class="badge">א</span> גילוי המזמור</div>
  <label>שם פרטי:</label>
  <input type="text" id="firstName">
  <label>שם האב:</label>
  <input type="text" id="fatherName">
  <label>שם האם:</label>
  <input type="text" id="motherName">
  <label>שם העיר:</label>
  <input type="text" id="cityName">
  <label>תאריך לידה:</label>
  <div class="date-row">
    <select id="dobDay"><option value="">יום</option></select>
    <select id="dobMonth"><option value="">חודש</option></select>
    <select id="dobYear"><option value="">שנה</option></select>
  </div>
  <button class="btn btn-gold" onclick="runCalc1()">חשב</button>
  <button class="btn btn-clear" onclick="clearCalc1()">🗑 נקה מחשבון</button>
  <div class="result-a" id="res1">
    <div class="psalm-number" id="psalmNum">—</div>
    <div class="psalm-label">מזמור תהילים שלך</div>
    <div class="total-sum" id="totalSum"></div>
  </div>
</div>

<!-- מחשבון ב -->
<div class="card">
  <div class="card-title"><span class="badge">ב</span> הפקת זמנים וחותם 5×5</div>
  <label>בחר מזמור תהילים:</label>
  <div class="sel-row">
    <button class="arr-btn" onclick="chg(-1)">›</button>
    <select class="ps-select" id="psalmSel" onchange="onSelChange()"></select>
    <button class="arr-btn" onclick="chg(1)">‹</button>
  </div>
  <div class="psalm-preview" id="psalmPreview"></div>
  <button class="btn btn-blue" onclick="runCalc2()">+ חשב גימטריה והפק חותם</button>
  <button class="btn btn-clear" onclick="clearCalc2()">🗑 נקה מחשבון</button>
  <div class="result-b" id="res2">
    <div class="g-total">
      <span class="g-total-lbl">גימטריה סופית</span>
      <span class="g-total-val" id="outG">—</span>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-val" id="outDay">—</div><div class="stat-lbl">יום</div></div>
      <div class="stat-box"><div class="stat-val" id="outHour">—</div><div class="stat-lbl">שעה</div></div>
    </div>
    <div class="keys-row">
      <div class="key-box"><div class="key-val" id="outBase">—</div><div class="key-lbl">מפתח (Base)</div></div>
      <div class="key-box"><div class="key-val" id="outJebra">—</div><div class="key-lbl">שבר (Jebra)</div></div>
    </div>
    <div class="seal-wrap">
      <div class="seal-title">חותם 5×5</div>
      <div id="outTable"></div>
    </div>
  </div>
</div>

<script>
const PSALMS = {"1": "אשרי האיש אשר לא הלך בעצת רשעים ובדרך חטאים לא עמד ובמושב לצים לא ישב כי אם בתורת יהוה חפצו ובתורתו יהגה יומם ולילה והיה כעץ שתול עלפלגי מים אשר פריו יתן בעתו ועלהו לאיבול וכל אשריעשה יצליח לאכן הרשעים כי אםכמץ אשרתדפנו רוח עלכן לאיקמו רשעים במשפט וחטאים בעדת צדיקים כייודע יהוה דרך צדיקים ודרך רשעים תאבד פ", "2": "למה רגשו גוים ולאמים יהגוריק יתיצבו מלכיארץ ורוזנים נוסדויחד עליהוה ועלמשיחו ננתקה אתמוסרותימו ונשליכה ממנו עבתימו יושב בשמים ישחק אדני ילעגלמו אז ידבר אלימו באפו ובחרונו יבהלמו ואני נסכתי מלכי עלציון הרקדשי אספרה אל חק יהוה אמר אלי בני אתה אני היום ילדתיך שאל ממני ואתנה גוים נחלתך ואחזתך אפסיארץ תרעם בשבט ברזל ככלי יוצר תנפצם ועתה מלכים השכילו הוסרו שפטי ארץ עבדו אתיהוה ביראה וגילו ברעדה נשקובר פןיאנף ותאבדו דרך כייבער כמעט אפו אשרי כלחוסי בו פ", "3": "מזמור לדוד בברחו מפני אבשלום בנו יהוה מהרבו צרי רבים קמים עלי רבים אמרים לנפשי אין ישועתה לו באלהים סלה ואתה יהוה מגן בעדי כבודי ומרים ראשי קולי אליהוה אקרא ויענני מהר קדשו סלה אני שכבתי ואישנה הקיצותי כי יהוה יסמכני לאאירא מרבבות עם אשר סביב שתו עלי קומה יהוה הושיעני אלהי כיהכית אתכלאיבי לחי שני רשעים שברת ליהוה הישועה עלעמך ברכתך סלה פ", "4": "למנצח בנגינות מזמור לדוד בקראי ענני אלהי צדקי בצר הרחבת לי חנני ושמע תפלתי בני איש עדמה כבודי לכלמה תאהבון ריק תבקשו כזב סלה ודעו כיהפלה יהוה חסיד לו יהוה ישמע בקראי אליו רגזו ואלתחטאו אמרו בלבבכם עלמשכבכם ודמו סלה זבחו זבחיצדק ובטחו אליהוה רבים אמרים מייראנו טוב נסהעלינו אור פניך יהוה נתתה שמחה בלבי מעת דגנם ותירושם רבו בשלום יחדו אשכבה ואישן כיאתה יהוה לבדד לבטח תושיבני פ", "5": "למנצח אלהנחילות מזמור לדוד אמרי האזינה יהוה בינה הגיגי הקשיבה לקול שועי מלכי ואלהי כיאליך אתפלל יהוה בקר תשמע קולי בקר אערךלך ואצפה כי לא אלחפץ רשע אתה לא יגרך רע לאיתיצבו הוללים לנגד עיניך שנאת כלפעלי און תאבד דברי כזב אישדמים ומרמה יתעב יהוה ואני ברב חסדך אבוא ביתך אשתחוה אלהיכלקדשך ביראתך יהוה נחני בצדקתך למען שוררי הושר הישר לפני דרכך כי אין בפיהו נכונה קרבם הוות קברפתוח גרנם לשונם יחליקון האשימם אלהים יפלו ממעצותיהם ברב פשעיהם הדיחמו כימרו בך וישמחו כלחוסי בך לעולם ירננו ותסך עלימו ויעלצו בך אהבי שמך כיאתה תברך צדיק יהוה כצנה רצון תעטרנו פ", "6": "למנצח בנגינות עלהשמינית מזמור לדוד יהוה אלבאפך תוכיחני ואלבחמתך תיסרני חנני יהוה כי אמלל אני רפאני יהוה כי נבהלו עצמי ונפשי נבהלה מאד ואת ואתה יהוה עדמתי שובה יהוה חלצה נפשי הושיעני למען חסדך כי אין במות זכרך בשאול מי יודהלך יגעתי באנחתי אשחה בכללילה מטתי בדמעתי ערשי אמסה עששה מכעס עיני עתקה בכלצוררי סורו ממני כלפעלי און כישמע יהוה קול בכיי שמע יהוה תחנתי יהוה תפלתי יקח יבשו ויבהלו מאד כלאיבי ישבו יבשו רגע פ", "7": "שגיון לדוד אשרשר ליהוה עלדבריכוש בןימיני יהוה אלהי בך חסיתי הושיעני מכלרדפי והצילני פןיטרף כאריה נפשי פרק ואין מציל יהוה אלהי אםעשיתי זאת אםישעול בכפי אםגמלתי שולמי רע ואחלצה צוררי ריקם ירדףאויב נפשי וישג וירמס לארץ חיי וכבודי לעפר ישכן סלה קומה יהוה באפך הנשא בעברות צוררי ועורה אלי משפט צוית ועדת לאמים תסובבך ועליה למרום שובה יהוה ידין עמים שפטני יהוה כצדקי וכתמי עלי יגמרנא רע רשעים ותכונן צדיק ובחן לבות וכליות אלהים צדיק מגני עלאלהים מושיע ישרילב אלהים שופט צדיק ואל זעם בכליום אםלא ישוב חרבו ילטוש קשתו דרך ויכוננה ולו הכין כלימות חציו לדלקים יפעל הנה יחבלאון והרה עמל וילד שקר בור כרה ויחפרהו ויפל בשחת יפעל ישוב עמלו בראשו ועל קדקדו חמסו ירד אודה יהוה כצדקו ואזמרה שםיהוה עליון פ", "8": "למנצח עלהגתית מזמור לדוד יהוה אדנינו מהאדיר שמך בכלהארץ אשר תנה הודך עלהשמים מפי עוללים וינקים יסדת עז למען צורריך להשבית אויב ומתנקם כיאראה שמיך מעשה אצבעתיך ירח וכוכבים אשר כוננתה מהאנוש כיתזכרנו ובןאדם כי תפקדנו ותחסרהו מעט מאלהים וכבוד והדר תעטרהו תמשילהו במעשי ידיך כל שתה תחתרגליו צנה ואלפים כלם וגם בהמות שדי צפור שמים ודגי הים עבר ארחות ימים יהוה אדנינו מהאדיר שמך בכלהארץ פ", "9": "למנצח עלמות לבן מזמור לדוד אודה יהוה בכללבי אספרה כלנפלאותיך אשמחה ואעלצה בך אזמרה שמך עליון בשובאויבי אחור יכשלו ויאבדו מפניך כיעשית משפטי ודיני ישבת לכסא שופט צדק גערת גוים אבדת רשע שמם מחית לעולם ועד האויב תמו חרבות לנצח וערים נתשת אבד זכרם המה ויהוה לעולם ישב כונן למשפט כסאו והוא ישפטתבל בצדק ידין לאמים במישרים ויהי יהוה משגב לדך משגב לעתות בצרה ויבטחו בך יודעי שמך כי לאעזבת דרשיך יהוה זמרו ליהוה ישב ציון הגידו בעמים עלילותיו כידרש דמים אותם זכר לאשכח צעקת עניים ענוים חננני יהוה ראה עניי משנאי מרוממי משערי מות למען אספרה כלתהלתיך בשערי בתציון אגילה בישועתך טבעו גוים בשחת עשו ברשתזו טמנו נלכדה רגלם נודע יהוה משפט עשה בפעל כפיו נוקש רשע הגיון סלה ישובו רשעים לשאולה כלגוים שכחי אלהים כי לא לנצח ישכח אביון תקות ענוים עניים תאבד לעד קומה יהוה אליעז אנוש ישפטו גוים עלפניך שיתה יהוה מורה להם ידעו גוים אנוש המה סלה פ", "10": "למה יהוה תעמד ברחוק תעלים לעתות בצרה בגאות רשע ידלק עני יתפשו במזמות זו חשבו כיהלל רשע עלתאות נפשו ובצע ברך נאץ יהוה רשע כגבה אפו בלידרש אין אלהים כלמזמותיו יחילו דרכו בכלעת מרום משפטיך מנגדו כלצורריו יפיח בהם אמר בלבו בלאמוט לדר ודר אשר לאברע אלה פיהו מלא ומרמות ותך תחת לשונו עמל ואון ישב במארב חצרים במסתרים יהרג נקי עיניו לחלכה יצפנו יארב במסתר כאריה בסכה יארב לחטוף עני יחטף עני במשכו ברשתו ודכה ידכה ישח ונפל בעצומיו חלכאים חל כאים אמר בלבו שכח אל הסתיר פניו בלראה לנצח קומה יהוה אל נשא ידך אלתשכח עניים ענוים עלמה נאץ רשע אלהים אמר בלבו לא תדרש ראתה כיאתה עמל וכעס תביט לתת בידך עליך יעזב חלכה יתום אתה היית עוזר שבר זרוע רשע ורע תדרושרשעו בלתמצא יהוה מלך עולם ועד אבדו גוים מארצו תאות ענוים שמעת יהוה תכין לבם תקשיב אזנך לשפט יתום ודך בליוסיף עוד לערץ אנוש מןהארץ פ", "11": "למנצח לדוד ביהוה חסיתי איך תאמרו לנפשי נודו נודי הרכם צפור כי הנה הרשעים ידרכון קשת כוננו חצם עליתר לירות במואפל לישרילב כי השתות יהרסון צדיק מהפעל יהוה בהיכל קדשו יהוה בשמים כסאו עיניו יחזו עפעפיו יבחנו בני אדם יהוה צדיק יבחן ורשע ואהב חמס שנאה נפשו ימטר עלרשעים פחים אש וגפרית ורוח זלעפות מנת כוסם כיצדיק יהוה צדקות אהב ישר יחזו פנימו פ", "12": "למנצח עלהשמינית מזמור לדוד הושיעה יהוה כיגמר חסיד כיפסו אמונים מבני אדם שוא ידברו איש אתרעהו שפת חלקות בלב ולב ידברו יכרת יהוה כלשפתי חלקות לשון מדברת גדלות אשר אמרו ללשננו נגביר שפתינו אתנו מי אדון לנו משד עניים מאנקת אביונים עתה אקום יאמר יהוה אשית בישע יפיחלו אמרות יהוה אמרות טהרות כסף צרוף בעליל לארץ מזקק שבעתים אתהיהוה תשמרם תצרנו מןהדור זו לעולם סביב רשעים יתהלכון כרם זלות לבני אדם פ", "13": "למנצח מזמור לדוד עדאנה יהוה תשכחני נצח עדאנה תסתיר אתפניך ממני עדאנה אשית עצות בנפשי יגון בלבבי יומם עדאנה ירום איבי עלי הביטה ענני יהוה אלהי האירה עיני פןאישן המות פןיאמר איבי יכלתיו צרי יגילו כי אמוט ואני בחסדך בטחתי יגל לבי בישועתך אשירה ליהוה כי גמל עלי פ", "14": "למנצח לדוד אמר נבל בלבו אין אלהים השחיתו התעיבו עלילה אין עשהטוב יהוה משמים השקיף עלבניאדם לראות היש משכיל דרש אתאלהים הכל סר יחדו נאלחו אין עשהטוב אין גםאחד הלא ידעו כלפעלי און אכלי עמי אכלו לחם יהוה לא קראו שם פחדו פחד כיאלהים בדור צדיק עצתעני תבישו כי יהוה מחסהו מי יתן מציון ישועת ישראל בשוב יהוה שבות עמו יגל יעקב ישמח ישראל פ", "15": "מזמור לדוד יהוה מייגור באהלך מיישכן בהר קדשך הולך תמים ופעל צדק ודבר אמת בלבבו לארגל עללשנו לאעשה לרעהו רעה וחרפה לאנשא עלקרבו נבזה בעיניו נמאס ואתיראי יהוה יכבד נשבע להרע ולא ימר כספו לאנתן בנשך ושחד עלנקי לא לקח עשהאלה לא ימוט לעולם פ", "16": "מכתם לדוד שמרני אל כיחסיתי בך אמרת ליהוה אדני אתה טובתי בלעליך לקדושים אשרבארץ המה ואדירי כלחפציבם ירבו עצבותם אחר מהרו בלאסיך נסכיהם מדם ובלאשא אתשמותם עלשפתי יהוה מנתחלקי וכוסי אתה תומיך גורלי חבלים נפלולי בנעמים אףנחלת שפרה עלי אברך אתיהוה אשר יעצני אףלילות יסרוני כליותי שויתי יהוה לנגדי תמיד כי מימיני בלאמוט לכן שמח לבי ויגל כבודי אףבשרי ישכן לבטח כי לאתעזב נפשי לשאול לאתתן חסידך לראות שחת תודיעני ארח חיים שבע שמחות אתפניך נעמות בימינך נצח פ", "17": "תפלה לדוד שמעה יהוה צדק הקשיבה רנתי האזינה תפלתי בלא שפתי מרמה מלפניך משפטי יצא עיניך תחזינה מישרים בחנת לבי פקדת לילה צרפתני בלתמצא זמתי בליעברפי לפעלות אדם בדבר שפתיך אני שמרתי ארחות פריץ תמך אשרי במעגלותיך בלנמוטו פעמי אניקראתיך כיתענני אל הטאזנך לי שמע אמרתי הפלה חסדיך מושיע חוסים ממתקוממים בימינך שמרני כאישון בתעין בצל כנפיך תסתירני מפני רשעים זו שדוני איבי בנפש יקיפו עלי חלבמו סגרו פימו דברו בגאות אשרינו עתה סבבוני סבבונו עיניהם ישיתו לנטות בארץ דמינו כאריה יכסוף לטרף וככפיר ישב במסתרים קומה יהוה קדמה פניו הכריעהו פלטה נפשי מרשע חרבך ממתיםידך יהוה ממתים מחלד חלקם בחיים וצפינך וצפונך תמלא בטנם ישבעו בנים והניחו יתרם לעולליהם אני בצדק אחזה פניך אשבעה בהקיץ תמונתך פ", "18": "למנצח לעבד יהוה לדוד אשר דבר ליהוה אתדברי השירה הזאת ביום הציליהוה אותו מכף כלאיביו ומיד שאול ויאמר ארחמך יהוה חזקי יהוה סלעי ומצודתי ומפלטי אלי צורי אחסהבו מגני וקרןישעי משגבי מהלל אקרא יהוה ומןאיבי אושע אפפוני חבלימות ונחלי בליעל יבעתוני חבלי שאול סבבוני קדמוני מוקשי מות בצרלי אקרא יהוה ואלאלהי אשוע ישמע מהיכלו קולי ושועתי לפניו תבוא באזניו ותגעש ותרעש הארץ ומוסדי הרים ירגזו ויתגעשו כיחרה לו עלה עשן באפו ואשמפיו תאכל גחלים בערו ממנו ויט שמים וירד וערפל תחת רגליו וירכב עלכרוב ויעף וידא עלכנפירוח ישת חשך סתרו סביבותיו סכתו חשכתמים עבי שחקים מנגה נגדו עביו עברו ברד וגחליאש וירעם בשמים יהוה ועליון יתן קלו ברד וגחליאש וישלח חציו ויפיצם וברקים רב ויהמם ויראו אפיקי מים ויגלו מוסדות תבל מגערתך יהוה מנשמת רוח אפך ישלח ממרום יקחני ימשני ממים רבים יצילני מאיבי עז ומשנאי כיאמצו ממני יקדמוני ביוםאידי ויהייהוה למשען לי ויוציאני למרחב יחלצני כי חפץ בי יגמלני יהוה כצדקי כבר ידי ישיב לי כישמרתי דרכי יהוה ולארשעתי מאלהי כי כלמשפטיו לנגדי וחקתיו לאאסיר מני ואהי תמים עמו ואשתמר מעוני וישביהוה לי כצדקי כבר ידי לנגד עיניו עםחסיד תתחסד עםגבר תמים תתמם עםנבר תתברר ועםעקש תתפתל כיאתה עםעני תושיע ועינים רמות תשפיל כיאתה תאיר נרי יהוה אלהי יגיה חשכי כיבך ארץ גדוד ובאלהי אדלגשור האל תמים דרכו אמרתיהוה צרופה מגן הוא לכל החסים בו כי מי אלוה מבלעדי יהוה ומי צור זולתי אלהינו האל המאזרני חיל ויתן תמים דרכי משוה רגלי כאילות ועל במתי יעמידני מלמד ידי למלחמה ונחתה קשתנחושה זרועתי ותתןלי מגן ישעך וימינך תסעדני וענותך תרבני תרחיב צעדי תחתי ולא מעדו קרסלי ארדוף אויבי ואשיגם ולאאשוב עדכלותם אמחצם ולאיכלו קום יפלו תחת רגלי ותאזרני חיל למלחמה תכריע קמי תחתי ואיבי נתתה לי ערף ומשנאי אצמיתם ישועו ואיןמושיע עליהוה ולא ענם ואשחקם כעפר עלפנירוח כטיט חוצות אריקם תפלטני מריבי עם תשימני לראש גוים עם לאידעתי יעבדוני לשמע אזן ישמעו לי בנינכר יכחשולי בנינכר יבלו ויחרגו ממסגרותיהם חייהוה וברוך צורי וירום אלוהי ישעי האל הנותן נקמות לי וידבר עמים תחתי מפלטי מאיבי אף מןקמי תרוממני מאיש חמס תצילני עלכן אודך בגוים יהוה ולשמך אזמרה מגדל ישועות מלכו ועשה חסד למשיחו לדוד ולזרעו עדעולם פ", "19": "למנצח מזמור לדוד השמים מספרים כבודאל ומעשה ידיו מגיד הרקיע יום ליום יביע אמר ולילה ללילה יחוהדעת איןאמר ואין דברים בלי נשמע קולם בכלהארץ יצא קום ובקצה תבל מליהם לשמש שםאהל בהם והוא כחתן יצא מחפתו ישיש כגבור לרוץ ארח מקצה השמים מוצאו ותקופתו עלקצותם ואין נסתר מחמתו תורת יהוה תמימה משיבת נפש עדות יהוה נאמנה מחכימת פתי פקודי יהוה ישרים משמחילב מצות יהוה ברה מאירת עינים יראת יהוה טהורה עומדת לעד משפטייהוה אמת צדקו יחדו הנחמדים מזהב ומפז רב ומתוקים מדבש ונפת צופים גםעבדך נזהר בהם בשמרם עקב רב שגיאות מייבין מנסתרות נקני גם מזדים חשך עבדך אלימשלובי אז איתם ונקיתי מפשע רב יהיולרצון אמריפי והגיון לבי לפניך יהוה צורי וגאלי פ", "20": "למנצח מזמור לדוד יענך יהוה ביום צרה ישגבך שם אלהי יעקב ישלחעזרך מקדש ומציון יסעדך יזכר כלמנחתך ועולתך ידשנה סלה יתןלך כלבבך וכלעצתך ימלא נרננה בישועתך ובשםאלהינו נדגל ימלא יהוה כלמשאלותיך עתה ידעתי כי הושיע יהוה משיחו יענהו משמי קדשו בגברות ישע ימינו אלה ברכב ואלה בסוסים ואנחנו בשםיהוה אלהינו נזכיר המה כרעו ונפלו ואנחנו קמנו ונתעודד יהוה הושיעה המלך יעננו ביוםקראנו פ", "21": "למנצח מזמור לדוד יהוה בעזך ישמחמלך ובישועתך מה יגל יגיל מאד תאות לבו נתתה לו וארשת שפתיו בלמנעת סלה כיתקדמנו ברכות טוב תשית לראשו עטרת פז חיים שאל ממך נתתה לו ארך ימים עולם ועד גדול כבודו בישועתך הוד והדר תשוה עליו כיתשיתהו ברכות לעד תחדהו בשמחה אתפניך כיהמלך בטח ביהוה ובחסד עליון בלימוט תמצא ידך לכלאיביך ימינך תמצא שנאיך תשיתמו כתנור אש לעת פניך יהוה באפו יבלעם ותאכלם אש פרימו מארץ תאבד וזרעם מבני אדם כינטו עליך רעה חשבו מזמה בליוכלו כי תשיתמו שכם במיתריך תכונן עלפניהם רומה יהוה בעזך נשירה ונזמרה גבורתך פ", "22": "למנצח עלאילת השחר מזמור לדוד אלי אלי למה עזבתני רחוק מישועתי דברי שאגתי אלהי אקרא יומם ולא תענה ולילה ולאדמיה לי ואתה קדוש יושב תהלות ישראל בך בטחו אבתינו בטחו ותפלטמו אליך זעקו ונמלטו בך בטחו ולאבושו ואנכי תולעת ולאאיש חרפת אדם ובזוי עם כלראי ילעגו לי יפטירו בשפה יניעו ראש גל אליהוה יפלטהו יצילהו כי חפץ בו כיאתה גחי מבטן מבטיחי עלשדי אמי עליך השלכתי מרחם מבטן אמי אלי אתה אלתרחק ממני כיצרה קרובה כיאין עוזר סבבוני פרים רבים אבירי בשן כתרוני פצו עלי פיהם אריה טרף ושאג כמים נשפכתי והתפרדו כלעצמותי היה לבי כדונג נמס בתוך מעי יבש כחרש כחי ולשוני מדבק מלקוחי ולעפרמות תשפתני כי סבבוני כלבים עדת מרעים הקיפוני כארי ידי ורגלי אספר כלעצמותי המה יביטו יראובי יחלקו בגדי להם ועללבושי יפילו גורל ואתה יהוה אלתרחק אילותי לעזרתי חושה הצילה מחרב נפשי מידכלב יחידתי הושיעני מפי אריה ומקרני רמים עניתני אספרה שמך לאחי בתוך קהל אהללך יראי יהוה הללוהו כלזרע יעקב כבדוהו וגורו ממנו כלזרע ישראל כי לאבזה ולא שקץ ענות עני ולאהסתיר פניו ממנו ובשועו אליו שמע מאתך תהלתי בקהל רב נדרי אשלם נגד יראיו יאכלו ענוים וישבעו יהללו יהוה דרשיו יחי לבבכם לעד יזכרו וישבו אליהוה כלאפסיארץ וישתחוו לפניך כלמשפחות גוים כי ליהוה המלוכה ומשל בגוים אכלו וישתחוו כלדשניארץ לפניו יכרעו כליורדי עפר ונפשו לא חיה זרע יעבדנו יספר לאדני לדור יבאו ויגידו צדקתו לעם נולד כי עשה פ", "23": "מזמור לדוד יהוה רעי לא אחסר בנאות דשא ירביצני עלמי מנחות ינהלני נפשי ישובב ינחני במעגליצדק למען שמו גם כיאלך בגיא צלמות לאאירא רע כיאתה עמדי שבטך ומשענתך המה ינחמני תערך לפני שלחן נגד צררי דשנת בשמן ראשי כוסי רויה אך טוב וחסד ירדפוני כלימי חיי ושבתי בביתיהוה לארך ימים פ", "24": "לדוד מזמור ליהוה הארץ ומלואה תבל וישבי בה כיהוא עלימים יסדה ועלנהרות יכוננה מייעלה בהריהוה ומייקום במקום קדשו נקי כפים וברלבב אשר לאנשא לשוא נפשי ולא נשבע למרמה ישא ברכה מאת יהוה וצדקה מאלהי ישעו זה דור דרשו מבקשי פניך יעקב סלה שאו שערים ראשיכם והנשאו פתחי עולם ויבוא מלך הכבוד מי זה מלך הכבוד יהוה עזוז וגבור יהוה גבור מלחמה שאו שערים ראשיכם ושאו פתחי עולם ויבא מלך הכבוד מי הוא זה מלך הכבוד יהוה צבאות הוא מלך הכבוד סלה פ", "25": "לדוד אליך יהוה נפשי אשא אלהי בך בטחתי אלאבושה אליעלצו אויבי לי גם כלקויך לא יבשו יבשו הבוגדים ריקם דרכיך יהוה הודיעני ארחותיך למדני הדריכני באמתך ולמדני כיאתה אלהי ישעי אותך קויתי כלהיום זכררחמיך יהוה וחסדיך כי מעולם המה חטאות נעורי ופשעי אלתזכר כחסדך זכרליאתה למען טובך יהוה טובוישר יהוה עלכן יורה חטאים בדרך ידרך ענוים במשפט וילמד ענוים דרכו כלארחות יהוה חסד ואמת לנצרי בריתו ועדתיו למעןשמך יהוה וסלחת לעוני כי רבהוא מיזה האיש ירא יהוה יורנו בדרך יבחר נפשו בטוב תלין וזרעו יירש ארץ סוד יהוה ליראיו ובריתו להודיעם עיני תמיד אליהוה כי הואיוציא מרשת רגלי פנהאלי וחנני כייחיד ועני אני צרות לבבי הרחיבו ממצוקותי הוציאני ראה עניי ועמלי ושא לכלחטאותי ראהאיבי כירבו ושנאת חמס שנאוני שמרה נפשי והצילני אלאבוש כיחסיתי בך תםוישר יצרוני כי קויתיך פדה אלהים אתישראל מכל צרותיו פ", "26": "לדוד שפטני יהוה כיאני בתמי הלכתי וביהוה בטחתי לא אמעד בחנני יהוה ונסני צרופה צרפה כליותי ולבי כיחסדך לנגד עיני והתהלכתי באמתך לאישבתי עםמתישוא ועם נעלמים לא אבוא שנאתי קהל מרעים ועםרשעים לא אשב ארחץ בנקיון כפי ואסבבה אתמזבחך יהוה לשמע בקול תודה ולספר כלנפלאותיך יהוה אהבתי מעון ביתך ומקום משכן כבודך אלתאסף עםחטאים נפשי ועםאנשי דמים חיי אשרבידיהם זמה וימינם מלאה שחד ואני בתמי אלך פדני וחנני רגלי עמדה במישור במקהלים אברך יהוה פ", "27": "לדוד יהוה אורי וישעי ממי אירא יהוה מעוזחיי ממי אפחד בקרב עלי מרעים לאכל אתבשרי צרי ואיבי לי המה כשלו ונפלו אםתחנה עלי מחנה לאיירא לבי אםתקום עלי מלחמה בזאת אני בוטח אחת שאלתי מאתיהוה אותה אבקש שבתי בביתיהוה כלימי חיי לחזות בנעםיהוה ולבקר בהיכלו כי יצפנני בסכה ביום רעה יסתרני בסתר אהלו בצור ירוממני ועתה ירום ראשי על איבי סביבותי ואזבחה באהלו זבחי תרועה אשירה ואזמרה ליהוה שמעיהוה קולי אקרא וחנני וענני לך אמר לבי בקשו פני אתפניך יהוה אבקש אלתסתר פניך ממני אל תטבאף עבדך עזרתי היית אלתטשני ואלתעזבני אלהי ישעי כיאבי ואמי עזבוני ויהוה יאספני הורני יהוה דרכך ונחני בארח מישור למען שוררי אלתתנני בנפש צרי כי קמובי עדישקר ויפח חמס לולא האמנתי לראות בטוביהוה בארץ חיים קוה אליהוה חזק ויאמץ לבך וקוה אליהוה פ", "28": "לדוד אליך יהוה אקרא צורי אלתחרש ממני פןתחשה ממני ונמשלתי עםיורדי בור שמע קול תחנוני בשועי אליך בנשאי ידי אלדביר קדשך אלתמשכני עםרשעים ועםפעלי און דברי שלום עםרעיהם ורעה בלבבם תןלהם כפעלם וכרע מעלליהם כמעשה ידיהם תן להם השב גמולם להם כי לא יבינו אלפעלת יהוה ואלמעשה ידיו יהרסם ולא יבנם ברוך יהוה כישמע קול תחנוני יהוה עזי ומגני בו בטח לבי ונעזרתי ויעלז לבי ומשירי אהודנו יהוה עזלמו ומעוז ישועות משיחו הוא הושיעה אתעמך וברך אתנחלתך ורעם ונשאם עדהעולם פ", "29": "מזמור לדוד הבו ליהוה בני אלים הבו ליהוה כבוד ועז הבו ליהוה כבוד שמו השתחוו ליהוה בהדרתקדש קול יהוה עלהמים אלהכבוד הרעים יהוה עלמים רבים קוליהוה בכח קול יהוה בהדר קול יהוה שבר ארזים וישבר יהוה אתארזי הלבנון וירקידם כמועגל לבנון ושרין כמו בןראמים קוליהוה חצב להבות אש קול יהוה יחיל מדבר יחיל יהוה מדבר קדש קול יהוה יחולל אילות ויחשף יערות ובהיכלו כלו אמר כבוד יהוה למבול ישב וישב יהוה מלך לעולם יהוה עז לעמו יתן יהוה יברך אתעמו בשלום פ", "30": "מזמור שירחנכת הבית לדוד ארוממך יהוה כי דליתני ולאשמחת איבי לי יהוה אלהי שועתי אליך ותרפאני יהוה העלית מןשאול נפשי חייתני מיורדי מירדי בור זמרו ליהוה חסידיו והודו לזכר קדשו כי רגע באפו חיים ברצונו בערב ילין בכי ולבקר רנה ואני אמרתי בשלוי בלאמוט לעולם יהוה ברצונך העמדתה להררי עז הסתרת פניך הייתי נבהל אליך יהוה אקרא ואלאדני אתחנן מהבצע בדמי ברדתי אל שחת היודך עפר היגיד אמתך שמעיהוה וחנני יהוה היהעזר לי הפכת מספדי למחול לי פתחת שקי ותאזרני שמחה למען יזמרך כבוד ולא ידם יהוה אלהי לעולם אודך פ", "31": "למנצח מזמור לדוד בךיהוה חסיתי אלאבושה לעולם בצדקתך פלטני הטה אלי אזנך מהרה הצילני היה לי לצורמעוז לבית מצודות להושיעני כיסלעי ומצודתי אתה ולמען שמך תנחני ותנהלני תוציאני מרשת זו טמנו לי כיאתה מעוזי בידך אפקיד רוחי פדית אותי יהוה אל אמת שנאתי השמרים הבלישוא ואני אליהוה בטחתי אגילה ואשמחה בחסדך אשר ראית אתעניי ידעת בצרות נפשי ולא הסגרתני בידאויב העמדת במרחב רגלי חנני יהוה כי צר לי עששה בכעס עיני נפשי ובטני כי כלו ביגון חיי ושנותי באנחה כשל בעוני כחי ועצמי עששו מכלצררי הייתי חרפה ולשכני מאד ופחד למידעי ראי בחוץ נדדו ממני נשכחתי כמת מלב הייתי ככלי אבד כי שמעתי דבת רבים מגור מסביב בהוסדם יחד עלי לקחת נפשי זממו ואני עליך בטחתי יהוה אמרתי אלהי אתה בידך עתתי הצילני מידאויבי ומרדפי האירה פניך עלעבדך הושיעני בחסדך יהוה אלאבושה כי קראתיך יבשו רשעים ידמו לשאול תאלמנה שפתי שקר הדברות עלצדיק עתק בגאוה ובוז מה רבטובך אשרצפנת ליראיך פעלת לחסים בך נגד בני אדם תסתירם בסתר פניך מרכסי איש תצפנם בסכה מריב לשנות ברוך יהוה כי הפליא חסדו לי בעיר מצור ואני אמרתי בחפזי נגרזתי מנגד עיניך אכן שמעת קול תחנוני בשועי אליך אהבו אתיהוה כלחסידיו אמונים נצר יהוה ומשלם עליתר עשה גאוה חזקו ויאמץ לבבכם כלהמיחלים ליהוה פ", "32": "לדוד משכיל אשרי נשויפשע כסוי חטאה אשרי אדם לא יחשב יהוה לו עון ואין ברוחו רמיה כיהחרשתי בלו עצמי בשאגתי כלהיום כי יומם ולילה תכבד עלי ידך נהפך לשדי בחרבני קיץ סלה חטאתי אודיעך ועוני לאכסיתי אמרתי אודה עלי פשעי ליהוה ואתה נשאת עון חטאתי סלה עלזאת יתפלל כלחסיד אליך לעת מצא רק לשטף מים רבים אליו לא יגיעו אתה סתר לי מצר תצרני רני פלט תסובבני סלה אשכילך ואורך בדרךזו תלך איעצה עליך עיני אלתהיו כסוס כפרד אין הבין במתגורסן עדיו לבלום בל קרב אליך רבים מכאובים לרשע והבוטח ביהוה חסד יסובבנו שמחו ביהוה וגילו צדיקים והרנינו כלישרילב פ", "33": "רננו צדיקים ביהוה לישרים נאוה תהלה הודו ליהוה בכנור בנבל עשור זמרולו שירולו שיר חדש היטיבו נגן בתרועה כיישר דבריהוה וכלמעשהו באמונה אהב צדקה ומשפט חסד יהוה מלאה הארץ בדבר יהוה שמים נעשו וברוח פיו כלצבאם כנס כנד מי הים נתן באוצרות תהומות ייראו מיהוה כלהארץ ממנו יגורו כלישבי תבל כי הוא אמר ויהי הואצוה ויעמד יהוה הפיר עצתגוים הניא מחשבות עמים עצת יהוה לעולם תעמד מחשבות לבו לדר ודר אשרי הגוי אשריהוה אלהיו העם בחר לנחלה לו משמים הביט יהוה ראה אתכלבני האדם ממכוןשבתו השגיח אל כלישבי הארץ היצר יחד לבם המבין אלכלמעשיהם איןהמלך נושע ברבחיל גבור לאינצל ברבכח שקר הסוס לתשועה וברב חילו לא ימלט הנה עין יהוה אליראיו למיחלים לחסדו להציל ממות נפשם ולחיותם ברעב נפשנו חכתה ליהוה עזרנו ומגננו הוא כיבו ישמח לבנו כי בשם קדשו בטחנו יהיחסדך יהוה עלינו כאשר יחלנו לך פ", "34": "לדוד בשנותו אתטעמו לפני אבימלך ויגרשהו וילך אברכה אתיהוה בכלעת תמיד תהלתו בפי ביהוה תתהלל נפשי ישמעו ענוים וישמחו גדלו ליהוה אתי ונרוממה שמו יחדו דרשתי אתיהוה וענני ומכלמגורותי הצילני הביטו אליו ונהרו ופניהם אליחפרו זה עני קרא ויהוה שמע ומכלצרותיו הושיעו חנה מלאךיהוה סביב ליראיו ויחלצם טעמו וראו כיטוב יהוה אשרי הגבר יחסהבו יראו אתיהוה קדשיו כיאין מחסור ליראיו כפירים רשו ורעבו ודרשי יהוה לאיחסרו כלטוב לכובנים שמעולי יראת יהוה אלמדכם מיהאיש החפץ חיים אהב ימים לראות טוב נצר לשונך מרע ושפתיך מדבר מרמה סור מרע ועשהטוב בקש שלום ורדפהו עיני יהוה אלצדיקים ואזניו אלשועתם פני יהוה בעשי רע להכרית מארץ זכרם צעקו ויהוה שמע ומכלצרותם הצילם קרוב יהוה לנשברילב ואתדכאירוח יושיע רבות רעות צדיק ומכלם יצילנו יהוה שמר כלעצמותיו אחת מהנה לא נשברה תמותת רשע רעה ושנאי צדיק יאשמו פדה יהוה נפש עבדיו ולא יאשמו כלהחסים בו פ", "35": "לדוד ריבה יהוה אתיריבי לחם אתלחמי החזק מגן וצנה וקומה בעזרתי והרק חנית וסגר לקראת רדפי אמר לנפשי ישעתך אני יבשו ויכלמו מבקשי נפשי יסגו אחור ויחפרו חשבי רעתי יהיו כמץ לפנירוח ומלאך יהוה דוחה יהידרכם חשך וחלקלקת ומלאך יהוה רדפם כיחנם טמנולי שחת רשתם חנם חפרו לנפשי תבואהו שואה לאידע ורשתו אשרטמן תלכדו בשואה יפלבה ונפשי תגיל ביהוה תשיש בישועתו כל עצמותי תאמרנה יהוה מי כמוך מציל עני מחזק ממנו ועני ואביון מגזלו יקומון עדי חמס אשר לאידעתי ישאלוני ישלמוני רעה תחת טובה שכול לנפשי ואני בחלותם לבושי שק עניתי בצום נפשי ותפלתי עלחיקי תשוב כרעכאח לי התהלכתי כאבלאם קדר שחותי ובצלעי שמחו ונאספו נאספו עלי נכים ולא ידעתי קרעו ולאדמו בחנפי לעגי מעוג חרק עלי שנימו אדני כמה תראה השיבה נפשי משאיהם מכפירים יחידתי אודך בקהל רב בעם עצום אהללך אלישמחולי איבי שקר שנאי חנם יקרצועין כי לא שלום ידברו ועל רגעיארץ דברי מרמות יחשבון וירחיבו עלי פיהם אמרו האח האח ראתה עיננו ראיתה יהוה אלתחרש אדני אלתרחק ממני העירה והקיצה למשפטי אלהי ואדני לריבי שפטני כצדקך יהוה אלהי ואלישמחולי אליאמרו בלבם האח נפשנו אליאמרו בלענוהו יבשו ויחפרו יחדו שמחי רעתי ילבשובשת וכלמה המגדילים עלי ירנו וישמחו חפצי צדקי ויאמרו תמיד יגדל יהוה החפץ שלום עבדו ולשוני תהגה צדקך כלהיום תהלתך פ", "36": "למנצח לעבדיהוה לדוד נאםפשע לרשע בקרב לבי איןפחד אלהים לנגד עיניו כיהחליק אליו בעיניו למצא עונו לשנא דבריפיו און ומרמה חדל להשכיל להיטיב און יחשב עלמשכבו יתיצב עלדרך לאטוב רע לא ימאס יהוה בהשמים חסדך אמונתך עדשחקים צדקתך כהרריאל משפטיך תהום רבה אדם ובהמה תושיע יהוה מהיקר חסדך אלהים ובני אדם בצל כנפיך יחסיון ירוין מדשן ביתך ונחל עדניך תשקם כיעמך מקור חיים באורך נראהאור משך חסדך לידעיך וצדקתך לישרילב אלתבואני רגל גאוה וידרשעים אלתנדני שם נפלו פעלי און דחו ולאיכלו קום פ", "37": "לדוד אלתתחר במרעים אלתקנא בעשי עולה כי כחציר מהרה ימלו וכירק דשא יבולון בטח ביהוה ועשהטוב שכןארץ ורעה אמונה והתענג עליהוה ויתןלך משאלת לבך גול עליהוה דרכך ובטח עליו והוא יעשה והוציא כאור צדקך ומשפטך כצהרים דום ליהוה והתחולל לו אלתתחר במצליח דרכו באיש עשה מזמות הרף מאף ועזב חמה אלתתחר אךלהרע כימרעים יכרתון וקוי יהוה המה יירשוארץ ועוד מעט ואין רשע והתבוננת עלמקומו ואיננו וענוים יירשוארץ והתענגו עלרב שלום זמם רשע לצדיק וחרק עליו שניו אדני ישחקלו כיראה כייבא יומו חרב פתחו רשעים ודרכו קשתם להפיל עני ואביון לטבוח ישרידרך חרבם תבוא בלבם וקשתותם תשברנה טובמעט לצדיק מהמון רשעים רבים כי זרועות רשעים תשברנה וסומך צדיקים יהוה יודע יהוה ימי תמימם ונחלתם לעולם תהיה לאיבשו בעת רעה ובימי רעבון ישבעו כי רשעים יאבדו ואיבי יהוה כיקר כרים כלו בעשן כלו לוה רשע ולא ישלם וצדיק חונן ונותן כי מברכיו יירשו ארץ ומקלליו יכרתו מיהוה מצעדיגבר כוננו ודרכו יחפץ כייפל לאיוטל כייהוה סומך ידו נער הייתי גםזקנתי ולאראיתי צדיק נעזב וזרעו מבקשלחם כלהיום חונן ומלוה וזרעו לברכה סור מרע ועשהטוב ושכן לעולם כי יהוה אהב משפט ולאיעזב אתחסידיו לעולם נשמרו וזרע רשעים נכרת צדיקים יירשוארץ וישכנו לעד עליה פיצדיק יהגה חכמה ולשונו תדבר משפט תורת אלהיו בלבו לא תמעד אשריו צופה רשע לצדיק ומבקש להמיתו יהוה לאיעזבנו בידו ולא ירשיענו בהשפטו קוה אליהוה ושמר דרכו וירוממך לרשת ארץ בהכרת רשעים תראה ראיתי רשע עריץ ומתערה כאזרח רענן ויעבר והנה איננו ואבקשהו ולא נמצא שמרתם וראה ישר כיאחרית לאיש שלום ופשעים נשמדו יחדו אחרית רשעים נכרתה ותשועת צדיקים מיהוה מעוזם בעת צרה ויעזרם יהוה ויפלטם יפלטם מרשעים ויושיעם כיחסו בו פ", "38": "מזמור לדוד להזכיר יהוה אלבקצפך תוכיחני ובחמתך תיסרני כיחציך נחתו בי ותנחת עלי ידך איןמתם בבשרי מפני זעמך איןשלום בעצמי מפני חטאתי כי עונתי עברו ראשי כמשא כבד יכבדו ממני הבאישו נמקו חבורתי מפני אולתי נעויתי שחתי עדמאד כלהיום קדר הלכתי כיכסלי מלאו נקלה ואין מתם בבשרי נפוגותי ונדכיתי עדמאד שאגתי מנהמת לבי אדני נגדך כלתאותי ואנחתי ממך לאנסתרה לבי סחרחר עזבני כחי ואורעיני גםהם אין אתי אהבי ורעי מנגד נגעי יעמדו וקרובי מרחק עמדו וינקשו מבקשי נפשי ודרשי רעתי דברו הוות ומרמות כלהיום יהגו ואני כחרש לא אשמע וכאלם לא יפתחפיו ואהי כאיש אשר לאשמע ואין בפיו תוכחות כילך יהוה הוחלתי אתה תענה אדני אלהי כיאמרתי פןישמחולי במוט רגלי עלי הגדילו כיאני לצלע נכון ומכאובי נגדי תמיד כיעוני אגיד אדאג מחטאתי ואיבי חיים עצמו ורבו שנאי שקר ומשלמי רעה תחת טובה ישטנוני תחת רדופי רדפי טוב אלתעזבני יהוה אלהי אלתרחק ממני חושה לעזרתי אדני תשועתי פ", "39": "למנצח לידיתון לידותון מזמור לדוד אמרתי אשמרה דרכי מחטוא בלשוני אשמרה לפי מחסום בעד רשע לנגדי נאלמתי דומיה החשיתי מטוב וכאבי נעכר חםלבי בקרבי בהגיגי תבעראש דברתי בלשוני הודיעני יהוה קצי ומדת ימי מההיא אדעה מהחדל אני הנה טפחות נתתה ימי וחלדי כאין נגדך אך כלהבל כלאדם נצב סלה אךבצלם יתהלךאיש אךהבל יהמיון יצבר ולאידע מיאספם ועתה מהקויתי אדני תוחלתי לך היא מכלפשעי הצילני חרפת נבל אלתשימני נאלמתי לא אפתחפי כי אתה עשית הסר מעלי נגעך מתגרת ידך אני כליתי בתוכחות עלעון יסרת איש ותמס כעש חמודו אך הבל כלאדם סלה שמעה תפלתי יהוה ושועתי האזינה אלדמעתי אלתחרש כי גר אנכי עמך תושב ככלאבותי השע ממני ואבליגה בטרם אלך ואינני פ", "40": "למנצח לדוד מזמור קוה קויתי יהוה ויט אלי וישמע שועתי ויעלני מבור שאון מטיט היון ויקם עלסלע רגלי כונן אשרי ויתן בפי שיר חדש תהלה לאלהינו יראו רבים וייראו ויבטחו ביהוה אשרי הגבר אשרשם יהוה מבטחו ולאפנה אלרהבים ושטי כזב רבות עשית אתה יהוה אלהי נפלאתיך ומחשבתיך אלינו אין ערך אליך אגידה ואדברה עצמו מספר זבח ומנחה לאחפצת אזנים כרית לי עולה וחטאה לא שאלת אז אמרתי הנהבאתי במגלתספר כתוב עלי לעשותרצונך אלהי חפצתי ותורתך בתוך מעי בשרתי צדק בקהל רב הנה שפתי לא אכלא יהוה אתה ידעת צדקתך לאכסיתי בתוך לבי אמונתך ותשועתך אמרתי לאכחדתי חסדך ואמתך לקהל רב אתה יהוה לאתכלא רחמיך ממני חסדך ואמתך תמיד יצרוני כי אפפועלי רעות עדאין מספר השיגוני עונתי ולאיכלתי לראות עצמו משערות ראשי ולבי עזבני רצה יהוה להצילני יהוה לעזרתי חושה יבשו ויחפרו יחד מבקשי נפשי לספותה יסגו אחור ויכלמו חפצי רעתי ישמו עלעקב בשתם האמרים לי האח האח ישישו וישמחו בך כלמבקשיך יאמרו תמיד יגדל יהוה אהבי תשועתך ואני עני ואביון אדני יחשב לי עזרתי ומפלטי אתה אלהי אלתאחר פ", "41": "למנצח מזמור לדוד אשרי משכיל אלדל ביום רעה ימלטהו יהוה יהוה ישמרהו ויחיהו יאשר ואשר בארץ ואלתתנהו בנפש איביו יהוה יסעדנו עלערש דוי כלמשכבו הפכת בחליו אניאמרתי יהוה חנני רפאה נפשי כיחטאתי לך אויבי יאמרו רע לי מתי ימות ואבד שמו ואםבא לראות שוא ידבר לבו יקבץאון לו יצא לחוץ ידבר יחד עלי יתלחשו כלשנאי עלי יחשבו רעה לי דברבליעל יצוק בו ואשר שכב לאיוסיף לקום גםאיש שלומי אשרבטחתי בו אוכל לחמי הגדיל עלי עקב ואתה יהוה חנני והקימני ואשלמה להם בזאת ידעתי כיחפצת בי כי לאיריע איבי עלי ואני בתמי תמכת בי ותציבני לפניך לעולם ברוך יהוה אלהי ישראל מהעולם ועד העולם אמן ואמן", "42": "למנצח משכיל לבניקרח כאיל תערג עלאפיקימים כן נפשי תערג אליך אלהים צמאה נפשי לאלהים לאל חי מתי אבוא ואראה פני אלהים היתהלי דמעתי לחם יומם ולילה באמר אלי כלהיום איה אלהיך אלה אזכרה ואשפכה עלי נפשי כי אעבר בסך אדדם עדבית אלהים בקולרנה ותודה המון חוגג מהתשתוחחי נפשי ותהמי עלי הוחלי לאלהים כיעוד אודנו ישועות פניו אלהי עלי נפשי תשתוחח עלכן אזכרך מארץ ירדן וחרמונים מהר מצער תהוםאלתהום קורא לקול צנוריך כלמשבריך וגליך עלי עברו יומם יצוה יהוה חסדו ובלילה שירה עמי תפלה לאל חיי אומרה לאל סלעי למה שכחתני למהקדר אלך בלחץ אויב ברצח בעצמותי חרפוני צוררי באמרם אלי כלהיום איה אלהיך מהתשתוחחי נפשי ומהתהמי עלי הוחילי לאלהים כיעוד אודנו ישועת פני ואלהי פ", "43": "שפטני אלהים וריבה ריבי מגוי לאחסיד מאיש מרמה ועולה תפלטני כיאתה אלהי מעוזי למה זנחתני למהקדר אתהלך בלחץ אויב שלחאורך ואמתך המה ינחוני יביאוני אלהרקדשך ואלמשכנותיך ואבואה אלמזבח אלהים אלאל שמחת גילי ואודך בכנור אלהים אלהי מהתשתוחחי נפשי ומהתהמי עלי הוחילי לאלהים כיעוד אודנו ישועת פני ואלהי פ", "44": "למנצח לבניקרח משכיל אלהים באזנינו שמענו אבותינו ספרולנו פעל פעלת בימיהם בימי קדם אתה ידך גוים הורשת ותטעם תרע לאמים ותשלחם כי לא בחרבם ירשו ארץ וזרועם לאהושיעה למו כיימינך וזרועך ואור פניך כי רציתם אתההוא מלכי אלהים צוה ישועות יעקב בך צרינו ננגח בשמך נבוס קמינו כי לא בקשתי אבטח וחרבי לא תושיעני כי הושעתנו מצרינו ומשנאינו הבישות באלהים הללנו כלהיום ושמך לעולם נודה סלה אףזנחת ותכלימנו ולאתצא בצבאותינו תשיבנו אחור מניצר ומשנאינו שסו למו תתננו כצאן מאכל ובגוים זריתנו תמכרעמך בלאהון ולארבית במחיריהם תשימנו חרפה לשכנינו לעג וקלס לסביבותינו תשימנו משל בגוים מנודראש בלאמים כלהיום כלמתי נגדי ובשת פני כסתני מקול מחרף ומגדף מפני אויב ומתנקם כלזאת באתנו ולא שכחנוך ולאשקרנו בבריתך לאנסוג אחור לבנו ותט אשרינו מני ארחך כי דכיתנו במקום תנים ותכס עלינו בצלמות אםשכחנו שם אלהינו ונפרש כפינו לאל זר הלא אלהים יחקרזאת כיהוא ידע תעלמות לב כיעליך הרגנו כלהיום נחשבנו כצאן טבחה עורה למה תישן אדני הקיצה אלתזנח לנצח למהפניך תסתיר תשכח ענינו ולחצנו כי שחה לעפר נפשנו דבקה לארץ בטננו קומה עזרתה לנו ופדנו למען חסדך פ", "45": "למנצח עלששנים לבניקרח משכיל שיר ידידת רחש לבי דבר טוב אמר אני מעשי למלך לשוני עט סופר מהיר יפיפית מבני אדם הוצק חן בשפתותיך עלכן ברכך אלהים לעולם חגורחרבך עלירך גבור הודך והדרך והדרך צלח רכב עלדבראמת וענוהצדק ותורך נוראות ימינך חציך שנונים עמים תחתיך יפלו בלב אויבי המלך כסאך אלהים עולם ועד שבט מישר שבט מלכותך אהבת צדק ותשנא רשע עלכן משחך אלהים אלהיך שמן ששון מחברך מרואהלות קציעות כלבגדתיך מןהיכלי שן מני שמחוך בנות מלכים ביקרותיך נצבה שגל לימינך בכתם אופיר שמעיבת וראי והטי אזנך ושכחי עמך ובית אביך ויתאו המלך יפיך כיהוא אדניך והשתחוילו ובתצר במנחה פניך יחלו עשירי עם כלכבודה בתמלך פנימה ממשבצות זהב לבושה לרקמות תובל למלך בתולות אחריה רעותיה מובאות לך תובלנה בשמחת וגיל תבאינה בהיכל מלך תחת אבתיך יהיו בניך תשיתמו לשרים בכלהארץ אזכירה שמך בכלדר ודר עלכן עמים יהודוך לעלם ועד פ", "46": "למנצח לבניקרח עלעלמות שיר אלהים לנו מחסה ועז עזרה בצרות נמצא מאד עלכן לאנירא בהמיר ארץ ובמוט הרים בלב ימים יהמו יחמרו מימיו ירעשו הרים בגאותו סלה נהר פלגיו ישמחו עיראלהים קדש משכני עליון אלהים בקרבה בלתמוט יעזרה אלהים לפנות בקר המו גוים מטו ממלכות נתן בקולו תמוג ארץ יהוה צבאות עמנו משגבלנו אלהי יעקב סלה לכוחזו מפעלות יהוה אשרשם שמות בארץ משבית מלחמות עדקצה הארץ קשת ישבר וקצץ חנית עגלות ישרף באש הרפו ודעו כיאנכי אלהים ארום בגוים ארום בארץ יהוה צבאות עמנו משגבלנו אלהי יעקב סלה פ", "47": "למנצח לבניקרח מזמור כלהעמים תקעוכף הריעו לאלהים בקול רנה כייהוה עליון נורא מלך גדול עלכלהארץ ידבר עמים תחתינו ולאמים תחת רגלינו יבחרלנו אתנחלתנו את גאון יעקב אשראהב סלה עלה אלהים בתרועה יהוה בקול שופר זמרו אלהים זמרו זמרו למלכנו זמרו כי מלך כלהארץ אלהים זמרו משכיל מלך אלהים עלגוים אלהים ישב עלכסא קדשו נדיבי עמים נאספו עם אלהי אברהם כי לאלהים מגניארץ מאד נעלה פ", "48": "שיר מזמור לבניקרח גדול יהוה ומהלל מאד בעיר אלהינו הרקדשו יפה נוף משוש כלהארץ הרציון ירכתי צפון קרית מלך רב אלהים בארמנותיה נודע למשגב כיהנה המלכים נועדו עברו יחדו המה ראו כן תמהו נבהלו נחפזו רעדה אחזתם שם חיל כיולדה ברוח קדים תשבר אניות תרשיש כאשר שמענו כן ראינו בעיריהוה צבאות בעיר אלהינו אלהים יכוננה עדעולם סלה דמינו אלהים חסדך בקרב היכלך כשמך אלהים כן תהלתך עלקצויארץ צדק מלאה ימינך ישמח הרציון תגלנה בנות יהודה למען משפטיך סבו ציון והקיפוה ספרו מגדליה שיתו לבכם לחילה פסגו ארמנותיה למען תספרו לדור אחרון כי זה אלהים אלהינו עולם ועד הוא ינהגנו עלמות פ", "49": "למנצח לבניקרח מזמור שמעוזאת כלהעמים האזינו כלישבי חלד גםבני אדם גםבניאיש יחד עשיר ואביון פי ידבר חכמות והגות לבי תבונות אטה למשל אזני אפתח בכנור חידתי למה אירא בימי רע עון עקבי יסובני הבטחים עלחילם וברב עשרם יתהללו אח לאפדה יפדה איש לאיתן לאלהים כפרו ויקר פדיון נפשם וחדל לעולם ויחיעוד לנצח לא יראה השחת כי יראה חכמים ימותו יחד כסיל ובער יאבדו ועזבו לאחרים חילם קרבם בתימו לעולם משכנתם לדור ודר קראו בשמותם עלי אדמות ואדם ביקר בלילין נמשל כבהמות נדמו זה דרכם כסל למו ואחריהם בפיהם ירצו סלה כצאן לשאול שתו מות ירעם וירדו בם ישרים לבקר וצירם וצורם לבלות שאול מזבל לו אךאלהים יפדה נפשי מידשאול כי יקחני סלה אלתירא כייעשר איש כיירבה כבוד ביתו כי לא במותו יקח הכל לאירד אחריו כבודו כינפשו בחייו יברך ויודך כיתיטיב לך תבוא עדדור אבותיו עדנצח לא יראואור אדם ביקר ולא יבין נמשל כבהמות נדמו פ", "50": "מזמור לאסף אל אלהים יהוה דבר ויקראארץ ממזרחשמש עדמבאו מציון מכלליפי אלהים הופיע יבא אלהינו ואליחרש אשלפניו תאכל וסביביו נשערה מאד יקרא אלהשמים מעל ואלהארץ לדין עמו אספולי חסידי כרתי בריתי עליזבח ויגידו שמים צדקו כיאלהים שפט הוא סלה שמעה עמי ואדברה ישראל ואעידה בך אלהים אלהיך אנכי לא עלזבחיך אוכיחך ועולתיך לנגדי תמיד לאאקח מביתך פר ממכלאתיך עתודים כילי כלחיתויער בהמות בהרריאלף ידעתי כלעוף הרים וזיז שדי עמדי אםארעב לאאמר לך כילי תבל ומלאה האוכל בשר אבירים ודם עתודים אשתה זבח לאלהים תודה ושלם לעליון נדריך וקראני ביום צרה אחלצך ותכבדני ולרשע אמר אלהים מהלך לספר חקי ותשא בריתי עליפיך ואתה שנאת מוסר ותשלך דברי אחריך אםראית גנב ותרץ עמו ועם מנאפים חלקך פיך שלחת ברעה ולשונך תצמיד מרמה תשב באחיך תדבר בבןאמך תתןדפי אלה עשית והחרשתי דמית היותאהיה כמוך אוכיחך ואערכה לעיניך בינונא זאת שכחי אלוה פןאטרף ואין מציל זבח תודה יכבדנני ושם דרך אראנו בישע אלהים פ", "51": "למנצח מזמור לדוד בבואאליו נתן הנביא כאשרבא אלבתשבע חנני אלהים כחסדך כרב רחמיך מחה פשעי הרבה הרב כבסני מעוני ומחטאתי טהרני כיפשעי אני אדע וחטאתי נגדי תמיד לך לבדך חטאתי והרע בעיניך עשיתי למען תצדק בדברך תזכה בשפטך הןבעוון חוללתי ובחטא יחמתני אמי הןאמת חפצת בטחות ובסתם חכמה תודיעני תחטאני באזוב ואטהר תכבסני ומשלג אלבין תשמיעני ששון ושמחה תגלנה עצמות דכית הסתר פניך מחטאי וכלעונתי מחה לב טהור בראלי אלהים ורוח נכון חדש בקרבי אלתשליכני מלפניך ורוח קדשך אלתקח ממני השיבה לי ששון ישעך ורוח נדיבה תסמכני אלמדה פשעים דרכיך וחטאים אליך ישובו הצילני מדמים אלהים אלהי תשועתי תרנן לשוני צדקתך אדני שפתי תפתח ופי יגיד תהלתך כי לאתחפץ זבח ואתנה עולה לא תרצה זבחי אלהים רוח נשברה לבנשבר ונדכה אלהים לא תבזה היטיבה ברצונך אתציון תבנה חומות ירושל ם אז תחפץ זבחיצדק עולה וכליל אז יעלו עלמזבחך פרים פ", "52": "למנצח משכיל לדוד בבוא דואג האדמי ויגד לשאול ויאמר לו בא דוד אלבית אחימלך מהתתהלל ברעה הגבור חסד אל כלהיום הוות תחשב לשונך כתער מלטש עשה רמיה אהבת רע מטוב שקר מדבר צדק סלה אהבת כלדבריבלע לשון מרמה גםאל יתצך לנצח יחתך ויסחך מאהל ושרשך מארץ חיים סלה ויראו צדיקים וייראו ועליו ישחקו הנה הגבר לא ישים אלהים מעוזו ויבטח ברב עשרו יעז בהותו ואני כזית רענן בבית אלהים בטחתי בחסדאלהים עולם ועד אודך לעולם כי עשית ואקוה שמך כיטוב נגד חסידיך פ", "53": "למנצח עלמחלת משכיל לדוד אמר נבל בלבו אין אלהים השחיתו והתעיבו עול אין עשהטוב אלהים משמים השקיף עלבניאדם לראות היש משכיל דרש אתאלהים כלו סג יחדו נאלחו אין עשהטוב אין גםאחד הלא ידעו פעלי און אכלי עמי אכלו לחם אלהים לא קראו שם פחדו פחד לאהיה פחד כיאלהים פזר עצמות חנך הבשתה כיאלהים מאסם מי יתן מציון ישעות ישראל בשוב אלהים שבות עמו יגל יעקב ישמח ישראל פ", "54": "למנצח בנגינת משכיל לדוד בבא הזיפים ויאמרו לשאול הלא דוד מסתתר עמנו אלהים בשמך הושיעני ובגבורתך תדינני אלהים שמע תפלתי האזינה לאמריפי כי זרים קמו עלי ועריצים בקשו נפשי לא שמו אלהים לנגדם סלה הנה אלהים עזר לי אדני בסמכי נפשי ישוב ישיב הרע לשררי באמתך הצמיתם בנדבה אזבחהלך אודה שמך יהוה כיטוב כי מכלצרה הצילני ובאיבי ראתה עיני פ", "55": "למנצח בנגינת משכיל לדוד האזינה אלהים תפלתי ואלתתעלם מתחנתי הקשיבה לי וענני אריד בשיחי ואהימה מקול אויב מפני עקת רשע כיימיטו עלי און ובאף ישטמוני לבי יחיל בקרבי ואימות מות נפלו עלי יראה ורעד יבא בי ותכסני פלצות ואמר מייתןלי אבר כיונה אעופה ואשכנה הנה ארחיק נדד אלין במדבר סלה אחישה מפלט לי מרוח סעה מסער בלע אדני פלג לשונם כיראיתי חמס וריב בעיר יומם ולילה יסובבה עלחומתיה ואון ועמל בקרבה הוות בקרבה ולאימיש מרחבה תך ומרמה כי לאאויב יחרפני ואשא לאמשנאי עלי הגדיל ואסתר ממנו ואתה אנוש כערכי אלופי ומידעי אשר יחדו נמתיק סוד בבית אלהים נהלך ברגש ישימות ישי מות עלימו ירדו שאול חיים כירעות במגורם בקרבם אני אלאלהים אקרא ויהוה יושיעני ערב ובקר וצהרים אשיחה ואהמה וישמע קולי פדה בשלום נפשי מקרבלי כיברבים היו עמדי ישמע אל ויענם וישב קדם סלה אשר אין חליפות למו ולא יראו אלהים שלח ידיו בשלמיו חלל בריתו חלקו מחמאת פיו וקרבלבו רכו דבריו משמן והמה פתחות השלך עליהוה יהבך והוא יכלכלך לאיתן לעולם מוט לצדיק ואתה אלהים תורדם לבאר שחת אנשי דמים ומרמה לאיחצו ימיהם ואני אבטחבך פ", "56": "למנצח עליונת אלם רחקים לדוד מכתם באחז אותו פלשתים בגת חנני אלהים כישאפני אנוש כלהיום לחם ילחצני שאפו שוררי כלהיום כירבים לחמים לי מרום יום אירא אני אליך אבטח באלהים אהלל דברו באלהים בטחתי לא אירא מהיעשה בשר לי כלהיום דברי יעצבו עלי כלמחשבתם לרע יגורו יצפינו יצפונו המה עקבי ישמרו כאשר קוו נפשי עלאון פלטלמו באף עמים הורד אלהים נדי ספרתה אתה שימה דמעתי בנאדך הלא בספרתך אז ישובו אויבי אחור ביום אקרא זהידעתי כיאלהים לי באלהים אהלל דבר ביהוה אהלל דבר באלהים בטחתי לא אירא מהיעשה אדם לי עלי אלהים נדריך אשלם תודת לך כי הצלת נפשי ממות הלא רגלי מדחי להתהלך לפני אלהים באור החיים פ", "57": "למנצח אלתשחת לדוד מכתם בברחו מפנישאול במערה חנני אלהים חנני כי בך חסיה נפשי ובצלכנפיך אחסה עד יעבר הוות אקרא לאלהים עליון לאל גמר עלי ישלח משמים ויושיעני חרף שאפי סלה ישלח אלהים חסדו ואמתו נפשי בתוך לבאם אשכבה להטים בניאדם שניהם חנית וחצים ולשונם חרב חדה רומה עלהשמים אלהים על כלהארץ כבודך רשת הכינו לפעמי כפף נפשי כרו לפני שיחה נפלו בתוכה סלה נכון לבי אלהים נכון לבי אשירה ואזמרה עורה כבודי עורה הנבל וכנור אעירה שחר אודך בעמים אדני אזמרך בלאמים כיגדל עדשמים חסדך ועדשחקים אמתך רומה עלשמים אלהים על כלהארץ כבודך פ", "58": "למנצח אלתשחת לדוד מכתם האמנם אלם צדק תדברון מישרים תשפטו בני אדם אףבלב עולת תפעלון בארץ חמס ידיכם תפלסון זרו רשעים מרחם תעו מבטן דברי כזב חמתלמו כדמות חמתנחש כמופתן חרש יאטם אזנו אשר לאישמע לקול מלחשים חובר חברים מחכם אלהים הרסשנימו בפימו מלתעות כפירים נתץ יהוה ימאסו כמומים יתהלכולמו ידרך חצו כמו יתמללו כמו שבלול תמס יהלך נפל אשת בלחזו שמש בטרם יבינו סירתכם אטד כמוחי כמוחרון ישערנו ישמח צדיק כיחזה נקם פעמיו ירחץ בדם הרשע ויאמר אדם אךפרי לצדיק אך ישאלהים שפטים בארץ פ", "59": "למנצח אלתשחת לדוד מכתם בשלח שאול וישמרו אתהבית להמיתו הצילני מאיבי אלהי ממתקוממי תשגבני הצילני מפעלי און ומאנשי דמים הושיעני כי הנה ארבו לנפשי יגורו עלי עזים לאפשעי ולאחטאתי יהוה בליעון ירצון ויכוננו עורה לקראתי וראה ואתה יהוהאלהים צבאות אלהי ישראל הקיצה לפקד כלהגוים אלתחן כלבגדי און סלה ישובו לערב יהמו ככלב ויסובבו עיר הנה יביעון בפיהם חרבות בשפתותיהם כימי שמע ואתה יהוה תשחקלמו תלעג לכלגוים עזו אליך אשמרה כיאלהים משגבי אלהי חסדו חסדי יקדמני אלהים יראני בשררי אלתהרגם פןישכחו עמי הניעמו בחילך והורידמו מגננו אדני חטאתפימו דברשפתימו וילכדו בגאונם ומאלה ומכחש יספרו כלה בחמה כלה ואינמו וידעו כיאלהים משל ביעקב לאפסי הארץ סלה וישבו לערב יהמו ככלב ויסובבו עיר המה ינועון יניעון לאכל אםלא ישבעו וילינו ואני אשיר עזך וארנן לבקר חסדך כיהיית משגב לי ומנוס ביום צרלי עזי אליך אזמרה כיאלהים משגבי אלהי חסדי פ", "60": "למנצח עלשושן עדות מכתם לדוד ללמד בהצותו את ארם נהרים ואתארם צובה וישב יואב ויך אתאדום בגיאמלח שנים עשר אלף אלהים זנחתנו פרצתנו אנפת תשובב לנו הרעשתה ארץ פצמתה רפה שבריה כימטה הראית עמך קשה השקיתנו יין תרעלה נתתה ליראיך נס להתנוסס מפני קשט סלה למען יחלצון ידידיך הושיעה ימינך ועננו וענני אלהים דבר בקדשו אעלזה אחלקה שכם ועמק סכות אמדד לי גלעד ולי מנשה ואפרים מעוז ראשי יהודה מחקקי מואב סיר רחצי עלאדום אשליך נעלי עלי פלשת התרועעי מי יבלני עיר מצור מי נחני עדאדום הלאאתה אלהים זנחתנו ולאתצא אלהים בצבאותינו הבהלנו עזרת מצר ושוא תשועת אדם באלהים נעשהחיל והוא יבוס צרינו פ", "61": "למנצח עלנגינת לדוד שמעה אלהים רנתי הקשיבה תפלתי מקצה הארץ אליך אקרא בעטף לבי בצורירום ממני תנחני כיהיית מחסה לי מגדלעז מפני אויב אגורה באהלך עולמים אחסה בסתר כנפיך סלה כיאתה אלהים שמעת לנדרי נתת ירשת יראי שמך ימים עלימימלך תוסיף שנותיו כמודר ודר ישב עולם לפני אלהים חסד ואמת מן ינצרהו כן אזמרה שמך לעד לשלמי נדרי יום יום פ", "62": "למנצח עלידותון מזמור לדוד אך אלאלהים דומיה נפשי ממנו ישועתי אךהוא צורי וישועתי משגבי לאאמוט רבה עדאנה תהותתו עלאיש תרצחו כלכם כקיר נטוי גדר הדחויה אך משאתו יעצו להדיח ירצו כזב בפיו יברכו ובקרבם יקללוסלה אך לאלהים דומי נפשי כיממנו תקותי אךהוא צורי וישועתי משגבי לא אמוט עלאלהים ישעי וכבודי צורעזי מחסי באלהים בטחו בו בכלעת עם שפכולפניו לבבכם אלהים מחסהלנו סלה אך הבל בניאדם כזב בני איש במאזנים לעלות המה מהבל יחד אלתבטחו בעשק ובגזל אלתהבלו חיל כיינוב אלתשיתו לב אחת דבר אלהים שתיםזו שמעתי כי עז לאלהים ולךאדני חסד כיאתה תשלם לאיש כמעשהו פ", "63": "מזמור לדוד בהיותו במדבר יהודה אלהים אלי אתה אשחרך צמאה לך נפשי כמה לך בשרי בארץציה ועיף בלימים כן בקדש חזיתך לראות עזך וכבודך כיטוב חסדך מחיים שפתי ישבחונך כן אברכך בחיי בשמך אשא כפי כמו חלב ודשן תשבע נפשי ושפתי רננות יהללפי אםזכרתיך עליצועי באשמרות אהגהבך כיהיית עזרתה לי ובצל כנפיך ארנן דבקה נפשי אחריך בי תמכה ימינך והמה לשואה יבקשו נפשי יבאו בתחתיות הארץ יגירהו עלידיחרב מנת שעלים יהיו והמלך ישמח באלהים יתהלל כלהנשבע בו כי יסכר פי דוברישקר פ", "64": "למנצח מזמור לדוד שמעאלהים קולי בשיחי מפחד אויב תצר חיי תסתירני מסוד מרעים מרגשת פעלי און אשר שננו כחרב לשונם דרכו חצם דבר מר לירת במסתרים תם פתאם ירהו ולא ייראו יחזקולמו דבר רע יספרו לטמון מוקשים אמרו מי יראהלמו יחפשו עולת תמנו חפש מחפש וקרב איש ולב עמק וירם אלהים חץ פתאום היו מכותם ויכשילוהו עלימו לשונם יתנדדו כלראה בם וייראו כלאדם ויגידו פעל אלהים ומעשהו השכילו ישמח צדיק ביהוה וחסה בו ויתהללו כלישרילב פ", "65": "למנצח מזמור לדוד שיר לך דמיה תהלה אלהים בציון ולך ישלםנדר שמע תפלה עדיך כלבשר יבאו דברי עונת גברו מני פשעינו אתה תכפרם אשרי תבחר ותקרב ישכן חצריך נשבעה בטוב ביתך קדש היכלך נוראות בצדק תעננו אלהי ישענו מבטח כלקצויארץ וים רחקים מכין הרים בכחו נאזר בגבורה משביח שאון ימים שאון גליהם והמון לאמים וייראו ישבי קצות מאותתיך מוצאי בקר וערב תרנין פקדת הארץ ותשקקה רבת תעשרנה פלג אלהים מלא מים תכין דגנם כיכן תכינה תלמיה רוה נחת גדודה ברביבים תמגגנה צמחה תברך עטרת שנת טובתך ומעגליך ירעפון דשן ירעפו נאות מדבר וגיל גבעות תחגרנה לבשו כרים הצאן ועמקים יעטפובר יתרועעו אףישירו פ", "66": "למנצח שיר מזמור הריעו לאלהים כלהארץ זמרו כבודשמו שימו כבוד תהלתו אמרו לאלהים מהנורא מעשיך ברב עזך יכחשו לך איביך כלהארץ ישתחוו לך ויזמרולך יזמרו שמך סלה לכו וראו מפעלות אלהים נורא עלילה עלבני אדם הפך ים ליבשה בנהר יעברו ברגל שם נשמחהבו משל בגבורתו עולם עיניו בגוים תצפינה הסוררים אל ירומו ירימו למו סלה ברכו עמים אלהינו והשמיעו קול תהלתו השם נפשנו בחיים ולאנתן למוט רגלנו כיבחנתנו אלהים צרפתנו כצרףכסף הבאתנו במצודה שמת מועקה במתנינו הרכבת אנוש לראשנו באנובאש ובמים ותוציאנו לרויה אבוא ביתך בעולות אשלם לך נדרי אשרפצו שפתי ודברפי בצרלי עלות מיחים אעלהלך עםקטרת אילים אעשה בקר עםעתודים סלה לכושמעו ואספרה כליראי אלהים אשר עשה לנפשי אליו פיקראתי ורומם תחת לשוני און אםראיתי בלבי לא ישמע אדני אכן שמע אלהים הקשיב בקול תפלתי ברוך אלהים אשר לאהסיר תפלתי וחסדו מאתי פ", "67": "למנצח בנגינת מזמור שיר אלהים יחננו ויברכנו יאר פניו אתנו סלה לדעת בארץ דרכך בכלגוים ישועתך יודוך עמים אלהים יודוך עמים כלם ישמחו וירננו לאמים כיתשפט עמים מישר ולאמים בארץ תנחם סלה יודוך עמים אלהים יודוך עמים כלם ארץ נתנה יבולה יברכנו אלהים אלהינו יברכנו אלהים וייראו אותו כלאפסיארץ פ", "68": "למנצח לדוד מזמור שיר יקום אלהים יפוצו אויביו וינוסו משנאיו מפניו כהנדף עשן תנדף כהמס דונג מפניאש יאבדו רשעים מפני אלהים וצדיקים ישמחו יעלצו לפני אלהים וישישו בשמחה שירו לאלהים זמרו שמו סלו לרכב בערבות ביה שמו ועלזו לפניו אבי יתומים ודין אלמנות אלהים במעון קדשו אלהים מושיב יחידים ביתה מוציא אסירים בכושרות אך סוררים שכנו צחיחה אלהים בצאתך לפני עמך בצעדך בישימון סלה ארץ רעשה אףשמים נטפו מפני אלהים זה סיני מפני אלהים אלהי ישראל גשם נדבות תניף אלהים נחלתך ונלאה אתה כוננתה חיתך ישבובה תכין בטובתך לעני אלהים אדני יתןאמר המבשרות צבא רב מלכי צבאות ידדון ידדון ונותבית תחלק שלל אםתשכבון בין שפתים כנפי יונה נחפה בכסף ואברותיה בירקרק חרוץ בפרש שדי מלכים בה תשלג בצלמון הראלהים הרבשן הר גבננים הרבשן למה תרצדון הרים גבננים ההר חמד אלהים לשבתו אףיהוה ישכן לנצח רכב אלהים רבתים אלפי שנאן אדני בם סיני בקדש עלית למרום שבית שבי לקחת מתנות באדם ואף סוררים לשכן יה אלהים ברוך אדני יום יום יעמסלנו האל ישועתנו סלה האל לנו אל למושעות וליהוה אדני למות תצאות אךאלהים ימחץ ראש איביו קדקד שער מתהלך באשמיו אמר אדני מבשן אשיב אשיב ממצלות ים למען תמחץ רגלך בדם לשון כלביך מאיבים מנהו ראו הליכותיך אלהים הליכות אלי מלכי בקדש קדמו שרים אחר נגנים בתוך עלמות תופפות במקהלות ברכו אלהים אדני ממקור ישראל שם בנימן צעיר רדם שרי יהודה רגמתם שרי זבלון שרי נפתלי צוה אלהיך עזך עוזה אלהים זו פעלת לנו מהיכלך עלירושל ם לך יובילו מלכים שי גער חית קנה עדת אבירים בעגלי עמים מתרפס ברציכסף בזר עמים קרבות יחפצו יאתיו חשמנים מני מצרים כוש תריץ ידיו לאלהים ממלכות הארץ שירו לאלהים זמרו אדני סלה לרכב בשמי שמיקדם הן יתן בקולו קול עז תנו עז לאלהים עלישראל גאותו ועזו בשחקים נורא אלהים ממקדשיך אל ישראל הוא נתן עז ותעצמות לעם ברוך אלהים פ", "69": "למנצח עלשושנים לדוד הושיעני אלהים כי באו מים עדנפש טבעתי ביון מצולה ואין מעמד באתי במעמקימים ושבלת שטפתני יגעתי בקראי נחר גרוני כלו עיני מיחל לאלהי רבו משערות ראשי שנאי חנם עצמו מצמיתי איבי שקר אשר לאגזלתי אז אשיב אלהים אתה ידעת לאולתי ואשמותי ממך לאנכחדו אליבשו בי קויך אדני יהוה צבאות אליכלמו בי מבקשיך אלהי ישראל כיעליך נשאתי חרפה כסתה כלמה פני מוזר הייתי לאחי ונכרי לבני אמי כיקנאת ביתך אכלתני וחרפות חורפיך נפלו עלי ואבכה בצום נפשי ותהי לחרפות לי ואתנה לבושי שק ואהי להם למשל ישיחו בי ישבי שער ונגינות שותי שכר ואני תפלתילך יהוה עת רצון אלהים ברבחסדך ענני באמת ישעך הצילני מטיט ואלאטבעה אנצלה משנאי וממעמקי מים אלתשטפני שבלת מים ואלתבלעני מצולה ואלתאטרעלי באר פיה ענני יהוה כיטוב חסדך כרב רחמיך פנה אלי ואלתסתר פניך מעבדך כיצרלי מהר ענני קרבה אלנפשי גאלה למען איבי פדני אתה ידעת חרפתי ובשתי וכלמתי נגדך כלצוררי חרפה שברה לבי ואנושה ואקוה לנוד ואין ולמנחמים ולא מצאתי ויתנו בברותי ראש ולצמאי ישקוני חמץ יהישלחנם לפניהם לפח ולשלומים למוקש תחשכנה עיניהם מראות ומתניהם תמיד המעד שפךעליהם זעמך וחרון אפך ישיגם תהיטירתם נשמה באהליהם אליהי ישב כיאתה אשרהכית רדפו ואלמכאוב חלליך יספרו תנהעון עלעונם ואליבאו בצדקתך ימחו מספר חיים ועם צדיקים אליכתבו ואני עני וכואב ישועתך אלהים תשגבני אהללה שםאלהים בשיר ואגדלנו בתודה ותיטב ליהוה משור פר מקרן מפריס ראו ענוים ישמחו דרשי אלהים ויחי לבבכם כישמע אלאביונים יהוה ואתאסיריו לא בזה יהללוהו שמים וארץ ימים וכלרמש בם כי אלהים יושיע ציון ויבנה ערי יהודה וישבו שם וירשוה וזרע עבדיו ינחלוה ואהבי שמו ישכנובה פ", "70": "למנצח לדוד להזכיר אלהים להצילני יהוה לעזרתי חושה יבשו ויחפרו מבקשי נפשי יסגו אחור ויכלמו חפצי רעתי ישובו עלעקב בשתם האמרים האח האח ישישו וישמחו בך כלמבקשיך ויאמרו תמיד יגדל אלהים אהבי ישועתך ואני עני ואביון אלהים חושהלי עזרי ומפלטי אתה יהוה אלתאחר פ", "71": "בךיהוה חסיתי אלאבושה לעולם בצדקתך תצילני ותפלטני הטהאלי אזנך והושיעני היה לי לצור מעון לבוא תמיד צוית להושיעני כיסלעי ומצודתי אתה אלהי פלטני מיד רשע מכף מעול וחומץ כיאתה תקותי אדני יהוה מבטחי מנעורי עליך נסמכתי מבטן ממעי אמי אתה גוזי בך תהלתי תמיד כמופת הייתי לרבים ואתה מחסיעז ימלא פי תהלתך כלהיום תפארתך אלתשליכני לעת זקנה ככלות כחי אלתעזבני כיאמרו אויבי לי ושמרי נפשי נועצו יחדו לאמר אלהים עזבו רדפו ותפשוהו כיאין מציל אלהים אלתרחק ממני אלהי לעזרתי חישה חושה יבשו יכלו שטני נפשי יעטו חרפה וכלמה מבקשי רעתי ואני תמיד איחל והוספתי עלכלתהלתך פי יספר צדקתך כלהיום תשועתך כי לא ידעתי ספרות אבוא בגברות אדני יהוה אזכיר צדקתך לבדך אלהים למדתני מנעורי ועדהנה אגיד נפלאותיך וגם עדזקנה ושיבה אלהים אלתעזבני עדאגיד זרועך לדור לכליבוא גבורתך וצדקתך אלהים עדמרום אשרעשית גדלות אלהים מי כמוך אשר הראיתנו הראיתני צרות רבות ורעות תשוב תחינו תחיני ומתהמות הארץ תשוב תעלני תרב גדלתי ותסב תנחמני גםאני אודך בכלינבל אמתך אלהי אזמרה לך בכנור קדוש ישראל תרננה שפתי כי אזמרהלך ונפשי אשר פדית גםלשוני כלהיום תהגה צדקתך כיבשו כיחפרו מבקשי רעתי פ", "72": "לשלמה אלהים משפטיך למלך תן וצדקתך לבןמלך ידין עמך בצדק וענייך במשפט ישאו הרים שלום לעם וגבעות בצדקה ישפט ענייעם יושיע לבני אביון וידכא עושק ייראוך עםשמש ולפני ירח דור דורים ירד כמטר עלגז כרביבים זרזיף ארץ יפרחבימיו צדיק ורב שלום עדבלי ירח וירד מים עדים ומנהר עדאפסיארץ לפניו יכרעו ציים ואיביו עפר ילחכו מלכי תרשיש ואיים מנחה ישיבו מלכי שבא וסבא אשכר יקריבו וישתחוולו כלמלכים כלגוים יעבדוהו כייציל אביון משוע ועני ואיןעזר לו יחס עלדל ואביון ונפשות אביונים יושיע מתוך ומחמס יגאל נפשם וייקר דמם בעיניו ויחי ויתןלו מזהב שבא ויתפלל בעדו תמיד כלהיום יברכנהו יהי פסתבר בארץ בראש הרים ירעש כלבנון פריו ויציצו מעיר כעשב הארץ יהי שמו לעולם לפנישמש ינין ינון שמו ויתברכו בו כלגוים יאשרוהו ברוך יהוה אלהים אלהי ישראל עשה נפלאות לבדו וברוך שם כבודו לעולם וימלא כבודו אתכל הארץ אמן ואמן כלו תפלות דוד בןישי", "73": "מזמור לאסף אך טוב לישראל אלהים לברי לבב ואני כמעט נטוי נטיו רגלי כאין שפכה שפכו אשרי כיקנאתי בהוללים שלום רשעים אראה כי אין חרצבות למותם ובריא אולם בעמל אנוש אינמו ועםאדם לא ינגעו לכן ענקתמו גאוה יעטףשית חמס למו יצא מחלב עינמו עברו משכיות לבב ימיקו וידברו ברע עשק ממרום ידברו שתו בשמים פיהם ולשונם תהלך בארץ לכן ישיב ישוב עמו הלם ומי מלא ימצו למו ואמרו איכה ידעאל ויש דעה בעליון הנהאלה רשעים ושלוי עולם השגוחיל אךריק זכיתי לבבי וארחץ בנקיון כפי ואהי נגוע כלהיום ותוכחתי לבקרים אםאמרתי אספרה כמו הנה דור בניך בגדתי ואחשבה לדעת זאת עמל היא הוא בעיני עדאבוא אלמקדשיאל אבינה לאחריתם אך בחלקות תשית למו הפלתם למשואות איך היו לשמה כרגע ספו תמו מןבלהות כחלום מהקיץ אדני בעיר צלמם תבזה כי יתחמץ לבבי וכליותי אשתונן ואניבער ולא אדע בהמות הייתי עמך ואני תמיד עמך אחזת בידימיני בעצתך תנחני ואחר כבוד תקחני מילי בשמים ועמך לאחפצתי בארץ כלה שארי ולבבי צורלבבי וחלקי אלהים לעולם כיהנה רחקיך יאבדו הצמתה כלזונה ממך ואני קרבת אלהים לי טוב שתי באדני יהוה מחסי לספר כלמלאכותיך פ", "74": "משכיל לאסף למה אלהים זנחת לנצח יעשן אפך בצאן מרעיתך זכר עדתך קנית קדם גאלת שבט נחלתך הרציון זה שכנת בו הרימה פעמיך למשאות נצח כלהרע אויב בקדש שאגו צרריך בקרב מועדך שמו אותתם אתות יודע כמביא למעלה בסבךעץ קרדמות ועת ועתה פתוחיה יחד בכשיל וכילפות יהלמון שלחו באש מקדשך לארץ חללו משכןשמך אמרו בלבם נינם יחד שרפו כלמועדיאל בארץ אותתינו לא ראינו איןעוד נביא ולאאתנו ידע עדמה עדמתי אלהים יחרף צר ינאץ אויב שמך לנצח למה תשיב ידך וימינך מקרב חוקך חיקך כלה ואלהים מלכי מקדם פעל ישועות בקרב הארץ אתה פוררת בעזך ים שברת ראשי תנינים עלהמים אתה רצצת ראשי לויתן תתננו מאכל לעם לציים אתה בקעת מעין ונחל אתה הובשת נהרות איתן לך יום אףלך לילה אתה הכינות מאור ושמש אתה הצבת כלגבולות ארץ קיץ וחרף אתה יצרתם זכרזאת אויב חרף יהוה ועם נבל נאצו שמך אלתתן לחית נפש תורך חית ענייך אלתשכח לנצח הבט לברית כי מלאו מחשכיארץ נאות חמס אלישב דך נכלם עני ואביון יהללו שמך קומה אלהים ריבה ריבך זכר חרפתך מנינבל כלהיום אלתשכח קול צרריך שאון קמיך עלה תמיד פ", "75": "למנצח אלתשחת מזמור לאסף שיר הודינו לך אלהים הודינו וקרוב שמך ספרו נפלאותיך כי אקח מועד אני מישרים אשפט נמגים ארץ וכלישביה אנכי תכנתי עמודיה סלה אמרתי להוללים אלתהלו ולרשעים אלתרימו קרן אלתרימו למרום קרנכם תדברו בצואר עתק כי לא ממוצא וממערב ולא ממדבר הרים כיאלהים שפט זה ישפיל וזה ירים כי כוס בידיהוה ויין חמר מלא מסך ויגר מזה אךשמריה ימצו ישתו כל רשעיארץ ואני אגיד לעלם אזמרה לאלהי יעקב וכלקרני רשעים אגדע תרוממנה קרנות צדיק פ", "76": "למנצח בנגינת מזמור לאסף שיר נודע ביהודה אלהים בישראל גדול שמו ויהי בשלם סוכו ומעונתו בציון שמה שבר רשפיקשת מגן וחרב ומלחמה סלה נאור אתה אדיר מהרריטרף אשתוללו אבירי לב נמו שנתם ולאמצאו כלאנשיחיל ידיהם מגערתך אלהי יעקב נרדם ורכב וסוס אתה נורא אתה ומייעמד לפניך מאז אפך משמים השמעת דין ארץ יראה ושקטה בקוםלמשפט אלהים להושיע כלענויארץ סלה כיחמת אדם תודך שארית חמת תחגר נדרו ושלמו ליהוה אלהיכם כלסביביו יבילו שי למורא יבצר רוח נגידים נורא למלכיארץ פ", "77": "למנצח על ידותון ידיתון לאסף מזמור קולי אלאלהים ואצעקה קולי אלאלהים והאזין אלי ביום צרתי אדני דרשתי ידי לילה נגרה ולא תפוג מאנה הנחם נפשי אזכרה אלהים ואהמיה אשיחה ותתעטף רוחי סלה אחזת שמרות עיני נפעמתי ולא אדבר חשבתי ימים מקדם שנות עולמים אזכרה נגינתי בלילה עםלבבי אשיחה ויחפש רוחי הלעולמים יזנח אדני ולאיסיף לרצות עוד האפס לנצח חסדו גמר אמר לדר ודר השכח חנות אל אםקפץ באף רחמיו סלה ואמר חלותי היא שנות ימין עליון אזכיר אזכור מעללייה כיאזכרה מקדם פלאך והגיתי בכלפעלך ובעלילותיך אשיחה אלהים בקדש דרכך מיאל גדול כאלהים אתה האל עשה פלא הודעת בעמים עזך גאלת בזרוע עמך בנייעקב ויוסף סלה ראוך מים אלהים ראוך מים יחילו אף ירגזו תהמות זרמו מים עבות קול נתנו שחקים אףחצציך יתהלכו קול רעמך בגלגל האירו ברקים תבל רגזה ותרעש הארץ בים דרכך ושביליך ושבילך במים רבים ועקבותיך לא נדעו נחית כצאן עמך בידמשה ואהרן פ", "78": "משכיל לאסף האזינה עמי תורתי הטו אזנכם לאמריפי אפתחה במשל פי אביעה חידות מניקדם אשר שמענו ונדעם ואבותינו ספרולנו לא נכחד מבניהם לדור אחרון מספרים תהלות יהוה ועזוזו ונפלאתיו אשר עשה ויקם עדות ביעקב ותורה שם בישראל אשר צוה אתאבותינו להודיעם לבניהם למען ידעו דור אחרון בנים יולדו יקמו ויספרו לבניהם וישימו באלהים כסלם ולא ישכחו מעלליאל ומצותיו ינצרו ולא יהיו כאבותם דור סורר ומרה דור לאהכין לבו ולאנאמנה אתאל רוחו בניאפרים נושקי רומיקשת הפכו ביום קרב לא שמרו ברית אלהים ובתורתו מאנו ללכת וישכחו עלילותיו ונפלאותיו אשר הראם נגד אבותם עשה פלא בארץ מצרים שדהצען בקע ים ויעבירם ויצבמים כמונד וינחם בענן יומם וכלהלילה באור אש יבקע צרים במדבר וישק כתהמות רבה ויוצא נוזלים מסלע ויורד כנהרות מים ויוסיפו עוד לחטאלו למרות עליון בציה וינסואל בלבבם לשאלאכל לנפשם וידברו באלהים אמרו היוכל אל לערך שלחן במדבר הן הכהצור ויזובו מים ונחלים ישטפו הגםלחם יוכל תת אםיכין שאר לעמו לכן שמע יהוה ויתעבר ואש נשקה ביעקב וגםאף עלה בישראל כי לא האמינו באלהים ולא בטחו בישועתו ויצו שחקים ממעל ודלתי שמים פתח וימטר עליהם מן לאכל ודגןשמים נתן למו לחם אבירים אכל איש צידה שלח להם לשבע יסע קדים בשמים וינהג בעזו תימן וימטר עליהם כעפר שאר וכחול ימים עוף כנף ויפל בקרב מחנהו סביב למשכנתיו ויאכלו וישבעו מאד ותאותם יבא להם לאזרו מתאותם עוד אכלם בפיהם ואף אלהים עלה בהם ויהרג במשמניהם ובחורי ישראל הכריע בכלזאת חטאועוד ולאהאמינו בנפלאותיו ויכלבהבל ימיהם ושנותם בבהלה אםהרגם ודרשוהו ושבו ושחרואל ויזכרו כיאלהים צורם ואל עליון גאלם ויפתוהו בפיהם ובלשונם יכזבולו ולבם לאנכון עמו ולא נאמנו בבריתו והוא רחום יכפר עון ולאישחית והרבה להשיב אפו ולאיעיר כלחמתו ויזכר כיבשר המה רוח הולך ולא ישוב כמה ימרוהו במדבר יעציבוהו בישימון וישובו וינסו אל וקדוש ישראל התוו לאזכרו אתידו יום אשרפדם מניצר אשרשם במצרים אתותיו ומופתיו בשדהצען ויהפך לדם יאריהם ונזליהם בלישתיון ישלח בהם ערב ויאכלם וצפרדע ותשחיתם ויתן לחסיל יבולם ויגיעם לארבה יהרג בברד גפנם ושקמותם בחנמל ויסגר לברד בעירם ומקניהם לרשפים ישלחבם חרון אפו עברה וזעם וצרה משלחת מלאכי רעים יפלס נתיב לאפו לאחשך ממות נפשם וחיתם לדבר הסגיר ויך כלבכור במצרים ראשית אונים באהליחם ויסע כצאן עמו וינהגם כעדר במדבר וינחם לבטח ולא פחדו ואתאויביהם כסה הים ויביאם אלגבול קדשו הרזה קנתה ימינו ויגרש מפניהם גוים ויפילם בחבל נחלה וישכן באהליהם שבטי ישראל וינסו וימרו אתאלהים עליון ועדותיו לא שמרו ויסגו ויבגדו כאבותם נהפכו כקשת רמיה ויכעיסוהו בבמותם ובפסיליהם יקניאוהו שמע אלהים ויתעבר וימאס מאד בישראל ויטש משכן שלו אהל שכן באדם ויתן לשבי עזו ותפארתו בידצר ויסגר לחרב עמו ובנחלתו התעבר בחוריו אכלהאש ובתולתיו לא הוללו כהניו בחרב נפלו ואלמנתיו לא תבכינה ויקץ כישן אדני כגבור מתרונן מיין ויךצריו אחור חרפת עולם נתן למו וימאס באהל יוסף ובשבט אפרים לא בחר ויבחר אתשבט יהודה אתהר ציון אשר אהב ויבן כמורמים מקדשו כארץ יסדה לעולם ויבחר בדוד עבדו ויקחהו ממכלאת צאן מאחר עלות הביאו לרעות ביעקב עמו ובישראל נחלתו וירעם כתם לבבו ובתבונות כפיו ינחם פ", "79": "מזמור לאסף אלהים באו גוים בנחלתך טמאו אתהיכל קדשך שמו אתירושל ם לעיים נתנו אתנבלת עבדיך מאכל לעוף השמים בשר חסידיך לחיתוארץ שפכו דמם כמים סביבות ירושל ם ואין קובר היינו חרפה לשכנינו לעג וקלס לסביבותינו עדמה יהוה תאנף לנצח תבער כמואש קנאתך שפך חמתך אלהגוים אשר לאידעוך ועל ממלכות אשר בשמך לא קראו כי אכל אתיעקב ואתנוהו השמו אלתזכרלנו עונת ראשנים מהר יקדמונו רחמיך כי דלונו מאד עזרנו אלהי ישענו עלדבר כבודשמך והצילנו וכפר עלחטאתינו למען שמך למה יאמרו הגוים איה אלהיהם יודע בגיים בגוים לעינינו נקמת דםעבדיך השפוך תבוא לפניך אנקת אסיר כגדל זרועך הותר בני תמותה והשב לשכנינו שבעתים אלחיקם חרפתם אשר חרפוך אדני ואנחנו עמך וצאן מרעיתך נודה לך לעולם לדור ודר נספר תהלתך פ", "80": "למנצח אלששנים עדות לאסף מזמור רעה ישראל האזינה נהג כצאן יוסף ישב הכרובים הופיעה לפני אפרים ובנימן ומנשה עוררה אתגבורתך ולכה לישעתה לנו אלהים השיבנו והאר פניך ונושעה יהוה אלהים צבאות עדמתי עשנת בתפלת עמך האכלתם לחם דמעה ותשקמו בדמעות שליש תשימנו מדון לשכנינו ואיבינו ילעגולמו אלהים צבאות השיבנו והאר פניך ונושעה גפן ממצרים תסיע תגרש גוים ותטעה פנית לפניה ותשרש שרשיה ותמלאארץ כסו הרים צלה וענפיה ארזיאל תשלח קצירה עדים ואלנהר יונקותיה למה פרצת גדריה וארוה כלעברי דרך יכרסמנה חזיר מי ע ר וזיז שדי ירענה אלהים צבאות שוב נא הבט משמים וראה ופקד גפן זאת ו כ נה אשרנטעה ימינך ועלבן אמצתה לך שרפה באש כסוחה מגערת פניך יאבדו תהיידך עלאיש ימינך עלבןאדם אמצת לך ולאנסוג ממך תחינו ובשמך נקרא יהוה אלהים צבאות השיבנו האר פניך ונושעה פ", "81": "למנצח עלהגתית לאסף הרנינו לאלהים עוזנו הריעו לאלהי יעקב שאוזמרה ותנותף כנור נעים עםנבל תקעו בחדש שופר בכסה ליום חגנו כי חק לישראל הוא משפט לאלהי יעקב עדות ביהוסף שמו בצאתו עלארץ מצרים שפת לאידעתי אשמע הסירותי מסבל שכמו כפיו מדוד תעברנה בצרה קראת ואחלצך אענך בסתר רעם אבחנך עלמי מריבה סלה שמע עמי ואעידה בך ישראל אםתשמעלי לאיהיה בך אל זר ולא תשתחוה לאל נכר אנכי יהוה אלהיך המעלך מארץ מצרים הרחבפיך ואמלאהו ולאשמע עמי לקולי וישראל לאאבה לי ואשלחהו בשרירות לבם ילכו במועצותיהם לו עמי שמע לי ישראל בדרכי יהלכו כמעט אויביהם אכניע ועל צריהם אשיב ידי משנאי יהוה יכחשולו ויהי עתם לעולם ויאכילהו מחלב חטה ומצור דבש אשביעך פ", "82": "מזמור לאסף אלהים נצב בעדתאל בקרב אלהים ישפט עדמתי תשפטועול ופני רשעים תשאוסלה שפטודל ויתום עני ורש הצדיקו פלטודל ואביון מיד רשעים הצילו לא ידעו ולא יבינו בחשכה יתהלכו ימוטו כלמוסדי ארץ אניאמרתי אלהים אתם ובני עליון כלכם אכן כאדם תמותון וכאחד השרים תפלו קומה אלהים שפטה הארץ כיאתה תנחל בכלהגוים פ", "83": "שיר מזמור לאסף אלהים אלדמילך אלתחרש ואלתשקט אל כיהנה אויביך יהמיון ומשנאיך נשאו ראש עלעמך יערימו סוד ויתיעצו עלצפוניך אמרו לכו ונכחידם מגוי ולאיזכר שםישראל עוד כי נועצו לב יחדו עליך ברית יכרתו אהלי אדום וישמעאלים מואב והגרים גבל ועמון ועמלק פלשת עםישבי צור גםאשור נלוה עמם היו זרוע לבנילוט סלה עשהלהם כמדין כסיסרא כיבין בנחל קישון נשמדו בעיןדאר היו דמן לאדמה שיתמו נדיבימו כערב וכזאב וכזבח וכצלמנע כלנסיכימו אשר אמרו נירשה לנו את נאות אלהים אלהי שיתמו כגלגל כקש לפנירוח כאש תבעריער וכלהבה תלהט הרים כן תרדפם בסערך ובסופתך תבהלם מלא פניהם קלון ויבקשו שמך יהוה יבשו ויבהלו עדיעד ויחפרו ויאבדו וידעו כיאתה שמך יהוה לבדך עליון עלכלהארץ פ", "84": "למנצח עלהגתית לבניקרח מזמור מהידידות משכנותיך יהוה צבאות נכספה וגםכלתה נפשי לחצרות יהוה לבי ובשרי ירננו אל אלחי גםצפור מצאה בית ודרור ק ן לה אשרשתה אפרחיה אתמזבחותיך יהוה צבאות מלכי ואלהי אשרי יושבי ביתך עוד יהללוך סלה אשרי אדם עוזלו בך מסלות בלבבם עברי בעמק הבכא מעין ישיתוהו גםברכות יעטה מורה ילכו מחיל אלחיל יראה אלאלהים בציון יהוה אלהים צבאות שמעה תפלתי האזינה אלהי יעקב סלה מגננו ראה אלהים והבט פני משיחך כי טוביום בחצריך מאלף בחרתי הסתופף בבית אלהי מדור באהלירשע כי שמש ומגן יהוה אלהים חן וכבוד יתן יהוה לא ימנעטוב להלכים בתמים יהוה צבאות אשרי אדם בטח בך פ", "85": "למנצח לבניקרח מזמור רצית יהוה ארצך שבת שבות שבית יעקב נשאת עון עמך כסית כלחטאתם סלה אספת כלעברתך השיבות מחרון אפך שובנו אלהי ישענו והפר כעסך עמנו הלעולם תאנףבנו תמשך אפך לדר ודר הלאאתה תשוב תחינו ועמך ישמחובך הראנו יהוה חסדך וישעך תתןלנו אשמעה מהידבר האל יהוה כי ידבר שלום אלעמו ואלחסידיו ואלישובו לכסלה אך קרוב ליראיו ישעו לשכן כבוד בארצנו חסדואמת נפגשו צדק ושלום נשקו אמת מארץ תצמח וצדק משמים נשקף גםיהוה יתן הטוב וארצנו תתן יבולה צדק לפניו יהלך וישם לדרך פעמיו פ", "86": "תפלה לדוד הטהיהוה אזנך ענני כיעני ואביון אני שמרה נפשי כיחסיד אני הושע עבדך אתה אלהי הבוטח אליך חנני אדני כי אליך אקרא כלהיום שמח נפש עבדך כי אליך אדני נפשי אשא כיאתה אדני טוב וסלח ורבחסד לכלקראיך האזינה יהוה תפלתי והקשיבה בקול תחנונותי ביום צרתי אקראך כי תענני איןכמוך באלהים אדני ואין כמעשיך כלגוים אשר עשית יבואו וישתחוו לפניך אדני ויכבדו לשמך כיגדול אתה ועשה נפלאות אתה אלהים לבדך הורני יהוה דרכך אהלך באמתך יחד לבבי ליראה שמך אודך אדני אלהי בכללבבי ואכבדה שמך לעולם כיחסדך גדול עלי והצלת נפשי משאול תחתיה אלהים זדים קמועלי ועדת עריצים בקשו נפשי ולא שמוך לנגדם ואתה אדני אלרחום וחנון ארך אפים ורבחסד ואמת פנה אלי וחנני תנהעזך לעבדך והושיעה לבןאמתך עשהעמי אות לטובה ויראו שנאי ויבשו כיאתה יהוה עזרתני ונחמתני פ", "87": "לבניקרח מזמור שיר יסודתו בהרריקדש אהב יהוה שערי ציון מכל משכנות יעקב נכבדות מדבר בך עיר האלהים סלה אזכיר רהב ובבל לידעי הנה פלשת וצר עםכוש זה ילדשם ולציון יאמר איש ואיש ילדבה והוא יכוננה עליון יהוה יספר בכתוב עמים זה ילדשם סלה ושרים כחללים כלמעיני בך פ", "88": "שיר מזמור לבני קרח למנצח עלמחלת לענות משכיל להימן האזרחי יהוה אלהי ישועתי יוםצעקתי בלילה נגדך תבוא לפניך תפלתי הטה אזנך לרנתי כישבעה ברעות נפשי וחיי לשאול הגיעו נחשבתי עםיורדי בור הייתי כגבר איןאיל במתים חפשי כמו חללים שכבי קבר אשר לא זכרתם עוד והמה מידך נגזרו שתני בבור תחתיות במחשכים במצלות עלי סמכה חמתך וכלמשבריך ענית סלה הרחקת מידעי ממני שתני תועבות למו כלא ולא אצא עיני דאבה מני עני קראתיך יהוה בכליום שטחתי אליך כפי הלמתים תעשהפלא אםרפאים יקומו יודוך סלה היספר בקבר חסדך אמונתך באבדון היודע בחשך פלאך וצדקתך בארץ נשיה ואני אליך יהוה שועתי ובבקר תפלתי תקדמך למה יהוה תזנח נפשי תסתיר פניך ממני עני אני וגוע מנער נשאתי אמיך אפונה עלי עברו חרוניך בעותיך צמתותני סבוני כמים כלהיום הקיפו עלי יחד הרחקת ממני אהב ורע מידעי מחשך פ", "89": "משכיל לאיתן האזרחי חסדי יהוה עולם אשירה לדר ודר אודיע אמונתך בפי כיאמרתי עולם חסד יבנה שמים תכן אמונתך בהם כרתי ברית לבחירי נשבעתי לדוד עבדי עדעולם אכין זרעך ובניתי לדרודור כסאך סלה ויודו שמים פלאך יהוה אףאמונתך בקהל קדשים כי מי בשחק יערך ליהוה ידמה ליהוה בבני אלים אל נערץ בסודקדשים רבה ונורא עלכלסביביו יהוה אלהי צבאות מיכמוך חסין יה ואמונתך סביבותיך אתה מושל בגאות הים בשוא גליו אתה תשבחם אתה דכאת כחלל רהב בזרוע עזך פזרת אויביך לך שמים אףלך ארץ תבל ומלאה אתה יסדתם צפון וימין אתה בראתם תבור וחרמון בשמך ירננו לך זרוע עםגבורה תעז ידך תרום ימינך צדק ומשפט מכון כסאך חסד ואמת יקדמו פניך אשרי העם ידעי תרועה יהוה באורפניך יהלכון בשמך יגילון כלהיום ובצדקתך ירומו כיתפארת עזמו אתה וברצונך תרים תרום קרנינו כי ליהוה מגננו ולקדוש ישראל מלכנו אז דברתבחזון לחסידיך ותאמר שויתי עזר עלגבור הרימותי בחור מעם מצאתי דוד עבדי בשמן קדשי משחתיו אשר ידי תכון עמו אףזרועי תאמצנו לאישיא אויב בו ובןעולה לא יעננו וכתותי מפניו צריו ומשנאיו אגוף ואמונתי וחסדי עמו ובשמי תרום קרנו ושמתי בים ידו ובנהרות ימינו הוא יקראני אבי אתה אלי וצור ישועתי אףאני בכור אתנהו עליון למלכיארץ לעולם אשמור אשמר לו חסדי ובריתי נאמנת לו ושמתי לעד זרעו וכסאו כימי שמים אםיעזבו בניו תורתי ובמשפטי לא ילכון אםחקתי יחללו ומצותי לא ישמרו ופקדתי בשבט פשעם ובנגעים עונם וחסדי לאאפיר מעמו ולאאשקר באמונתי לאאחלל בריתי ומוצא שפתי לא אשנה אחת נשבעתי בקדשי אםלדוד אכזב זרעו לעולם יהיה וכסאו כשמש נגדי כירח יכון עולם ועד בשחק נאמן סלה ואתה זנחת ותמאס התעברת עםמשיחך נארתה ברית עבדך חללת לארץ נזרו פרצת כלגדרתיו שמת מבצריו מחתה שסהו כלעברי דרך היה חרפה לשכניו הרימות ימין צריו השמחת כלאויביו אףתשיב צור חרבו ולא הקימתו במלחמה השבת מטהרו וכסאו לארץ מגרתה הקצרת ימי עלומיו העטית עליו בושה סלה עדמה יהוה תסתר לנצח תבער כמואש חמתך זכראני מהחלד עלמהשוא בראת כלבניאדם מי גבר יחיה ולא יראהמות ימלט נפשו מידשאול סלה איה חסדיך הראשנים אדני נשבעת לדוד באמונתך זכר אדני חרפת עבדיך שאתי בחיקי כלרבים עמים אשר חרפו אויביך יהוה אשר חרפו עקבות משיחך ברוך יהוה לעולם אמן ואמן", "90": "תפלה למשה אישהאלהים אדני מעון אתה היית לנו בדר ודר בטרם הרים ילדו ותחולל ארץ ותבל ומעולם עדעולם אתה אל תשב אנוש עדדכא ותאמר שובו בניאדם כי אלף שנים בעיניך כיום אתמול כי יעבר ואשמורה בלילה זרמתם שנה יהיו בבקר כחציר יחלף בבקר יציץ וחלף לערב ימולל ויבש כיכלינו באפך ובחמתך נבהלנו שת עונתינו לנגדך עלמנו למאור פניך כי כלימינו פנו בעברתך כלינו שנינו כמוהגה ימישנותינו בהם שבעים שנה ואם בגבורת שמונים שנה ורהבם עמל ואון כיגז חיש ונעפה מייודע עז אפך וכיראתך עברתך למנות ימינו כן הודע ונבא לבב חכמה שובה יהוה עדמתי והנחם עלעבדיך שבענו בבקר חסדך ונרננה ונשמחה בכלימינו שמחנו כימות עניתנו שנות ראינו רעה יראה אלעבדיך פעלך והדרך עלבניהם ויהי נעם אדני אלהינו עלינו ומעשה ידינו כוננה עלינו ומעשה ידינו כוננהו פ", "91": "ישב בסתר עליון בצל שדי יתלונן אמר ליהוה מחסי ומצודתי אלהי אבטחבו כי הוא יצילך מפח יקוש מדבר הוות באברתו יסך לך ותחתכנפיו תחסה צנה וסחרה אמתו לאתירא מפחד לילה מחץ יעוף יומם מדבר באפל יהלך מקטב ישוד צהרים יפל מצדך אלף ורבבה מימינך אליך לא יגש רק בעיניך תביט ושלמת רשעים תראה כיאתה יהוה מחסי עליון שמת מעונך לאתאנה אליך רעה ונגע לאיקרב באהלך כי מלאכיו יצוהלך לשמרך בכלדרכיך עלכפים ישאונך פןתגף באבן רגלך עלשחל ופתן תדרך תרמס כפיר ותנין כי בי חשק ואפלטהו אשגבהו כיידע שמי יקראני ואענהו עמואנכי בצרה אחלצהו ואכבדהו ארך ימים אשביעהו ואראהו בישועתי פ", "92": "מזמור שיר ליום השבת טוב להדות ליהוה ולזמר לשמך עליון להגיד בבקר חסדך ואמונתך בלילות עליעשור ועלינבל עלי הגיון בכנור כי שמחתני יהוה בפעלך במעשי ידיך ארנן מהגדלו מעשיך יהוה מאד עמקו מחשבתיך אישבער לא ידע וכסיל לאיבין אתזאת בפרח רשעים כמועשב ויציצו כלפעלי און להשמדם עדיעד ואתה מרום לעלם יהוה כי הנה איביך יהוה כיהנה איביך יאבדו יתפרדו כלפעלי און ותרם כראים קרני בלתי בשמן רענן ותבט עיני בשורי בקמים עלי מרעים תשמענה אזני צדיק כתמר יפרח כארז בלבנון ישגה שתולים בבית יהוה בחצרות אלהינו יפריחו עוד ינובון בשיבה דשנים ורעננים יהיו להגיד כיישר יהוה צורי ולא עולתה עלתה בו פ", "93": "יהוה מלך גאות לבש לבש יהוה עז התאזר אףתכון תבל בלתמוט נכון כסאך מאז מעולם אתה נשאו נהרות יהוה נשאו נהרות קולם ישאו נהרות דכים מקלות מים רבים אדירים משבריים אדיר במרום יהוה עדתיך נאמנו מאד לביתך נאוהקדש יהוה לארך ימים פ", "94": "אלנקמות יהוה אל נקמות הופיע הנשא שפט הארץ השב גמול עלגאים עדמתי רשעים יהוה עדמתי רשעים יעלזו יביעו ידברו עתק יתאמרו כלפעלי און עמך יהוה ידכאו ונחלתך יענו אלמנה וגר יהרגו ויתומים ירצחו ויאמרו לא יראהיה ולאיבין אלהי יעקב בינו בערים בעם וכסילים מתי תשכילו הנטע אזן הלא ישמע אםיצר עין הלא יביט היסר גוים הלא יוכיח המלמד אדם דעת יהוה ידע מחשבות אדם כיהמה הבל אשרי הגבר אשרתיסרנו יה ומתורתך תלמדנו להשקיט לו מימי רע עד יכרה לרשע שחת כי לאיטש יהוה עמו ונחלתו לא יעזב כיעדצדק ישוב משפט ואחריו כלישרילב מייקום לי עםמרעים מייתיצב לי עםפעלי און לולי יהוה עזרתה לי כמעט שכנה דומה נפשי אםאמרתי מטה רגלי חסדך יהוה יסעדני ברב שרעפי בקרבי תנחומיך ישעשעו נפשי היחברך כסא הוות יצר עמל עליחק יגודו עלנפש צדיק ודם נקי ירשיעו ויהי יהוה לי למשגב ואלהי לצור מחסי וישב עליהם אתאונם וברעתם יצמיתם יצמיתם יהוה אלהינו פ", "95": "לכו נרננה ליהוה נריעה לצור ישענו נקדמה פניו בתודה בזמרות נריע לו כי אל גדול יהוה ומלך גדול עלכלאלהים אשר בידו מחקריארץ ותועפת הרים לו אשרלו הים והוא עשהו ויבשת ידיו יצרו באו נשתחוה ונכרעה נברכה לפנייהוה עשנו כי הוא אלהינו ואנחנו עם מרעיתו וצאן ידו היום אםבקלו תשמעו אלתקשו לבבכם כמריבה כיום מסה במדבר אשר נסוני אבותיכם בחנוני גםראו פעלי ארבעים שנה אקוט בדור ואמר עם תעי לבב הם והם לאידעו דרכי אשרנשבעתי באפי אםיבאון אלמנוחתי פ", "96": "שירו ליהוה שיר חדש שירו ליהוה כלהארץ שירו ליהוה ברכו שמו בשרו מיוםליום ישועתו ספרו בגוים כבודו בכלהעמים נפלאותיו כי גדול יהוה ומהלל מאד נורא הוא עלכלאלהים כי כלאלהי העמים אלילים ויהוה שמים עשה הודוהדר לפניו עז ותפארת במקדשו הבו ליהוה משפחות עמים הבו ליהוה כבוד ועז הבו ליהוה כבוד שמו שאומנחה ובאו לחצרותיו השתחוו ליהוה בהדרתקדש חילו מפניו כלהארץ אמרו בגוים יהוה מלך אףתכון תבל בלתמוט ידין עמים במישרים ישמחו השמים ותגל הארץ ירעם הים ומלאו יעלז שדי וכלאשרבו אז ירננו כלעצייער לפני יהוה כי בא כי בא לשפט הארץ ישפטתבל בצדק ועמים באמונתו פ", "97": "יהוה מלך תגל הארץ ישמחו איים רבים ענן וערפל סביביו צדק ומשפט מכון כסאו אש לפניו תלך ותלהט סביב צריו האירו ברקיו תבל ראתה ותחל הארץ הרים כדונג נמסו מלפני יהוה מלפני אדון כלהארץ הגידו השמים צדקו וראו כלהעמים כבודו יבשו כלעבדי פסל המתהללים באלילים השתחוולו כלאלהים שמעה ותשמח ציון ותגלנה בנות יהודה למען משפטיך יהוה כיאתה יהוה עליון עלכלהארץ מאד נעלית עלכלאלהים אהבי יהוה שנאו רע שמר נפשות חסידיו מיד רשעים יצילם אור זרע לצדיק ולישרילב שמחה שמחו צדיקים ביהוה והודו לזכר קדשו פ", "98": "מזמור שירו ליהוה שיר חדש כינפלאות עשה הושיעהלו ימינו וזרוע קדשו הודיע יהוה ישועתו לעיני הגוים גלה צדקתו זכר חסדו ואמונתו לבית ישראל ראו כלאפסיארץ את ישועת אלהינו הריעו ליהוה כלהארץ פצחו ורננו וזמרו זמרו ליהוה בכנור בכנור וקול זמרה בחצצרות וקול שופר הריעו לפני המלך יהוה ירעם הים ומלאו תבל וישבי בה נהרות ימחאוכף יחד הרים ירננו לפני יהוה כי בא לשפט הארץ ישפטתבל בצדק ועמים במישרים פ", "99": "יהוה מלך ירגזו עמים ישב כרובים תנוט הארץ יהוה בציון גדול ורם הוא עלכלהעמים יודו שמך גדול ונורא קדוש הוא ועז מלך משפט אהב אתה כוננת מישרים משפט וצדקה ביעקב אתה עשית רוממו יהוה אלהינו והשתחוו להדם רגליו קדוש הוא משה ואהרן בכהניו ושמואל בקראי שמו קראים אליהוה והוא יענם בעמוד ענן ידבר אליהם שמרו עדתיו וחק נתןלמו יהוה אלהינו אתה עניתם אל נשא היית להם ונקם עלעלילותם רוממו יהוה אלהינו והשתחוו להר קדשו כיקדוש יהוה אלהינו פ", "100": "מזמור לתודה הריעו ליהוה כלהארץ עבדו אתיהוה בשמחה באו לפניו ברננה דעו כייהוה הוא אלהים הואעשנו ולא ולו אנחנו עמו וצאן מרעיתו באו שעריו בתודה חצרתיו בתהלה הודולו ברכו שמו כיטוב יהוה לעולם חסדו ועדדר ודר אמונתו פ", "101": "לדוד מזמור חסדומשפט אשירה לך יהוה אזמרה אשכילה בדרך תמים מתי תבוא אלי אתהלך בתםלבבי בקרב ביתי לאאשית לנגד עיני דברבליעל עשהסטים שנאתי לא ידבק בי לבב עקש יסור ממני רע לא אדע מלושני מלשני בסתר רעהו אותו אצמית גבהעינים ורחב לבב אתו לא אוכל עיני בנאמניארץ לשבת עמדי הלך בדרך תמים הוא ישרתני לאישב בקרב ביתי עשה רמיה דבר שקרים לאיכון לנגד עיני לבקרים אצמית כלרשעיארץ להכרית מעיריהוה כלפעלי און פ", "102": "תפלה לעני כייעטף ולפני יהוה ישפך שיחו יהוה שמעה תפלתי ושועתי אליך תבוא אלתסתר פניך ממני ביום צר לי הטהאלי אזנך ביום אקרא מהר ענני כיכלו בעשן ימי ועצמותי כמוקד נחרו הוכהכעשב ויבש לבי כישכחתי מאכל לחמי מקול אנחתי דבקה עצמי לבשרי דמיתי לקאת מדבר הייתי ככוס חרבות שקדתי ואהיה כצפור בודד עלגג כלהיום חרפוני אויבי מהוללי בי נשבעו כיאפר כלחם אכלתי ושקוי בבכי מסכתי מפניזעמך וקצפך כי נשאתני ותשליכני ימי כצל נטוי ואני כעשב איבש ואתה יהוה לעולם תשב וזכרך לדר ודר אתה תקום תרחם ציון כיעת לחננה כיבא מועד כירצו עבדיך אתאבניה ואתעפרה יחננו וייראו גוים אתשם יהוה וכלמלכי הארץ אתכבודך כיבנה יהוה ציון נראה בכבודו פנה אלתפלת הערער ולאבזה אתתפלתם תכתב זאת לדור אחרון ועם נברא יהלליה כיהשקיף ממרום קדשו יהוה משמים אלארץ הביט לשמע אנקת אסיר לפתח בני תמותה לספר בציון שם יהוה ותהלתו בירושל ם בהקבץ עמים יחדו וממלכות לעבד אתיהוה ענה בדרך כחו כחי קצר ימי אמר אלי אלתעלני בחצי ימי בדור דורים שנותיך לפנים הארץ יסדת ומעשה ידיך שמים המה יאבדו ואתה תעמד וכלם כבגד יבלו כלבוש תחליפם ויחלפו ואתההוא ושנותיך לא יתמו בניעבדיך ישכונו וזרעם לפניך יכון פ", "103": "לדוד ברכי נפשי אתיהוה וכלקרבי אתשם קדשו ברכי נפשי אתיהוה ואלתשכחי כלגמוליו הסלח לכלעונכי הרפא לכלתחלואיכי הגואל משחת חייכי המעטרכי חסד ורחמים המשביע בטוב עדיך תתחדש כנשר נעוריכי עשה צדקות יהוה ומשפטים לכלעשוקים יודיע דרכיו למשה לבני ישראל עלילותיו רחום וחנון יהוה ארך אפים ורבחסד לאלנצח יריב ולא לעולם יטור לא כחטאינו עשה לנו ולא כעונתינו גמל עלינו כי כגבה שמים עלהארץ גבר חסדו עליראיו כרחק מזרח ממערב הרחיק ממנו אתפשעינו כרחם אב עלבנים רחם יהוה עליראיו כיהוא ידע יצרנו זכור כיעפר אנחנו אנוש כחציר ימיו כציץ השדה כן יציץ כי רוח עברהבו ואיננו ולאיכירנו עוד מקומו וחסד יהוה מעולם ועדעולם עליראיו וצדקתו לבני בנים לשמרי בריתו ולזכרי פקדיו לעשותם יהוה בשמים הכין כסאו ומלכותו בכל משלה ברכו יהוה מלאכיו גברי כח עשי דברו לשמע בקול דברו ברכו יהוה כלצבאיו משרתיו עשי רצונו ברכו יהוה כלמעשיו בכלמקמות ממשלתו ברכי נפשי אתיהוה פ", "104": "ברכי נפשי אתיהוה יהוה אלהי גדלת מאד הוד והדר לבשת עטהאור כשלמה נוטה שמים כיריעה המקרה במים עליותיו השםעבים רכובו המהלך עלכנפירוח עשה מלאכיו רוחות משרתיו אש להט יסדארץ עלמכוניה בלתמוט עולם ועד תהום כלבוש כסיתו עלהרים יעמדו מים מןגערתך ינוסון מןקול רעמך יחפזון יעלו הרים ירדו בקעות אלמקום זה יסדת להם גבולשמת בליעברון בלישבון לכסות הארץ המשלח מעינים בנחלים בין הרים יהלכון ישקו כלחיתו שדי ישברו פראים צמאם עליהם עוףהשמים ישכון מבין עפאים יתנוקול משקה הרים מעליותיו מפרי מעשיך תשבע הארץ מצמיח חציר לבהמה ועשב לעבדת האדם להוציא לחם מןהארץ ויין ישמח לבבאנוש להצהיל פנים משמן ולחם לבבאנוש יסעד ישבעו עצי יהוה ארזי לבנון אשר נטע אשרשם צפרים יקננו חסידה ברושים ביתה הרים הגבהים ליעלים סלעים מחסה לשפנים עשה ירח למועדים שמש ידע מבואו תשתחשך ויהי לילה בותרמש כלחיתויער הכפירים שאגים לטרף ולבקש מאל אכלם תזרח השמש יאספון ואלמעונתם ירבצון יצא אדם לפעלו ולעבדתו עדיערב מהרבו מעשיך יהוה כלם בחכמה עשית מלאה הארץ קנינך זה הים גדול ורחב ידים שםרמש ואין מספר חיות קטנות עםגדלות שם אניות יהלכון לויתן זהיצרת לשחקבו כלם אליך ישברון לתת אכלם בעתו תתן להם ילקטון תפתח ידך ישבעון טוב תסתיר פניך יבהלון תסף רוחם יגועון ואלעפרם ישובון תשלח רוחך יבראון ותחדש פני אדמה יהי כבוד יהוה לעולם ישמח יהוה במעשיו המביט לארץ ותרעד יגע בהרים ויעשנו אשירה ליהוה בחיי אזמרה לאלהי בעודי יערב עליו שיחי אנכי אשמח ביהוה יתמו חטאים מןהארץ ורשעים עוד אינם ברכי נפשי אתיהוה הללויה פ", "105": "הודו ליהוה קראו בשמו הודיעו בעמים עלילותיו שירולו זמרולו שיחו בכלנפלאותיו התהללו בשם קדשו ישמח לב מבקשי יהוה דרשו יהוה ועזו בקשו פניו תמיד זכרו נפלאותיו אשרעשה מפתיו ומשפטיפיו זרע אברהם עבדו בני יעקב בחיריו הוא יהוה אלהינו בכלהארץ משפטיו זכר לעולם בריתו דבר צוה לאלף דור אשר כרת אתאברהם ושבועתו לישחק ויעמידה ליעקב לחק לישראל ברית עולם לאמר לך אתן אתארץכנען חבל נחלתכם בהיותם מתי מספר כמעט וגרים בה ויתהלכו מגוי אלגוי מממלכה אלעם אחר לאהניח אדם לעשקם ויוכח עליהם מלכים אלתגעו במשיחי ולנביאי אלתרעו ויקרא רעב עלהארץ כלמטהלחם שבר שלח לפניהם איש לעבד נמכר יוסף ענו בכבל רגליו רגלו ברזל באה נפשו עדעת באדברו אמרת יהוה צרפתהו שלח מלך ויתירהו משל עמים ויפתחהו שמו אדון לביתו ומשל בכלקנינו לאסר שריו בנפשו וזקניו יחכם ויבא ישראל מצרים ויעקב גר בארץחם ויפר אתעמו מאד ויעצמהו מצריו הפך לבם לשנא עמו להתנכל בעבדיו שלח משה עבדו אהרן אשר בחרבו שמובם דברי אתותיו ומפתים בארץ חם שלח חשך ויחשך ולאמרו את דברו דבריו הפך אתמימיהם לדם וימת אתדגתם שרץ ארצם צפרדעים בחדרי מלכיהם אמר ויבא ערב כנים בכלגבולם נתן גשמיהם ברד אש להבות בארצם ויך גפנם ותאנתם וישבר עץ גבולם אמר ויבא ארבה וילק ואין מספר ויאכל כלעשב בארצם ויאכל פרי אדמתם ויך כלבכור בארצם ראשית לכלאונם ויוציאם בכסף וזהב ואין בשבטיו כושל שמח מצרים בצאתם כינפל פחדם עליהם פרש ענן למסך ואש להאיר לילה שאל ויבא שלו ולחם שמים ישביעם פתח צור ויזובו מים הלכו בציות נהר כיזכר אתדבר קדשו אתאברהם עבדו ויוצא עמו בששון ברנה אתבחיריו ויתן להם ארצות גוים ועמל לאמים יירשו בעבור ישמרו חקיו ותורתיו ינצרו הללויה פ", "106": "הללו יה הודו ליהוה כיטוב כי לעולם חסדו מי ימלל גבורות יהוה ישמיע כלתהלתו אשרי שמרי משפט עשה צדקה בכלעת זכרני יהוה ברצון עמך פקדני בישועתך לראות בטובת בחיריך לשמח בשמחת גויך להתהלל עםנחלתך חטאנו עםאבותינו העוינו הרשענו אבותינו במצרים לאהשכילו נפלאותיך לא זכרו אתרב חסדיך וימרו עלים ביםסוף ויושיעם למען שמו להודיע אתגבורתו ויגער ביםסוף ויחרב ויוליכם בתהמות כמדבר ויושיעם מיד שונא ויגאלם מיד אויב ויכסומים צריהם אחד מהם לא נותר ויאמינו בדבריו ישירו תהלתו מהרו שכחו מעשיו לאחכו לעצתו ויתאוו תאוה במדבר וינסואל בישימון ויתן להם שאלתם וישלח רזון בנפשם ויקנאו למשה במחנה לאהרן קדוש יהוה תפתחארץ ותבלע דתן ותכס עלעדת אבירם ותבעראש בעדתם להבה תלהט רשעים יעשועגל בחרב וישתחוו למסכה וימירו אתכבודם בתבנית שור אכל עשב שכחו אל מושיעם עשה גדלות במצרים נפלאות בארץ חם נוראות עליםסוף ויאמר להשמידם לולי משה בחירו עמד בפרץ לפניו להשיב חמתו מהשחית וימאסו בארץ חמדה לאהאמינו לדברו וירגנו באהליהם לא שמעו בקול יהוה וישא ידו להם להפיל אותם במדבר ולהפיל זרעם בגוים ולזרותם בארצות ויצמדו לבעל פעור ויאכלו זבחי מתים ויכעיסו במעלליהם ותפרץבם מגפה ויעמד פינחס ויפלל ותעצר המגפה ותחשב לו לצדקה לדר ודר עדעולם ויקציפו עלמי מריבה וירע למשה בעבורם כיהמרו אתרוחו ויבטא בשפתיו לאהשמידו אתהעמים אשר אמר יהוה להם ויתערבו בגוים וילמדו מעשיהם ויעבדו אתעצביהם ויהיו להם למוקש ויזבחו אתבניהם ואתבנותי
