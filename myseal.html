<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>חותמות ותהילים</title>
</head>
<body class="dashboard-body">
    <div class="container">
        <h1 class="gold-title">חותמות ותהילים</h1>
        
        <div class="card">
            <h3>הפסוק האישי שלך</h3>
            <div id="psalmOutput">
                <button class="real-gold-btn-small" onclick="findPsalm()">גלה פסוק מהספר המלא</button>
            </div>
        </div>

        <div class="card">
            <h3>מזל היום</h3>
            <div id="dayInfo">
                <p id="dayName"></p>
                <p id="dayLeader"></p>
            </div>
        </div>

        <button onclick="location.href='index.html'" class="real-gold-btn" style="margin-top:20px; width:100%;">חזרה להיכל</button>
    </div>

    <script src="logic.js"></script>
    <script>
        // הפעלה ראשונית של נתוני היום
        window.onload = () => {
            const days = ['ראשון - אברהם (חסד)', 'שני - יצחק (גבורה)', 'שלישי - יעקב (תפארת)', 'רביעי - משה (נצח)', 'חמישי - אהרן (הוד)', 'שישי - יוסף (יסוד)', 'שבת - דוד (מלכות)'];
            document.getElementById('dayName').innerText = days[new Date().getDay()];
        };
    </script>
<script src="library.js"></script>
</body>
</html>
