<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>היכל החכמה</title>
</head>
<body class="calc-page">

<!-- תפריט צד -->
<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
<div class="side-menu" id="sideMenu">
  <div class="side-menu-header">
    ✦ היכל החכמה
    <button class="side-menu-close" onclick="closeMenu()">✕</button>
  </div>
  <div class="menu-section">
    <div class="menu-section-title">מחשבוני נומרולוגיה</div>
    <button class="menu-item" onclick="showPage('numerology')">✦ מערכת ייעוץ נומרולוגית</button>
    <button class="menu-item disabled">גורל החולה <span class="soon">בקרוב</span></button>
    <button class="menu-item disabled">גורל הזיווג <span class="soon">בקרוב</span></button>
    <button class="menu-item disabled">גורל המעוברת <span class="soon">בקרוב</span></button>
    <button class="menu-item disabled">גורל החול <span class="soon">בקרוב</span></button>
  </div>
  <div class="menu-section">
    <div class="menu-section-title">תהילים וגימטריה</div>
    <button class="menu-item" onclick="showPage('psalms')">📖 מחשבון פרק התהילים האישי</button>
    <button class="menu-item" onclick="showPage('gematria')">🔢 מחשבון גימטריה</button>
  </div>
  <div class="menu-section">
    <div class="menu-section-title">כלים נוספים</div>
    <button class="menu-item" onclick="showPage('diary')">📅 יומן לקוחות</button>
    <button class="menu-item disabled">🗺 מפה אסטרולוגית <span class="soon">בקרוב</span></button>
    <button class="menu-item disabled">🙏 מקבץ תפילות <span class="soon">בקרוב</span></button>
  </div>
  <div class="menu-section">
    <button class="menu-item" onclick="location.href='index.html'">🚪 יציאה</button>
  </div>
</div>

<!-- פס עליון -->
<div class="top-bar">
  <button class="menu-btn" onclick="openMenu()">☰ תפריט</button>
  <div class="top-bar-title">✦ היכל החכמה</div>
  <div class="top-bar-time" id="topTime"></div>
</div>

<!-- דף ריק - ברירת מחדל -->
<div id="page-home" class="dashboard-container" style="text-align:center; padding-top:120px;">
  <div style="color:var(--gold-dark);font-size:2.5rem;">✦</div>
  <div style="color:var(--muted);font-size:1rem;margin-top:12px;">בחר כלי מהתפריט</div>
</div>

<!-- דף נומרולוגיה -->
<div id="page-numerology" class="dashboard-container fade-in" style="display:none">
  <h1 class="gold-title">מערכת ייעוץ נומרולוגית</h1>
  <div class="card">
    <div class="card-title"><span class="badge">א</span> פרטים אישיים</div>
    <label>שם פרטי</label>
    <input type="text" id="userName" placeholder="שם פרטי...">
    <label>שם משפחה</label>
    <input type="text" id="userLastName" placeholder="שם משפחה...">
    <label>תאריך לידה</label>
    <input type="date" id="birthDate">
    <button class="btn btn-gold" onclick="runAnalysis()">נתח נתונים ←</button>
    <button class="btn btn-clear" onclick="clearNumerology()">🗑 נקה</button>
  </div>
  <div id="output"></div>
</div>

<!-- דף תהילים -->
<div id="page-psalms" class="dashboard-container fade-in" style="display:none">
  <h1 class="gold-title">📖 מחשבון פרק התהילים האישי</h1>
  <div style="text-align:center;color:var(--muted);padding:40px;">בקרוב...</div>
</div>

<!-- דף גימטריה -->
<div id="page-gematria" class="dashboard-container fade-in" style="display:none">
  <h1 class="gold-title">🔢 מחשבון גימטריה</h1>
  <div style="text-align:center;color:var(--muted);padding:40px;">בקרוב...</div>
</div>

<!-- דף יומן -->
<div id="page-diary" class="dashboard-container fade-in" style="display:none">
  <h1 class="gold-title">📅 יומן לקוחות</h1>
  <div class="datetime-bar">
    <div class="date-big" id="diaryDate"></div>
    <div class="time-big" id="diaryTime"></div>
  </div>
  <div class="card">
    <div class="card-title">הוספת פגישה</div>
    <label>שם לקוח</label>
    <input type="text" id="apptName" placeholder="שם הלקוח...">
    <label>תאריך</label>
    <input type="date" id="apptDate">
    <label>שעה</label>
    <input type="time" id="apptTime">
    <label>הערות</label>
    <input type="text" id="apptNote" placeholder="הערות...">
    <button class="btn btn-gold" onclick="addAppt()">+ הוסף פגישה</button>
  </div>
  <div class="card">
    <div class="card-title">פגישות קרובות</div>
    <div id="apptList"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="library.js"></script>
<script src="logic.js"></script>
<script>
function updateClock() {
  const now = new Date();
  const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const d = now.toLocaleDateString('he-IL');
  const t = now.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('topTime').textContent = 'יום '+days[now.getDay()]+' | '+d+' | '+t;
  const dd = document.getElementById('diaryDate');
  const dt = document.getElementById('diaryTime');
  if(dd) dd.textContent = 'יום '+days[now.getDay()]+', '+d;
  if(dt) dt.textContent = t;
}
setInterval(updateClock,1000); updateClock();

function openMenu() {
  document.getElementById('sideMenu').classList.add('open');
  document.getElementById('menuOverlay').classList.add('open');
}
function closeMenu() {
  document.getElementById('sideMenu').classList.remove('open');
  document.getElementById('menuOverlay').classList.remove('open');
}

function showPage(name) {
  document.querySelectorAll('.dashboard-container').forEach(p=>p.style.display='none');
  document.getElementById('page-'+name).style.display='block';
  document.querySelectorAll('.menu-item').forEach(b=>b.classList.remove('active'));
  closeMenu();
}

function clearNumerology() {
  document.getElementById('userName').value='';
  document.getElementById('birthDate').value='';
  document.getElementById('output').innerHTML='';
}

function loadAppts() {
  const appts = JSON.parse(localStorage.getItem('appts')||'[]');
  const list = document.getElementById('apptList');
  if(!list) return;
  if(appts.length===0){list.innerHTML='<div style="color:var(--muted);text-align:center;padding:16px;">אין פגישות עדיין</div>';return;}
  appts.sort((a,b)=>(a.date+a.time)>(b.date+b.time)?1:-1);
  list.innerHTML=appts.map((a,i)=>'<div class="appt-item"><div class="appt-info"><div class="appt-name">'+a.name+'</div><div class="appt-time">'+a.date+' | '+a.time+(a.note?' | '+a.note:'')+'</div></div><button class="appt-del" onclick="delAppt('+i+')">מחק</button></div>').join('');
}

function addAppt() {
  const name=document.getElementById('apptName').value.trim();
  const date=document.getElementById('apptDate').value;
  const time=document.getElementById('apptTime').value;
  const note=document.getElementById('apptNote').value.trim();
  if(!name||!date||!time) return alert('מלא שם, תאריך ושעה');
  const appts=JSON.parse(localStorage.getItem('appts')||'[]');
  appts.push({name,date,time,note});
  localStorage.setItem('appts',JSON.stringify(appts));
  document.getElementById('apptName').value='';
  document.getElementById('apptDate').value='';
  document.getElementById('apptTime').value='';
  document.getElementById('apptNote').value='';
  loadAppts();
}

function delAppt(i) {
  const appts=JSON.parse(localStorage.getItem('appts')||'[]');
  appts.splice(i,1);
  localStorage.setItem('appts',JSON.stringify(appts));
  loadAppts();
}

loadAppts();
</script>
</body>
</html>
