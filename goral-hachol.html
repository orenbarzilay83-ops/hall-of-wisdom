<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>גורל החול — ממשק חדש</title>

  <script src="./raml-data/raml-forms-basic.js?v=clean-ui-1"></script>
  <script src="./raml-data/raml-houses-basic.js?v=clean-ui-1"></script>
  <script src="./raml.js?v=clean-ui-1"></script>

  <style>
    :root {
      --navy:#06192d;
      --navy2:#0d2a49;
      --gold:#d8aa45;
      --gold2:#f2d27b;
      --paper:#fffaf0;
      --paper2:#f7eedc;
      --ink:#101010;
      --line:#111;
      --muted:#6d6250;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      direction:rtl;
      font-family: Arial, sans-serif;
      background:linear-gradient(135deg,#06192d,#0a1424);
      color:var(--ink);
    }

    .app {
      max-width:980px;
      margin:0 auto;
      min-height:100vh;
      background:linear-gradient(180deg,var(--paper),var(--paper2));
      box-shadow:0 0 35px rgba(0,0,0,.35);
    }

    .topbar {
      height:68px;
      background:linear-gradient(90deg,var(--navy),var(--navy2));
      color:var(--gold2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      position:sticky;
      top:0;
      z-index:20;
    }

    .topbar h1 {
      margin:0;
      font-size:25px;
      font-weight:900;
    }

    .icon-btn {
      border:0;
      background:transparent;
      color:var(--gold2);
      font-size:28px;
      cursor:pointer;
      padding:8px 10px;
    }

    .screen {
      display:none;
      padding:26px;
    }

    .screen.active { display:block; }

    .panel {
      border:1px solid rgba(216,170,69,.45);
      border-radius:18px;
      background:rgba(255,255,255,.72);
      padding:22px;
      box-shadow:0 14px 30px rgba(0,0,0,.08);
    }

    h2 {
      margin:0 0 18px;
      color:#071b30;
      border-bottom:1px solid rgba(216,170,69,.6);
      padding-bottom:10px;
      font-size:25px;
    }

    .form-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }

    .full { grid-column:1 / -1; }

    label {
      display:block;
      margin-bottom:6px;
      font-weight:800;
      color:#1e2a36;
    }

    input, textarea, select {
      width:100%;
      border:1px solid rgba(0,0,0,.18);
      border-radius:13px;
      background:white;
      padding:13px;
      font-size:17px;
      color:#111;
    }

    textarea {
      min-height:90px;
      resize:vertical;
    }

    .actions {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:18px;
    }

    .btn {
      border:1px solid rgba(216,170,69,.5);
      border-radius:14px;
      padding:15px;
      font-weight:900;
      font-size:16px;
      cursor:pointer;
      background:#fff4d8;
      color:#071b30;
    }

    .btn.primary {
      background:linear-gradient(180deg,#0d2a49,#06192d);
      color:var(--gold2);
      border:0;
    }

    .btn.gray {
      background:#f4f4f4;
      color:#333;
      border:1px solid rgba(0,0,0,.16);
    }

    .mother-slots {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-bottom:18px;
    }

    .mother-slot {
      border:1px dashed rgba(0,0,0,.3);
      border-radius:14px;
      min-height:74px;
      display:grid;
      place-items:center;
      text-align:center;
      background:white;
      font-weight:700;
      cursor:pointer;
      padding:8px;
    }

    .mother-slot.active {
      border:2px solid var(--gold);
      box-shadow:0 0 0 4px rgba(216,170,69,.18);
    }

    .mother-slot.filled {
      background:rgba(255,245,205,.72);
    }

    .figure-grid {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      border:1px solid rgba(0,0,0,.35);
      border-radius:16px;
      overflow:hidden;
      background:white;
    }

    .figure-card {
      min-height:135px;
      border:0;
      border-left:1px solid rgba(0,0,0,.24);
      border-bottom:1px solid rgba(0,0,0,.24);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      position:relative;
      background:#fffaf0;
      cursor:pointer;
      padding:8px;
      color:#111;
    }

    .figure-card.selected {
      outline:3px solid var(--gold);
      outline-offset:-3px;
      background:#fff2cc;
    }

    .figure-card.selected::after {
      content:"✓";
      position:absolute;
      top:9px;
      right:9px;
      width:26px;
      height:26px;
      border-radius:50%;
      background:var(--gold2);
      color:#071b30;
      display:grid;
      place-items:center;
      font-weight:900;
    }

    .figure-card.other-selected {
      outline:1px dashed #aaa;
      outline-offset:-2px;
      background:#f5f5f5;
      opacity:0.72;
    }

    .other-slot-badge {
      font-size:10px;
      color:#888;
      margin-top:-2px;
    }

    .glyph {
      width:58px;
      display:grid;
      grid-template-rows:repeat(4,13px);
      gap:7px;
      justify-items:center;
      align-items:center;
    }

    .one {
      width:9px;
      height:9px;
      background:#111;
      border-radius:50%;
    }

    .two {
      width:38px;
      height:7px;
      background:#111;
      border-radius:99px;
    }

    .figure-name {
      font-weight:900;
      font-size:16px;
    }

    .board {
      border:2px solid var(--line);
      background:white;
      max-width:860px;
      margin:0 auto;
      direction:rtl;
    }

    .board-row {
      display:grid;
      border-bottom:2px solid var(--line);
      direction:rtl;
    }

    .board-row.r1 { grid-template-columns:repeat(8,1fr); }
    .board-row.r2 { grid-template-columns:repeat(4,1fr); }
    .board-row.r3 { grid-template-columns:repeat(2,1fr); border-bottom:0; }

    .house {
      min-height:132px;
      border-left:1px solid var(--line);
      padding:8px 5px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:6px;
      background:white;
      position:relative;
    }

    .house.dhamir-house {
      background: #fffbea;
      outline: 2px solid #c8a200;
      outline-offset: -2px;
    }

    .house.dhamir-house::before {
      content: "ض";
      position: absolute;
      top: 3px;
      left: 4px;
      font-size: 11px;
      font-weight: 900;
      color: #c8a200;
      background: #fff8cc;
      border-radius: 3px;
      padding: 1px 3px;
      line-height: 1;
    }

    .house:last-child { border-left:0; }

    .dhamir-legend {
      text-align: center;
      font-size: 13px;
      color: #8a6d00;
      background: #fffbea;
      border: 1px solid #e8d870;
      border-radius: 6px;
      padding: 6px 12px;
      margin: 8px auto 0;
      max-width: 860px;
    }

    .house-title {
      font-weight:900;
      font-size:16px;
    }

    .house-name {
      color:#555;
      font-size:13px;
      min-height:18px;
    }

    .final-row {
      max-width:860px;
      margin:22px auto 0;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:22px;
      direction:rtl;
    }

    .final-box {
      border:2px solid var(--line);
      background:white;
      min-height:150px;
    }

    .final-box .house {
      border-left:0;
      min-height:150px;
    }

    .summary-box {
      margin-top:18px;
      background:var(--navy);
      color:#f8f2e5;
      border-radius:20px;
      padding:18px;
      white-space:pre-wrap;
      line-height:1.7;
      font-size:16px;
    }

    .verdict-box {
      margin-top:20px;
      border-radius:20px;
      padding:22px 24px;
      text-align:center;
      border:3px solid transparent;
    }
    .verdict-box.verdict-yes {
      background:#1a3d1a;
      border-color:#4caf50;
      color:#a8f0a0;
    }
    .verdict-box.verdict-no {
      background:#3d1a1a;
      border-color:#e53935;
      color:#f4a0a0;
    }
    .verdict-box.verdict-maybe {
      background:#3d3000;
      border-color:#ffb300;
      color:#ffe082;
    }
    .verdict-box.verdict-mixed {
      background:#1a2a3a;
      border-color:#78909c;
      color:#b0c4d8;
    }
    .verdict-label {
      font-size:13px;
      opacity:0.75;
      margin-bottom:6px;
      letter-spacing:0.05em;
    }
    .verdict-answer {
      font-size:28px;
      font-weight:900;
      margin-bottom:10px;
    }
    .verdict-detail {
      font-size:14px;
      line-height:1.6;
      opacity:0.9;
      white-space:pre-wrap;
    }

    .board-info-row {
      margin-top:10px;
      border-radius:12px;
      padding:10px 16px;
      font-size:15px;
      line-height:1.6;
      direction:rtl;
    }
    .board-score-ok {
      background:#1a3d1a;
      border:2px solid #4caf50;
      color:#a8f0a0;
    }
    .board-score-warn {
      background:#3d2800;
      border:2px solid #ff9800;
      color:#ffe0a0;
    }
    .board-dhamir {
      background:#1a2a3a;
      border:2px solid #5c9fc7;
      color:#c8e0f4;
    }

    .error {
      margin-top:14px;
      padding:12px 14px;
      background:#ffe9e4;
      color:#8c2118;
      border:1px solid #e2a39a;
      border-radius:14px;
      display:none;
      white-space:pre-wrap;
    }

    .note {
      margin-top:14px;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }

    @media (max-width:800px) {
      .screen { padding:16px; }
      .form-grid, .actions, .mother-slots { grid-template-columns:1fr; }
      .figure-grid { grid-template-columns:repeat(2,1fr); }
      .board-row.r1 { grid-template-columns:repeat(4,1fr); }
      .final-row { grid-template-columns:1fr; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" onclick="location.href='calculator.html'">←</button>
      <h1>גורל החול</h1>
      <div style="width:40px;"></div>
    </header>

    <section id="screen-open" class="screen active">
      <div class="panel">
        <h2>עמוד פתיחה</h2>

        <div class="form-grid">

          </div>

          <div>

          <div class="full">

          <div class="full">
            <label>נושא השאלה</label>
            <select id="questionTopicInput">
              <option value="">בחר נושא שאלה</option>

              <option value="spiritualDiagnostics">אבחון רוחני / עין / כישוף</option>
              <option value="illness">חולה / מחלה</option>
              <option value="travel">נסיעה</option>
              <option value="missingPerson">נעדר / גאיב</option>
              <option value="childrenPregnancy">ילדים / הריון</option>
              <option value="commerce">מסחר / קנייה ומכירה</option>
              <option value="disputes">סכסוך / תביעה</option>
              <option value="enemies">אויב / אויבות</option>
              <option value="fear">פחד / סכנה</option>
              <option value="loveHate">אהבה ושנאה</option>
              <option value="completion">האם הדבר יצליח / יושלם</option>
              <option value="hiddenTreasure">מטמון / דבר חבוי</option>
              <option value="authorityState">שלטון / סמכות</option>
              <option value="yearlyForecast">טאלע השנה / גשם / יוקר וזול</option>
              <option value="birthNativity">מולד / טבע האדם</option>
              <option value="general">כללי</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button class="btn" id="manualBtn" type="button">הכנסה ידנית של 4 האמהות</button>
          <button class="btn gray" id="autoBtn" type="button">בחירה אוטומטית לפי עצירה</button>
          <button class="btn gray" id="clearBtn" type="button">נקה טופס</button>
          <button class="btn primary" id="startBtn" type="button">התחל</button>
        </div>
      </div>
    </section>

    <section id="screen-select" class="screen">
      <div class="panel">
        <h2>בחירת 4 צורות ראשונות</h2>

        <div id="motherSlots" class="mother-slots"></div>
        <div id="figureGrid" class="figure-grid"></div>

        <div class="actions">
          <button class="btn gray" id="backOpenBtn" type="button">חזרה</button>
          <button class="btn gray" id="clearSelectionBtn" type="button">נקה בחירה</button>
          <button class="btn primary" id="buildBoardBtn" type="button">המשך ללוח הגורל</button>

        <div class="note">הסימון ✓ מציין צורה שכבר נבחרה.</div>

    <section id="screen-board" class="screen">

          <button class="btn gray" id="clearArchiveBtn" type="button">נקה ארכיון</button>
        </div>
      </div>
    </section>
  </div>

  <script type="module">

      import('/goral-hachol/engine/hawi-interpreter.js'),

      };

      window.GORAL_CLIENT_ARCHIVE = {
        getGoralArchive: archive.getGoralArchive,
        saveGoralReadingToArchive: archive.saveGoralReadingToArchive,
        deleteGoralArchiveRecord: archive.deleteGoralArchiveRecord,
        clearGoralArchive: archive.clearGoralArchive,
        summarizeGoralClientHistory: archive.summarizeGoralClientHistory
      };

      console.log("✅ HAWI modules loaded successfully!");
      console.log("window.HAWI_INTERPRETER:", window.HAWI_INTERPRETER);
      console.log("window.GORAL_CLIENT_ARCHIVE:", window.GORAL_CLIENT_ARCHIVE);

      console.log("✅ HAWI modules loaded successfully!");
      console.log("window.HAWI_INTERPRETER:", window.HAWI_INTERPRETER);
      console.log("window.GORAL_CLIENT_ARCHIVE:", window.GORAL_CLIENT_ARCHIVE);

      return false;
    });

  <script>
    const FIGURE_ORDER = [
      "1222", "2122", "1122", "2212",
      "1212", "2112", "1112", "2221",
      "1221", "2121", "1121", "2211",
      "1211", "2111", "1111", "2222"
    ];

    let selectedMothers = [null, null, null, null];
    let activeMother = 0;

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function linesFromKey(key) {
      return String(key).split("").map(Number);
    }

    function getFiguresForPicker() {
      const forms = window.RAML_FORMS_BASIC || {};
      return FIGURE_ORDER.map(key => {
        const item = forms[key] || {};
        return {
          id: `raml-${key}`,
          key,
          name: item.hebrew || key,
          arabic: item.arabic || "",
          statusHebrew: item.statusHebrew || "",
          lines: linesFromKey(key)
        };
      });
    }

    const figures = getFiguresForPicker();

    function glyphHtml(lines) {
      return `
        <div class="glyph">
          ${lines.map(v => `<div class="${Number(v) === 1 ? "one" : "two"}"></div>`).join("")}
        </div>
      `;
    }

    function showScreen(name) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById("screen-" + name)?.classList.add("active");
      window.scrollTo({ top:0, behavior:"smooth" });
    }

    function renderMotherSlots() {
      const box = document.getElementById("motherSlots");
      box.innerHTML = selectedMothers.map((fig, index) => `
        <button type="button"
          class="mother-slot ${index === activeMother ? "active" : ""} ${fig ? "filled" : ""}"
          data-index="${index}">
          <div>
            <div style="font-weight:900;">אם ${index + 1}</div>
            <div style="margin-top:4px;">${fig ? escapeHtml(fig.name) : "טרם נבחר"}</div>
          </div>
        </button>
      `).join("");

      box.querySelectorAll(".mother-slot").forEach(btn => {
        btn.addEventListener("click", () => {
          activeMother = Number(btn.dataset.index);
          renderMotherSlots();
          renderFigureGrid();
        });
      });
    }

    function renderFigureGrid() {
      const grid = document.getElementById("figureGrid");
      grid.innerHTML = figures.map((fig, index) => {
        const isCurrentSlot = selectedMothers[activeMother] && selectedMothers[activeMother].key === fig.key;
        const isOtherSlot = !isCurrentSlot && selectedMothers.some((m, i) => i !== activeMother && m && m.key === fig.key);
        const slotNum = isOtherSlot
          ? selectedMothers.findIndex((m, i) => i !== activeMother && m && m.key === fig.key) + 1
          : null;
        return `
          <button type="button" class="figure-card ${isCurrentSlot ? "selected" : isOtherSlot ? "other-selected" : ""}" data-index="${index}">
            ${glyphHtml(fig.lines)}
            <div class="figure-name">${escapeHtml(fig.name)}</div>
            ${isOtherSlot && slotNum ? `<div class="other-slot-badge">אם ${slotNum}</div>` : ""}
          </button>
        `;
      }).join("");

      grid.querySelectorAll(".figure-card").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedMothers[activeMother] = figures[Number(btn.dataset.index)];
          if (activeMother < 3) activeMother++;
          renderMotherSlots();
          renderFigureGrid();
        });
      });
    }

    function getClientContext() {
      return {
        clientName: document.getElementById("clientNameInput").value.trim(),
        parentName: document.getElementById("clientParentInput").value.trim(),
        questionDate: document.getElementById("questionDateInput").value.trim(),
        questionTime: document.getElementById("questionTimeInput").value.trim(),
        consultationContext: "",
        topicOverride: document.getElementById("questionTopicInput").value
      };
    }

    function houseName(number) {
      const h = (window.RAML_HOUSES_BASIC || {})[number] || {};
      return h.hebrew || "";
    }

    function figNameFromReadingHouse(house) {
      return house.hebrew || house.figureHebrew || house.name || "";
    }

    function computeDhamirHouseNumber(chart) {
      // נהמת האמהות: שורה i מאם i (0-indexed) → צורת הדמיר
      const rows = [];
      for (let i = 1; i <= 4; i++) {
        const m = chart.find(x => Number(x.house) === i);
        const key = m?.key ? String(m.key) : null;
        if (!key || key.length < 4) return null;
        rows.push(key[i - 1]);
      }
      const targetPattern = rows.join('');
      const entry = chart.find(x => x.key === targetPattern);
      return entry ? Number(entry.house) : null;
    }

    function houseHtml(h, label, isDhamir) {
      return `
        <div class="house${isDhamir ? ' dhamir-house' : ''}">
          <div class="house-title">${label}</div>
          <div class="house-name">${escapeHtml(h.houseHebrew || houseName(h.house))}</div>
          ${glyphHtml(h.figure)}
          <div class="figure-name">${escapeHtml(figNameFromReadingHouse(h))}</div>
        </div>
      `;
    }

    function buildBoardHtml(reading) {
      const h = n => reading.chart.find(x => Number(x.house) === Number(n));
      const dhamirHouseNum = computeDhamirHouseNumber(reading.chart);

      const d = n => n === dhamirHouseNum;

      return `
        <article class="board">
          <div class="board-row r1">
            ${[1,2,3,4,5,6,7,8].map(n => houseHtml(h(n), `${n} — ${n <= 4 ? "אם" : "בת"}`, d(n))).join("")}
          </div>

          <div class="board-row r2">
            ${[9,10,11,12].map(n => houseHtml(h(n), `${n} — נכדה`, d(n))).join("")}
          </div>

          <div class="board-row r3">
            ${houseHtml(h(13), "13 — עד ראשון", d(13))}
            ${houseHtml(h(14), "14 — עד שני", d(14))}
          </div>
        </article>

        <div class="final-row">
          <div class="final-box">
            ${houseHtml(h(16), "16 — משלים", d(16))}
          </div>
          <div class="final-box">
            ${houseHtml(h(15), "15 — דיין", d(15))}
          </div>
        </div>
        ${dhamirHouseNum ? `<div class="dhamir-legend">ض = בית הדמיר (בית ${dhamirHouseNum}) — הצורה שכל שאר הצורות מעידות עליה</div>` : ""}
      `;
    }

    function verdictClass(verdict) {
      if (!verdict) return "";
      if (verdict === "yes-strong" || verdict === "yes-weak") return "verdict-yes";
      if (verdict === "no-strong" || verdict === "no-weak") return "verdict-no";
      if (verdict === "maybe-positive" || verdict === "maybe-negative") return "verdict-maybe";
      return "verdict-mixed";
    }

    function buildInterpretationHtml(reading) {
      if (!window.HAWI_INTERPRETER?.interpretHawiQuestionInitial) {
        return `<div class="summary-box">אבחון גורל החול עדיין נטען. אם ההודעה נשארת, מנוע הידע לא נטען בדפדפן.</div>`;
      }

      if (window.GORAL_CLIENT_ARCHIVE?.summarizeGoralClientHistory) {
        const clientName = reading.clientContext?.clientName || "";
        reading.clientHistorySummary = window.GORAL_CLIENT_ARCHIVE.summarizeGoralClientHistory(clientName);
      }

      const insight = window.HAWI_INTERPRETER.interpretHawiQuestionInitial(reading.question, reading);
      window.__LAST_GORAL_READING = reading;
      window.__LAST_GORAL_INTERPRETATION = insight;

      const conclusion = insight.finalConclusionHebrew || insight.conclusionDraftHebrew || insight.technicalConclusionHebrew || "";
      const score = insight.boardScore || {};
      const judgeV = insight.judgeVerdict || score.judgeVerdict || null;
      const rules = Array.isArray(insight.relevantRules) ? insight.relevantRules.slice(0, 6) : [];
      const sources = Array.isArray(insight.knowledgeSources) ? insight.knowledgeSources.slice(0, 5) : [];
      const spiritual = insight.spiritualDiagnosis || null;
      const isSpiritualTopic = insight.topicId === "spiritualDiagnostics";
      // Only show spiritual section when explicitly spiritual topic,
      // or when the engine finds very strong suspicion (not just any score > 0)
      const showSpiritual =
        spiritual &&
        (
          isSpiritualTopic ||
          spiritual.grade === 'strong-suspicion'
        );

      // Board score + dhamir banner (before verdict)
      const boardScoreData = insight.boardAnalysis?.boardScore || null;
      const dhamirMizanData = insight.boardAnalysis?.dhamirByMizan || null;
      let boardInfoHtml = "";
      if (boardScoreData) {
        const scoreClass = boardScoreData.isComplete ? "board-score-ok" : "board-score-warn";
        boardInfoHtml += `<div class="board-info-row ${scoreClass}">📊 ${escapeHtml(boardScoreData.hebrewSummary)}</div>`;
      }
      if (dhamirMizanData && dhamirMizanData.traces && dhamirMizanData.traces.length > 0) {
        const traceText = dhamirMizanData.traces.map(t =>
          `שורת ${escapeHtml(t.rowElement)} → בית ${t.dhamirHouseNumber} (${escapeHtml(t.dhamirHebrew)}${t.dhamirFortune ? ', ' + t.dhamirFortune : ''})`
        ).join(' | ');
        boardInfoHtml += `<div class="board-info-row board-dhamir">🎯 הדמיר: ${traceText} — הדמיר העיקרי: בית ${dhamirMizanData.primaryHouseNumber}</div>`;
      }

      // Prominent verdict box
      let verdictHtml = "";
      if (isSpiritualTopic && spiritual?.grade) {
        const gradeMap = {
          "strong-suspicion": "כן — יש פגיעה רוחנית",
          "medium-suspicion": "ייתכן — חשד בינוני לפגיעה רוחנית",
          "weak-suspicion": "ספק — סימנים חלשים בלבד",
          "mostly-clear": "לא — אין פגיעה רוחנית",
          "mixed": "ממוזג — יש לבדוק עוד"
        };
        const verdictText = gradeMap[spiritual.grade] || spiritual.grade;
        const vClass = spiritual.grade === "strong-suspicion" ? "verdict-yes" :
                       spiritual.grade === "mostly-clear" ? "verdict-no" : "verdict-maybe";
        verdictHtml = `
          <div class="verdict-box ${vClass}">
            <div class="verdict-label">תשובה לשאלה</div>
            <div class="verdict-answer">${escapeHtml(verdictText)}</div>
            <div class="verdict-detail">${escapeHtml(spiritual.finalHebrew || "")}</div>
          </div>`;
      } else if (judgeV && judgeV.hebrewShort) {
        verdictHtml = `
          <div class="verdict-box ${escapeHtml(verdictClass(judgeV.verdict))}">
            <div class="verdict-label">תשובה לשאלה</div>
            <div class="verdict-answer">${escapeHtml(judgeV.hebrewShort)}</div>
            <div class="verdict-detail">${escapeHtml(judgeV.hebrewFull || "")}</div>
          </div>`;
      }

      const rulesHtml = rules.length
        ? `
          <div class="summary-box">
            <strong>חוקים שנבדקו מתוך המקור:</strong>
            <ul>
              ${rules.map(rule => `
                <li>
                  ${escapeHtml(rule.hebrew || rule.result || rule.condition || "")}
                  ${rule.arabic ? `<br/><small>${escapeHtml(rule.arabic)}</small>` : ""}
                </li>
              `).join("")}
            </ul>
          </div>
        `
        : "";

      const sourcesHtml = sources.length
        ? `
          <div class="summary-box">
            <strong>מקורות ידע שהופעלו:</strong>
            <ul>
              ${sources.map(src => `
                <li>${escapeHtml(src.titleHebrew || src.id || "")}</li>
              `).join("")}
            </ul>
          </div>
        `
        : "";

      const spiritualDetailHtml = showSpiritual
        ? `
          <div class="summary-box">
            <strong>${isSpiritualTopic ? "פרטי האבחון הרוחני:" : "אבחון רוחני נוסף:"}</strong>
            ${!isSpiritualTopic ? `<br/>${escapeHtml(spiritual.finalHebrew || "")}` : ""}
            ${Array.isArray(spiritual.mainReasons) && spiritual.mainReasons.length
              ? `<ul>${spiritual.mainReasons.filter(r => r.score > 0).slice(0, 6).map(reason => `
                  <li><strong>בית ${reason.house}</strong> (${escapeHtml(reason.role || "")})${reason.figureHebrew ? ` — ${escapeHtml(reason.figureHebrew)}` : ""}: ${escapeHtml((reason.signals || []).join(" "))}</li>
                `).join("")}</ul>`
              : (isSpiritualTopic ? "<p>לא נמצאו חוקים ספציפיים מהמקור. הפסיקה מבוססת על הדיין והעדים.</p>" : "")}
          </div>
        `
        : "";

      return `
        ${boardInfoHtml}

        ${verdictHtml}

        <div class="summary-box">
          <strong>מסקנה מפורטת:</strong><br/>
          ${escapeHtml(conclusion).replace(/\n/g, "<br/>")}
        </div>

        ${spiritualDetailHtml}
        ${rulesHtml}
        ${sourcesHtml}
      `;
    }

    async function runReading() {
      const errorBox = document.getElementById("errorBox");
      const boardResult = document.getElementById("boardResult");

      errorBox.style.display = "none";
      errorBox.textContent = "";

      try {
        if (selectedMothers.some(m => !m)) {
          throw new Error("צריך לבחור 4 אמהות לפני יצירת לוח הגורל.");
        }

        const question = document.getElementById("questionInput").value.trim();

        if (window.__HAWI_MODULE_READY) {
          await window.__HAWI_MODULE_READY;
        }

        const mothers = selectedMothers.map(m => m.lines);

        if (typeof window.ramlRunReading !== "function") {
          throw new Error("מנוע גורל החול לא נטען מתוך raml.js.");
        }

        const reading = window.ramlRunReading(question, mothers);
        reading.clientContext = getClientContext();

        boardResult.innerHTML = buildBoardHtml(reading) + buildInterpretationHtml(reading);
        showScreen("board");
      } catch (err) {
        errorBox.textContent = err.message || String(err);
        errorBox.style.display = "block";
        showScreen("board");
      }
    }

    function clearForm() {
      ["clientNameInput","clientParentInput","questionDateInput","questionTimeInput","questionInput","questionTopicInput"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });
      selectedMothers = [null,null,null,null];
      activeMother = 0;
      renderMotherSlots();
      renderFigureGrid();
    }

    document.getElementById("manualBtn").addEventListener("click", () => {
      renderMotherSlots();
      renderFigureGrid();
      showScreen("select");
    });

    document.getElementById("startBtn").addEventListener("click", () => {
      renderMotherSlots();
      renderFigureGrid();
      showScreen("select");
    });

    document.getElementById("autoBtn").addEventListener("click", () => {
      alert("בחירה אוטומטית לפי עצירה תיבנה בשלב הבא. כרגע משתמשים בהכנסה ידנית בלבד.");
    });

    document.getElementById("backOpenBtn").addEventListener("click", () => showScreen("open"));
    document.getElementById("backSelectBtn").addEventListener("click", () => showScreen("select"));
    document.getElementById("clearSelectionBtn").addEventListener("click", () => {
      selectedMothers = [null,null,null,null];
      activeMother = 0;
      renderMotherSlots();
      renderFigureGrid();
    });

    document.getElementById("buildBoardBtn").addEventListener("click", runReading);
    document.getElementById("clearBtn").addEventListener("click", clearForm);

    document.getElementById("archiveBtn").addEventListener("click", () => {
      alert("ארכיון הקריאות יחובר אחרי שהממשק החדש יאושר.");
    });

    document.getElementById("clearArchiveBtn").addEventListener("click", () => {
      alert("ניקוי ארכיון יחובר אחרי שהממשק החדש יאושר.");
    });

    clearForm();
  </script>
</body>
</html>
