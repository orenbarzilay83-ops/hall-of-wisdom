<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>גורל החול</title>
  <script src="./raml-data/raml-forms-basic.js"></script>
  <script src="./raml-data/raml-forms-profiles.js"></script>
  <script src="./raml-data/raml-houses-basic.js"></script>
  <script src="./raml-data/raml-houses-profiles.js"></script>
  <script src="./raml-data/raml-reading-foundations.js"></script>
  <script src="./raml-data/raml-foundation-qawl-jami-extra.js"></script>
  <script src="./raml-data/raml-foundation-closure-audit.js"></script>
  <script src="./raml-data/raml-foundation-bulugh-al-amal.js"></script>
  <script src="./raml-data/raml-spiritual-diagnostics.js"></script>
  <script src="./raml-data/raml-topic-rules.js"></script>
  <script src="./raml.js"></script>
  <style>
    :root {
      --bg: #f7f1e8;
      --paper: #fffaf2;
      --ink: #251c16;
      --muted: #7b6b5a;
      --gold: #b99032;
      --gold-soft: #e3c96e;
      --border: #2d251f;
      --line: rgba(45, 37, 31, 0.24);
      --dark: #171525;
      --good: #1f7a3a;
      --bad: #9b2d22;
      --mixed: #9a7418;
      --shadow: 0 18px 45px rgba(59, 43, 22, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Times New Roman", "Noto Serif Hebrew", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top, rgba(218, 184, 88, 0.22), transparent 30%),
        linear-gradient(180deg, #fbf7ef 0%, var(--bg) 100%);
    }

    .page {
      width: min(1180px, 94vw);
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 15px;
    }

    .brand {
      color: #8f6b1f;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .hero {
      text-align: center;
      margin-bottom: 22px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 46px);
      color: #8a681e;
      letter-spacing: .03em;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 18px;
    }

    .control-panel {
      background: rgba(255, 250, 242, 0.86);
      border: 1px solid rgba(185, 144, 50, 0.35);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr auto;
      gap: 14px;
      align-items: end;
    }

    label {
      display: block;
      font-weight: 800;
      color: #7c5c1b;
      margin-bottom: 7px;
      font-size: 15px;
    }

    .field-hint {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    input, textarea {
      width: 100%;
      border: 1px solid rgba(45, 37, 31, 0.22);
      border-radius: 14px;
      padding: 12px 14px;
      background: #fffdf8;
      color: var(--ink);
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }

    textarea {
      min-height: 96px;
      direction: ltr;
      text-align: left;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      line-height: 1.5;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 13px 22px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      color: #15120c;
      background: linear-gradient(135deg, #f3d86d, #b99032);
      box-shadow: 0 12px 25px rgba(185, 144, 50, 0.25);
      white-space: nowrap;
    }

    .reading-card {
      background: var(--paper);
      border: 3px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .reading-header {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      border-bottom: 3px solid var(--border);
    }

    .header-block {
      padding: 16px 18px;
      border-left: 2px solid var(--border);
    }

    .header-block:last-child { border-left: 0; }

    .header-title {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .header-value {
      font-size: 20px;
      font-weight: 900;
    }

    .shield {
      direction: rtl;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border-bottom: 3px solid var(--border);
    }

    .house {
      min-height: 190px;
      padding: 10px 8px;
      border-left: 2px solid var(--border);
      border-bottom: 2px solid var(--border);
      text-align: center;
      background: rgba(255, 255, 255, 0.32);
    }

    .house:nth-child(8n) { border-left: 0; }

    .house.wide {
      min-height: 210px;
    }

    .house-title {
      font-weight: 900;
      font-size: 15px;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .house-sub {
      color: var(--muted);
      font-size: 13px;
      min-height: 30px;
      margin-bottom: 8px;
    }

    .figure {
      width: 74px;
      margin: 0 auto 8px;
      display: grid;
      gap: 7px;
      padding: 7px 6px;
      border: 1px solid rgba(45, 37, 31, 0.18);
      background: rgba(255, 255, 255, 0.45);
    }

    .fig-line {
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #111111;
      display: inline-block;
    }

    .bar {
      width: 46px;
      height: 8px;
      border-radius: 999px;
      background: #111111;
      display: inline-block;
    }

    .figure-name {
      font-size: 16px;
      font-weight: 900;
      color: #6e5116;
    }

    .figure-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .middle-grid {
      direction: rtl;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 3px solid var(--border);
    }

    .witness-grid {
      direction: rtl;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 3px solid var(--border);
    }
.diagnosis {
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 16px;
      align-items: center;
      background: #fff7e8;
    }

    .diagnosis-title {
      font-size: 22px;
      font-weight: 900;
      color: #7c5c1b;
    }

    .diagnosis-text {
      font-size: 16px;
      line-height: 1.65;
      color: #3b3128;
    }

    
    .client-details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .client-details-grid input {
      width: 100%;
    }

    @media (max-width: 700px) {
      .client-details-grid {
        grid-template-columns: 1fr;
      }
    }


    .summary-box {
      margin-top: 18px;
      background: var(--dark);
      color: #f8f2e5;
      border-radius: 20px;
      padding: 18px;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 16px;
    }

    .error {
      margin-top: 14px;
      padding: 12px 14px;
      background: #ffe9e4;
      color: #8c2118;
      border: 1px solid #e2a39a;
      border-radius: 14px;
      display: none;
    }

    @media (max-width: 900px) {
      .control-grid {
        grid-template-columns: 1fr;
      }

      .reading-header,
      .diagnosis,
      .witness-grid {
        grid-template-columns: 1fr;
      }

      .shield {
        grid-template-columns: repeat(2, 1fr);
      }

      .middle-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .house:nth-child(8n) { border-left: 2px solid var(--border); }
      .house:nth-child(2n) { border-left: 0; }
    }
  
.back-main-menu-btn {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 9999;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 16px;
  border-radius: 999px;
  border: 1px solid rgba(153, 110, 28, 0.35);
  background: linear-gradient(135deg, #f2d37b, #c99b2e);
  color: #2d1b05;
  font-weight: 800;
  text-decoration: none;
  box-shadow: 0 10px 25px rgba(0,0,0,.16);
}

.back-main-menu-btn:hover {
  filter: brightness(1.03);
}

    .final-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 18px;
      align-items: start;
      direction: rtl;
    }

    .final-main {
      grid-column: 2 / 3;
    }

    .final-detached {
      grid-column: 1 / 2;
      max-width: 100%;
    }

    .final-detached .house {
      border: 2px solid rgba(20, 20, 20, 0.88);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.10);
      background: rgba(255, 255, 255, 0.92);
      min-height: 150px;
    }

    .final-main .house {
      min-height: 150px;
    }

    @media (max-width: 700px) {
      .final-area {
        grid-template-columns: 1fr;
      }

      .final-main,
      .final-detached {
        grid-column: auto;
      }
    }

  </style>
</head>
<body>
<a href="calculator.html" class="back-main-menu-btn">← חזרה לתפריט הראשי</a>
  <main class="page">
    <div class="topbar">
      <div id="dateLine"></div>
      <div class="brand">✦ היכל החכמה</div>
    </div>

    <section class="hero">
      <h1>✦ גורל החול</h1>
      <p>לוח תכת רמלי — אמהות, בנות, נכדות, עדים, שופט ומשפט</p>
    </section>

    <section class="control-panel">
      <div class="control-grid">
        <div>
          <label>שאלה</label>
          <div class="client-details-grid">
            <input id="clientNameInput" placeholder="שם הלקוח" />
            <input id="clientParentInput" placeholder="שם האב / האם אם ידוע" />
            <input id="clientAgeInput" placeholder="גיל / שלב חיים" />
            <input id="consultationContextInput" placeholder="רקע קצר: על מה האדם מבקש הכוונה?" />
          </div>

          <input id="questionInput" placeholder="כתוב כאן את שאלת גורל החול" />
        </div>

        <div>
          <label>ספירות נקודות — 4 שורות לכל אם</label>
          <textarea id="countsInput" placeholder="הזן כאן 4 שורות — בכל שורה 4 מספרים"></textarea>
          <div class="field-hint">
            דוגמה: כל שורה מייצגת אם אחת. בכל שורה כותבים 4 מספרים של ספירות נקודות.
          </div>
        </div>

        <button id="runBtn">✦ צור לוח</button>
        <button id="archiveBtn" type="button">ארכיון קריאות</button>
        <button id="clearArchiveBtn" type="button">נקה ארכיון</button>
      </div>

      <div class="error" id="errorBox"></div>
    </section>

    <section id="result"></section>
    <section id="archivePanel" class="summary-box" style="display:none;"></section>
  </main>

  <script type="module">
    import {
      interpretHawiQuestionInitial
    } from './goral-hachol/engine/hawi-interpreter.js';

    import {
      getGoralArchive,
      saveGoralReadingToArchive,
      deleteGoralArchiveRecord,
      clearGoralArchive,
      summarizeGoralClientHistory
    } from './goral-hachol/engine/goral-client-archive.js';

    window.HAWI_INTERPRETER = {
      interpretHawiQuestionInitial
    };

    window.GORAL_CLIENT_ARCHIVE = {
      getGoralArchive,
      saveGoralReadingToArchive,
      deleteGoralArchiveRecord,
      clearGoralArchive,
      summarizeGoralClientHistory
    };
  </script>

  <script>
    function todayLine() {
      const now = new Date();
      return new Intl.DateTimeFormat("he-IL", {
        weekday: "long",
        day: "numeric",
        month: "numeric",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(now);
    }

    function parseCounts(text) {
      const rows = String(text || "")
        .trim()
        .split(/\n+/)
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => line.split(/[\s,]+/).map(Number));

      if (rows.length !== 4) {
        throw new Error("צריך להזין בדיוק 4 שורות — שורה אחת לכל אם.");
      }

      for (const row of rows) {
        if (row.length !== 4 || row.some(n => !Number.isFinite(n) || n <= 0)) {
          throw new Error("כל שורה חייבת להכיל בדיוק 4 מספרים חיוביים.");
        }
      }

      return rows;
    }

    function figHtml(fig) {
      return `
        <div class="figure">
          ${fig.map(v => `
            <div class="fig-line">
              ${Number(v) === 1 ? '<span class="dot"></span>' : '<span class="bar"></span>'}
            </div>
          `).join("")}
        </div>
      `;
    }

    function houseHtml(h, labelOverride) {
      const label = labelOverride || `בית ${h.house}`;
      return `
        <div class="house">
          <div class="house-title">${label}</div>
          <div class="house-sub">${h.houseHebrew || ""}</div>
          ${figHtml(h.figure)}
          <div class="figure-name">${h.hebrew}</div>
          <div class="figure-meta">
            ${h.key}<br/>
            ${h.fortune || ""} · ${h.movement || ""} · יסוד ${h.element || ""}
          </div>
        </div>
      `;
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function hawiSourceInsightHtml(reading) {
      if (!window.HAWI_INTERPRETER || !window.HAWI_INTERPRETER.interpretHawiQuestionInitial) {
        return `
          <div class="summary-box">
            <strong>אבחון גורל החול:</strong><br/>
            שכבת הידע נטענת. אם זה נשאר כך, רענן את הדף.
          </div>
        `;
      }

      const insight = window.HAWI_INTERPRETER.interpretHawiQuestionInitial(reading.question, reading);
      const archiveSaveBox = saveCurrentReading(reading, insight);

      const sources = insight.knowledgeSources
        .map(s => `<li>${escapeHtml(s.id)} — ${escapeHtml(s.titleHebrew)}</li>`)
        .join("");

      const rules = insight.relevantRules.slice(0, 7)
        .map(rule => {
          const houses = rule.houses
            ? ` | בתים: ${rule.houses.join(", ")}`
            : rule.house
              ? ` | בית: ${rule.house}`
              : "";

          const page = rule.sourcePage ? ` | עמוד מקור: ${rule.sourcePage}` : "";
          const text = rule.hebrew || rule.result || rule.condition || rule.id || "כלל מקור";

          return `<li>${escapeHtml(text)}${escapeHtml(houses)}${escapeHtml(page)}</li>`;
        })
        .join("");

      const boardRows = insight.boardAnalysis && insight.boardAnalysis.hasBoard
        ? insight.boardAnalysis.houses.slice(0, 10).map(h => `
            <li>
              בית ${escapeHtml(h.house)} —
              ${escapeHtml(h.figureHebrew || "")}
              ${h.house === insight.boardAnalysis.focusHouseNumber ? " — בית מרכזי" : ""}
              ${h.house === 13 ? " — עד ראשון" : ""}
              ${h.house === 14 ? " — עד שני" : ""}
              ${h.house === 15 ? " — דיין" : ""}
              ${h.house === 16 ? " — משלים" : ""}
            </li>
          `).join("")
        : "";

      const reasons = insight.boardScore && insight.boardScore.reasons
        ? insight.boardScore.reasons.map(r => `<li>${escapeHtml(r)}</li>`).join("")
        : "";

      const spiritualBox = insight.spiritualDiagnosis && insight.spiritualDiagnosis.active
        ? `
          <div style="margin-bottom:8px;">
            <strong>אבחון רוחני:</strong><br/>
            ${escapeHtml(insight.spiritualDiagnosis.finalHebrew)}
            ${
              insight.spiritualDiagnosis.mainReasons && insight.spiritualDiagnosis.mainReasons.length
                ? `<ul style="margin-top:6px;">${
                    insight.spiritualDiagnosis.mainReasons.slice(0, 6).map(r => `
                      <li>
                        בית ${escapeHtml(r.house)} — ${escapeHtml(r.role)}:
                        ${escapeHtml((r.signals || []).join(" "))}
                      </li>
                    `).join("")
                  }</ul>`
                : ""
            }
          </div>
        `
        : "";

      return `
        <div class="summary-box">
          <div style="font-weight:800; margin-bottom:10px;">אבחון גורל החול</div>

          <div style="margin-bottom:10px;">
            <strong>מסקנה:</strong><br/>
            ${escapeHtml(insight.finalConclusionHebrew || insight.conclusionDraftHebrew)}
          </div>

          <div style="margin-bottom:8px;">
            <strong>נושא השאלה:</strong>
            ${escapeHtml(insight.topicHebrew)}
          </div>

          <div style="margin-bottom:8px;">
            <strong>בתים עיקריים לבדיקה:</strong>
            ${escapeHtml(insight.mainHouses.join(", "))}
          </div>

          <div style="margin-bottom:8px;">
            <strong>לוח בפועל:</strong>
            <ul style="margin-top:6px;">${boardRows}</ul>
          </div>

          <div style="margin-bottom:8px;">
            <strong>שיקולי פסיקה:</strong>
            <ul style="margin-top:6px;">${reasons}</ul>
          </div>

          ${spiritualBox}

          <div style="margin-bottom:8px;">
            <strong>שכבות ידע שנבדקו:</strong>
            <ul style="margin-top:6px;">${sources}</ul>
          </div>

          <div style="margin-bottom:8px;">
            <strong>כללי גורל החול שנבדקו:</strong>
            <ul style="margin-top:6px;">${rules}</ul>
          </div>

          <div style="margin-top:10px; opacity:.9;">
            ${escapeHtml(insight.boardContext.noteHebrew)}
          </div>
        </div>

        ${archiveSaveBox}
      `;
    }


    function buildChart(reading) {
      const h = n => reading.chart.find(x => x.house === n);
      const diagnosis = ramlBuildInitialDiagnosis(reading);

      const topOrder = [8,7,6,5,4,3,2,1];
      const middleOrder = [12,11,10,9];

      return `
        <article class="reading-card">
          <div class="reading-header">
            <div class="header-block">
              <div class="header-title">שאלה</div>
              <div class="header-value">${reading.question}</div>
            </div>
            <div class="header-block">
              <div class="header-title">נושא ובית מרכזי</div>
              <div class="header-value">${reading.topic.hebrew} — בית ${reading.focusHouseNumber}</div>
            </div>
          </div>

          <div class="shield">
            ${topOrder.map(n => {
              const type =
                n <= 4 ? "אם" :
                "בת";
              return houseHtml(h(n), `${n} — ${type}`);
            }).join("")}
          </div>

          <div class="middle-grid">
            ${middleOrder.map(n => houseHtml(h(n), `${n} — נכדה`)).join("")}
          </div>

          <div class="witness-grid">
            ${houseHtml(h(13), "13 — עד ראשון")}
            ${houseHtml(h(14), "14 — עד שני")}
          </div>

          <div class="final-area">
            <div class="final-main">
              ${houseHtml(h(15), "15 — דיין")}
            </div>
            <div class="final-detached">
              ${houseHtml(h(16), "16 — משלים")}
            </div>
          </div>

          <div class="diagnosis">
            <div class="diagnosis-title">אבחון ראשוני: ${diagnosis.title}</div>
            <div class="diagnosis-text">${diagnosis.text}</div>
          </div>
        </article>

        <div class="summary-box">${ramlBuildReadingSummary(reading)}</div>

        ${hawiSourceInsightHtml(reading)}
      `;
    }



    function formatArchiveDate(value) {
      try {
        return new Intl.DateTimeFormat("he-IL", {
          day: "numeric",
          month: "numeric",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(value));
      } catch {
        return "";
      }
    }

    function renderArchivePanel() {
      const panel = document.getElementById("archivePanel");
      const api = window.GORAL_CLIENT_ARCHIVE;

      if (!panel || !api) return;

      const archive = api.getGoralArchive();

      if (!archive.length) {
        panel.style.display = "block";
        panel.innerHTML = "<strong>ארכיון קריאות</strong><br/>אין עדיין קריאות שמורות.";
        return;
      }

      panel.style.display = "block";
      panel.innerHTML = `
        <div style="font-weight:800; margin-bottom:10px;">ארכיון קריאות לקוחות</div>
        ${archive.slice(0, 20).map(item => `
          <div style="border-top:1px solid rgba(255,255,255,.18); padding:10px 0;">
            <div><strong>${escapeHtml(item.clientName || "לקוח ללא שם")}</strong> — ${escapeHtml(item.topicHebrew || "")}</div>
            <div style="opacity:.8; font-size:.92em;">${escapeHtml(formatArchiveDate(item.createdAt))}</div>
            <div style="margin-top:5px;"><strong>שאלה:</strong> ${escapeHtml(item.question || "")}</div>
            <div style="margin-top:5px; white-space:pre-line;">${escapeHtml(item.conclusion || "")}</div>
            <button type="button" onclick="window.deleteGoralArchiveItem('${escapeHtml(item.id)}')">מחק קריאה</button>
          </div>
        `).join("")}
      `;
    }

    window.deleteGoralArchiveItem = function(id) {
      if (!window.GORAL_CLIENT_ARCHIVE) return;
      window.GORAL_CLIENT_ARCHIVE.deleteGoralArchiveRecord(id);
      renderArchivePanel();
    };

    function saveCurrentReading(reading, interpretation) {
      const api = window.GORAL_CLIENT_ARCHIVE;
      if (!api || !reading || !interpretation) return "";

      const saved = api.saveGoralReadingToArchive(reading, interpretation);
      if (!saved.ok) return "";

      const clientName = reading.clientContext?.clientName || "";
      const history = api.summarizeGoralClientHistory(clientName);

      return `
        <div class="summary-box">
          <strong>הקריאה נשמרה בארכיון.</strong><br/>
          ${escapeHtml(history.summaryHebrew)}
        </div>
      `;
    }


    function getClientContext() {
      return {
        clientName: document.getElementById("clientNameInput")?.value?.trim() || "",
        parentName: document.getElementById("clientParentInput")?.value?.trim() || "",
        ageOrLifeStage: document.getElementById("clientAgeInput")?.value?.trim() || "",
        consultationContext: document.getElementById("consultationContextInput")?.value?.trim() || ""
      };
    }


    function run() {
      const errorBox = document.getElementById("errorBox");
      const result = document.getElementById("result");

      errorBox.style.display = "none";
      errorBox.textContent = "";

      try {
        const question = document.getElementById("questionInput").value;
        const matrix = parseCounts(document.getElementById("countsInput").value);
        const reading = ramlRunReadingFromPointCounts(question, matrix);
        reading.clientContext = getClientContext();

        if (window.GORAL_CLIENT_ARCHIVE && reading.clientContext.clientName) {
          reading.clientHistorySummary = window.GORAL_CLIENT_ARCHIVE.summarizeGoralClientHistory(
            reading.clientContext.clientName
          );
        }

        result.innerHTML = buildChart(reading);
      } catch (err) {
        errorBox.textContent = err.message || String(err);
        errorBox.style.display = "block";
      }
    }

    document.getElementById("dateLine").textContent = todayLine();
    document.getElementById("runBtn").addEventListener("click", run);

    document.getElementById("archiveBtn")?.addEventListener("click", () => {
      renderArchivePanel();
    });

    document.getElementById("clearArchiveBtn")?.addEventListener("click", () => {
      if (!window.GORAL_CLIENT_ARCHIVE) return;
      if (confirm("לנקות את כל ארכיון הקריאות?")) {
        window.GORAL_CLIENT_ARCHIVE.clearGoralArchive();
        renderArchivePanel();
      }
    });
    document.getElementById("result").innerHTML = "";
  </script>

<script>
/* === REAL GORAL HACHOL APP FLOW FROM MOCKUP === */
(function () {
  const figures = [
    { id: "tariq", name: "דרך", lines: [1,1,1,1] },
    { id: "jamaa", name: "קהלה", lines: [2,2,2,2] },
    { id: "bayad", name: "לבן", lines: [2,2,1,2] },
    { id: "humra", name: "אדום", lines: [2,1,2,2] },
    { id: "aqla", name: "סוהר", lines: [2,1,1,2] },
    { id: "ijtima", name: "חיבור", lines: [1,2,2,1] },
    { id: "qabd-dakhil", name: "ממון נכנס", lines: [2,1,2,1] },
    { id: "qabd-kharij", name: "ממון יוצא", lines: [1,2,1,2] },
    { id: "nusra-dakhila", name: "כבוד נכנס", lines: [2,2,2,1] },
    { id: "nusra-kharija", name: "כבוד יוצא", lines: [1,2,2,2] },
    { id: "ataba-dakhila", name: "סף נכנס", lines: [2,1,1,1] },
    { id: "ataba-kharija", name: "סף יוצא", lines: [1,1,1,2] },
    { id: "nakis", name: "שפל ראש", lines: [2,2,1,1] },
    { id: "hayyan", name: "נשוא ראש", lines: [1,1,2,2] },
    { id: "judla", name: "נלחם", lines: [1,2,2,1] },
    { id: "farah", name: "שפע", lines: [2,1,2,2] }
  ];

  let selectedMothers = [null, null, null, null];
  let activeSlot = 0;

  function figHtml(lines) {
    return `
      <div class="goral-figure">
        ${lines.map(v => `
          <div>${Number(v) === 1 ? '<span class="goral-dot"></span>' : '<span class="goral-bar"></span>'}</div>
        `).join("")}
      </div>
    `;
  }

  function showScreen(name) {
    document.querySelectorAll(".goral-screen").forEach(s => s.classList.remove("active"));
    const target = document.getElementById("goral-screen-" + name);
    if (target) target.classList.add("active");
  }

  function syncCountsInput() {
    const counts = document.getElementById("countsInput");
    if (!counts) return;

    counts.value = selectedMothers
      .filter(Boolean)
      .map(m => m.lines.join(" "))
      .join("\n");
  }

  function renderSlots() {
    const box = document.getElementById("goralMotherSlots");
    if (!box) return;

    box.innerHTML = selectedMothers.map((fig, index) => `
      <button type="button"
        class="goral-mother-slot ${index === activeSlot ? "active" : ""} ${fig ? "filled" : ""}"
        data-slot="${index}">
        <div>
          <strong>אם ${index + 1}</strong><br/>
          ${fig ? fig.name : "טרם נבחרה"}
        </div>
      </button>
    `).join("");

    box.querySelectorAll(".goral-mother-slot").forEach(btn => {
      btn.addEventListener("click", () => {
        activeSlot = Number(btn.dataset.slot);
        renderSlots();
        renderPicker();
      });
    });
  }

  function renderPicker() {
    const picker = document.getElementById("goralFigurePicker");
    if (!picker) return;

    picker.innerHTML = figures.map((f, index) => {
      const selected = selectedMothers.some(m => m && m.id === f.id);
      return `
        <button type="button" class="goral-figure-choice ${selected ? "selected" : ""}" data-index="${index}">
          ${figHtml(f.lines)}
          <span>${f.name}</span>
        </button>
      `;
    }).join("");

    picker.querySelectorAll(".goral-figure-choice").forEach(btn => {
      btn.addEventListener("click", () => {
        const fig = figures[Number(btn.dataset.index)];
        selectedMothers[activeSlot] = fig;
        if (activeSlot < 3) activeSlot += 1;
        syncCountsInput();
        renderSlots();
        renderPicker();
      });
    });
  }

  function mountRealFlow() {
    if (document.getElementById("goralRealFlow")) return;

    const clientName = document.getElementById("clientNameInput");
    const parentName = document.getElementById("clientParentInput");
    const age = document.getElementById("clientAgeInput");
    const context = document.getElementById("consultationContextInput");
    const question = document.getElementById("questionInput");
    const counts = document.getElementById("countsInput");
    const runBtn = document.getElementById("runBtn");
    const archiveBtn = document.getElementById("archiveBtn");
    const clearArchiveBtn = document.getElementById("clearArchiveBtn");
    const result = document.getElementById("result");

    if (!clientName || !question || !counts || !runBtn || !result) return;

    const oldSection = clientName.closest("section") || question.closest("section");
    if (oldSection) oldSection.classList.add("goral-hidden-original");

    const app = document.createElement("div");
    app.id = "goralRealFlow";
    app.className = "goral-live-app";
    app.innerHTML = `
      <h1>גורל החול</h1>
      <div class="goral-live-subtitle">אבחון והכוונה לפי לוח הגורל</div>

      <section id="goral-screen-open" class="goral-screen active">
        <h2>עמוד פתיחה</h2>
        <div class="goral-form-grid" id="goralOpenFields"></div>
        <div class="goral-actions">
          <button type="button" class="goral-btn primary" id="goralGoSelect">המשך לבחירת 4 האמהות</button>
        </div>
      </section>

      <section id="goral-screen-select" class="goral-screen">
        <h2>בחירת 4 צורות ראשונות</h2>
        <div id="goralMotherSlots" class="goral-mother-slots"></div>
        <div id="goralFigurePicker" class="goral-picker"></div>
        <div class="goral-actions">
          <button type="button" class="goral-btn" id="goralBackOpen">חזרה</button>
          <button type="button" class="goral-btn primary" id="goralRunReal">צור לוח ופירוש</button>
        </div>
      </section>

      <section id="goral-screen-board" class="goral-screen">
        <h2>לוח הגורל</h2>
        <div class="goral-actions" id="goralBoardActions"></div>
      </section>
    `;

    document.body.insertBefore(app, result);

    const fields = document.getElementById("goralOpenFields");

    function wrap(label, el, full = false) {
      const d = document.createElement("div");
      d.className = "goral-field" + (full ? " full" : "");
      const l = document.createElement("label");
      l.textContent = label;
      d.appendChild(l);
      d.appendChild(el);
      fields.appendChild(d);
    }

    wrap("שם הלקוח", clientName);
    wrap("שם האב / האם", parentName);
    wrap("גיל / שלב חיים", age);
    wrap("רקע קצר", context);
    wrap("שאלת גורל החול", question, true);

    counts.style.display = "none";
    runBtn.style.display = "none";

    const boardActions = document.getElementById("goralBoardActions");
    boardActions.appendChild(archiveBtn);
    boardActions.appendChild(clearArchiveBtn);

    document.getElementById("goralGoSelect").addEventListener("click", () => showScreen("select"));
    document.getElementById("goralBackOpen").addEventListener("click", () => showScreen("open"));

    document.getElementById("goralRunReal").addEventListener("click", () => {
      if (selectedMothers.some(m => !m)) {
        alert("צריך לבחור 4 אמהות לפני יצירת הלוח.");
        return;
      }
      syncCountsInput();
      runBtn.click();
      const boardScreen = document.getElementById("goral-screen-board");
      boardScreen.appendChild(result);
      showScreen("board");
    });

    renderSlots();
    renderPicker();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mountRealFlow);
  } else {
    mountRealFlow();
  }
})();
</script>
