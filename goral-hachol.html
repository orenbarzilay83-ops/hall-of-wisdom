<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>גורל החול</title>

  <script src="./raml-data/raml-forms-basic.js"></script>
  <script src="./raml-data/raml-forms-profiles.js"></script>
  <script src="./raml-data/raml-houses-basic.js"></script>
  <script src="./raml-data/raml-houses-profiles.js"></script>
  <script src="./raml-data/raml-reading-foundations.js"></script>
  <script src="./raml-data/raml-foundation-qawl-jami-extra.js"></script>
  <script src="./raml-data/raml-foundation-closure-audit.js"></script>
  <script src="./raml-data/raml-foundation-bulugh-al-amal.js"></script>
  <script src="./raml-data/raml-spiritual-diagnostics.js"></script>
  <script src="./raml-data/raml-topic-rules.js"></script>
  <script src="./raml.js"></script>

  <style>
    :root {
      --navy: #06192d;
      --navy2: #0d2a49;
      --gold: #d8aa45;
      --gold2: #f2d27b;
      --paper: #fff8e8;
      --ink: #111;
      --muted: #6d6250;
      --border: #1d1d1d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      direction: rtl;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(242, 210, 123, .18), transparent 35%),
        linear-gradient(135deg, #06192d, #0a1424);
      color: var(--ink);
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      min-height: 100vh;
      background: linear-gradient(180deg, #fffaf0, #f7eedc);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.35);
    }

    .topbar {
      height: 68px;
      background: linear-gradient(90deg, var(--navy), var(--navy2));
      color: var(--gold2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar h1 {
      margin: 0;
      font-size: 25px;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      color: var(--gold2);
      font-size: 28px;
      cursor: pointer;
      padding: 8px 10px;
    }

    .screen {
      display: none;
      padding: 26px;
    }

    .screen.active {
      display: block;
    }

    .panel {
      border: 1px solid rgba(216, 170, 69, 0.45);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      padding: 22px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 18px;
      color: #071b30;
      border-bottom: 1px solid rgba(216, 170, 69, 0.6);
      padding-bottom: 10px;
      font-size: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 800;
      color: #1e2a36;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 13px;
      background: white;
      padding: 13px;
      font-size: 17px;
      color: #111;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .btn {
      border: 1px solid rgba(216, 170, 69, 0.5);
      border-radius: 14px;
      padding: 15px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      background: #fff4d8;
      color: #071b30;
    }

    .btn.primary {
      background: linear-gradient(180deg, #0d2a49, #06192d);
      color: var(--gold2);
      border: 0;
    }

    .btn.gold {
      background: linear-gradient(180deg, #f2d27b, #d8aa45);
      color: #071b30;
      border: 0;
    }

    .btn.gray {
      background: #f4f4f4;
      color: #333;
      border: 1px solid rgba(0, 0, 0, 0.16);
    }

    .mother-slots {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .mother-slot {
      border: 1px dashed rgba(0, 0, 0, 0.3);
      border-radius: 14px;
      min-height: 74px;
      display: grid;
      place-items: center;
      text-align: center;
      background: white;
      font-weight: 700;
      cursor: pointer;
      padding: 8px;
    }

    .mother-slot.active {
      border: 2px solid var(--gold);
      box-shadow: 0 0 0 4px rgba(216, 170, 69, 0.18);
    }

    .mother-slot.filled {
      background: rgba(255, 245, 205, 0.72);
    }

    .figure-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      overflow: hidden;
      background: white;
    }

    .figure-card {
      min-height: 135px;
      border: 0;
      border-left: 1px solid rgba(0, 0, 0, 0.24);
      border-bottom: 1px solid rgba(0, 0, 0, 0.24);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      background: #fffaf0;
      cursor: pointer;
      padding: 8px;
      color: #111;
    }

    .figure-card.selected {
      outline: 3px solid var(--gold);
      outline-offset: -3px;
      background: #fff2cc;
    }

    .figure-card.selected::after {
      content: "✓";
      position: absolute;
      top: 9px;
      right: 9px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--gold2);
      color: #071b30;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .glyph {
      width: 58px;
      display: grid;
      grid-template-rows: repeat(4, 13px);
      gap: 7px;
      justify-items: center;
      align-items: center;
    }

    .one {
      width: 9px;
      height: 9px;
      background: #111;
      border-radius: 50%;
    }

    .two {
      width: 38px;
      height: 7px;
      background: #111;
      border-radius: 99px;
    }

    .figure-name {
      font-weight: 900;
      font-size: 16px;
    }

    .board {
      border: 2px solid var(--border);
      background: white;
      max-width: 860px;
      margin: 0 auto;
    }

    .board-row {
      display: grid;
      border-bottom: 2px solid var(--border);
    }

    .board-row.r1 {
      grid-template-columns: repeat(8, 1fr);
    }

    .board-row.r2 {
      grid-template-columns: repeat(4, 1fr);
    }

    .board-row.r3 {
      grid-template-columns: repeat(2, 1fr);
      border-bottom: 0;
    }

    .final-row {
      display: flex;
      flex-direction: row;
      gap: 22px;
      margin-top: 22px;
      align-items: start;
      direction: rtl;
    }

    .final-box {
      border: 2px solid var(--border);
      background: white;
      min-height: 150px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      text-align: center;
    }

    .sentence-box {
      order: 1;
    }

    .judge-box {
      order: 2;
    }

    .house {
      min-height: 132px;
      border-left: 1px solid var(--border);
      padding: 8px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 6px;
    }

    .house:last-child {
      border-left: 0;
    }

    .final-box .house {
      border-left: 0;
    }

    .house-title {
      font-weight: 900;
      font-size: 16px;
    }

    .house-name {
      color: #555;
      font-size: 13px;
      min-height: 18px;
    }

    .note {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .summary-box {
      margin-top: 18px;
      background: var(--navy);
      color: #f8f2e5;
      border-radius: 20px;
      padding: 18px;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 16px;
    }

    .error {
      margin-top: 14px;
      padding: 12px 14px;
      background: #ffe9e4;
      color: #8c2118;
      border: 1px solid #e2a39a;
      border-radius: 14px;
      display: none;
    }

    #countsInput,
    #runBtn,
    #result,
    #archivePanel {
      display: none;
    }

    @media (max-width: 800px) {
      .screen {
        padding: 16px;
      }

      .form-grid,
      .actions,
      .mother-slots {
        grid-template-columns: 1fr;
      }

      .figure-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .board-row.r1 {
        grid-template-columns: repeat(4, 1fr);
      }

      .final-row {
        flex-direction: column;
      }

      .final-box {
        width: 100%;
      }
    }
  
    /* opening screen exact layout */
    .opening-actions {
      grid-template-columns: repeat(3, 1fr);
      align-items: stretch;
    }

    .opening-actions .start-btn {
      grid-column: 3 / 4;
      margin-top: 6px;
    }

    @media (max-width: 800px) {
      .opening-actions {
        grid-template-columns: 1fr;
      }

      .opening-actions .start-btn {
        grid-column: auto;
      }
    }

  
    /* Exact opening screen layout */
    .opening-actions {
      grid-template-columns: repeat(3, 1fr);
      align-items: stretch;
    }

    .opening-actions .start-btn {
      grid-column: 3 / 4;
    }

    @media (max-width: 800px) {
      .opening-actions {
        grid-template-columns: 1fr;
      }

      .opening-actions .start-btn {
        grid-column: auto;
      }
    }

  </style>
</head>

<body autocomplete="off">
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" onclick="location.href='calculator.html'">←</button>
      <h1>גורל החול</h1>
      <div style="width: 40px;"></div>
    </header>

    <section id="screen-open" class="screen active">
      <div class="panel">
        <h2>עמוד פתיחה</h2>

        <div class="form-grid">
          <div>
            <label>שם הפונה</label>
            <input id="clientNameInput" placeholder="שם הלקוח" value="" autocomplete="off" />
          </div>

          <div>
            <label>שם האב</label>
            <input id="clientParentInput" placeholder="שם האב" value="" autocomplete="off" />
          </div>

          <div>
            <label>תאריך השאלה</label>
            <input id="clientAgeInput" placeholder="תאריך השאלה" value="" autocomplete="off" />
          </div>

          <div>
            <label>שעת השאלה</label>
            <input id="consultationContextInput" placeholder="שעת השאלה" value="" autocomplete="off" />
          </div>

          <div class="full">
            <label>שאלה / כוונה</label>
            <textarea id="questionInput" placeholder="כתוב כאן את שאלת גורל החול" autocomplete="off"></textarea>
          </div>

          <div class="full">
            <label>נושא השאלה</label>
            <select id="questionTopicInput" autocomplete="off">
              <option value="">בחר נושא שאלה</option>
              <option value="travel">נסיעה</option>
              <option value="missingPerson">נעדרים / אבידה</option>
              <option value="childrenPregnancy">ילדים / הריון</option>
              <option value="hiddenTreasure">מטמון / דבר חבוי</option>
              <option value="spiritualDiagnostics">אבחון רוחני / עין / כישוף</option>
              <option value="authorityState">שלטון / סמכות / בעלי תפקידים</option>
              <option value="yearlyForecast">טאלע השנה / גשם / יוקר וזול</option>
              <option value="birthNativity">מולד / טבע האדם</option>
              <option value="general">כללי</option>
            </select>
          </div>
        </div>

        <div class="actions opening-actions">
          <button class="btn gold" id="goToSelectBtn" type="button">הכנסה ידנית של 4 האמהות</button>
          <button class="btn gray" id="autoSelectBtn" type="button">בחירה אוטומטית לפי עצירה</button>
          <button class="btn gray" id="clearFormBtn" type="button">נקה טופס</button>
          <button class="btn primary start-btn" id="startBtn" type="button">התחל</button>
        </div>
      </div>
    </section>

    <section id="screen-select" class="screen">
      <div class="panel">
        <h2>בחירת 4 צורות ראשונות</h2>

        <div id="motherSlots" class="mother-slots"></div>
        <div id="figureGrid" class="figure-grid"></div>

        <div class="actions">
          <button class="btn gray" id="backToOpenBtn">חזרה</button>
          <button class="btn gray" id="clearSelectionBtn">נקה בחירה</button>
          <button class="btn primary" id="goToBoardBtn">המשך ללוח הגורל</button>
        </div>

        <div class="note">הסימון ✓ מציין צורה שכבר נבחרה.</div>
      </div>
    </section>

    <section id="screen-board" class="screen">
      <div class="panel">
        <h2>לוח הגורל</h2>
        <div id="boardResult"></div>
        <div id="errorBox" class="error"></div>

        <div class="actions">
          <button class="btn gray" id="backToBoardSelectBtn">חזרה לבחירת אמהות</button>
          <button class="btn primary" id="archiveBtn">ארכיון קריאות</button>
          <button class="btn gray" id="clearArchiveBtn">נקה ארכיון</button>

      </div>

  </div>

  <textarea id="countsInput"></textarea>
  <button id="runBtn" type="button"></button>
  <section id="result"></section>
  <section id="archivePanel" class="summary-box"></section>

  <script type="module">
    import { interpretHawiQuestionInitial } from './goral-hachol/engine/hawi-interpreter.js';

    import {
      getGoralArchive,
      saveGoralReadingToArchive,
      deleteGoralArchiveRecord,
      clearGoralArchive,
      summarizeGoralClientHistory
    } from './goral-hachol/engine/goral-client-archive.js';

    window.HAWI_INTERPRETER = { interpretHawiQuestionInitial };

    window.GORAL_CLIENT_ARCHIVE = {
      getGoralArchive,
      saveGoralReadingToArchive,
      deleteGoralArchiveRecord,
      clearGoralArchive,
      summarizeGoralClientHistory
    };
  </script>

  <script>

    function clearInitialClientFields() {
      ["clientNameInput", "clientParentInput", "clientAgeInput", "consultationContextInput", "questionInput"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });
    }

    function parseCounts(text) {
      const rows = String(text || "")
        .trim()
        .split(/\n+/)
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => line.split(/[\s,]+/).map(Number));

      if (rows.length !== 4) {
        throw new Error("צריך להזין בדיוק 4 שורות — שורה אחת לכל אם.");
      }

      for (const row of rows) {
        if (row.length !== 4 || row.some(n => !Number.isFinite(n) || n <= 0)) {
          throw new Error("כל שורה חייבת להכיל בדיוק 4 מספרים חיוביים.");
        }
      }

      return rows;
    }

    function figHtml(fig) {
      return `
        <div class="glyph" style="margin-bottom:8px;">
          ${fig.map(v => `<div class="${Number(v) === 1 ? "one" : "two"}"></div>`).join("")}
        </div>
      `;
    }

    function houseHtml(h, labelOverride) {
      const label = labelOverride || `בית ${h.house}`;
      return `
        <div class="house">
          <div class="house-title">${label}</div>
          <div class="house-name">${h.houseHebrew || ""}</div>
          ${figHtml(h.figure)}
          <div class="figure-name">${h.hebrew}</div>
          <div class="house-name" style="font-size:12px; margin-top:4px;">
            ${h.key}<br/>
            ${h.fortune || ""} · ${h.movement || ""} · יסוד ${h.element || ""}
          </div>
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function hawiSourceInsightHtml(reading) {
      if (!window.HAWI_INTERPRETER || !window.HAWI_INTERPRETER.interpretHawiQuestionInitial) {
        return `
          <div class="summary-box">
            <strong>אבחון גורל החול:</strong><br/>
            שכבת הידע נטענת. אם זה נשאר כך, רענן את הדף.
          </div>
        `;
      }

      const insight = window.HAWI_INTERPRETER.interpretHawiQuestionInitial(reading.question, reading);
      const archiveSaveBox = saveCurrentReading(reading, insight);

      const sources = (insight.knowledgeSources || [])
        .map(s => `<li>${escapeHtml(s.id)} — ${escapeHtml(s.titleHebrew)}</li>`)
        .join("");

      const rules = (insight.relevantRules || []).slice(0, 7)
        .map(rule => {
          const houses = rule.houses
            ? ` | בתים: ${rule.houses.join(", ")}`
            : rule.house
              ? ` | בית: ${rule.house}`
              : "";

          const page = rule.sourcePage ? ` | עמוד מקור: ${rule.sourcePage}` : "";
          const text = rule.hebrew || rule.result || rule.condition || rule.id || "כלל מקור";

          return `<li>${escapeHtml(text)}${escapeHtml(houses)}${escapeHtml(page)}</li>`;
        })
        .join("");

      const boardRows = insight.boardAnalysis && insight.boardAnalysis.hasBoard
        ? insight.boardAnalysis.houses.slice(0, 16).map(h => `
            <li>
              בית ${escapeHtml(h.house)} —
              ${escapeHtml(h.figureHebrew || "")}
              ${h.house === insight.boardAnalysis.focusHouseNumber ? " — בית מרכזי" : ""}
              ${h.house === 13 ? " — עד ראשון" : ""}
              ${h.house === 14 ? " — עד שני" : ""}
              ${h.house === 15 ? " — דיין" : ""}
              ${h.house === 16 ? " — משלים" : ""}
            </li>
          `).join("")
        : "";

      const reasons = insight.boardScore && insight.boardScore.reasons
        ? insight.boardScore.reasons.map(r => `<li>${escapeHtml(r)}</li>`).join("")
        : "";

      const spiritualBox = insight.spiritualDiagnosis && insight.spiritualDiagnosis.active
        ? `
          <div style="margin-bottom:8px;">
            <strong>אבחון רוחני:</strong><br/>
            ${escapeHtml(insight.spiritualDiagnosis.finalHebrew)}
            ${
              insight.spiritualDiagnosis.mainReasons && insight.spiritualDiagnosis.mainReasons.length
                ? `<ul style="margin-top:6px;">${
                    insight.spiritualDiagnosis.mainReasons.slice(0, 6).map(r => `
                      <li>
                        בית ${escapeHtml(r.house)} — ${escapeHtml(r.role)}:
                        ${escapeHtml((r.signals || []).join(" "))}
                      </li>
                    `).join("")
                  }</ul>`
                : ""
            }
          </div>
        `
        : "";

      return `
        <div class="summary-box">
          <div style="font-weight:800; margin-bottom:10px;">אבחון גורל החול</div>

          <div style="margin-bottom:10px;">
            <strong>מסקנה:</strong><br/>
            ${escapeHtml(insight.finalConclusionHebrew || insight.conclusionDraftHebrew)}
          </div>

          <div style="margin-bottom:8px;">
            <strong>נושא השאלה:</strong>
            ${escapeHtml(insight.topicHebrew)}
          </div>

          <div style="margin-bottom:8px;">
            <strong>בתים עיקריים לבדיקה:</strong>
            ${escapeHtml((insight.mainHouses || []).join(", "))}
          </div>

          <div style="margin-bottom:8px;">
            <strong>לוח בפועל:</strong>
            <ul style="margin-top:6px;">${boardRows}</ul>
          </div>

          <div style="margin-bottom:8px;">
            <strong>שיקולי פסיקה:</strong>
            <ul style="margin-top:6px;">${reasons}</ul>
          </div>

          ${spiritualBox}

          <div style="margin-bottom:8px;">
            <strong>שכבות ידע שנבדקו:</strong>
            <ul style="margin-top:6px;">${sources}</ul>
          </div>

          <div style="margin-bottom:8px;">
            <strong>כללי גורל החול שנבדקו:</strong>
            <ul style="margin-top:6px;">${rules}</ul>
          </div>

          <div style="margin-top:10px; opacity:.9;">
            ${escapeHtml(insight.boardContext?.noteHebrew || "")}
          </div>
        </div>

        ${archiveSaveBox}
      `;
    }

    function buildChart(reading) {
      const h = n => reading.chart.find(x => x.house === n);

      const topOrder = [8, 7, 6, 5, 4, 3, 2, 1];
      const middleOrder = [12, 11, 10, 9];

      return `
        <article class="board">
          <div class="board-row r1">
            ${topOrder
              .map(n => {
                const type = n <= 4 ? "אם" : "בת";
                return houseHtml(h(n), `${n} — ${type}`);
              })
              .join("")}
          </div>

          <div class="board-row r2">
            ${middleOrder
              .map(n => houseHtml(h(n), `${n} — נכדה`))
              .join("")}
          </div>

          <div class="board-row r3">
            ${houseHtml(h(14), "14 — עד שני")}
            ${houseHtml(h(13), "13 — עד ראשון")}
          </div>

          <div class="final-row">
            <div class="final-box sentence-box">
              ${houseHtml(h(16), "16 — משלים")}
            </div>
            <div class="final-box judge-box">
              ${houseHtml(h(15), "15 — דיין")}
            </div>
          </div>
        </article>

        <div class="summary-box">${ramlBuildReadingSummary(reading)}</div>

        ${hawiSourceInsightHtml(reading)}
      `;
    }

    function formatArchiveDate(value) {
      try {
        return new Intl.DateTimeFormat("he-IL", {
          day: "numeric",
          month: "numeric",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(value));
      } catch {
        return "";
      }
    }

    function renderArchivePanel() {
      const panel = document.getElementById("archivePanel");
      const api = window.GORAL_CLIENT_ARCHIVE;
      const boardResult = document.getElementById("boardResult");

      if (!panel || !api || !boardResult) return;

      const archive = api.getGoralArchive();

      if (!archive.length) {
        boardResult.innerHTML = `<div class="summary-box"><strong>ארכיון קריאות</strong><br/>אין עדיין קריאות שמורות.</div>`;
        return;
      }

      boardResult.innerHTML = `
        <div class="summary-box">
          <div style="font-weight:800; margin-bottom:10px;">ארכיון קריאות לקוחות</div>
          ${archive.slice(0, 20).map(item => `
            <div style="border-top:1px solid rgba(255,255,255,.18); padding:10px 0;">
              <div><strong>${escapeHtml(item.clientName || "לקוח ללא שם")}</strong> — ${escapeHtml(item.topicHebrew || "")}</div>
              <div style="opacity:.8; font-size:.92em;">${escapeHtml(formatArchiveDate(item.createdAt))}</div>
              <div style="margin-top:5px;"><strong>שאלה:</strong> ${escapeHtml(item.question || "")}</div>
              <div style="margin-top:5px; white-space:pre-line;">${escapeHtml(item.conclusion || "")}</div>
              <button type="button" onclick="window.deleteGoralArchiveItem('${escapeHtml(item.id)}')">מחק קריאה</button>
            </div>
          `).join("")}
        </div>
      `;
    }

    window.deleteGoralArchiveItem = function(id) {
      if (!window.GORAL_CLIENT_ARCHIVE) return;
      window.GORAL_CLIENT_ARCHIVE.deleteGoralArchiveRecord(id);
      renderArchivePanel();
    };

    function saveCurrentReading(reading, interpretation) {
      const api = window.GORAL_CLIENT_ARCHIVE;
      if (!api || !reading || !interpretation) return "";

      const saved = api.saveGoralReadingToArchive(reading, interpretation);
      if (!saved.ok) return "";

      const clientName = reading.clientContext?.clientName || "";
      const history = api.summarizeGoralClientHistory(clientName);

      return `
        <div class="summary-box">
          <strong>הקריאה נשמרה בארכיון.</strong><br/>
          ${escapeHtml(history.summaryHebrew)}
        </div>
      `;
    }

    function getClientContext() {
      return {
        clientName: document.getElementById("clientNameInput")?.value?.trim() || "",
        parentName: document.getElementById("clientParentInput")?.value?.trim() || "",
        ageOrLifeStage: document.getElementById("clientAgeInput")?.value?.trim() || "",
        consultationContext: document.getElementById("consultationContextInput")?.value?.trim() || ""
      };
    }

    function run() {
      const errorBox = document.getElementById("errorBox");
      const boardResult = document.getElementById("boardResult");
      const result = document.getElementById("result");

      errorBox.style.display = "none";
      errorBox.textContent = "";

      try {
        const question = document.getElementById("questionInput").value;
        const matrix = parseCounts(document.getElementById("countsInput").value);
        const runEngine =
          window.ramlRunReadingFromPointCounts ||
          window.runRamlReadingFromPointCounts ||
          window.ramlRunReading ||
          window.runRamlReading ||
          (typeof ramlRunReadingFromPointCounts !== "undefined" ? ramlRunReadingFromPointCounts : null);

        if (typeof runEngine !== "function") {
          throw new Error("מנוע גורל החול לא נטען: לא נמצאה פונקציית יצירת לוח מתוך raml.js.");
        }

        const reading = runEngine(question, matrix);
        reading.clientContext = getClientContext();

        if (window.GORAL_CLIENT_ARCHIVE && reading.clientContext.clientName) {
          reading.clientHistorySummary = window.GORAL_CLIENT_ARCHIVE.summarizeGoralClientHistory(
            reading.clientContext.clientName
          );
        }

        const chartHtml = buildChart(reading);
        boardResult.innerHTML = chartHtml;
        result.innerHTML = chartHtml;
      } catch (err) {
        errorBox.textContent = err.message || String(err);
        errorBox.style.display = "block";
      }
    }

    function normalizeLineValue(v) {
      const n = Number(v);
      if (n === 1 || n === 2) return n;
      return n % 2 === 0 ? 2 : 1;
    }

    function figureNameFromEngine(lines) {
      try {
        const fn =
          (typeof ramlFigureInfo === "function" ? ramlFigureInfo : null) ||
          (window && typeof window.ramlFigureInfo === "function" ? window.ramlFigureInfo : null);

        if (typeof fn === "function") {
          const info = fn(lines);

          return (
            info?.hebrew ||
            info?.hebrewName ||
            info?.nameHebrew ||
            info?.name ||
            info?.title ||
            ""
          );
        }
      } catch (err) {
        console.warn("Could not read figure name from ramlFigureInfo", lines, err);
      }

      return "";
    }

    function getFiguresForPicker() {
      /*
        מסך הבחירה לא משתמש יותר בשמות דמו.
        הוא מייצר את כל 16 הצורות האפשריות ושואל את raml.js מה השם האמיתי של כל צורה.
      */
      const patterns = [];

      for (const a of [1, 2]) {
        for (const b of [1, 2]) {
          for (const c of [1, 2]) {
            for (const d of [1, 2]) {
              patterns.push([a, b, c, d]);
            }
          }
        }
      }

      return patterns.map((lines, index) => {
        const key = lines.join("");
        const engineName = figureNameFromEngine(lines);

        return {
          id: `engine-figure-${key}`,
          key,
          name: engineName || `צורה ${index + 1}`,
          lines
        };
      });
    }

    const figures = getFiguresForPicker();
    let selectedMothers = [null, null, null, null];
    let activeMother = 0;

    function glyphHtml(lines) {
      return `
        <div class="glyph">
          ${lines.map(v => `<div class="${Number(v) === 1 ? "one" : "two"}"></div>`).join("")}
        </div>
      `;
    }

    function renderMotherSlots() {
      const slots = document.getElementById("motherSlots");
      if (!slots) return;

      slots.innerHTML = selectedMothers
        .map((fig, index) => `
          <button type="button"
            class="mother-slot ${index === activeMother ? "active" : ""} ${fig ? "filled" : ""}"
            data-slot="${index}">
            <div>
              <div style="font-weight:900;">אם ${index + 1}</div>
              <div style="margin-top:4px; font-weight:700;">${fig ? fig.name : "טרם נבחר"}</div>
            </div>
          </button>
        `)
        .join("");

      slots.querySelectorAll(".mother-slot").forEach(slot => {
        slot.addEventListener("click", () => {
          activeMother = Number(slot.dataset.slot);
          renderMotherSlots();
          buildFigurePicker();
        });
      });
    }

    function buildFigurePicker() {
      const grid = document.getElementById("figureGrid");
      if (!grid) return;

      grid.innerHTML = figures
        .map((fig, index) => {
          const isSelected = selectedMothers.some(m => m && m.id === fig.id);
          return `
            <button type="button" class="figure-card ${isSelected ? "selected" : ""}" data-index="${index}">
              ${glyphHtml(fig.lines)}
              <div class="figure-name">${fig.name}</div>
            </button>
          `;
        })
        .join("");

      grid.querySelectorAll(".figure-card").forEach(btn => {
        btn.addEventListener("click", () => {
          const fig = figures[Number(btn.dataset.index)];
          selectedMothers[activeMother] = fig;
          if (activeMother < 3) activeMother += 1;
          syncCountsInput();
          renderMotherSlots();
          buildFigurePicker();
        });
      });
    }

    function syncCountsInput() {
      const countsInput = document.getElementById("countsInput");
      if (!countsInput) return;

      if (selectedMothers.some(m => !m)) {
        countsInput.value = "";
        return;
      }

      countsInput.value = selectedMothers.map(m => m.lines.map(normalizeLineValue).join(" ")).join("\n");
    }

    function showScreen(name) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      const screen = document.getElementById("screen-" + name);
      if (screen) screen.classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    clearInitialClientFields();

    document.getElementById("startBtn")?.addEventListener("click", () => {
      renderMotherSlots();
      buildFigurePicker();
      showScreen("select");
    });

    document.getElementById("goToSelectBtn").addEventListener("click", () => {
      renderMotherSlots();
      buildFigurePicker();
      showScreen("select");
    });

    document.getElementById("autoSelectBtn").addEventListener("click", () => {
      const shuffled = [...figures].sort(() => Math.random() - 0.5);
      selectedMothers = shuffled.slice(0, 4);
      activeMother = 0;
      syncCountsInput();
      renderMotherSlots();
      buildFigurePicker();
      showScreen("select");
    });

    document.getElementById("backToOpenBtn").addEventListener("click", () => {
      showScreen("open");
    });

    document.getElementById("clearSelectionBtn").addEventListener("click", () => {
      selectedMothers = [null, null, null, null];
      activeMother = 0;
      syncCountsInput();
      renderMotherSlots();
      buildFigurePicker();
    });

    document.getElementById("goToBoardBtn").addEventListener("click", () => {
      if (selectedMothers.some(m => !m)) {
        alert("צריך לבחור 4 אמהות לפני המשך ללוח הגורל.");
        return;
      }

      syncCountsInput();
      run();
      showScreen("board");
    });

    document.getElementById("backToBoardSelectBtn").addEventListener("click", () => {
      showScreen("select");
    });

    document.getElementById("clearFormBtn").addEventListener("click", () => {
      document.getElementById("clientNameInput").value = "";
      document.getElementById("clientParentInput").value = "";
      document.getElementById("clientAgeInput").value = "";
      document.getElementById("consultationContextInput").value = "";
      document.getElementById("questionInput").value = "";
      const topicInput = document.getElementById("questionTopicInput");
      if (topicInput) topicInput.value = "";
      selectedMothers = [null, null, null, null];
      activeMother = 0;
      syncCountsInput();
      renderMotherSlots();
      buildFigurePicker();
    });

    document.getElementById("archiveBtn").addEventListener("click", () => {
      renderArchivePanel();
    });

    document.getElementById("clearArchiveBtn").addEventListener("click", () => {
      if (!window.GORAL_CLIENT_ARCHIVE) return;
      if (confirm("לנקות את כל ארכיון הקריאות?")) {
        window.GORAL_CLIENT_ARCHIVE.clearGoralArchive();
        renderArchivePanel();
      }
    });

    document.getElementById("runBtn").addEventListener("click", run);
  </script>
</body>
</html>
