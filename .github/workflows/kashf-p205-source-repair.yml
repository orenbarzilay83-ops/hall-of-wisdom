name: Kashf p205 Source Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-p205-source-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate p205 patcher syntax
        run: node --check _patch_kashf_p205_source_repair.mjs
      - name: Apply p205 source repair
        run: node _patch_kashf_p205_source_repair.mjs
      - name: Validate canonical registry syntax
        run: node --check goral-hachol/registry/kashf-canonical-method-registry.js
      - name: Validate v57 knowledge registry syntax
        run: node --check goral-hachol/registry/kashf-v57-knowledge-registry.js
      - name: Validate retrieval registry syntax
        run: node --check goral-hachol/registry/kashf-ai-retrieval-index.js
      - name: Run canonical routing contract
        run: node _test_kashf_canonical_routing.mjs
      - name: Audit question-route coverage
        run: node _audit_kashf_question_route_coverage.mjs
      - name: Run AI retrieval contract
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: Run canonical AI live bridge contract
        run: node _test_kashf_ai_retrieval_live_bridge.mjs
      - name: Run AI context builder regression
        run: node _test_kashf_ai_context_builder.mjs

      - name: Commit p205 source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            goral-hachol/registry/kashf-canonical-method-registry.js \
            goral-hachol/registry/kashf-question-route-registry.js \
            goral-hachol/registry/kashf-v57-knowledge-registry.js \
            goral-hachol/registry/kashf-ai-retrieval-index.js \
            HALL_WISDOM_KASHF_REMAINING_7_SOURCE_CLOSURE_AUDIT.md \
            _test_kashf_canonical_routing.mjs \
            _test_kashf_ai_retrieval_index.mjs \
            _test_kashf_ai_retrieval_live_bridge.mjs
          if git diff --cached --quiet; then
            echo "No p205 changes to commit"
            exit 1
          fi
          git commit -m "fix(kashf): repair p205 love source mapping"
          git push origin HEAD:main
