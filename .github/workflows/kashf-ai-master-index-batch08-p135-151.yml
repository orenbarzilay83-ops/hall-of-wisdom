name: Kashf AI Master Index Batch08 P135-151

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-ai-master-index-batch08-p135-151.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate patcher
        run: node --check _patch_kashf_ai_master_index_batch08_p135_151.mjs
      - name: Apply Batch08
        run: node _patch_kashf_ai_master_index_batch08_p135_151.mjs
      - name: Validate AI master index
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text=fs.readFileSync('kashf-v57-ai-master-index.html','utf8');
          const m=text.match(/<script id="kashf-ai-master-index-data" type="application\/json">\s*([\s\S]*?)\s*<\/script>/);
          if(!m) throw new Error('master index JSON block missing');
          const data=JSON.parse(m[1]);
          const assert=(c,msg)=>{if(!c) throw new Error(msg)};
          assert(data.schemaVersion==='1.9.0','schema mismatch');
          assert(data.records.length===108,`expected 108 records got ${data.records.length}`);
          assert(new Set(data.records.map(r=>r.entryId)).size===108,'duplicate entryIds');
          const counts=Object.fromEntries(['VERIFIED','INDEXED','REVIEW_REQUIRED','UNRESOLVED'].map(s=>[s,data.records.filter(r=>r.verificationStatus===s).length]));
          assert(counts.VERIFIED===84 && counts.REVIEW_REQUIRED===24 && counts.INDEXED===0 && counts.UNRESOLVED===0,`unexpected counts ${JSON.stringify(counts)}`);
          assert(data.coverage.bookEndPage===151 && data.coverage.scanPdfEndPage===153,'coverage mismatch');
          assert(data.coverage.completedBatches.includes('BATCH08_P135_151'),'batch marker missing');
          assert(data.gateStatus?.gate3PlacementOrders?.distinctOrdersEnumerated===15,'Gate3 order count mismatch');
          assert(data.gateStatus?.gate3PlacementOrders?.sourceClosingClaim===16,'Gate3 source claim mismatch');
          assert(data.gateStatus?.gate3PlacementOrders?.operationalizationDeferred===true,'Gate3 operationalization must stay deferred');

          const p135=data.records.find(r=>r.entryId==='shibutz.p135.planet-letters-utility');
          const byPlanet=(p)=>p135?.planetLetters?.find(x=>x.planet===p)?.lettersArabic?.join('')||'';
          assert(byPlanet('כוכב חמה')==='جيفح','Mercury p135 letters mismatch');
          assert(byPlanet('ירח')==='دكصذ','Moon p135 letters mismatch');
          assert(byPlanet('שבתאי')==='هلقص','Saturn p135 letters mismatch');
          assert(p135.verificationStatus==='REVIEW_REQUIRED' && p135.runtimeEligible===false,'p135 source/v57 review guard lost');

          const seasons=data.records.find(r=>r.entryId==='shibutz.p136-137.season-figure-groups');
          const season=(s)=>seasons.seasonGroups.find(x=>x.season===s)?.patterns||[];
          assert(JSON.stringify(season('אביב'))===JSON.stringify(['2122','1211','2211','1121','2222','2112']),'Spring printed group mismatch');
          assert(JSON.stringify(season('קיץ'))===JSON.stringify(['2212','1111','1122','2121','2112']),'Summer printed group mismatch');
          assert(JSON.stringify(season('חורף'))===JSON.stringify(['1221','2221','2111']),'Winter printed group mismatch');
          assert(JSON.stringify(season('סתיו'))===JSON.stringify(['1121','1211','1222']),'Autumn printed group mismatch');
          assert(season('אביב').length===6,'Spring must preserve six printed figures');
          assert(new Set(season('אביב')).size===6,'Spring duplicate pattern');
          assert(seasons.runtimeEligible===false,'season map must not auto-enable runtime');

          const letters=data.records.find(r=>r.entryId==='shibutz.p138-139.letter-figure-table');
          assert(letters.letterFigureMap.length===16,'letter table must have 16 primary entries');
          assert(letters.letterFigureMap.filter(x=>x.secondary).length===12,'letter table must preserve 12 secondary letters');
          assert(letters.letterFigureMap.find(x=>x.primary==='ا')?.pattern==='1222','Alef mapping mismatch');
          assert(letters.letterFigureMap.find(x=>x.primary==='ع')?.pattern==='1111','Ayn mapping mismatch');

          const o8=data.records.find(r=>r.entryId==='shibutz.p143-144.order8-width');
          assert(o8.reduction.threshold===17 && o8.workedExample.total===18 && o8.workedExample.resultHouse===1,'order8 width rule mismatch');
          const o9=data.records.find(r=>r.entryId==='shibutz.p144-145.order9-depth');
          assert(o9.reduction.subtract===16 && o9.workedExample.resultHouse===2,'order9 depth rule mismatch');
          const o11=data.records.find(r=>r.entryId==='shibutz.p146-147.order11-bzdj');
          assert(o11.elementValues.fire===2 && o11.elementValues.air===7 && o11.elementValues.water===4 && o11.elementValues.earth===8,'order11 values mismatch');
          const o12=data.records.find(r=>r.entryId==='shibutz.p147-149.order12-like-abduh');
          assert(o12.primaryElementValues.fire===3 && o12.primaryElementValues.earth===24,'order12 primary values mismatch');
          assert(o12.quotedAlternative.fire===7 && o12.quotedAlternative.earth===56,'order12 quoted alternative mismatch');
          const o13=data.records.find(r=>r.entryId==='shibutz.p149.order13-damaged-name');
          assert(o13.verificationStatus==='REVIEW_REQUIRED' && o13.nameStatus==='DAMAGED_OR_EDITORIAL','order13 name guard lost');
          const o15=data.records.find(r=>r.entryId==='shibutz.p150-151.order15-ibn-mahfuf');
          assert(o15.algorithmStatus==='SEQUENCE_ONLY_NO_NEW_FORMULA_FOUND' && o15.runtimeEligible===false,'order15 no-invented-formula guard lost');

          assert((data.v57CorrectionQueue||[]).length===22,`expected 22 v57 corrections got ${data.v57CorrectionQueue?.length}`);
          assert((data.downstreamCorrectionQueue||[]).length===20,`expected 20 downstream corrections got ${data.downstreamCorrectionQueue?.length}`);
          assert((data.sourceConflictQueue||[]).length===3,`expected 3 source conflicts got ${data.sourceConflictQueue?.length}`);
          assert(data.v57CorrectionQueue.some(x=>x.id==='B08-P135-PLANET-LETTERS-V57'),'p135 v57 correction missing');
          assert(data.downstreamCorrectionQueue.some(x=>x.id==='B08-SHIB-5-SEASON-MAP-SOURCE-CORRECTION'),'season downstream correction missing');
          assert(data.sourceConflictQueue.some(x=>x.id==='B08-SOURCE-P151-SIXTEEN-VS-FIFTEEN'),'p151 count conflict missing');
          console.log('Batch08 validation PASS',counts,'records',data.records.length,'v57Queue',data.v57CorrectionQueue.length,'downstreamQueue',data.downstreamCorrectionQueue.length,'sourceConflicts',data.sourceConflictQueue.length);
          NODE
      - name: Commit Batch08 index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kashf-v57-ai-master-index.html
          if git diff --cached --quiet; then echo 'No index changes'; exit 1; fi
          git commit -m "feat(kashf): index and verify source pages 135-151"
          git push origin HEAD:main
