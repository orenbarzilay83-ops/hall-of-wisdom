name: Kashf P17 Fix Test Log

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-p17-fix-test-log.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-log:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Move test summary after P17 assertions
        run: node _fix_kashf_p17_test_log_order.mjs
      - name: Run Kashf canonical routing contract
        run: node _test_kashf_canonical_routing.mjs
      - name: Audit Question Bank route coverage
        run: node _audit_kashf_question_route_coverage.mjs
      - name: Commit test-log ordering fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _test_kashf_canonical_routing.mjs
          if git diff --cached --quiet; then
            echo "No test changes to commit"
            exit 1
          fi
          git commit -m "test(kashf): include p265 assertions in test summary"
          git push origin HEAD:main
