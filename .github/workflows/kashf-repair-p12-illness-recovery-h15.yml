name: Repair Kashf P12 Illness Recovery H15

on:
  push:
    branches: [main]
    paths:
      - '_repair_kashf_p12_illness_recovery_h15.mjs'
      - '.github/workflows/kashf-repair-p12-illness-recovery-h15.yml'

permissions:
  contents: write

jobs:
  repair-p12:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair and apply P12 illness recovery cutover
        run: node _repair_kashf_p12_illness_recovery_h15.mjs
      - name: Commit P12 canonical changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _apply_kashf_p12_illness_recovery_h15.mjs goral-hachol/engine/kashf-canonical-executors.js goral-hachol/registry/kashf-canonical-method-registry.js _test_kashf_canonical_routing.mjs HALL_WISDOM_KASHF_P196_ILLNESS_RECOVERY_AUDIT.md
          git commit -m "feat(kashf): enable p196 H15 illness recovery executor"
          git push
