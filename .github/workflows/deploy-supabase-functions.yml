name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - claude/app-cleanup-organization-mia9b2
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy oren-smart-advisor
        run: supabase functions deploy oren-smart-advisor --project-ref hfdsoudhelzayimjwqkp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
