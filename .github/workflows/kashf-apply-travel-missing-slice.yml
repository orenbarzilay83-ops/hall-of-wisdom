name: Apply Kashf Travel Missing Slice

on:
  push:
    branches: [main]
    paths:
      - '_apply_kashf_travel_missing_slice.mjs'
      - '.github/workflows/kashf-apply-travel-missing-slice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Align missing-person acceptance test with provenance correction
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('_test_kashf_canonical_routing.mjs')
          s = p.read_text()
          old = "kashfMethodId: 'missing.p248.aliveOrDead',\n  kashfRuntimeStatus: 'repair-required',"
          new = "kashfMethodId: 'missing.p248-249.lifeH1H4H9Outcome',\n  kashfRuntimeStatus: 'ready',"
          if old not in s:
              raise SystemExit('missing-person acceptance-test pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply canonical travel/missing patch and run tests
        run: node _apply_kashf_travel_missing_slice.mjs

      - name: Commit registry updates
        run: |
          if git diff --quiet; then
            echo "No registry changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goral-hachol/registry/kashf-canonical-method-registry.js goral-hachol/registry/kashf-question-route-registry.js _test_kashf_canonical_routing.mjs
          git commit -m "feat(kashf): route travel and missing canonical slice"
          git push
