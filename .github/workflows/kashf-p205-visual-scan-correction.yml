name: Kashf p205 Visual Scan Correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-p205-visual-scan-correction.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate patcher
        run: node --check _patch_kashf_p205_scan_correction.mjs
      - name: Apply p205 visual-scan correction
        run: node _patch_kashf_p205_scan_correction.mjs
      - name: Syntax checks
        run: |
          node --check goral-hachol/registry/kashf-v57-knowledge-registry.js
          node --check goral-hachol/registry/kashf-canonical-method-registry.js
          node --check goral-hachol/registry/kashf-question-route-registry.js
          node --check goral-hachol/registry/kashf-ai-retrieval-index.js
          node --check goral-hachol/intelligence/kashf-professional-verdict-safety.js
          node --check _test_kashf_ai_retrieval_index.mjs
          node --check _test_kashf_canonical_routing.mjs
          node --check _test_kashf_ai_retrieval_live_bridge.mjs
      - name: P205 source identity audit
        run: |
          node --input-type=module <<'NODE'
          import { getKashfMethod } from './goral-hachol/registry/kashf-canonical-method-registry.js';
          import { getKashfV57Knowledge } from './goral-hachol/registry/kashf-v57-knowledge-registry.js';
          import { getKashfAiRetrievalRecord } from './goral-hachol/registry/kashf-ai-retrieval-index.js';
          const id = 'love.p205.directLoveH1PlacementH15';
          const wrong = 'love.p205.directLoveH1PlacementH5Relation';
          const method = getKashfMethod(id);
          const knowledge = getKashfV57Knowledge(id);
          const retrieval = getKashfAiRetrievalRecord(id);
          if (!method || !knowledge || !retrieval) throw new Error('source-correct p205 H15 identity missing from canonical layers');
          if (getKashfMethod(wrong) || getKashfV57Knowledge(wrong) || getKashfAiRetrievalRecord(wrong)) throw new Error('mistaken p205 H5 identity still present');
          if (!knowledge.v57.hebrewRule.includes('בית החמישה־עשר')) throw new Error('p205 v57 does not preserve H15');
          if (JSON.stringify(retrieval.houses) !== JSON.stringify([1,15])) throw new Error('p205 retrieval scope is not H1+H15');
          if (method.kashfRuntimeStatus !== 'repair-required' || method.runtimeAllowed !== false || method.executorStatus !== 'pending') throw new Error('p205 must remain fail-closed');
          console.log('p205 visual source identity audit: H15 restored, fail-closed preserved');
          NODE
      - name: Canonical routing regression
        run: node _test_kashf_canonical_routing.mjs
      - name: Question route coverage
        run: node _audit_kashf_question_route_coverage.mjs
      - name: AI retrieval regression
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: Canonical AI live bridge regression
        run: node _test_kashf_ai_retrieval_live_bridge.mjs
      - name: Professional Verdict Safety regression
        run: node _test_kashf_professional_verdict_safety.mjs
      - name: AI context builder regression
        run: node _test_kashf_ai_context_builder.mjs
      - name: Method isolation regression
        run: node _test_kashf_hawi_method_isolation.mjs
      - name: Structured output regression
        run: node _test_kashf_structured_tool_output.mjs
      - name: Advisor payload regression
        run: node _test_oren_smart_advisor_kashf_reading_payload.mjs
      - name: Commit p205 correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            goral-hachol/registry/kashf-v57-knowledge-registry.js \
            goral-hachol/registry/kashf-canonical-method-registry.js \
            goral-hachol/registry/kashf-question-route-registry.js \
            goral-hachol/registry/kashf-ai-retrieval-index.js \
            goral-hachol/intelligence/kashf-professional-verdict-safety.js \
            _test_kashf_ai_retrieval_index.mjs \
            _test_kashf_canonical_routing.mjs \
            _test_kashf_ai_retrieval_live_bridge.mjs \
            HALL_WISDOM_KASHF_REMAINING_7_SOURCE_CLOSURE_AUDIT.md
          if git diff --cached --quiet; then
            echo "No p205 correction changes to commit"
            exit 1
          fi
          git commit -m "fix(kashf): restore p205 H15 from visual scan"
          git push origin HEAD:main
