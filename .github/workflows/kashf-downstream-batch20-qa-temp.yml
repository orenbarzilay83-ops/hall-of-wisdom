name: Kashf Downstream Batch20 QA Temp

on:
  push:
    branches:
      - chatgpt/kashf-downstream-batch05-p100-101-months

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check goral-hachol/registry/kashf-canonical-method-registry.js
          node --check goral-hachol/registry/kashf-question-route-registry.js
          node --check goral-hachol/registry/kashf-v57-knowledge-registry.js
          node --check goral-hachol/registry/kashf-ai-retrieval-index.js
          node --check goral-hachol/ui/question-bank.js
          node --check _test_kashf_house4_hidden_boundaries_p185_191.mjs
      - name: Batch20 House4 hidden boundaries
        run: node _test_kashf_house4_hidden_boundaries_p185_191.mjs
      - name: Batch19 House3 + property boundaries
        run: node _test_kashf_house3_property_boundaries_p183_185.mjs
      - name: Batch18 p179-182 House2 boundaries
        run: node _test_kashf_house2_runtime_boundaries_p179_182.mjs
      - name: Batch17 House1 p172-178 boundaries
        run: node _test_kashf_house1_intent_boundaries_p172_178.mjs
      - name: Batch16 House1 p166-172 boundaries
        run: node _test_kashf_house1_intent_boundaries_p166_172.mjs
      - name: Canonical routing
        run: node _test_kashf_canonical_routing.mjs
      - name: AI retrieval index
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: AI retrieval live bridge
        run: node _test_kashf_ai_retrieval_live_bridge.mjs
      - name: Professional verdict safety
        run: node _test_kashf_professional_verdict_safety.mjs
      - name: Book rule catalog
        run: node _test_kashf_book_rule_catalog.mjs
      - name: Rule applicability
        run: node _test_goral_rule_applicability.mjs
      - name: Hawi method isolation
        run: node _test_kashf_hawi_method_isolation.mjs
      - name: Route coverage
        run: node _audit_kashf_question_route_coverage.mjs
