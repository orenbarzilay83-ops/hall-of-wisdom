name: tmp-kashf-rr-count
on:
  push:
    branches: [tmp/kashf-rr-count]
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Pass2 numbering and current statuses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,collections
          h=Path('KASHF_AI_MASTER_INDEX_CONTINUATION_HANDOFF.md').read_text(encoding='utf-8')
          t=Path('kashf-v57-ai-master-index.html').read_text(encoding='utf-8')
          d=json.loads(re.search(r'<script id="kashf-ai-master-index-data" type="application/json">\s*(.*?)\s*</script>',t,re.S).group(1))
          status={r['entryId']:r['verificationStatus'] for r in d['records']}
          rows=[]
          for line in h.splitlines():
              m=re.match(r'^(\d+)\. `([^`]+)` — (.*)$',line)
              if m and 1<=int(m.group(1))<=66:
                  n=int(m.group(1)); eid=m.group(2); tail=m.group(3)
                  cm=re.search(r'סיווג \*\*(.+?)\*\*',tail)
                  rows.append((n,eid,cm.group(1) if cm else 'NO_CLASS',status.get(eid,'MISSING')))
          print('ROWS',len(rows))
          nums={n for n,_,_,_ in rows}
          print('MISSING_NUMBERS',[n for n in range(1,67) if n not in nums])
          print('DUP_NUMBERS',[n for n,c in collections.Counter(n for n,_,_,_ in rows).items() if c>1])
          print('CLASS_COUNTS',dict(collections.Counter(c for _,_,c,_ in rows)))
          print('STATUS_COUNTS',dict(collections.Counter(s for *_,s in rows)))
          print('NO_CLASS_ROWS')
          for row in rows:
              if row[2]=='NO_CLASS': print(row)
          print('REVIEW_ROWS_BY_CLASS')
          cc=collections.Counter(c for _,_,c,s in rows if s=='REVIEW_REQUIRED')
          print(dict(cc))
          print('REVIEW_ROWS_TOTAL',sum(cc.values()))
          print('ALL_RR',sum(1 for s in status.values() if s=='REVIEW_REQUIRED'))
          print('UNREVIEWED_RR',89-sum(cc.values()))
          PY
