name: tmp-kashf-rr-count
on:
  push:
    branches: [tmp/kashf-rr-count]
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count Pass2 decision classes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,collections,json
          handoff=Path('KASHF_AI_MASTER_INDEX_CONTINUATION_HANDOFF.md').read_text(encoding='utf-8')
          txt=Path('kashf-v57-ai-master-index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="kashf-ai-master-index-data" type="application/json">\s*(.*?)\s*</script>',txt,re.S)
          d=json.loads(m.group(1))
          rr=[r for r in d['records'] if r.get('verificationStatus')=='REVIEW_REQUIRED']
          decisions=[]
          for line in handoff.splitlines():
              mm=re.match(r'^(\d+)\. `([^`]+)` — סיווג \*\*(.+?)\*\*',line)
              if mm and 1<=int(mm.group(1))<=66:
                  decisions.append((int(mm.group(1)),mm.group(2),mm.group(3)))
          print('DECISIONS',len(decisions))
          c=collections.Counter(label for _,_,label in decisions)
          for k,v in sorted(c.items()): print('LABEL',repr(k),v)
          print('--- IDS BY LABEL ---')
          for label in sorted(c):
              print('\n',label)
              for n,e,l in decisions:
                  if l==label: print(n,e)
          print('\nTOTAL_RR',len(rr))
          print('UNAUDITED_BY_HANDOFF',24)
          print('CURRENT_RR_AMONG_DECISIONS',sum(1 for _,eid,_ in decisions if any(r['entryId']==eid for r in rr)))
          PY
