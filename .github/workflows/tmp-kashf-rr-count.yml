name: tmp-kashf-rr-count
on:
  push:
    branches: [tmp/kashf-rr-count]
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find current RR not covered by Pass2 decision ids
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          h=Path('KASHF_AI_MASTER_INDEX_CONTINUATION_HANDOFF.md').read_text(encoding='utf-8')
          t=Path('kashf-v57-ai-master-index.html').read_text(encoding='utf-8')
          d=json.loads(re.search(r'<script id="kashf-ai-master-index-data" type="application/json">\s*(.*?)\s*</script>',t,re.S).group(1))
          ids=set()
          for line in h.splitlines():
              m=re.match(r'^(\d+)\. `([^`]+)` — ',line)
              if m and 1<=int(m.group(1))<=66: ids.add(m.group(2))
          rr=[r for r in d['records'] if r.get('verificationStatus')=='REVIEW_REQUIRED']
          missing=[r for r in rr if r['entryId'] not in ids]
          print('MISSING_RR',len(missing))
          for r in missing: print(r['entryId'],r.get('bookPages'),r.get('methodStatus'))
          print('MISSING_RR_LE194')
          for r in missing:
              if min(r.get('bookPages',[9999]))<=194: print(r['entryId'],r.get('bookPages'),r.get('methodStatus'))
          PY
