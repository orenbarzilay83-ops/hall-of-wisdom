name: Apply Kashf P12 Hidden Still-There Executor

on:
  push:
    branches: [main]
    paths:
      - '_apply_kashf_p12_hidden_still_there_executor.mjs'
      - '.github/workflows/kashf-apply-p12-hidden-still-there-executor.yml'

permissions:
  contents: write

jobs:
  apply-p12:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply P12 executor and run contracts
        run: node _apply_kashf_p12_hidden_still_there_executor.mjs
      - name: Commit P12 canonical changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goral-hachol/engine/kashf-canonical-executors.js goral-hachol/registry/kashf-canonical-method-registry.js goral-hachol/ui/question-bank.js _test_kashf_canonical_routing.mjs
          git commit -m "feat(kashf): enable hidden-item p188 executor"
          git push
