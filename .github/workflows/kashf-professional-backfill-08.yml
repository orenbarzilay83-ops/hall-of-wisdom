name: Kashf Professional Backfill 08
# bootstrap-retry: 2

on:
  push:
    paths:
      - '.github/workflows/kashf-professional-backfill-08.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair patcher syntax
        run: |
          node --check _repair_kashf_professional_backfill_08_patcher.mjs
          node _repair_kashf_professional_backfill_08_patcher.mjs
      - name: Validate patcher
        run: node --check _patch_kashf_professional_backfill_08.mjs
      - name: Apply professional backfill batch 08
        run: node _patch_kashf_professional_backfill_08.mjs
      - name: Syntax checks
        run: |
          node --check goral-hachol/intelligence/kashf-professional-verdict-safety.js
          node --check goral-hachol/engine/kashf-canonical-executors.js
          node --check goral-hachol/registry/kashf-v57-knowledge-registry.js
          node --check _test_kashf_professional_verdict_safety.mjs
      - name: Professional Verdict Safety backfill tests
        run: node _test_kashf_professional_verdict_safety.mjs
      - name: Canonical routing regression
        run: node _test_kashf_canonical_routing.mjs
      - name: Question route coverage
        run: node _audit_kashf_question_route_coverage.mjs
      - name: AI retrieval regression
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: Canonical AI live bridge regression
        run: node _test_kashf_ai_retrieval_live_bridge.mjs
      - name: AI context builder regression
        run: node _test_kashf_ai_context_builder.mjs
      - name: Method isolation regression
        run: node _test_kashf_hawi_method_isolation.mjs
      - name: Structured output regression
        run: node _test_kashf_structured_tool_output.mjs
      - name: Advisor payload regression
        run: node _test_oren_smart_advisor_kashf_reading_payload.mjs
      - name: Commit professional backfill batch 08
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            goral-hachol/registry/kashf-v57-knowledge-registry.js \
            goral-hachol/engine/kashf-canonical-executors.js \
            goral-hachol/intelligence/kashf-professional-verdict-safety.js \
            _test_kashf_professional_verdict_safety.mjs \
            HALL_WISDOM_KASHF_PROFESSIONAL_VERDICT_BACKFILL_STATUS.md \
            HALL_WISDOM_PROFESSIONAL_VERDICT_SAFETY_WORK_ORDER.md
          if git diff --cached --quiet; then
            echo "No backfill changes to commit"
            exit 1
          fi
          git commit -m "feat(kashf): certify p179 money-source after raw-scan closure"
          git push origin HEAD:main
