name: Apply Kashf P7 Authority Planet Executors

on:
  push:
    branches: [main]
    paths:
      - '_apply_kashf_p7_authority_planet_executors.mjs'
      - '.github/workflows/kashf-apply-p7-authority-planet-executors.yml'

permissions:
  contents: write

jobs:
  apply-authority-planet-executors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply authority planet executors and run contracts
        run: node _apply_kashf_p7_authority_planet_executors.mjs
      - name: Commit canonical executor cutover
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goral-hachol/engine/kashf-canonical-executors.js goral-hachol/registry/kashf-canonical-method-registry.js _test_kashf_canonical_routing.mjs
          git commit -m "feat(kashf): enable authority planet canonical executors"
          git push
