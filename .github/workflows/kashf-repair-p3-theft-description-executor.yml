name: Repair Kashf P3 Thief-Description Executor

on:
  push:
    branches: [main]
    paths:
      - '_repair_kashf_p3_theft_description_executor.mjs'
      - '.github/workflows/kashf-repair-p3-theft-description-executor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-thief-description-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repair contract and apply thief-description canonical executor
        run: node _repair_kashf_p3_theft_description_executor.mjs

      - name: Commit canonical executor cutover
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goral-hachol/engine/kashf-canonical-executors.js goral-hachol/engine/kashf-canonical-reading-engine.js goral-hachol/registry/kashf-canonical-method-registry.js _test_kashf_canonical_routing.mjs
          git commit -m "feat(kashf): enable thief-description canonical executor"
          git push
