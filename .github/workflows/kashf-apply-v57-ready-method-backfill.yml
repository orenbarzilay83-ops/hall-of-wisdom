name: Apply Kashf v57 Source-ready Hebrew Backfill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-apply-v57-ready-method-backfill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v57-ready-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply backfill and run contracts
        run: node _apply_kashf_v57_ready_method_backfill.mjs
      - name: Commit permanent v57 source-ready changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goral-hachol/registry/kashf-v57-knowledge-registry.js \
                  goral-hachol/registry/kashf-canonical-method-registry.js \
                  goral-hachol/registry/kashf-question-route-registry.js \
                  _test_kashf_canonical_routing.mjs \
                  .github/workflows/kashf-canonical-routing-tests.yml \
                  HALL_WISDOM_KASHF_V57_READY_METHOD_BACKFILL.md
          git commit -m "feat(kashf): backfill v57 Hebrew for source-ready methods"
          git push
