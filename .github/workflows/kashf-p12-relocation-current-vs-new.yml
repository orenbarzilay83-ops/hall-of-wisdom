name: Kashf P12 p183 Relocation Current vs New

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-p12-relocation-current-vs-new.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply p183 relocation patch
        run: |
          node _patch_kashf_p12_relocation_current_vs_new.mjs
          node _repair_kashf_p12_relocation_current_vs_new.mjs

      - name: Run Kashf canonical routing contract
        run: node _test_kashf_canonical_routing.mjs

      - name: Audit Question Bank route coverage
        run: node _audit_kashf_question_route_coverage.mjs

      - name: Commit source-safe p183 relocation executor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            goral-hachol/registry/kashf-canonical-method-registry.js \
            goral-hachol/engine/kashf-canonical-executors.js \
            _test_kashf_canonical_routing.mjs
          if git diff --cached --quiet; then
            echo "No core changes to commit"
            exit 1
          fi
          git commit -m "feat(kashf): implement p183 relocation place executor"
          git push origin HEAD:main
