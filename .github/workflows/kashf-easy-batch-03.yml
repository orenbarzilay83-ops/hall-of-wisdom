name: Kashf Easy Batch 03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-easy-batch-03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate batch patcher syntax
        run: node --check _patch_kashf_easy_batch_03.mjs
      - name: Apply easy batch 03
        run: node _patch_kashf_easy_batch_03.mjs
      - name: Fix unresolved missing-person fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('_test_kashf_canonical_routing.mjs')
          s = path.read_text()
          old = "makeP204Board({ 1: '1222', 4: '1112', 9: '1222', 15: '2112' }), 'q-missing-alive'"
          new = "makeP204Board({ 1: '1222', 4: '1112', 6: '1222', 7: '1222', 8: '1222', 9: '1222', 15: '2112' }), 'q-missing-alive'"
          if old not in s:
              raise SystemExit('Missing unresolved fixture anchor')
          path.write_text(s.replace(old, new, 1))
          PY
      - name: Validate canonical executor syntax
        run: node --check goral-hachol/engine/kashf-canonical-executors.js
      - name: Run canonical routing contract
        run: node _test_kashf_canonical_routing.mjs
      - name: Audit question-route coverage
        run: node _audit_kashf_question_route_coverage.mjs
      - name: Run AI retrieval contract
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: Run canonical AI live bridge contract
        run: node _test_kashf_ai_retrieval_live_bridge.mjs
      - name: Run AI context builder regression
        run: node _test_kashf_ai_context_builder.mjs

      - name: Commit easy batch 03
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            goral-hachol/registry/kashf-canonical-method-registry.js \
            goral-hachol/registry/kashf-ai-retrieval-index.js \
            goral-hachol/engine/kashf-canonical-executors.js \
            goral-hachol/ui/question-bank.js \
            _test_kashf_canonical_routing.mjs \
            _test_kashf_ai_retrieval_index.mjs \
            _test_kashf_ai_retrieval_live_bridge.mjs
          if git diff --cached --quiet; then
            echo "No core changes to commit"
            exit 1
          fi
          git commit -m "feat(kashf): implement easy batch 03"
          git push origin HEAD:main
