name: Kashf AI Retrieval Index Tests

on:
  push:
    branches: [main]
    paths:
      - 'goral-hachol/registry/kashf-ai-retrieval-index.js'
      - '_test_kashf_ai_retrieval_index.mjs'
      - '.github/workflows/kashf-ai-retrieval-index-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run AI retrieval index contract
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: Run canonical routing contract
        run: node _test_kashf_canonical_routing.mjs
      - name: Audit question-route coverage
        run: node _audit_kashf_question_route_coverage.mjs
