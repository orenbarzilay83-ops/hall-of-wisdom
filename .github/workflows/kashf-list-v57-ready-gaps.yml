name: List Kashf v57 Ready Gaps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-list-v57-ready-gaps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: List source-ready methods missing v57 Hebrew knowledge
        run: |
          node --input-type=module <<'NODE'
          import { KASHF_CANONICAL_METHODS } from './goral-hachol/registry/kashf-canonical-method-registry.js';
          import { KASHF_V57_KNOWLEDGE } from './goral-hachol/registry/kashf-v57-knowledge-registry.js';
          const ready = Object.values(KASHF_CANONICAL_METHODS)
            .filter((m) => m.kashfRuntimeStatus === 'ready' && m.methodRole === 'canonical-operational')
            .sort((a,b)=>a.kashfMethodId.localeCompare(b.kashfMethodId));
          const missing = ready.filter((m) => !KASHF_V57_KNOWLEDGE[m.kashfMethodId]);
          console.log('SOURCE_READY_COUNT=' + ready.length);
          console.log('V57_READY_COVERED=' + (ready.length - missing.length));
          console.log('V57_READY_MISSING=' + missing.length);
          for (const m of missing) {
            console.log(JSON.stringify({id:m.kashfMethodId,intent:m.kashfIntentId,pages:m.sourcePages,executionKind:m.executionKind,executorStatus:m.executorStatus,runtimeAllowed:m.runtimeAllowed,notes:m.notes}));
          }
          NODE
