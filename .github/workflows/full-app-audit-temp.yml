name: Full App Audit Temp

on:
  push:
    branches:
      - chatgpt/kashf-downstream-batch05-p100-101-months

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repository sanity
        run: |
          git status --short
          git fsck --no-reflogs --unreachable --no-progress
          test -f calculator.html
          test -f goral-hachol.html
          test -d goral-hachol
          test -d supabase

      - name: JavaScript syntax sweep
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            node --check "$f" >/dev/null
            count=$((count+1))
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -not -path './node_modules/*' -print0)
          echo "Syntax OK: $count JS/MJS files"

      - name: Key HTML local-reference audit
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          pages = [Path(x) for x in ['index.html','calculator.html','goral-hachol.html','cards.html','myseal.html'] if Path(x).exists()]
          missing = []
          checked = 0
          pat = re.compile(r'''(?:src|href)\s*=\s*["']([^"']+)["']''', re.I)
          for page in pages:
              text = page.read_text('utf-8', errors='ignore')
              for ref in pat.findall(text):
                  ref = ref.strip()
                  if not ref or ref.startswith(('#','http://','https://','mailto:','tel:','javascript:','data:','//')):
                      continue
                  clean = ref.split('#',1)[0].split('?',1)[0]
                  if not clean:
                      continue
                  # Only check repository-file references, not route-like links.
                  if '.' not in Path(clean).name:
                      continue
                  target = Path(clean.lstrip('/')) if clean.startswith('/') else (page.parent / clean)
                  checked += 1
                  if not target.exists():
                      missing.append((str(page), ref, str(target)))
          print(f"Checked {checked} local references across {len(pages)} key pages")
          if missing:
              print("Missing local references:")
              for row in missing:
                  print("  ", row)
              sys.exit(1)

      - name: Static page smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 >/tmp/hall-http.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          sleep 1
          for p in index.html calculator.html goral-hachol.html cards.html myseal.html; do
            if [ -f "$p" ]; then
              code=$(curl -sS -o /tmp/page.out -w '%{http_code}' "http://127.0.0.1:8123/$p")
              echo "$p -> $code"
              test "$code" = "200"
              test -s /tmp/page.out
            fi
          done

      - name: Full local regression sweep
        shell: bash
        run: |
          set +e
          failed=0
          passed=0
          skipped=0
          echo "Skipping only _test_oren_smart_advisor_kashf_live_runner.mjs: it explicitly requires a real JWT + real payload and is not a repository-local CI test."
          for f in _test_*.mjs _audit_*.mjs; do
            [ -f "$f" ] || continue
            if [ "$f" = "_test_oren_smart_advisor_kashf_live_runner.mjs" ]; then
              skipped=$((skipped+1))
              continue
            fi
            echo "::group::$f"
            node "$f"
            rc=$?
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              passed=$((passed+1))
            else
              echo "FAILED: $f (exit $rc)"
              failed=$((failed+1))
            fi
          done
          echo "Regression summary: passed=$passed failed=$failed skipped=$skipped"
          test $failed -eq 0
