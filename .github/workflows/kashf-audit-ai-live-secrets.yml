name: Audit AI Live Secret Names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-audit-ai-live-secrets.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: '2.116.0'
      - name: Check required secret names without printing values
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets list --project-ref hfdsoudhelzayimjwqkp --output json > /tmp/supabase-secrets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/supabase-secrets.json').read_text())
          names = set()
          def walk(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key.lower() in {'name', 'key'} and isinstance(item, str):
                          names.add(item)
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
          walk(data)
          required = ['ALLOWED_OREN_UID', 'ANTHROPIC_API_KEY', 'ANTHROPIC_MODEL', 'HALL_WISDOM_AI_MODE']
          found = [name for name in required if name in names]
          missing = [name for name in required if name not in names]
          print('FOUND_REQUIRED_SECRET_NAMES=' + ','.join(found))
          print('MISSING_REQUIRED_SECRET_NAMES=' + ','.join(missing))
          print('AI_LIVE_SECRET_NAMES_READY=' + ('true' if not missing else 'false'))
          PY
