name: Kashf Downstream Batch11 QA Temp

on:
  push:
    branches:
      - chatgpt/kashf-downstream-batch05-p100-101-months

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check goral-hachol/data/sources/kashf-al-asrar/kashf-shibutzim.js
          node --check goral-hachol/engine/kashf-dhamir.js
          node --check goral-hachol/engine/kashf-reading-engine.js
          node --check goral-hachol/engine/kashf-leshon-hainyan.js
          node --check goral-hachol/brain/goral-rule-applicability-matrix.js
          node --check goral-hachol/brain/goral-knowledge-registry.js
          node --check _test_kashf_dhamir_runtime_precedence_wave.mjs
      - name: Batch11 Dhamir runtime precedence
        run: node _test_kashf_dhamir_runtime_precedence_wave.mjs
      - name: Batch10 Dhamir need-driven
        run: node _test_kashf_dhamir_need_driven_p121_123.mjs
      - name: Rule applicability
        run: node _test_goral_rule_applicability.mjs
      - name: Brain phase4
        run: node _test_goral_knowledge_decision_brain_phase4.mjs
      - name: Brain phase2
        run: node _test_goral_qa_brain_phase2.mjs
      - name: Book rule catalog
        run: node _test_kashf_book_rule_catalog.mjs
      - name: Hawi method isolation
        run: node _test_kashf_hawi_method_isolation.mjs
      - name: AI context builder
        run: node _test_kashf_ai_context_builder.mjs
      - name: AI retrieval index
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: AI retrieval live bridge
        run: node _test_kashf_ai_retrieval_live_bridge.mjs
      - name: Professional verdict safety
        run: node _test_kashf_professional_verdict_safety.mjs
      - name: Canonical routing
        run: node _test_kashf_canonical_routing.mjs
      - name: Route coverage
        run: node _audit_kashf_question_route_coverage.mjs
      - name: Prior downstream regressions
        run: |
          node _test_kashf_attributed_methods_reference_only.mjs
          node _test_kashf_lisan_structure_p112.mjs
          node _test_kashf_essential_dignities_table.mjs
          node _test_kashf_joy_grief_supplement_p100.mjs
          node _test_kashf_month_associations_p100_101.mjs
          node _test_kashf_partners_witnesses_p101_102.mjs
          node _test_kashf_money_table_p111.mjs
