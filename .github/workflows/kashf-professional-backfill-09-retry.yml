name: Kashf Professional Backfill 09 Retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-professional-backfill-09-retry.yml'

permissions:
  contents: write

jobs:
  repair-apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair batch 09 method-notes anchor in workspace
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = '_patch_kashf_professional_backfill_09.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const stale = "    notes: 'Canonical thief-description executor is wired from H7 using the source-backed figure-description table.',";
          const actual = "    notes: 'Body-source instruction takes the thief description from H7 and its figure, with H10 used for location/context. This yields a descriptive profile/letters, not a certain real-world identity or accusation.',";
          if (!text.includes(stale)) throw new Error('stale p225 method-notes patch anchor not found');
          text = text.replace(stale, actual);
          fs.writeFileSync(path, text, 'utf8');
          NODE
      - name: Validate patcher
        run: node --check _patch_kashf_professional_backfill_09.mjs
      - name: Apply professional backfill batch 09
        run: node _patch_kashf_professional_backfill_09.mjs
      - name: Syntax checks
        run: |
          node --check goral-hachol/engine/kashf-canonical-executors.js
          node --check goral-hachol/engine/kashf-pending-extraction.js
          node --check goral-hachol/registry/kashf-canonical-method-registry.js
          node --check goral-hachol/registry/kashf-v57-knowledge-registry.js
          node --check goral-hachol/registry/kashf-ai-retrieval-index.js
          node --check goral-hachol/intelligence/kashf-professional-verdict-safety.js
          node --check _test_kashf_professional_verdict_safety.mjs
      - name: Professional Verdict Safety tests
        run: node _test_kashf_professional_verdict_safety.mjs
      - name: Canonical routing regression
        run: node _test_kashf_canonical_routing.mjs
      - name: Question route coverage
        run: node _audit_kashf_question_route_coverage.mjs
      - name: AI retrieval regression
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: Canonical AI live bridge regression
        run: node _test_kashf_ai_retrieval_live_bridge.mjs
      - name: AI context builder regression
        run: node _test_kashf_ai_context_builder.mjs
      - name: Method isolation regression
        run: node _test_kashf_hawi_method_isolation.mjs
      - name: Structured output regression
        run: node _test_kashf_structured_tool_output.mjs
      - name: Advisor payload regression
        run: node _test_oren_smart_advisor_kashf_reading_payload.mjs
      - name: Commit batch 09
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            goral-hachol/engine/kashf-canonical-executors.js \
            goral-hachol/engine/kashf-pending-extraction.js \
            goral-hachol/registry/kashf-canonical-method-registry.js \
            goral-hachol/registry/kashf-v57-knowledge-registry.js \
            goral-hachol/registry/kashf-ai-retrieval-index.js \
            goral-hachol/intelligence/kashf-professional-verdict-safety.js \
            _test_kashf_professional_verdict_safety.mjs \
            HALL_WISDOM_KASHF_PROFESSIONAL_VERDICT_BACKFILL_STATUS.md
          if git diff --cached --quiet; then
            echo "No batch 09 changes to commit"
            exit 1
          fi
          git commit -m "feat(kashf): certify p225 thief profile from source table"
          git push origin HEAD:main
