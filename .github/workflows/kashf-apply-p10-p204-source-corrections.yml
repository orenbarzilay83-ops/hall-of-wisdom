name: Apply Kashf P10 p204 Source Corrections

on:
  push:
    branches: [main]
    paths:
      - '_apply_kashf_p10_p204_source_corrections.mjs'
      - '.github/workflows/kashf-apply-p10-p204-source-corrections.yml'

permissions:
  contents: write

jobs:
  apply-p10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply p204 corrections and run contracts
        run: node _apply_kashf_p10_p204_source_corrections.mjs
      - name: Commit p204 canonical corrections
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goral-hachol/engine/kashf-canonical-executors.js goral-hachol/registry/kashf-canonical-method-registry.js goral-hachol/registry/kashf-question-route-registry.js goral-hachol/ui/question-bank.js _test_kashf_canonical_routing.mjs
          git commit -m "fix(kashf): correct p204 status and dowry rules"
          git push
