name: Apply Kashf P1 Profession Executor

on:
  push:
    branches: [main]
    paths:
      - '_apply_kashf_p1_profession_executor.mjs'
      - '.github/workflows/kashf-apply-p1-profession-executor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-profession-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repair temporary patch-script quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('_apply_kashf_p1_profession_executor.mjs')
          lines = p.read_text().splitlines()
          changed = False
          for i, line in enumerate(lines):
              if 'sourceRef:' in line and "method.sourcePages.join('–')" in line:
                  lines[i] = "      sourceRef: 'כשף אל-אסרר, עמ׳ ' + method.sourcePages.join('–'),\\n"
                  changed = True
                  break
          if not changed:
              raise SystemExit('temporary sourceRef line not found')
          p.write_text('\n'.join(lines) + '\n')
          PY

      - name: Apply profession canonical executor and run contracts
        run: node _apply_kashf_p1_profession_executor.mjs

      - name: Commit canonical executor cutover
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goral-hachol/engine/kashf-canonical-reading-engine.js goral-hachol/registry/kashf-canonical-method-registry.js _test_kashf_canonical_routing.mjs
          git commit -m "feat(kashf): enable profession p254 canonical executor"
          git push
