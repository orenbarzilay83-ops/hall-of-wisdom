name: Apply Kashf P1 Profession Executor

on:
  push:
    branches: [main]
    paths:
      - '_apply_kashf_p1_profession_executor_v2.mjs'
      - 'goral-hachol/engine/kashf-canonical-executors.js'
      - '.github/workflows/kashf-apply-p1-profession-executor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-profession-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply profession canonical executor and run contracts
        run: node _apply_kashf_p1_profession_executor_v2.mjs

      - name: Commit canonical executor cutover
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goral-hachol/engine/kashf-canonical-reading-engine.js goral-hachol/registry/kashf-canonical-method-registry.js _test_kashf_canonical_routing.mjs
          git commit -m "feat(kashf): enable profession p254 canonical executor"
          git push
