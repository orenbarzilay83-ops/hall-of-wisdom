name: Temporary Kashf Super Audit Clean Repair

on:
  push:
    branches:
      - codex/kashf-index-super-audit-work
    paths:
      - .github/workflows/temp-kashf-super-audit-clean.yml
      - .tmp_kashf_clean_audit.py

permissions:
  contents: write

jobs:
  clean-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/kashf-index-super-audit-work
      - name: Apply and validate minimal audit repairs
        run: python3 .tmp_kashf_clean_audit.py
      - name: Commit clean audit output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kashf-v57-ai-master-index.html KASHF_AI_MASTER_INDEX_SUPER_AUDIT_FINAL.md
          if git diff --cached --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "fix(kashf): repair source traceability from super audit"
          git push origin HEAD:codex/kashf-index-super-audit-work
