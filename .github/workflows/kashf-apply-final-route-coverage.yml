name: Apply Kashf Final Route Coverage

on:
  push:
    branches: [main]
    paths:
      - '_apply_kashf_final_route_coverage.mjs'
      - '.github/workflows/kashf-apply-final-route-coverage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-final-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fix one-time patcher nested template literals
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('_apply_kashf_final_route_coverage.mjs')
          s = p.read_text()
          replacements = {
            "assert(r.ok === true, `${qid}: has an explicit route`);": "assert(r.ok === true, qid + ': has an explicit route');",
            "assert(r.canRunKashf === false, `${qid}: house signification/unsupported question cannot run`);": "assert(r.canRunKashf === false, qid + ': house signification/unsupported question cannot run');",
            "assert(r.kashfRuntimeStatus === 'unsupported', `${qid}: remains explicitly unsupported`);": "assert(r.kashfRuntimeStatus === 'unsupported', qid + ': remains explicitly unsupported');",
            "assert(r.ok === true && r.disposition === 'SPLIT', `${qid}: mixed-scope question is explicitly split`);": "assert(r.ok === true && r.disposition === 'SPLIT', qid + ': mixed-scope question is explicitly split');",
            "assert(r.canRunKashf === false, `${qid}: mixed-scope question cannot run before split`);": "assert(r.canRunKashf === false, qid + ': mixed-scope question cannot run before split');",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'patcher test pattern not found: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Apply final explicit routing coverage and run hard gate
        run: node _apply_kashf_final_route_coverage.mjs

      - name: Commit registry, tests, and hard coverage gate
        run: |
          if git diff --quiet; then
            echo "No final coverage changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goral-hachol/registry/kashf-canonical-method-registry.js goral-hachol/registry/kashf-question-route-registry.js _test_kashf_canonical_routing.mjs _audit_kashf_question_route_coverage.mjs
          git commit -m "feat(kashf): reach 100 percent explicit question routing"
          git push
