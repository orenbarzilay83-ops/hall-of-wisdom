name: Kashf Professional Backfill 01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-professional-backfill-01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate repair helper
        run: node --check _repair_kashf_professional_backfill_01_patcher.mjs
      - name: Repair patcher quoting
        run: node _repair_kashf_professional_backfill_01_patcher.mjs
      - name: Validate patcher
        run: node --check _patch_kashf_professional_backfill_01.mjs
      - name: Apply professional backfill batch 01
        run: node _patch_kashf_professional_backfill_01.mjs
      - name: Syntax checks
        run: |
          node --check goral-hachol/intelligence/kashf-professional-verdict-safety.js
          node --check supabase/functions/oren-smart-advisor/oren-smart-advisor-brain-tool-schema.ts
          node --check supabase/functions/oren-smart-advisor/kashf_reading_payload_sanitizer.ts
          node --check supabase/functions/oren-smart-advisor/oren-smart-advisor-brain-prompt.ts
      - name: Professional Verdict Safety backfill tests
        run: node _test_kashf_professional_verdict_safety.mjs
      - name: Canonical routing regression
        run: node _test_kashf_canonical_routing.mjs
      - name: Question route coverage
        run: node _audit_kashf_question_route_coverage.mjs
      - name: AI retrieval regression
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: Canonical AI live bridge regression
        run: node _test_kashf_ai_retrieval_live_bridge.mjs
      - name: AI context builder regression
        run: node _test_kashf_ai_context_builder.mjs
      - name: Method isolation regression
        run: node _test_kashf_hawi_method_isolation.mjs
      - name: Structured output regression
        run: node _test_kashf_structured_tool_output.mjs
      - name: Advisor payload regression
        run: node _test_oren_smart_advisor_kashf_reading_payload.mjs

      - name: Commit professional backfill batch 01
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            goral-hachol/intelligence/kashf-professional-verdict-safety.js \
            ai/prompts/oren-smart-advisor-brain.prompt.md \
            supabase/functions/oren-smart-advisor/oren-smart-advisor-brain-prompt.ts \
            supabase/functions/oren-smart-advisor/kashf_reading_payload_sanitizer.ts \
            supabase/functions/oren-smart-advisor/oren-smart-advisor-brain-tool-schema.ts \
            _test_kashf_professional_verdict_safety.mjs \
            HALL_WISDOM_PROFESSIONAL_VERDICT_SAFETY_WORK_ORDER.md \
            HALL_WISDOM_KASHF_PROFESSIONAL_VERDICT_BACKFILL_STATUS.md
          if git diff --cached --quiet; then
            echo "No backfill changes to commit"
            exit 1
          fi
          git commit -m "feat(kashf): certify professional backfill batch 01"
          git push origin HEAD:main
