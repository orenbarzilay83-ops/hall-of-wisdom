name: Kashf Source Freeze Wave04 QA Temp

on:
  push:
    branches:
      - chatgpt/kashf-downstream-batch05-p100-101-months

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Master index JSON and final freeze counts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const html=fs.readFileSync('kashf-v57-ai-master-index.html','utf8');
          const marker='<script id="kashf-ai-master-index-data" type="application/json">';
          const start=html.indexOf(marker);
          assert(start>=0);
          const jsonStart=html.indexOf('\n',start)+1;
          const jsonEnd=html.indexOf('</script>',jsonStart);
          const data=JSON.parse(html.slice(jsonStart,jsonEnd));

          assert.equal(data.downstreamCorrectionQueue.length,46);
          assert.equal(data.downstreamCorrectionQueue.filter(x=>x.status==='RESOLVED').length,46);

          assert.equal(data.sourceConflictQueue.length,48);
          assert.equal(data.sourceConflictQueue.filter(x=>x.status==='OPEN').length,0);
          assert.equal(data.sourceConflictQueue.filter(x=>x.status==='RESOLVED').length,9);
          assert.equal(data.sourceConflictQueue.filter(x=>x.status==='SOURCE_CONFLICT/NON_OPERATIONAL').length,39);

          const p254=data.sourceConflictQueue.find(x=>x.id==='B28-SOURCE-P254-AL-TUWAYHIR');
          assert.equal(p254.status,'SOURCE_CONFLICT/NON_OPERATIONAL');
          assert.match(p254.summary,/التويهر/);

          const p274=data.sourceConflictQueue.find(x=>x.id==='B30-SOURCE-P274-KHASHIYA-CONJECTURE');
          assert.equal(p274.status,'RESOLVED');
          assert.match(p274.summary,/خشي على نفسه/);
          assert.match(p274.summary,/جنى جناية/);

          const p275=data.sourceConflictQueue.find(x=>x.id==='B30-SOURCE-P275-AL-MUNAQQAT-TITLE');
          assert.equal(p275.status,'RESOLVED');
          assert.match(p275.summary,/الملتقط في علم النقط/);

          const p275Record=data.records.find(x=>x.entryId==='gate12.prisoners.p275.multaqat-release-and-outcome');
          assert(p275Record);
          assert.match(p275Record.topic,/الملتقط في علم النقط/);
          assert(p275Record.keywords.includes('الملتقط في علم النقط'));
          assert.match(p275Record.sourceVerification?.note||'',/الملتقط في علم النقط/);

          console.log('Master JSON: PASS');
          console.log('Downstream: 46/46 RESOLVED');
          console.log('Source Freeze: 48/48 frozen; 9 RESOLVED; 39 NON_OPERATIONAL; 0 OPEN');
          NODE
      - name: Batch21 regression
        run: node _test_kashf_house5_illness_boundaries_p191_196.mjs
      - name: Batch20 regression
        run: node _test_kashf_house4_hidden_boundaries_p185_191.mjs
      - name: Canonical routing
        run: node _test_kashf_canonical_routing.mjs
      - name: AI retrieval
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: AI retrieval live bridge
        run: node _test_kashf_ai_retrieval_live_bridge.mjs
      - name: Professional verdict safety
        run: node _test_kashf_professional_verdict_safety.mjs
      - name: Book rule catalog
        run: node _test_kashf_book_rule_catalog.mjs
      - name: Rule applicability
        run: node _test_goral_rule_applicability.mjs
      - name: Hawi isolation
        run: node _test_kashf_hawi_method_isolation.mjs
      - name: Route coverage
        run: node _audit_kashf_question_route_coverage.mjs
