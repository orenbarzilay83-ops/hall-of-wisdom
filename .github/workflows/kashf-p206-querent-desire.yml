name: Kashf P206 Querent Desire Executor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-p206-querent-desire.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate one-time patcher syntax
        run: node --check _patch_kashf_p206_querent_desire.mjs
      - name: Apply p206 querent-desire executor
        run: node _patch_kashf_p206_querent_desire.mjs
      - name: Run canonical routing contract
        run: node _test_kashf_canonical_routing.mjs
      - name: Audit question-route coverage
        run: node _audit_kashf_question_route_coverage.mjs
      - name: Run AI retrieval contract
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: Run canonical AI live bridge contract
        run: node _test_kashf_ai_retrieval_live_bridge.mjs

      - name: Commit p206 querent-desire executor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            goral-hachol/registry/kashf-canonical-method-registry.js \
            goral-hachol/engine/kashf-canonical-executors.js \
            _test_kashf_canonical_routing.mjs
          if git diff --cached --quiet; then
            echo "No core changes to commit"
            exit 1
          fi
          git commit -m "feat(kashf): implement p206 querent-desire method"
          git push origin HEAD:main
