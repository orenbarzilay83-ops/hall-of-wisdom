name: Kashf Downstream Batch14 QA Temp

on:
  push:
    branches:
      - chatgpt/kashf-downstream-batch05-p100-101-months

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check goral-hachol/data/sources/kashf-al-asrar/kashf-gate5-foundational-figures.js
          node --check goral-hachol/engine/kashf-book-additions.js
          node --check _test_kashf_derekh_h13_p163.mjs
      - name: P163 Derekh H13 polarity
        run: node _test_kashf_derekh_h13_p163.mjs
      - name: Canonical routing
        run: node _test_kashf_canonical_routing.mjs
      - name: Professional verdict safety
        run: node _test_kashf_professional_verdict_safety.mjs
      - name: AI retrieval live bridge
        run: node _test_kashf_ai_retrieval_live_bridge.mjs
      - name: Rule applicability
        run: node _test_goral_rule_applicability.mjs
      - name: Route coverage
        run: node _audit_kashf_question_route_coverage.mjs
