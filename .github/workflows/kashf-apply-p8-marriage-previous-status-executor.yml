name: Apply Kashf P8 Marriage Previous-Status Executor

on:
  push:
    branches: [main]
    paths:
      - '_apply_kashf_p8_marriage_previous_status_executor.mjs'
      - '.github/workflows/kashf-apply-p8-marriage-previous-status-executor.yml'

permissions:
  contents: write

jobs:
  apply-marriage-previous-status-executor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply p204 previous-status executor and run contracts
        run: node _apply_kashf_p8_marriage_previous_status_executor.mjs
      - name: Commit canonical executor cutover
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goral-hachol/engine/kashf-canonical-executors.js goral-hachol/registry/kashf-canonical-method-registry.js _test_kashf_canonical_routing.mjs
          git commit -m "feat(kashf): enable p204 previous-status canonical executor"
          git push
