name: Kashf AI Master Index Batch01 Verify3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-ai-master-index-batch01-verify3.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate patcher
        run: node --check _patch_kashf_ai_master_index_batch01_verify3.mjs
      - name: Apply verified source promotions
        run: node _patch_kashf_ai_master_index_batch01_verify3.mjs
      - name: Validate master index
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text=fs.readFileSync('kashf-v57-ai-master-index.html','utf8');
          const m=text.match(/<script id="kashf-ai-master-index-data" type="application\/json">\s*([\s\S]*?)\s*<\/script>/);
          if(!m) throw new Error('master index JSON block missing');
          const data=JSON.parse(m[1]);
          if(data.schemaVersion!=='1.1.2') throw new Error('schema mismatch');
          if(data.records.length!==23) throw new Error(`expected 23 records, got ${data.records.length}`);
          const counts=Object.fromEntries(['VERIFIED','INDEXED','REVIEW_REQUIRED','UNRESOLVED'].map(s=>[s,data.records.filter(r=>r.verificationStatus===s).length]));
          if(counts.VERIFIED!==17 || counts.INDEXED!==0 || counts.REVIEW_REQUIRED!==6 || counts.UNRESOLVED!==0) throw new Error(`unexpected counts ${JSON.stringify(counts)}`);
          const ids=['casting.p25-27.preconditions-times','arithmetic.p38-39.form-measurement','relations.p40.definitions'];
          for(const id of ids){const r=data.records.find(x=>x.entryId===id);if(r?.verificationStatus!=='VERIFIED'||r?.sourceVerification?.printedScanChecked!==true||r?.sourceVerification?.v57Checked!==true)throw new Error(`${id} not fully source-marked`);}
          console.log('Batch01 verify3 PASS',counts);
          NODE
      - name: Commit source verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kashf-v57-ai-master-index.html
          if git diff --cached --quiet; then echo 'No index changes'; exit 1; fi
          git commit -m "feat(kashf): verify remaining indexed Batch01 records"
          git push origin HEAD:main
