name: Kashf AI Master Index Batch05 P104-113

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-ai-master-index-batch05-p104-113.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate patcher
        run: node --check _patch_kashf_ai_master_index_batch05_p104_113.mjs
      - name: Apply Batch05
        run: node _patch_kashf_ai_master_index_batch05_p104_113.mjs
      - name: Validate AI master index
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text=fs.readFileSync('kashf-v57-ai-master-index.html','utf8');
          const m=text.match(/<script id="kashf-ai-master-index-data" type="application\/json">\s*([\s\S]*?)\s*<\/script>/);
          if(!m) throw new Error('master index JSON block missing');
          const data=JSON.parse(m[1]);
          const assert=(c,msg)=>{if(!c) throw new Error(msg)};
          assert(data.schemaVersion==='1.6.0','schema mismatch');
          assert(data.records.length===69,`expected 69 records got ${data.records.length}`);
          assert(new Set(data.records.map(r=>r.entryId)).size===69,'duplicate entryIds');
          const counts=Object.fromEntries(['VERIFIED','INDEXED','REVIEW_REQUIRED','UNRESOLVED'].map(s=>[s,data.records.filter(r=>r.verificationStatus===s).length]));
          assert(counts.VERIFIED===57 && counts.INDEXED===0 && counts.REVIEW_REQUIRED===12 && counts.UNRESOLVED===0,`unexpected counts ${JSON.stringify(counts)}`);
          assert(data.coverage.bookEndPage===113 && data.coverage.scanPdfEndPage===115,'coverage mismatch');
          assert(data.records.find(r=>r.entryId==='context.p23-24.comparative-divination')?.verificationStatus==='VERIFIED','p24 regression');

          const moshav=data.records.find(r=>r.entryId==='shibutz.p104-105.moshav-order');
          assert(moshav?.verificationStatus==='VERIFIED' && moshav.placements.length===16,'moshav record invalid');
          const expectedMoshav=['1222','2121','1212','2222','1121','1221','2221','2122','2212','1122','2211','1112','1111','2111','2112','1211'];
          assert(JSON.stringify(moshav.placements.map(x=>x.pattern))===JSON.stringify(expectedMoshav),'moshav order mismatch');
          assert(moshav.rejectedVariant.placements.find(x=>x.pattern==='1211')?.house===13,'rejected Naqi H13 lost');
          assert(moshav.rejectedVariant.placements.find(x=>x.pattern==='1111')?.house===16,'rejected Tariq H16 lost');

          const num=data.records.find(r=>r.entryId==='shibutz.p105-107.number-duration-order');
          const expectedNums=[1,3,6,10,15,21,28,36,45,55,66,78,91,105,120,136];
          assert(JSON.stringify(num.numberOrder.map(x=>x.number))===JSON.stringify(expectedNums),'canonical p106 number order mismatch');
          assert(num.reportedVariant.swap.find(x=>x.pattern==='2121')?.position===16 && num.reportedVariant.swap.find(x=>x.pattern==='1122')?.position===9,'p107 competing swap lost');

          const cum=data.records.find(r=>r.entryId==='shibutz.p107-108.cumulative-number-method');
          assert(cum?.derivedFormula?.sourceStatus==='derived-from-explicit-examples-not-source-wording','derived formula must be labeled');

          const author=data.records.find(r=>r.entryId==='shibutz.p108-109.author-number-resolution');
          assert(author?.operationalStatus==='PARTIAL_UNRESOLVED_HAWA_AL_HAWA' && author.unresolvedMechanism==='هواء الهواء','Hawa al-Hawa unresolved guard lost');

          const duration=data.records.find(r=>r.entryId==='shibutz.p110.duration-by-house');
          assert(duration.durationByHouse.find(x=>x.house===16)?.value===10 && duration.durationByHouse.find(x=>x.house===16)?.unit==='שנים','duration H16 mismatch');

          const money=data.records.find(r=>r.entryId==='shibutz.p111.money-number-table');
          assert(money?.verificationStatus==='REVIEW_REQUIRED','p111 must remain review while v57 differs');
          const cash=(h)=>money.moneyByHouse.find(x=>x.house===h);
          assert(cash(7)?.value===29,'p111 H7 must be 29');
          assert(cash(11)?.altValue===600,'p111 H11 alternate must be 600');
          assert(cash(12)?.altValue===700,'p111 H12 alternate must be 700');
          assert(cash(14)?.value===110,'p111 H14 must remain 110');

          const lisan=data.records.find(r=>r.entryId==='shibutz.p112.lisan-al-amr');
          assert(lisan?.verificationStatus==='REVIEW_REQUIRED','p112 must remain review');
          assert(lisan.structuralStates.find(x=>x.arabic==='مائل الأوتاد')?.judgment==='עתיד','p112 structural future trigger lost');
          assert(lisan.structuralStates.find(x=>x.arabic==='الزائل الساقط عن الوتد')?.judgment==='עבר','p112 past trigger lost');

          const zanati=data.records.find(r=>r.entryId==='shibutz.p113.al-zanati-examples');
          assert(zanati?.verificationStatus==='REVIEW_REQUIRED' && zanati.continuationRequired?.includes(114),'p113 continuation guard lost');
          const ahyan=zanati.examples.find(x=>x.pattern==='1222');
          assert(ahyan?.resultText.includes('מפחיתים מן השנה שלושה ימים'),'p113 Ahyan source correction lost');

          assert((data.v57CorrectionQueue||[]).length===13,'expected 13 v57 correction items');
          assert((data.downstreamCorrectionQueue||[]).length===15,'expected 15 downstream correction items');
          assert(data.v57CorrectionQueue.some(x=>x.id==='B05-P111-MONEY-NUMBERS'),'p111 v57 correction queue missing');
          assert(data.downstreamCorrectionQueue.some(x=>x.id==='B05-DATA-P111-MONEY-TABLE'),'p111 downstream queue missing');
          console.log('Batch05 validation PASS',counts,'v57Queue',data.v57CorrectionQueue.length,'downstreamQueue',data.downstreamCorrectionQueue.length);
          NODE
      - name: Commit Batch05 index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kashf-v57-ai-master-index.html
          if git diff --cached --quiet; then echo 'No index changes'; exit 1; fi
          git commit -m "feat(kashf): index and verify source pages 104-113"
          git push origin HEAD:main
