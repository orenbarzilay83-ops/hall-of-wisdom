name: Kashf Downstream Batch05 QA

on:
  push:
    branches:
      - chatgpt/kashf-downstream-batch05-p100-101-months

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check goral-hachol/data/sources/kashf-al-asrar/kashf-figure-attributes-gate2.js
          node --check _test_kashf_month_associations_p100_101.mjs
      - name: P100-101 month associations
        run: node _test_kashf_month_associations_p100_101.mjs
      - name: P100 joy-grief regression
        run: node _test_kashf_joy_grief_supplement_p100.mjs
      - name: P97-99 dignity regression
        run: node _test_kashf_essential_dignities_table.mjs
      - name: Figure names source tables
        run: node _test_kashf_figure_names_source_tables.mjs
      - name: Kashf book-rule catalog
        run: node _test_kashf_book_rule_catalog.mjs
      - name: Goral rule applicability
        run: node _test_goral_rule_applicability.mjs
      - name: AI retrieval index
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: AI retrieval live bridge
        run: node _test_kashf_ai_retrieval_live_bridge.mjs
      - name: AI context builder
        run: node _test_kashf_ai_context_builder.mjs
      - name: Professional verdict safety
        run: node _test_kashf_professional_verdict_safety.mjs
      - name: Kashf/Hawi method isolation
        run: node _test_kashf_hawi_method_isolation.mjs
      - name: Canonical routing
        run: node _test_kashf_canonical_routing.mjs
      - name: Route coverage
        run: node _audit_kashf_question_route_coverage.mjs
