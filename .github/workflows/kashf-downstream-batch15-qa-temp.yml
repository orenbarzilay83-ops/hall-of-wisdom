name: Kashf Downstream Batch15 QA Temp

on:
  push:
    branches:
      - chatgpt/kashf-downstream-batch05-p100-101-months

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check goral-hachol/data/sources/kashf-al-asrar/kashf-gate5-foundational-figures.js
          node --check _test_kashf_gate5_witness_proximity_isolation.mjs
      - name: Gate5 witness and proximity isolation
        run: node _test_kashf_gate5_witness_proximity_isolation.mjs
      - name: P163 Derekh H13 polarity
        run: node _test_kashf_derekh_h13_p163.mjs
      - name: Hawi method isolation
        run: node _test_kashf_hawi_method_isolation.mjs
      - name: Canonical routing
        run: node _test_kashf_canonical_routing.mjs
      - name: Professional verdict safety
        run: node _test_kashf_professional_verdict_safety.mjs
      - name: Dhamir runtime precedence
        run: node _test_kashf_dhamir_runtime_precedence_wave.mjs
      - name: Route coverage
        run: node _audit_kashf_question_route_coverage.mjs
