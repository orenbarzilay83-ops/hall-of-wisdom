name: Apply Kashf Final Coverage Slice

on:
  push:
    branches: [main]
    paths:
      - '_apply_kashf_final_coverage_slice.mjs'
      - '.github/workflows/kashf-apply-final-coverage-slice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply final canonical route patch and run tests
        run: node _apply_kashf_final_coverage_slice.mjs

      - name: Commit registry updates
        run: |
          if git diff --quiet; then
            echo "No registry changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goral-hachol/registry/kashf-canonical-method-registry.js goral-hachol/registry/kashf-question-route-registry.js _test_kashf_canonical_routing.mjs
          git commit -m "feat(kashf): complete explicit question-bank route coverage"
          git push
