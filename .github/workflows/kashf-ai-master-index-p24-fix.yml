name: Kashf AI Master Index P24 Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-ai-master-index-p24-fix.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate patcher
        run: node --check _patch_kashf_ai_master_index_batch01_p24_fix.mjs
      - name: Apply p24 correction
        run: node _patch_kashf_ai_master_index_batch01_p24_fix.mjs
      - name: Validate master index
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text=fs.readFileSync('kashf-v57-ai-master-index.html','utf8');
          const m=text.match(/<script id="kashf-ai-master-index-data" type="application\/json">\s*([\s\S]*?)\s*<\/script>/);
          if(!m) throw new Error('master index JSON block missing');
          const data=JSON.parse(m[1]);
          if(data.schemaVersion!=='1.2.1') throw new Error('schema mismatch');
          const counts=Object.fromEntries(['VERIFIED','INDEXED','REVIEW_REQUIRED','UNRESOLVED'].map(s=>[s,data.records.filter(r=>r.verificationStatus===s).length]));
          if(counts.VERIFIED!==20 || counts.INDEXED!==0 || counts.REVIEW_REQUIRED!==3 || counts.UNRESOLVED!==0) throw new Error(`unexpected counts ${JSON.stringify(counts)}`);
          const r=data.records.find(x=>x.entryId==='context.p23-24.comparative-divination');
          if(r?.verificationStatus!=='VERIFIED') throw new Error('p24 not verified');
          if(r?.sourceCorrectionRequired) throw new Error('stale p24 correction remains');
          if((data.v57CorrectionQueue||[]).some(x=>x.id==='B01-P24-KATIF')) throw new Error('stale p24 queue item remains');
          console.log('P24 fix PASS',counts);
          NODE
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kashf-v57-ai-master-index.html
          if git diff --cached --quiet; then echo 'No index changes'; exit 1; fi
          git commit -m "fix(kashf): correct p24 source reading to ilm al-kaf"
          git push origin HEAD:main
