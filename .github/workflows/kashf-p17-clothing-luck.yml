name: Kashf P17 Clothing Luck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-p17-clothing-luck.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Normalize test footer for one-time patch anchor
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = '_test_kashf_canonical_routing.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const old = 'if (failed > 0) process.exit(1);';
          const replacement = 'if (failed > 0) {\n  process.exit(1);\n}';
          if (!text.includes(old) && !text.includes(replacement)) throw new Error('Missing test footer');
          if (text.includes(old)) text = text.replace(old, replacement);
          fs.writeFileSync(path, text);
          NODE
      - name: Apply clothing patch
        run: node _patch_kashf_p17_clothing_luck.mjs
      - name: Run Kashf canonical routing contract
        run: node _test_kashf_canonical_routing.mjs
      - name: Audit Question Bank route coverage
        run: node _audit_kashf_question_route_coverage.mjs
      - name: Commit source-safe clothing executor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            goral-hachol/registry/kashf-canonical-method-registry.js \
            goral-hachol/registry/kashf-v57-knowledge-registry.js \
            goral-hachol/ui/question-bank.js \
            goral-hachol/engine/kashf-canonical-executors.js \
            _test_kashf_canonical_routing.mjs
          if git diff --cached --quiet; then
            echo "No core changes to commit"
            exit 1
          fi
          git commit -m "feat(kashf): implement p265 clothing luck executor"
          git push origin HEAD:main
