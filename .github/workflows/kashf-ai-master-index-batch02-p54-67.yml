name: Kashf AI Master Index Batch02 P54-67

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-ai-master-index-batch02-p54-67.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate patcher
        run: node --check _patch_kashf_ai_master_index_batch02_p54_67.mjs
      - name: Apply Batch02
        run: node _patch_kashf_ai_master_index_batch02_p54_67.mjs
      - name: Validate AI master index
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text=fs.readFileSync('kashf-v57-ai-master-index.html','utf8');
          const m=text.match(/<script id="kashf-ai-master-index-data" type="application\/json">\s*([\s\S]*?)\s*<\/script>/);
          if(!m) throw new Error('master index JSON block missing');
          const data=JSON.parse(m[1]);
          const assert=(c,msg)=>{if(!c)throw new Error(msg)};
          assert(data.schemaVersion==='1.3.0','schema mismatch');
          assert(data.records.length===37,`expected 37 records, got ${data.records.length}`);
          assert(new Set(data.records.map(r=>r.entryId)).size===37,'duplicate entryIds');
          const counts=Object.fromEntries(['VERIFIED','INDEXED','REVIEW_REQUIRED','UNRESOLVED'].map(s=>[s,data.records.filter(r=>r.verificationStatus===s).length]));
          assert(counts.VERIFIED===32 && counts.INDEXED===0 && counts.REVIEW_REQUIRED===5 && counts.UNRESOLVED===0,`unexpected counts ${JSON.stringify(counts)}`);
          assert(data.coverage.bookEndPage===67 && data.coverage.scanPdfEndPage===69,'coverage range mismatch');
          assert(data.records.find(r=>r.entryId==='context.p23-24.comparative-divination')?.verificationStatus==='VERIFIED','p24 regression');

          const all16=['1111','1112','1121','1122','1211','1212','1221','1222','2111','2112','2121','2122','2211','2212','2221','2222'].sort();
          const flat=(obj)=>Object.values(obj).flat().map(x=>x.pattern).sort();
          const uniq=(arr)=>[...new Set(arr)].sort();
          const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);

          const fortune=data.records.find(r=>r.entryId==='figures.p55-57.fortune-system');
          assert(fortune.verificationStatus==='VERIFIED','fortune not verified');
          assert(fortune.fortuneGroups.benefic.length===5 && fortune.fortuneGroups.malefic.length===5 && fortune.fortuneGroups.leanBenefic.length===3 && fortune.fortuneGroups.mixedLeanMalefic.length===3,'fortune group sizes');
          assert(same(uniq(flat(fortune.fortuneGroups)),all16),'fortune does not partition all 16');

          for(const id of ['figures.p57-59.movement','figures.p60-61.celestial-motion','figures.p61-62.elements-directions']){
            const r=data.records.find(x=>x.entryId===id); assert(r?.verificationStatus==='VERIFIED',`${id} not verified`);
            const groups=r.movementGroups||r.celestialGroups||r.elementGroups;
            assert(Object.values(groups).every(g=>g.length===4),`${id} group size`);
            assert(same(uniq(flat(groups)),all16),`${id} does not partition 16`);
          }
          const gender=data.records.find(r=>r.entryId==='figures.p59-60.gender-daynight');
          assert(gender.genderGroups.female.length===6 && gender.genderGroups.male.length===6 && gender.genderGroups.androgynous.length===4,'gender group sizes');
          assert(same(uniq(flat(gender.genderGroups)),all16),'gender does not partition 16');

          const purity=data.records.find(r=>r.entryId==='figures.p63.purity');
          assert(purity?.verificationStatus==='VERIFIED','purity not verified');
          assert(purity.purityGroups.pure.includes('2122') && purity.purityGroups.impureBoth.includes('2122'),'Humra overlap lost');
          assert(purity.purityGroups.pure.length===12,'pure list size mismatch');

          const seeker=data.records.find(r=>r.entryId==='figures.p64.seeker-table');
          const sought=data.records.find(r=>r.entryId==='figures.p65.sought-pattern-table');
          const seekerExpected=['1222','1212','1211','1221','1122','1112','1121','1111'];
          const soughtExpected=['2221','2222','2211','2112','2121','2111','2212','2122'];
          assert(seeker?.sourceVerification?.visualTableChecked===true && sought?.sourceVerification?.visualTableChecked===true,'visual table verification missing');
          assert(same(seeker.seekerRows.map(x=>x.pattern),seekerExpected),'p64 seeker order mismatch');
          assert(same(sought.soughtRows.map(x=>x.pattern),soughtExpected),'p65 sought order mismatch');
          assert(same([...seekerExpected,...soughtExpected].sort(),all16),'seeker/sought tables do not partition 16');
          assert(seeker.seekerRows[2].arabic.includes('طالب الشر ضعيف'),'p64 row3 scan reading lost');

          assert(data.records.find(r=>r.entryId==='figures.p65.sought-hebrew-wording')?.verificationStatus==='REVIEW_REQUIRED','p65 wording must remain review');
          assert(data.records.find(r=>r.entryId==='figures.p65-66.house-gender-context')?.verificationStatus==='REVIEW_REQUIRED','p66 فرج حقيقي must remain review');
          assert((data.v57CorrectionQueue||[]).length===6,'expected 6 v57 correction items');
          assert((data.downstreamCorrectionQueue||[]).length===3,'expected 3 downstream correction items');
          console.log('Batch02 validation PASS',counts,'v57Queue',data.v57CorrectionQueue.length,'downstreamQueue',data.downstreamCorrectionQueue.length);
          NODE
      - name: Commit Batch02 index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kashf-v57-ai-master-index.html
          if git diff --cached --quiet; then echo 'No index changes'; exit 1; fi
          git commit -m "feat(kashf): index and verify source pages 54-67"
          git push origin HEAD:main
