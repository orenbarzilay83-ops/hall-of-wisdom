name: Kashf Apply Canonical AI Live Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-apply-ai-live-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Normalize one-time patcher nested template literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_patch_kashf_ai_live_bridge.mjs')
          s = p.read_text()
          replacements = {
            "      readingId: `kashf-${Date.now()}`,": "      readingId: 'kashf-' + Date.now(),",
            "      return localFallback(error?.message ? `edge-error:${error.message}` : 'edge-response-invalid');": "      return localFallback(error?.message ? 'edge-error:' + error.message : 'edge-response-invalid');",
            "    return localFallback(err instanceof Error ? `client-error:${err.message}` : 'client-error');": "    return localFallback(err instanceof Error ? 'client-error:' + err.message : 'client-error');",
            "          question,\n          questionId: selectedQuestion?.id || null,": "          question: question || selectedQuestion?.label || '',\n          questionId: selectedQuestion?.id || null,",
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Missing one-time normalization anchor: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check _patch_kashf_ai_live_bridge.mjs

      - name: Apply canonical AI live bridge patch
        run: node _patch_kashf_ai_live_bridge.mjs

      - name: Harden one-token natural-language ambiguity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('goral-hachol/registry/kashf-ai-retrieval-index.js')
          s = p.read_text()
          old = "  const resolved = hasExactReason || (best.retrievalScore >= 45 && margin >= 12);"
          new = "  const singleTokenNaturalQuery = !hasExactReason && tokenizeKashfRetrievalText(query).length <= 1 && Boolean(second);\n  const resolved = hasExactReason || (!singleTokenNaturalQuery && best.retrievalScore >= 45 && margin >= 12);"
          if old not in s:
            raise SystemExit('Missing retrieval resolution anchor')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Run retrieval index contract
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: Run canonical live AI bridge contract
        run: node _test_kashf_ai_retrieval_live_bridge.mjs
      - name: Run AI context builder regression
        run: node _test_kashf_ai_context_builder.mjs
      - name: Run Edge Kashf payload regression
        run: node _test_oren_smart_advisor_kashf_reading_payload.mjs
      - name: Run canonical routing contract
        run: node _test_kashf_canonical_routing.mjs
      - name: Audit question-route coverage
        run: node _audit_kashf_question_route_coverage.mjs

      - name: Commit canonical AI live bridge core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            goral-hachol/registry/kashf-ai-retrieval-index.js \
            goral-hachol/intelligence/kashf-ai-context-builder.js \
            goral-hachol/ui/goral-app.js \
            supabase/functions/oren-smart-advisor/kashf_reading_payload_sanitizer.ts \
            supabase/functions/oren-smart-advisor/oren-smart-advisor-brain-prompt.ts
          if git diff --cached --quiet; then
            echo "No core changes to commit"
            exit 1
          fi
          git commit -m "feat(kashf): connect AI to canonical v57 retrieval"
          git push origin HEAD:main
