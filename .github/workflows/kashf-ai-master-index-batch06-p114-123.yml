name: Kashf AI Master Index Batch06 P114-123

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-ai-master-index-batch06-p114-123.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate patcher
        run: node --check _patch_kashf_ai_master_index_batch06_p114_123.mjs
      - name: Apply Batch06
        run: node _patch_kashf_ai_master_index_batch06_p114_123.mjs
      - name: Validate AI master index
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text=fs.readFileSync('kashf-v57-ai-master-index.html','utf8');
          const m=text.match(/<script id="kashf-ai-master-index-data" type="application\/json">\s*([\s\S]*?)\s*<\/script>/);
          if(!m) throw new Error('master index JSON block missing');
          const data=JSON.parse(m[1]);
          const assert=(c,msg)=>{if(!c) throw new Error(msg)};
          assert(data.schemaVersion==='1.7.0','schema mismatch');
          assert(data.records.length===80,`expected 80 records got ${data.records.length}`);
          assert(new Set(data.records.map(r=>r.entryId)).size===80,'duplicate entryIds');
          const counts=Object.fromEntries(['VERIFIED','INDEXED','REVIEW_REQUIRED','UNRESOLVED'].map(s=>[s,data.records.filter(r=>r.verificationStatus===s).length]));
          assert(counts.VERIFIED===63 && counts.REVIEW_REQUIRED===17 && counts.INDEXED===0 && counts.UNRESOLVED===0,`unexpected counts ${JSON.stringify(counts)}`);
          assert(data.coverage.bookEndPage===123 && data.coverage.scanPdfEndPage===125,'coverage mismatch');
          assert(data.methodSelectionPolicy?.principle==='ONE_PRIMARY_METHOD_PER_QUESTION_INTENT','method selection policy missing');
          const z113=data.records.find(r=>r.entryId==='shibutz.p113.al-zanati-examples');
          assert(z113?.operationalRole==='REFERENCE_ONLY' && z113.runtimeEligible===false,'p113 al-Zanati must stay reference-only');
          const dalail=data.records.find(r=>r.entryId==='shibutz.p114-115.dalail-al-fadl-table');
          assert(dalail?.verificationStatus==='REVIEW_REQUIRED' && dalail.printedRows.length===16,'Dalail table invalid');
          const row=(p)=>dalail.printedRows.find(x=>x.pattern===p);
          assert(row('2111')?.depth===3,'printed p114 Ataba Dakhila depth must remain 3');
          assert(row('1211')?.depth===201,'printed p114 Naqi depth must remain 201');
          assert(row('2112')?.length===60,'printed p115 Ijtima length must remain 60');
          assert(row('1111')?.depth===4,'printed p115 Tariq depth must remain 4');
          assert(row('1212')?.depth===301,'printed p115 Qabd Kharij depth must remain 301');
          const ranks=data.records.find(r=>r.entryId==='shibutz.p117.time-ranks-literal');
          assert(ranks?.verificationStatus==='REVIEW_REQUIRED' && ranks.criticalFacts.some(x=>x.includes('הבנות')&&x.includes('החודשים')),'p117 literal daughters=months lost');
          const ex=data.records.find(r=>r.entryId==='shibutz.p117-119.add-subtract-example');
          assert(ex?.arithmeticTrace?.printedAfterSubtract===1123 && ex.arithmeticTrace?.arithmeticallyExpectedAfterSubtract===123 && ex.arithmeticTrace?.sourceRemainder===11,'p118 anomaly trace lost');
          const dur=data.records.find(r=>r.entryId==='shibutz.p119-120.duration-points-method');
          assert(dur?.verificationStatus==='REVIEW_REQUIRED' && dur.humraExample?.balancesMoney===2000,'p120 two-thousand source value lost');
          const dist=data.records.find(r=>r.entryId==='shibutz.p121.al-zanati-al-layth-distance');
          assert(dist?.operationalRole==='REFERENCE_ONLY' && dist.runtimeEligible===false,'distance variants must be reference-only');
          const el=data.records.find(r=>r.entryId==='shibutz.p121-123.elements-order');
          assert(el?.elementOrder?.length===16 && el.elementValues?.fire===1 && el.elementValues?.earth===4 && el.runtimeEligible===false,'element order invalid or incorrectly runtime-enabled');
          const assoc=data.records.find(r=>r.entryId==='foundation.p123.bound-point-element-associations');
          assert(assoc?.verificationStatus==='REVIEW_REQUIRED','p123 associations must remain review');
          assert(assoc.associations.water.measure==='baa' && assoc.associations.earth.measure==='qama','p123 measure mapping lost');
          assert(assoc.associations.air.color==='red' && assoc.associations.water.color==='green','p123 color mapping lost');
          assert((data.v57CorrectionQueue||[]).length===19,'expected 19 v57 queue items');
          assert((data.downstreamCorrectionQueue||[]).length===17,'expected 17 downstream queue items');
          console.log('Batch06 validation PASS',counts,'v57Queue',data.v57CorrectionQueue.length,'downstreamQueue',data.downstreamCorrectionQueue.length);
          NODE
      - name: Commit Batch06 index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kashf-v57-ai-master-index.html
          if git diff --cached --quiet; then echo 'No index changes'; exit 1; fi
          git commit -m "feat(kashf): index and verify source pages 114-123"
          git push origin HEAD:main
