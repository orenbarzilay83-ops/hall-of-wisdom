name: Kashf Golden E2E QA Temp

on:
  push:
    branches:
      - chatgpt/kashf-downstream-batch05-p100-101-months

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check _test_kashf_golden_e2e.mjs
          node --check goral-hachol/intelligence/kashf-canonical-rule-decision.js
          node --check goral-hachol/intelligence/kashf-ai-context-builder.js
          node --check goral-hachol/registry/kashf-ai-retrieval-index.js
      - name: Golden E2E
        run: node _test_kashf_golden_e2e.mjs
      - name: Canonical Rule Decision payload
        run: node _test_kashf_canonical_rule_decision_payload.mjs
      - name: AI context builder
        run: node _test_kashf_ai_context_builder.mjs
      - name: Smart Advisor Kashf payload
        run: node _test_oren_smart_advisor_kashf_reading_payload.mjs
      - name: Smart Advisor Kashf live runner
        run: node _test_oren_smart_advisor_kashf_live_runner.mjs
      - name: Generic Rule Decision Engine
        run: node _test_hall_wisdom_rule_decision_engine.mjs
      - name: Batch21 pregnancy illness boundaries
        run: node _test_kashf_house5_illness_boundaries_p191_196.mjs
      - name: Canonical routing
        run: node _test_kashf_canonical_routing.mjs
      - name: AI retrieval index
        run: node _test_kashf_ai_retrieval_index.mjs
      - name: AI retrieval live bridge
        run: node _test_kashf_ai_retrieval_live_bridge.mjs
      - name: Professional verdict safety
        run: node _test_kashf_professional_verdict_safety.mjs
      - name: Book rule catalog
        run: node _test_kashf_book_rule_catalog.mjs
      - name: Rule applicability
        run: node _test_goral_rule_applicability.mjs
      - name: Hawi method isolation
        run: node _test_kashf_hawi_method_isolation.mjs
      - name: Route coverage
        run: node _audit_kashf_question_route_coverage.mjs
      - name: Master Index Source Freeze
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('kashf-v57-ai-master-index.html','utf8');
          const marker='<script id="kashf-ai-master-index-data" type="application/json">';
          const s=html.indexOf(marker);
          const start=html.indexOf('\n',s)+1;
          const end=html.indexOf('</script>',start);
          const data=JSON.parse(html.slice(start,end));
          const q=data.sourceConflictQueue || [];
          const open=q.filter(x=>x.status==='OPEN');
          const resolved=q.filter(x=>x.status==='RESOLVED');
          const nonop=q.filter(x=>x.status==='SOURCE_CONFLICT/NON_OPERATIONAL');
          if(q.length!==48 || open.length!==0 || resolved.length!==9 || nonop.length!==39) {
            throw new Error(JSON.stringify({total:q.length,open:open.length,resolved:resolved.length,nonop:nonop.length}));
          }
          console.log('Master Index Source Freeze: 48/48; 9 resolved; 39 non-operational; 0 open');
          NODE
