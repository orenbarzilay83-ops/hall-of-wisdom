name: Kashf AI Master Index Batch01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kashf-ai-master-index-batch01.yml'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate patcher
        run: node --check _patch_kashf_ai_master_index_batch01.mjs
      - name: Apply detailed Batch01 index
        run: node _patch_kashf_ai_master_index_batch01.mjs
      - name: Validate embedded master-index JSON
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text=fs.readFileSync('kashf-v57-ai-master-index.html','utf8');
          const m=text.match(/<script id="kashf-ai-master-index-data" type="application\/json">\s*([\s\S]*?)\s*<\/script>/);
          if(!m) throw new Error('master index JSON block missing');
          const data=JSON.parse(m[1]);
          if(data.schemaVersion!=='1.1.0') throw new Error('schema version mismatch');
          if(data.records.length!==23) throw new Error(`expected 23 Batch01 records, got ${data.records.length}`);
          const counts=Object.fromEntries(['VERIFIED','INDEXED','REVIEW_REQUIRED','UNRESOLVED'].map(s=>[s,data.records.filter(r=>r.verificationStatus===s).length]));
          if(counts.VERIFIED!==9 || counts.INDEXED!==8 || counts.REVIEW_REQUIRED!==6 || counts.UNRESOLVED!==0) throw new Error(`unexpected status counts ${JSON.stringify(counts)}`);
          if(data.coverage.bookStartPage!==21 || data.coverage.bookEndPage!==53 || data.coverage.scanPdfStartPage!==23 || data.coverage.scanPdfEndPage!==55) throw new Error('Batch01 page mapping mismatch');
          const p35=data.records.find(r=>r.entryId==='casting.p35.absent-four-figures');
          const aqla=p35?.figures?.find(f=>f.pattern==='1221');
          if(aqla?.name!=='סוהר' || aqla?.arabicName!=='العقلة') throw new Error('1221 canonical/source naming mismatch');
          const houses=data.records.find(r=>r.entryId==='houses.p46-53.profiles');
          if(houses?.houseProfiles?.length!==15) throw new Error('expected H1-H15 profiles');
          if(houses.houseProfiles.find(h=>h.house===2)?.verificationStatus!=='REVIEW_REQUIRED') throw new Error('H2 discrepancy must remain visible');
          if(houses.houseProfiles.find(h=>h.house===3)?.verificationStatus!=='REVIEW_REQUIRED') throw new Error('H3 discrepancy must remain visible');
          console.log('Batch01 master-index validation PASS',counts);
          NODE
      - name: Commit detailed Batch01 index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kashf-v57-ai-master-index.html
          if git diff --cached --quiet; then
            echo "No master-index changes to commit"
            exit 1
          fi
          git commit -m "feat(kashf): detail Batch01 AI master index pp21-53"
          git push origin HEAD:main
