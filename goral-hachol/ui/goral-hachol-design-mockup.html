<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>הדמיית גורל החול</title>
  <style>
    :root {
      --navy:#06192d;
      --navy2:#0d2a49;
      --gold:#d8aa45;
      --gold2:#f2d27b;
      --paper:#fff8e8;
      --ink:#111;
      --muted:#6d6250;
      --border:#1d1d1d;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      direction:rtl;
      font-family:Arial, sans-serif;
      background:linear-gradient(135deg,#06192d,#0a1424);
      color:var(--ink);
    }

    .app {
      max-width:980px;
      margin:0 auto;
      min-height:100vh;
      background:linear-gradient(180deg,#fffaf0,#f7eedc);
      box-shadow:0 0 35px rgba(0,0,0,.35);
    }

    .topbar {
      height:68px;
      background:linear-gradient(90deg,var(--navy),var(--navy2));
      color:var(--gold2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      position:sticky;
      top:0;
      z-index:20;
    }

    .topbar h1 {
      margin:0;
      font-size:25px;
    }

    .icon-btn {
      border:0;
      background:transparent;
      color:var(--gold2);
      font-size:28px;
      cursor:pointer;
      padding:8px 10px;
    }

    .drawer {
      position:fixed;
      top:0;
      right:0;
      width:310px;
      max-width:86vw;
      height:100vh;
      background:#06192d;
      color:white;
      transform:translateX(100%);
      transition:.25s ease;
      z-index:50;
      box-shadow:-12px 0 30px rgba(0,0,0,.35);
      border-left:1px solid rgba(216,170,69,.45);
    }

    .drawer.open { transform:translateX(0); }

    .drawer h2 {
      margin:0;
      padding:22px;
      color:var(--gold2);
      border-bottom:1px solid rgba(216,170,69,.35);
      text-align:center;
    }

    .drawer button {
      width:100%;
      text-align:right;
      padding:17px 22px;
      border:0;
      border-bottom:1px solid rgba(255,255,255,.1);
      background:transparent;
      color:white;
      font-size:16px;
    }

    .drawer button.active {
      background:rgba(216,170,69,.22);
      color:var(--gold2);
    }

    .screen {
      display:none;
      padding:26px;
    }

    .screen.active { display:block; }

    .panel {
      border:1px solid rgba(216,170,69,.45);
      border-radius:18px;
      background:rgba(255,255,255,.65);
      padding:22px;
      box-shadow:0 14px 30px rgba(0,0,0,.08);
    }

    h2 {
      margin:0 0 18px;
      color:#071b30;
      border-bottom:1px solid rgba(216,170,69,.6);
      padding-bottom:10px;
      font-size:25px;
    }

    .form-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }

    .full { grid-column:1/-1; }

    label {
      display:block;
      margin-bottom:6px;
      font-weight:800;
      color:#1e2a36;
    }

    input, select, textarea {
      width:100%;
      border:1px solid rgba(0,0,0,.18);
      border-radius:13px;
      background:white;
      padding:13px;
      font-size:17px;
      color:#111;
    }

    textarea { min-height:80px; resize:vertical; }

    .actions {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:18px;
    }

    .btn {
      border:1px solid rgba(216,170,69,.5);
      border-radius:14px;
      padding:15px;
      font-weight:900;
      font-size:16px;
      cursor:pointer;
      background:#fff4d8;
      color:#071b30;
    }

    .btn.primary {
      background:linear-gradient(180deg,#0d2a49,#06192d);
      color:var(--gold2);
      border:0;
    }

    .btn.gray {
      background:#f4f4f4;
      color:#333;
      border:1px solid rgba(0,0,0,.16);
    }

    .mother-slots {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-bottom:18px;
    }

    .slot {
      border:1px dashed rgba(0,0,0,.3);
      border-radius:14px;
      min-height:74px;
      display:grid;
      place-items:center;
      text-align:center;
      background:white;
      font-weight:700;
    }

    .slot.current {
      border:2px solid var(--gold);
      box-shadow:0 0 0 4px rgba(216,170,69,.18);
    }

    .figure-grid {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      border:1px solid rgba(0,0,0,.35);
      border-radius:16px;
      overflow:hidden;
      background:white;
    }

    .figure-card {
      min-height:135px;
      border-left:1px solid rgba(0,0,0,.24);
      border-bottom:1px solid rgba(0,0,0,.24);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      position:relative;
      background:#fffaf0;
    }

    .figure-card.selected {
      outline:3px solid var(--gold);
      outline-offset:-3px;
      background:#fff2cc;
    }

    .figure-card.selected::after {
      content:"✓";
      position:absolute;
      top:9px;
      right:9px;
      width:26px;
      height:26px;
      border-radius:50%;
      background:var(--gold2);
      color:#071b30;
      display:grid;
      place-items:center;
      font-weight:900;
    }

    .glyph {
      width:58px;
      display:grid;
      grid-template-rows:repeat(4,13px);
      gap:7px;
      justify-items:center;
      align-items:center;
    }

    .one {
      width:9px;
      height:9px;
      background:#111;
      border-radius:50%;
    }

    .two {
      width:38px;
      height:7px;
      background:#111;
      border-radius:99px;
    }

    .figure-name {
      font-weight:900;
      font-size:16px;
    }

    .board {
      border:2px solid var(--border);
      background:white;
      max-width:860px;
      margin:0 auto;
    }

    .board-row {
      display:grid;
      border-bottom:2px solid var(--border);
    }

    .board-row.r1 { grid-template-columns:repeat(8,1fr); }
    .board-row.r2 { grid-template-columns:repeat(4,1fr); }
    .board-row.r3 { grid-template-columns:repeat(2,1fr); border-bottom:0; }

    .final-row {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:22px;
      margin-top:22px;
      align-items:start;
    }

    .final-box {
      border:2px solid var(--border);
      background:white;
      min-height:150px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      text-align:center;
    }

    .final-box.right {
      justify-self:stretch;
    }

    .final-box.left {
      justify-self:stretch;
    }

    .house {
      min-height:132px;
      border-left:1px solid var(--border);
      padding:8px 5px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:6px;
    }

    .house:last-child { border-left:0; }

    .house-title {
      font-weight:900;
      font-size:16px;
    }

    .house-name {
      color:#555;
      font-size:13px;
      min-height:18px;
    }

    .note {
      margin-top:14px;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }

    @media (max-width:800px) {
      .screen { padding:16px; }
      .form-grid, .actions, .mother-slots { grid-template-columns:1fr; }
      .figure-grid { grid-template-columns:repeat(2,1fr); }
      .board-row.r1 { grid-template-columns:repeat(4,1fr); }
    }
  </style>
</head>
<body>
  <aside id="drawer" class="drawer">
    <h2>תפריט גורל החול</h2>
    <button>דף הבית</button>
    <button>יומן לקוחות</button>
    <button class="active">גורל החול</button>
    <button>תפילה לעשיית הגורל</button>
    <button>לימוד גורל החול</button>
    <button>הדפסות וטפסים</button>
    <button>לוח אסטרולוגי — בהמשך</button>
    <button>הגדרות</button>
    <button>עזרה</button>
    <button>יציאה</button>
  </aside>

  <div class="app">
    <header class="topbar">
      <button class="icon-btn" onclick="toggleMenu()">☰</button>
      <h1>גורל החול</h1>
      <button class="icon-btn" onclick="location.href='../../calculator.html'">←</button>
    </header>

    <section id="screen-open" class="screen active">
      <div class="panel">
        <h2>פרטי הלקוח</h2>

        <div class="form-grid">
          <div>
            <label>שם הפונה</label>
            <input />
          </div>

          <div>
            <label>שם האב</label>
            <input />
          </div>

          <div>
            <label>תאריך השאלה</label>
            <input />
          </div>

          <div>
            <label>שעת השאלה</label>
            <input />
          </div>

          <div class="full">
            <label>שאלה / כוונה</label>
            <textarea></textarea>
          </div>

          <div class="full">
            <label>נושא השאלה</label>
            <select>
            <option value="" selected>בחר נושא שאלה</option>
              <option>נעדרים / אבידה</option>
              <option>בריאות</option>
              <option>כסף / מסחר</option>
              <option>זוגיות / נישואין</option>
              <option>נסיעה</option>
              <option>משפט / סכסוך</option>
              <option>כללי</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button class="btn" onclick="showScreen('select')">הכנסה ידנית של 4 הצורות הראשונות</button>
          <button class="btn">בחירה אוטומטית לפי עצירה</button>
          <button class="btn gray">נקה טופס</button>
        </div>

        <div class="actions">
          <button class="btn primary" onclick="showScreen('select')">התחל</button>
        </div>
      </div>
    </section>

    <section id="screen-select" class="screen">
      <div class="panel">
        <h2>בחירת 4 צורות ראשונות</h2>

        <div class="mother-slots">
          <div class="slot current"></div>
          <div class="slot"></div>
          <div class="slot"></div>
          <div class="slot"></div>
        </div>

        <div id="figureGrid" class="figure-grid"></div>

        <div class="actions">
          <button class="btn gray" onclick="showScreen('open')">חזרה</button>
          <button class="btn gray">נקה בחירה</button>
          <button class="btn primary" onclick="showScreen('board')">המשך ללוח הגורל</button>
        </div>

        <div class="note">הסימון ✓ מציין צורה שכבר נבחרה. בהמשך נחליט אם להציג גם מספר אם קטן בתוך הסימון.</div>
      </div>
    </section>

    <section id="screen-board" class="screen">
      <div class="panel">
        <h2>לוח הגורל</h2>

        <div id="board" class="board"></div>

        <div class="actions">
          <button class="btn gray" onclick="showScreen('select')">חזרה לבחירת אמהות</button>
          <button class="btn primary">נתח את הגורל</button>
          <button class="btn gray">שמור ביומן לקוחות</button>
        </div>

        <div class="note">לוח אסטרולוגי / כיוונים — פרק נפרד לסוף, לא חלק מהמסך הזה כרגע.</div>
      </div>
    </section>
  </div>

  <script>
    const figures = [
      ['1111','דרך'], ['1112','סף יוצא'], ['1121','נלחם'], ['1122','כבוד יוצא'],
      ['1211','בר הלחי'], ['1212','ממון יוצא'], ['1221','סוהר'], ['1222','נשוא ראש'],
      ['2111','סף נכנס'], ['2112','חיבור'], ['2121','ממון נכנס'], ['2122','אדום'],
      ['2211','כבוד נכנס'], ['2212','לבן'], ['2221','שפל ראש'], ['2222','קהלה']
    ];

    const boardHouses = [
      [
        [1,'השואל','1111'], [2,'המשאבים','1212'], [3,'משפחה','1222'], [4,'בית','2212'],
        [5,'ילדים / שמחה','1112'], [6,'בריאות / חולי','1222'], [7,'הנשאל / יריב','1121'], [8,'מוות / ירושה','1222']
      ],
      [
        [9,'נסיעות / לימוד','2121'], [10,'מעמד / קריירה','1212'], [11,'ידידים / תקוות','2112'], [12,'סתר / מגבלות','2121']
      ],
      [
        [13,'עד ראשון','1111'], [14,'עד שני','2211']
      ]
    ];

    const finalHouses = {
      house16: [16,'משלים בית 15','2211'],
      house15: [15,'הדיין','1122']
    };

    function glyph(pattern) {
      return '<div class="glyph">' + pattern.split('').map(x =>
        `<div class="${x === '1' ? 'one' : 'two'}"></div>`
      ).join('') + '</div>';
    }

    function renderFigures() {
      const grid = document.getElementById('figureGrid');
      grid.innerHTML = figures.map((f, i) => `
        <div class="figure-card ${i === 0 ? 'selected' : ''}">
          ${glyph(f[0])}
          <div class="figure-name">${f[1]}</div>
        </div>
      `).join('');
    }

    function renderBoard() {
      const board = document.getElementById('board');

      const mainRows = boardHouses.map((row, i) => `
        <div class="board-row r${i + 1}">
          ${row.map(h => `
            <div class="house">
              <div class="house-title">בית ${h[0]}</div>
              <div class="house-name">${h[1]}</div>
              ${glyph(h[2])}
            </div>
          `).join('')}
        </div>
      `).join('');

      const h16 = finalHouses.house16;
      const h15 = finalHouses.house15;

      board.innerHTML = mainRows + `
        <div class="final-row">
          <div class="final-box right">
            <div class="house-title">בית ${h16[0]}</div>
            <div class="house-name">${h16[1]}</div>
            ${glyph(h16[2])}
          </div>

          <div class="final-box left">
            <div class="house-title">בית ${h15[0]}</div>
            <div class="house-name">${h15[1]}</div>
            ${glyph(h15[2])}
          </div>
        </div>
      `;
    }

    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + name).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleMenu() {
      document.getElementById('drawer').classList.toggle('open');
    }

    renderFigures();
    renderBoard();
  </script>
</body>
</html>
